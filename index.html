  async function runTool(id){
    const item = getItem(state.selectedId);
    if(id === 'forestPreset'){ buildForestPreset(); return; }
    if(id === 'meadowPreset'){ buildMeadowPreset(); return; }
    if(id === 'addWind'){
      const shaders = allFiles().filter(f => f.kind === 'shader' && /wind|leaf|grass/i.test(f.name));
      let shader = shaders[0];
      if(!shader){
        const folder = ensureFolder(['Shaders']);
        shader = makeFile('wind_leaf.gdshader', 'shader', PRESET_SHADERS[0].code);
        folder.children.push(shader);
        FileStore.put(shader.id, shader.data);
        renderShaders(); renderTree();
      }
      const targets = item ? [item] : state.objects;
      for(const t of targets){
        if(t.scripts.indexOf(shader.id) < 0) t.scripts.push(shader.id);
      }
      toast('Wind applied to ' + targets.length + ' object(s)');
      renderInspector(); scheduleSave();
      return;
    }
    if(!item){ toast('Select an object first'); return; }
    if(id === 'scatter'){
      const count = parseInt(prompt('How many copies?', '12') || '0', 10);
      if(!count) return;
      const radius = parseFloat(prompt('Radius?', '5') || '5');
      for(let i = 0; i < count; i++){
        const def = {
          id: uid('o'), name: item.name + '_' + i, type: item.type, asset: item.asset, seed: (item.seed||0) + i + 1,
          position: item.object3d.position.toArray(),
          rotation: [item.object3d.rotation.x, item.object3d.rotation.y, item.object3d.rotation.z],
          scale: item.object3d.scale.toArray(), visible: true,
          material: Object.assign({}, item.material), scripts: item.scripts.slice()
        };
        const a = Math.random() * Math.PI * 2;
        const r = Math.sqrt(Math.random()) * radius;
        def.position[0] += Math.cos(a) * r;
        def.position[2] += Math.sin(a) * r;
        def.rotation[1] += Math.random() * Math.PI * 2;
        const s = 0.7 + Math.random() * 0.6;
        def.scale = [def.scale[0]*s, def.scale[1]*s, def.scale[2]*s];
        addObjectFromDef(def, false);
      }
      toast('Scattered ' + count);
      Undo.push(); scheduleSave();
    } else if(id === 'grid'){
      const n = parseInt(prompt('Grid size (NxN)?', '3') || '3', 10);
      const sp = parseFloat(prompt('Spacing?', '2') || '2');
      const off = (n - 1) * sp / 2;
      for(let x = 0; x < n; x++){
        for(let z = 0; z < n; z++){
          if(x === 0 && z === 0) continue;
          const def = {
            id: uid('o'), name: item.name + '_' + x + '_' + z, type: item.type, asset: item.asset, seed: (item.seed||0) + x*100+z,
            position: item.object3d.position.toArray(),
            rotation: [item.object3d.rotation.x, item.object3d.rotation.y, item.object3d.rotation.z],
            scale: item.object3d.scale.toArray(), visible: true,
            material: Object.assign({}, item.material), scripts: item.scripts.slice()
          };
          def.position[0] += x * sp - off;
          def.position[2] += z * sp - off;
          addObjectFromDef(def, false);
        }
      }
      toast('Created grid');
      Undo.push(); scheduleSave();
    } else if(id === 'snapGround'){
      snapToGround(item);
      renderInspector(); Undo.push(); scheduleSave();
    } else if(id === 'frame' || id === 'focus'){
      const box = new THREE.Box3().setFromObject(item.object3d);
      const c = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const dist = maxDim * 2.2;
      editorCam.position.set(c.x + dist*0.7, c.y + dist*0.5, c.z + dist*0.7);
      controls.target.copy(c);
      controls.update();
    } else if(id === 'bakeTransform'){
      const o = item.object3d;
      o.updateMatrixWorld(true);
      const m = o.matrix.clone();
      o.position.set(0,0,0); o.rotation.set(0,0,0); o.scale.set(1,1,1);
      o.updateMatrix();
      o.traverse(c => {
        if(c !== o && c.isMesh){
          c.geometry = c.geometry.clone();
          c.geometry.applyMatrix4(m);
        }
      });
      renderInspector(); Undo.push(); scheduleSave();
      toast('Baked');
    } else if(id === 'randomize'){
      for(const t of state.objects){
        if(t === item || t.type === item.type){
          t.object3d.rotation.y += Math.random() * Math.PI * 2;
          const s = 0.8 + Math.random() * 0.4;
          t.object3d.scale.multiplyScalar(s);
        }
      }
      renderInspector(); Undo.push(); scheduleSave();
    }
  }

  /* ---------- Scene Presets ---------- */
  function buildForestPreset(){
    // Create a nice forest diorama from scratch
    // 1. Terrain
    let terrain = state.objects.find(o => o.type === 'terrain');
    if(!terrain) terrain = createTerrain();
    // Reset heights
    if(terrain.terrain){
      for(let i = 0; i < terrain.terrain.heights.length; i++) terrain.terrain.heights[i] = 0;
      applyTerrainHeights(terrain);
    }
    // 2. Environment
    World.apply(SKY_PRESETS.forest);
    // 3. Foliage: scatter trees, rocks, bushes
    const rng = mulberry32(42);
    const camItem = { object3d: new THREE.Object3D() }; // fake for scatter
    const terrainMesh = terrain.object3d;
    const half = TERRAIN_SIZE / 2 - 1;

    function placeOnTerrain(type, x, z, size, seed, color){
      const ray = new THREE.Raycaster(new THREE.Vector3(x, 20, z), new THREE.Vector3(0, -1, 0));
      const hits = ray.intersectObject(terrainMesh, false);
      const y = hits.length ? hits[0].point.y : 0;
      const def = {
        id: uid('o'), name: type + '_' + Math.floor(rng()*10000),
        type, seed,
        position:[x, y, z],
        rotation:[0, rng() * Math.PI * 2, 0],
        scale:[size, size, size],
        visible: true,
        material: materialDefaults({ color, roughness:0.9, flatShading:true }),
        scripts:[]
      };
      addObjectFromDef(def, false);
    }
    // Trees
    const treeColors = ['#4a7a30', '#3d6a28', '#d97a3a', '#c95a2a'];
    for(let i = 0; i < 22; i++){
      const x = (rng() - 0.5) * half * 2;
      const z = (rng() - 0.5) * half * 2;
      const type = rng() < 0.55 ? 'tree_round' : (rng() < 0.6 ? 'tree_pine' : 'tree_autumn');
      const s = 1.5 + rng() * 1.5;
      placeOnTerrain(type, x, z, s, rng() * 1e6 | 0, treeColors[i % treeColors.length]);
    }
    // Bushes
    for(let i = 0; i < 15; i++){
      const x = (rng() - 0.5) * half * 2;
      const z = (rng() - 0.5) * half * 2;
      placeOnTerrain('bush', x, z, 0.8 + rng() * 0.5, rng() * 1e6 | 0, '#3a6a28');
    }
    // Grass tufts
    for(let i = 0; i < 60; i++){
      const x = (rng() - 0.5) * half * 2;
      const z = (rng() - 0.5) * half * 2;
      placeOnTerrain('grass_tuft', x, z, 1 + rng() * 0.6, rng() * 1e6 | 0, '#5a9a3a');
    }
    // Flowers
    const flowerColors = ['#e04a5a', '#ff8ab0', '#ffd94a', '#ffffff'];
    for(let i = 0; i < 30; i++){
      const x = (rng() - 0.5) * half * 2;
      const z = (rng() - 0.5) * half * 2;
      const c = flowerColors[Math.floor(rng() * flowerColors.length)];
      placeOnTerrain('flower', x, z, 0.9 + rng() * 0.4, rng() * 1e6 | 0, c);
    }
    // Rocks
    for(let i = 0; i < 8; i++){
      const x = (rng() - 0.5) * half * 2;
      const z = (rng() - 0.5) * half * 2;
      placeOnTerrain('rock', x, z, 0.6 + rng() * 1.2, rng() * 1e6 | 0, '#a8a8a0');
    }
    // Mushrooms
    for(let i = 0; i < 10; i++){
      const x = (rng() - 0.5) * half * 2;
      const z = (rng() - 0.5) * half * 2;
      placeOnTerrain('mushroom', x, z, 1, rng() * 1e6 | 0, '#d94a3a');
    }
    refreshHierarchy();
    updateStatusBar();
    Undo.push();
    scheduleSave();
    toast('Forest scene built 🌳');
  }

  function buildMeadowPreset(){
    World.apply(SKY_PRESETS.forest);
    let terrain = state.objects.find(o => o.type === 'terrain');
    if(!terrain) terrain = createTerrain();
    if(terrain.terrain){
      for(let i = 0; i < terrain.terrain.heights.length; i++) terrain.terrain.heights[i] = 0;
      applyTerrainHeights(terrain);
    }
    const rng = mulberry32(7);
    const terrainMesh = terrain.object3d;
    const half = TERRAIN_SIZE / 2 - 1;
    function place(type, size, color){
      const x = (rng() - 0.5) * half * 2;
      const z = (rng() - 0.5) * half * 2;
      const ray = new THREE.Raycaster(new THREE.Vector3(x, 20, z), new THREE.Vector3(0, -1, 0));
      const hits = ray.intersectObject(terrainMesh, false);
      const y = hits.length ? hits[0].point.y : 0;
      addObjectFromDef({
        id: uid('o'), name: type + '_' + Math.floor(rng()*10000),
        type, seed: rng() * 1e6 | 0,
        position:[x, y, z], rotation:[0, rng() * Math.PI * 2, 0],
        scale:[size, size, size], visible:true,
        material: materialDefaults({ color, roughness:0.9, flatShading:true }), scripts:[]
      }, false);
    }
    for(let i = 0; i < 120; i++) place('grass_tuft', 1 + rng() * 0.5, '#5a9a3a');
    const flowerColors = ['#e04a5a', '#ff8ab0', '#ffd94a', '#ffffff', '#f0776c'];
    for(let i = 0; i < 60; i++) place('flower', 0.9 + rng() * 0.4, flowerColors[i % flowerColors.length]);
    for(let i = 0; i < 8; i++) place('tree_round', 1.3 + rng() * 0.7, '#4a7a30');
    for(let i = 0; i < 5; i++) place('bush', 0.8 + rng() * 0.5, '#3a6a28');
    refreshHierarchy(); updateStatusBar();
    Undo.push(); scheduleSave();
    toast('Meadow scene built 🌼');
  }

  /* ---------- Resize ---------- */
  function resizeAll(){
    const el = $('#center');
    const w = Math.max(1, el.clientWidth), h = Math.max(1, el.clientHeight);
    renderer.setSize(w, h, false);
    editorCam.aspect = w / h; editorCam.updateProjectionMatrix();
    gameCam.aspect = w / h; gameCam.updateProjectionMatrix();
  }
  if(window.ResizeObserver) new ResizeObserver(() => resizeAll()).observe($('#center'));
  window.addEventListener('resize', resizeAll);
  window.addEventListener('orientationchange', () => setTimeout(resizeAll, 120));

  /* ---------- Render loop ---------- */
  let fpsAcc = 0, fpsFrames = 0;
  let lastT = performance.now();
  let playTime = 0;

  function loop(){
    const now = performance.now();
    const dt = Math.min((now - lastT) / 1000, 0.1);
    lastT = now;
    fpsAcc += dt; fpsFrames++;
    if(fpsAcc >= 0.4){
      const fpsValue = Math.round(fpsFrames / fpsAcc);
      fpsAcc = 0; fpsFrames = 0;
      $('#hudFps').textContent = fpsValue + ' fps';
      $('#playStats').textContent = fpsValue + ' fps';
    }
    if(state.playing){ playTime += dt; runScriptUpdates(dt, playTime); }
    controls.update();
    for(const it of state.objects){
      const h = it.object3d.userData.__helper;
      if(h && h.update) h.update();
    }
    renderer.render(scene, state.playing ? gameCam : editorCam);
  }
  renderer.setAnimationLoop(loop);

  /* ---------- Script runtime ---------- */
  let scriptInstances = [];
  const keyState = {};
  window.addEventListener('keydown', e => { keyState[e.key] = true; });
  window.addEventListener('keyup', e => { keyState[e.key] = false; });

  function makeCtx(item){
    return {
      object: item.object3d, scene, camera: gameCam, renderer, THREE,
      input: { keys: keyState, isDown: k => !!keyState[k] },
      time: 0, delta: 0,
      find: name => scene.getObjectByName(name)
    };
  }
  async function startScripts(){
    scriptInstances = [];
    for(const item of state.objects){
      for(const sid of (item.scripts||[])){
        const f = findNode(sid);
        if(!f || f.kind === 'shader') continue;
        let data = f.data;
        if(data == null){
          const d = await FileStore.get(f.id);
          data = typeof d === 'string' ? d : (d instanceof Blob ? await d.text() : '');
        }
        if(!data) continue;
        try{
          const factory = new Function('ctx', 'THREE',
            '"use strict";\n' + data + '\n;return { init: (typeof init === "function") ? init : null, update: (typeof update === "function") ? update : null };');
          const mod = factory(makeCtx(item), THREE);
          const inst = { item, mod, ctx: makeCtx(item) };
          scriptInstances.push(inst);
          if(mod.init) mod.init(inst.ctx);
        } catch(err){
          console.error('Script error in ' + f.name, err);
          toast('Script error: ' + f.name);
        }
      }
    }
    if(scriptInstances.length) setStatus('Running ' + scriptInstances.length + ' script(s)');
  }
  function runScriptUpdates(dt, t){
    for(const inst of scriptInstances){
      inst.ctx.time = t;
      inst.ctx.delta = dt;
      if(inst.mod.update){
        try{ inst.mod.update(inst.ctx, dt); }
        catch(e){ console.error(e); }
      }
    }
  }

  /* ---------- Play ---------- */
  function enterPlay(){
    state.playing = true;
    playTime = 0;
    document.body.classList.add('playing');
    transform.detach(); transform.enabled = false;
    helpers.visible = false;
    state._savedCam = { pos: editorCam.position.clone(), target: controls.target.clone() };
    resizeAll();
    gameCam.position.set(0, 3, 10);
    gameCam.lookAt(0, 1, 0);
    controls.object = gameCam;
    controls.target.set(0, 1, 0);
    controls.enabled = true;
    controls.update();
    startScripts();
    setStatus('Playing');
  }
  function exitPlay(){
    state.playing = false;
    document.body.classList.remove('playing');
    scriptInstances = [];
    helpers.visible = true;
    transform.enabled = true;
    if(state.selectedId){
      const item = getItem(state.selectedId);
      if(item) transform.attach(item.object3d);
    }
    controls.object = editorCam;
    if(state._savedCam){
      editorCam.position.copy(state._savedCam.pos);
      controls.target.copy(state._savedCam.target);
    }
    controls.update();
    requestAnimationFrame(resizeAll);
    setStatus('Ready');
  }
  $('#btnPlay').onclick = enterPlay;
  $('#btnStop').onclick = exitPlay;

  /* ---------- Gizmo ---------- */
  $$('#gizmoBar [data-gizmo]').forEach(b => {
    b.onclick = () => {

    $('#hudMode').textContent = labels[state.activeTool] || 'Select';

    $('#brushRing').classList.toggle('on', state.activeTool === 'terrain' || state.activeTool === 'foliage');
  }
  $$('#gizmoBar [data-tool]').forEach(b => {
    b.onclick = () => {
      state.activeTool = b.dataset.tool;
      updateHudMode();
      if(state.activeTool === 'terrain' || state.activeTool === 'foliage'){

  $('#btnSpace').onclick = () => {

    transform.setSpace(state.gizmoSpace);

  };
  $('#btnQuickTools').onclick = () => setRightTab('tools');

  /* ---------- Viewport selection / brush interaction ---------- */
  let ptrDown = null;
  let isBrushing = false;
  let lastBrushPush = 0;

  canvas.addEventListener('pointerdown', e => {
    if(state.playing) return;
    // Brush modes
    if(state.activeTool === 'terrain' && e.button === 0){
      const t = pickTerrain(e.clientX, e.clientY);
      if(t){
        isBrushing = true;
        canvas.setPointerCapture(e.pointerId);
        lastBrushPush = performance.now();
        sculptAt(t.item, e.clientX, e.clientY);
        Undo.push();
        scheduleSave();
        return;
      }
    }
    if(state.activeTool === 'foliage' && e.button === 0){
      const t = pickTerrain(e.clientX, e.clientY);
      if(t){
        isBrushing = true;
        canvas.setPointerCapture(e.pointerId);
        scatterFoliage(e.clientX, e.clientY);
        Undo.push();
        scheduleSave();
        return;
      }
    }
    if(transform.axis !== null) return;
    ptrDown = { x: e.clientX, y: e.clientY, t: performance.now() };
  });

  canvas.addEventListener('pointermove', e => {

      const kind = kindOf(f.name);
      const textKind = isTextKind(kind);
      const node = { id: uid('f'), type:'file', name: f.name, kind, binary: !textKind, size: f.size, data: undefined };
