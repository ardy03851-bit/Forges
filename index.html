  transform.enabled = false;
  helpers.visible = false;

  // save editor camera state
  state._savedEditorCam = {
    pos: editorCamera.position.clone(),
    target: controls.target.clone()
  };

  resizeAll();
  gameCamera.position.set(0, 3.5, 11);
  gameCamera.lookAt(0, 1, 0);

  controls.object = gameCamera;
  controls.target.set(0, 1, 0);
  controls.enabled = true;
  controls.update();

  startScripts();
  setStatus('Playing — press Stop to return to the editor');
}

function exitPlay() {
  state.playing = false;
  document.body.classList.remove('playing');

  scriptInstances = [];

  helpers.visible = true;
  transform.enabled = true;
  if (state.selectedId) {
    const item = getItem(state.selectedId);
    if (item) transform.attach(item.object3d);
  }

  controls.object = editorCamera;
  if (state._savedEditorCam) {
    editorCamera.position.copy(state._savedEditorCam.pos);
    controls.target.copy(state._savedEditorCam.target);
  }
  controls.update();

  requestAnimationFrame(resizeAll);
  setStatus('Ready');
}

   ============================================================ */
let pointerDownPos = null;

canvas.addEventListener('pointerdown', e => {
  if (state.playing) return;
  if (transform.axis !== null) return;
  pointerDownPos = { x: e.clientX, y: e.clientY, t: performance.now() };
});

canvas.addEventListener('pointerup', e => {
  if (state.playing) return;
  if (!pointerDownPos) return;
  const dx = e.clientX - pointerDownPos.x;
  const dy = e.clientY - pointerDownPos.y;
  const dist = Math.hypot(dx, dy);
  const dur = performance.now() - pointerDownPos.t;
  pointerDownPos = null;

  if (dist > 8 || dur > 600) return;
  if (transform.axis !== null) return;

  const hit = pickItem(e.clientX, e.clientY);
  selectObject(hit ? hit.item.id : null);
});

$$('.panel-actions [data-act]').forEach(btn => {
  btn.onclick = () => {
    const act = btn.dataset.act;
    if (act === 'newFile') {
      const name = prompt('New file name (e.g. enemy.js, level.json):');
      if (!name) return;
      const kind = kindOf(name);
      const parent = (state.currentFolderId && findNode(state.currentFolderId)) || state.root;
      const folder = parent.type === 'folder' ? parent : state.root;
      const node = makeFile(name, kind, '');
      folder.children.push(node);
      folder.expanded = true;
      renderTree();
      openFile(node);
      markDirty();
      toast('Created ' + name);
    }
    else if (act === 'newFolder') {
      const name = prompt('New folder name:');
      if (!name) return;
      const parent = (state.currentFolderId && findNode(state.currentFolderId)) || state.root;
      const folder = parent.type === 'folder' ? parent : state.root;
      folder.children.push({ id: uid('d'), type: 'folder', name, children: [], expanded: true });
      renderTree();
      markDirty();
    }
    else if (act === 'rename') {
      const node = state.selectedFileId && findNode(state.selectedFileId);
      if (!node) { toast('Select a file or folder first'); return; }
      const name = prompt('Rename to:', node.name);
      if (!name || name === node.name) return;
      node.name = name;
      if (node.type === 'file') node.kind = kindOf(name);
      renderTree();
      renderTabs();
      markDirty();
    }
    else if (act === 'delete') {
      const node = state.selectedFileId && findNode(state.selectedFileId);
      if (!node) { toast('Select a file or folder first'); return; }
      if (node.id === 'root') return;
      const parent = findParent(node.id);
      if (!parent) return;
      if (!confirm('Delete "' + node.name + '"?')) return;
      const i = parent.children.indexOf(node);
      if (i >= 0) parent.children.splice(i, 1);
      state.selectedFileId = null;
      // remove from objects
      state.objects.forEach(o => {
        const si = o.scripts.indexOf(node.id);
        if (si >= 0) o.scripts.splice(si, 1);
        if (o.asset === node.id) o.asset = null;
      });
      renderTree();
      renderInspector();
      markDirty();
      toast('Deleted ' + node.name);
    }
  };
});

const fileInput = $('#fileInput');

function triggerImport() { fileInput.click(); }

function readAsText(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsText(file);
  });
}
function readAsDataURL(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

fileInput.addEventListener('change', async () => {
  const files = Array.prototype.slice.call(fileInput.files || []);
  if (!files.length) return;
  setStatus('Importing ' + files.length + ' file(s)…');

  for (const f of files) {
    const kind = kindOf(f.name);
    const textKind = isTextKind(kind);
    let data;
    try {
      data = textKind ? await readAsText(f) : await readAsDataURL(f);
    } catch (err) {
      console.error(err);
      toast('Could not read ' + f.name);
      continue;
    }
    const node = {
      id: uid('f'),
      type: 'file',
      name: f.name,
      kind,
      binary: !textKind,
      data
    };
    const folder = folderForKind(kind);
    folder.children.push(node);
    folder.expanded = true;
  }

  fileInput.value = '';
  renderTree();
  renderAssets();
  markDirty();
  persist();
  toast('Imported ' + files.length + ' file(s)');
  setStatus('Import complete');
});

   ============================================================ */
function markDirty() {
  state.dirty = true;
  clearTimeout(markDirty._t);
  markDirty._t = setTimeout(persist, 900);
}

function persist() {
  try {
    const payload = {
      v: 1,
      name: state.projectName,
      tree: state.root,
      scene: serializeScene()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    state.dirty = false;
    updateStatusBar();
  } catch (err) {
    console.warn('Persist failed', err);
    setStatus('Storage full — export project to save');
  }
}

function loadPersisted() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) {
    return null;
  }
}

function loadProject(payload) {
  state.projectName = payload.name || 'UntitledProject';
  state.root = payload.tree || defaultProject();
  state.objects = [];
  state.selectedId = null;

  // clear scene
  while (state.objects.length) removeObject(state.objects[0].id);
  helpers.clear();
  helpers.add(grid);
  helpers.add(axes);

  $('#projName').textContent = state.projectName;

  const sceneDefs = payload.scene || defaultScene();
  sceneDefs.forEach(def => {
    def.material = Object.assign(defaultMaterial(), def.material || {});
    addObjectFromDef(def, false);
  });

  renderTree();
  renderAssets();
  refreshHierarchy();
  updateStatusBar();
}

/* ============================================================
   EXPORT: ZIP
   ============================================================ */
const CRC_TABLE = (function () {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function buildZip(entries) {
  const enc = new TextEncoder();
  const chunks = [];
  const central = [];
  let offset = 0;

  entries.forEach(entry => {
    const nameBytes = enc.encode(entry.name);
    const data = entry.data;
    const crc = crc32(data);

    const local = new Uint8Array(30 + nameBytes.length);
    const dv = new DataView(local.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true);
    dv.setUint16(10, 0, true);
    dv.setUint16(12, 0, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, data.length, true);
    dv.setUint32(22, data.length, true);
    dv.setUint16(26, nameBytes.length, true);
    dv.setUint16(28, 0, true);
    local.set(nameBytes, 30);

    chunks.push(local);
    chunks.push(data);

    const cd = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true);
    cv.setUint16(14, 0, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    cd.set(nameBytes, 46);

    central.push(cd);
    offset += local.length + data.length;
  });

  let centralSize = 0;
  central.forEach(c => { centralSize += c.length; });

  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, entries.length, true);
  ev.setUint16(10, entries.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, offset, true);
  ev.setUint16(20, 0, true);

  return new Blob(chunks.concat(central).concat([end]), { type: 'application/zip' });
}

function dataURLToBytes(durl) {
  const i = durl.indexOf(',');
  const b64 = durl.slice(i + 1);
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
  return arr;
}

function bytesOfFile(node) {
  if (node.binary) return dataURLToBytes(node.data);
  return new TextEncoder().encode(node.data || '');
}

function safeName(s) {
  return String(s).replace(/[^a-zA-Z0-9._-]/g, '_');
}

$('#btnExportZip').onclick = () => {
  setStatus('Building ZIP archive…');
  const enc = new TextEncoder();
  const entries = [];

  // index.html

    '## Structure',
    '',
    '```',
    'index.html          Standalone playable build (open directly in a browser)',
    'project.json        Full project data (scene graph + assets)',
    'assets/models/      3D models (GLTF / GLB / OBJ)',
    'assets/textures/    Images, normal maps, roughness maps',
    'assets/audio/       Sound effects and music',
    'scripts/            Behaviour scripts',
    'src/                HTML / CSS / JSON source files',
    '```',
    '',
    '## Deploy',
    '',
    '1. Push this folder to a GitHub repository.',
    '2. Enable **GitHub Pages** in the repository settings.',
    '3. Your game is playable at `https://<user>.github.io/<repo>/`.',
    '',
    'Any static host (Netlify, Vercel, Cloudflare Pages, S3) works the same way —',
    'just upload the contents of this folder.',
    '',
    '## Object Count',
    '',
    state.objects.length + ' scene objects exported.',
    ''
  ].join('\n');
  entries.push({ name: 'README.md', data: enc.encode(readme) });

  const blob = buildZip(entries);
  const zipName = safeName(state.projectName || 'project') + '.zip';
  download(zipName, blob, 'application/zip');
  toast('Exported ' + zipName + ' (' + entries.length + ' files)');
  setStatus('ZIP export complete');
};

/* ============================================================
   SIDEBAR TOGGLES
   ============================================================ */
$('#btnToggleLeft').onclick = () => {
  $('#left').classList.toggle('collapsed');
  setTimeout(resizeAll, 200);
};
$('#btnToggleRight').onclick = () => {
  $('#right').classList.toggle('collapsed');
  setTimeout(resizeAll, 200);
};

/* ============================================================
   PREVENT PAGE ZOOM / BOUNCE
   ============================================================ */
document.addEventListener('gesturestart', e => {
  if (e.target.closest && e.target.closest('#codeArea')) return;
  e.preventDefault();
});
document.addEventListener('touchmove', e => {
  if (e.target.closest && (e.target.closest('#codeArea') || e.target.closest('.panel-body') ||
      e.target.closest('#assetGrid') || e.target.closest('#inspector'))) return;
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

/* ============================================================
   BOOT
   ============================================================ */
function boot() {
  const saved = loadPersisted();

  if (saved && saved.tree && saved.scene) {
    loadProject(saved);
    setStatus('Project restored');
  } else {
    state.root = defaultProject();
    state.projectName = 'UntitledProject';
    $('#projName').textContent = state.projectName;

    defaultScene().forEach(def => addObjectFromDef(def, false));

    renderTree();
    renderAssets();
    refreshHierarchy();
    selectObject(state.objects[1] ? state.objects[1].id : null);
    setStatus('New project — drag assets into the viewport');
  }

  // Auto-open the first script
  const firstScript = allFiles().find(f => f.kind === 'script');
  if (firstScript) {
    state.selectedFileId = firstScript.id;
    renderTree();
  }

  resizeAll();
  renderInspector();
  updateStatusBar();

  // iPad portrait: collapse right panel by default
  if (window.innerWidth < 860 && window.innerHeight > window.innerWidth) {
    $('#right').classList.add('collapsed');
  }

  setTimeout(() => {
    resizeAll();
    updateStatusBar();
  }, 300);

  console.log('%cForge IDE', 'color:#3d8bfd;font-weight:bold;font-size:14px', '— ready');
}

boot();

/* ============================================================
   GLOBAL SHORTCUTS
   ============================================================ */
window.addEventListener('keydown', e => {
  const meta = e.metaKey || e.ctrlKey;

  if (meta && e.key === 's') {
    e.preventDefault();
    persist();
    toast('Project saved');
  }
  if (meta && e.key === 'p') {
    e.preventDefault();
    if (state.playing) exitPlay();
    else enterPlay();
  }
  if (e.key === 'Escape' && state.playing) exitPlay();

  // Gizmo mode
  if (!state.playing && document.activeElement !== codeInput) {
    if (e.key === 'g' || e.key === 'w') {
      state.gizmoMode = 'translate';
      transform.setMode('translate');
      $$('#gizmoBar [data-gizmo]').forEach(x => x.classList.toggle('on', x.dataset.gizmo === 'translate'));
    }
    if (e.key === 'r') {
      state.gizmoMode = 'rotate';
      transform.setMode('rotate');
      $$('#gizmoBar [data-gizmo]').forEach(x => x.classList.toggle('on', x.dataset.gizmo === 'rotate'));
    }
    if (e.key === 's' && !meta) {
      state.gizmoMode = 'scale';
      transform.setMode('scale');
      $$('#gizmoBar [data-gizmo]').forEach(x => x.classList.toggle('on', x.dataset.gizmo === 'scale'));
    }
    if (e.key === 'Delete' || e.key === 'Backspace') {
      if (state.selectedId) removeObject(state.selectedId);
    }
  }
});

/* ============================================================
   AUTOSAVE ON VISIBILITY CHANGE
   ============================================================ */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) persist();
});

window.addEventListener('beforeunload', () => {
  persist();
});
</script>
</body>
</html>
