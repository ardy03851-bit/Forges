<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1b1d">
<title>Forge IDE — Game Development Environment</title>
<style>
/* ============================================================
   RESET / BASE
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--text);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;
  -webkit-font-smoothing:antialiased;
}
:root{
  --bg:#1b1b1d;
  --panel:#232326;
  --panel-2:#28282c;
  --panel-3:#2f2f34;
  --border:#37373d;
  --border-2:#45454d;
  --text:#d6d6d8;
  --dim:#8a8a92;
  --dim-2:#66666e;
  --accent:#3d8bfd;
  --accent-dk:#2a6fd6;
  --green:#4ec26a;
  --red:#e05252;
  --amber:#e0a852;
  --purple:#b57ee5;
  --cyan:#4fc3d9;
  --toolbar-h:46px;
  --status-h:24px;
  --radius:5px;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3d3d44;border-radius:5px;border:2px solid var(--panel)}
::-webkit-scrollbar-thumb:hover{background:#4d4d56}

/* ============================================================
   APP SHELL
   ============================================================ */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100vw}

/* ---------- Toolbar ---------- */
#toolbar{
  height:var(--toolbar-h);flex:0 0 auto;display:flex;align-items:center;gap:6px;
  padding:0 8px;padding-left:max(8px,env(safe-area-inset-left));
  padding-right:max(8px,env(safe-area-inset-right));
  background:linear-gradient(180deg,#26262a,#212124);
  border-bottom:1px solid var(--border);z-index:40;
}
.brand{display:flex;align-items:center;gap:7px;padding-right:10px;margin-right:4px;border-right:1px solid var(--border)}
.brand .logo{color:var(--accent);font-size:15px;line-height:1}
.brand .name{font-weight:600;font-size:12.5px;letter-spacing:.2px;color:#e8e8ea}
#modeSwitch{display:flex;background:#1a1a1c;border:1px solid var(--border);border-radius:6px;padding:2px;gap:2px}
.mode-btn{
  appearance:none;border:0;background:transparent;color:var(--dim);
  font:inherit;font-size:12px;font-weight:500;padding:5px 12px;border-radius:4px;
  min-height:30px;cursor:pointer;transition:background .12s,color .12s;
}
.mode-btn.active{background:var(--panel-3);color:#fff;box-shadow:inset 0 0 0 1px var(--border-2)}
.spacer{flex:1}
.tbtn{
  appearance:none;font:inherit;font-size:12px;font-weight:500;
  background:var(--panel-3);color:var(--text);border:1px solid var(--border-2);
  border-radius:var(--radius);padding:6px 11px;min-height:32px;cursor:pointer;
  transition:background .12s,border-color .12s,opacity .12s;white-space:nowrap;
}
.tbtn:hover{background:#3a3a42}
.tbtn:active{background:#44444e;transform:translateY(1px)}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.tbtn.primary:hover{background:var(--accent-dk)}
.tbtn.icon{padding:6px 9px;min-width:34px}
.tbtn.ghost{background:transparent;border-color:transparent;color:var(--dim)}
.tbtn.ghost:hover{background:var(--panel-3);color:var(--text)}

/* ---------- Main ---------- */
#main{flex:1;display:flex;min-height:0;position:relative}

/* ---------- Sidebars ---------- */
.side{
  flex:0 0 auto;display:flex;flex-direction:column;background:var(--panel);
  min-height:0;transition:width .18s ease,opacity .18s;
}
#left{width:262px;border-right:1px solid var(--border)}
#right{width:288px;border-left:1px solid var(--border)}
.side.collapsed{width:0;overflow:hidden;opacity:0;border:0}

.panel{display:flex;flex-direction:column;min-height:0;flex:1 1 auto;overflow:hidden}
.panel + .panel{border-top:1px solid var(--border)}
.panel-head{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  height:30px;padding:0 6px 0 10px;background:var(--panel-2);
  font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--dim);
  border-bottom:1px solid var(--border);
}
.panel-actions{display:flex;gap:1px}
.panel-actions button{
  appearance:none;border:0;background:transparent;color:var(--dim);
  width:26px;height:24px;border-radius:4px;cursor:pointer;font-size:13px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.panel-actions button:hover{background:var(--panel-3);color:var(--text)}
.panel-body{flex:1 1 auto;overflow:auto;min-height:0;padding:4px 0}

/* ---------- File tree ---------- */
.tree-row{
  display:flex;align-items:center;gap:6px;height:28px;padding-right:8px;
  font-size:12.5px;color:var(--text);cursor:pointer;white-space:nowrap;
  border-left:2px solid transparent;
}
.tree-row:hover{background:#2c2c31}
.tree-row.sel{background:#2f3a4d;border-left-color:var(--accent)}
.tree-row .arrow{width:11px;font-size:9px;color:var(--dim-2);flex:0 0 auto;text-align:center}
.tree-row .dot{width:7px;height:7px;border-radius:2px;flex:0 0 auto}
.tree-row .label{overflow:hidden;text-overflow:ellipsis;flex:1}
.tree-row .badge{font-size:9.5px;color:var(--dim-2);letter-spacing:.3px}

/* ---------- Hierarchy ---------- */
.hier-row{
  display:flex;align-items:center;gap:6px;height:29px;padding:0 6px 0 10px;
  font-size:12.5px;cursor:pointer;border-left:2px solid transparent;
}
.hier-row:hover{background:#2c2c31}
.hier-row.sel{background:#2f3a4d;border-left-color:var(--accent)}
.hier-row .glyph{width:14px;text-align:center;color:var(--dim);font-size:11px}
.hier-row .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hier-row .act{
  border:0;background:transparent;color:var(--dim-2);width:24px;height:24px;border-radius:4px;
  cursor:pointer;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;
}
.hier-row .act:hover{background:var(--panel-3);color:var(--text)}
.hier-row .act.on{color:var(--accent)}

/* ---------- Center ---------- */
#center{flex:1 1 auto;position:relative;min-width:0;background:#151517;overflow:hidden}
.pane{position:absolute;inset:0;display:none}
.pane.active{display:flex;flex-direction:column}

/* ---------- Viewport ---------- */
#viewportWrap{position:absolute;inset:0;touch-action:none;overflow:hidden}
#viewport{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#viewportWrap.drop-target::after{
  content:'';position:absolute;inset:0;border:2px dashed var(--accent);
  background:rgba(61,139,253,.07);pointer-events:none;z-index:5;
}
#viewportHud{
  position:absolute;left:10px;top:10px;display:flex;gap:6px;pointer-events:none;z-index:3;
}
.hud-chip{
  background:rgba(24,24,27,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.08);border-radius:5px;padding:3px 8px;
  font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.3px;
}
#gizmoBar{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  display:flex;gap:2px;background:rgba(24,24,27,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.09);border-radius:8px;padding:4px;z-index:6;
  box-shadow:0 6px 24px rgba(0,0,0,.5);
}
#gizmoBar button{
  appearance:none;border:0;background:transparent;color:var(--dim);
  min-width:52px;height:36px;border-radius:6px;cursor:pointer;
  font:inherit;font-size:11px;font-weight:600;letter-spacing:.3px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
}
#gizmoBar button .k{font-size:14px;line-height:1}
#gizmoBar button:hover{background:rgba(255,255,255,.07);color:var(--text)}
#gizmoBar button.on{background:var(--accent);color:#fff}
#gizmoSep{width:1px;background:rgba(255,255,255,.1);margin:6px 3px}

/* ---------- Empty hint ---------- */
.empty{color:var(--dim-2);font-size:12px;padding:16px;text-align:center;line-height:1.6}

/* ---------- Status bar ---------- */
#statusbar{
  height:var(--status-h);flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:0 10px;padding-bottom:env(safe-area-inset-bottom);
  background:var(--accent-dk);color:#eaf2ff;font-size:11px;letter-spacing:.2px;z-index:40;
}
#statusbar .right{display:flex;gap:14px;opacity:.92;font-variant-numeric:tabular-nums}

/* ============================================================
   INSPECTOR
   ============================================================ */
#inspector{padding:0 0 24px}
.insp-title{
  padding:9px 10px;background:var(--panel-2);border-bottom:1px solid var(--border);
  font-size:12px;font-weight:600;color:#eaeaec;display:flex;align-items:center;gap:7px;
}
.insp-title .tag{
  margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  color:var(--dim);background:var(--panel-3);border-radius:3px;padding:2px 5px;
}
.insp-section{border-bottom:1px solid var(--border);padding:6px 0 9px}
.insp-section > h4{
  margin:0;padding:5px 10px 6px;font-size:10px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;color:var(--dim-2);
}
.row{display:flex;align-items:center;gap:8px;padding:3px 10px;min-height:30px}
.row > label{flex:0 0 62px;font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis}
.row > .ctl{flex:1;display:flex;gap:4px;min-width:0}
input[type=text],input[type=number],select{
  appearance:none;background:#1a1a1d;border:1px solid var(--border-2);border-radius:4px;
  color:var(--text);font:inherit;font-size:12px;padding:5px 7px;min-width:0;width:100%;
  min-height:30px;-webkit-user-select:text;user-select:text;
}
input[type=number]{font-variant-numeric:tabular-nums;text-align:right;padding-right:6px}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(61,139,253,.18)}
select{background-image:none;cursor:pointer}
input[type=color]{
  appearance:none;border:1px solid var(--border-2);border-radius:4px;background:#1a1a1d;
  width:38px;height:30px;padding:2px;cursor:pointer;flex:0 0 auto;
}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:none;border-radius:2px}
input[type=range]{
  appearance:none;-webkit-appearance:none;background:transparent;width:100%;height:30px;cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:#3a3a42;border-radius:2px}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);
  margin-top:-6.5px;border:2px solid #1b1b1d;box-shadow:0 0 0 1px var(--accent);
}
.slider-val{
  flex:0 0 42px;text-align:right;font-size:11px;color:var(--dim);
  font-variant-numeric:tabular-nums;
}
.chk{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12px;color:var(--text)}
.chk input{appearance:none;width:32px;height:19px;border-radius:10px;background:#3a3a42;position:relative;transition:background .15s;cursor:pointer;flex:0 0 auto;margin:0}
.chk input::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#c9c9ce;transition:transform .15s}
.chk input:checked{background:var(--accent)}
.chk input:checked::after{transform:translateX(13px);background:#fff}

.tex-slot{
  display:flex;align-items:center;gap:8px;padding:5px 10px;
}
.tex-slot .thumb{
  width:34px;height:34px;border-radius:4px;background:#1a1a1d;border:1px solid var(--border-2);
  flex:0 0 auto;background-size:cover;background-position:center;display:flex;
  align-items:center;justify-content:center;font-size:9px;color:var(--dim-2);overflow:hidden;
}
.tex-slot .meta{flex:1;min-width:0}
.tex-slot .meta .n{font-size:11.5px;color:var(--dim);display:block}
.tex-slot .meta .v{font-size:11px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.tex-slot .clr{
  border:0;background:transparent;color:var(--dim-2);cursor:pointer;font-size:13px;
  width:26px;height:26px;border-radius:4px;flex:0 0 auto;
}
.tex-slot .clr:hover{background:var(--panel-3);color:var(--red)}
.tex-slot.droppable{outline:1px dashed rgba(61,139,253,.35);outline-offset:-3px;border-radius:4px}
.tex-slot.droppable.hot{outline-color:var(--accent);background:rgba(61,139,253,.1)}

.chip-list{display:flex;flex-wrap:wrap;gap:5px;padding:4px 10px}
.chip{
  display:flex;align-items:center;gap:6px;background:var(--panel-3);border:1px solid var(--border-2);
  border-radius:4px;padding:4px 6px;font-size:11px;color:var(--text);
}
.chip button{border:0;background:transparent;color:var(--dim);cursor:pointer;font-size:11px;padding:0 2px}
.chip button:hover{color:var(--text)}

.btn-row{display:flex;gap:6px;padding:6px 10px}
.btn-row .tbtn{flex:1;justify-content:center;text-align:center}
.tbtn.danger{color:#ffbdbd;border-color:#5a3030;background:#3a2323}
.tbtn.danger:hover{background:#4a2a2a}

/* ============================================================
   CODE EDITOR
   ============================================================ */
#editorPane{background:#1e1e21}
#tabBar{
  flex:0 0 auto;display:flex;align-items:stretch;height:34px;background:#1a1a1d;
  border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden;
}
#tabBar::-webkit-scrollbar{height:0}
.tab{
  display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;
  font-size:12px;color:var(--dim);background:#1a1a1d;border-right:1px solid var(--border);
  cursor:pointer;white-space:nowrap;flex:0 0 auto;min-height:34px;
}
.tab.active{background:#1e1e21;color:#fff;box-shadow:inset 0 2px 0 var(--accent)}
.tab .dot{width:7px;height:7px;border-radius:2px}
.tab .x{color:var(--dim-2);font-size:13px;line-height:1;padding:2px 3px;border-radius:3px}
.tab .x:hover{background:var(--panel-3);color:var(--text)}
#editorBody{flex:1;display:flex;min-height:0;position:relative}
#gutter{
  flex:0 0 auto;width:46px;background:#1a1a1d;border-right:1px solid var(--border);
  overflow:hidden;padding:10px 0;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color:#4a4a52;text-align:right;user-select:none;
}
#gutter div{padding-right:9px}
#codeArea{position:relative;flex:1;min-width:0;overflow:hidden}
#highlight,#codeInput{
  position:absolute;inset:0;margin:0;padding:10px 14px;
  font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  white-space:pre;overflow:auto;border:0;tab-size:2;
  -webkit-user-select:text;user-select:text;
}
#highlight{color:#cfcfd4;pointer-events:none;z-index:0}
#codeInput{
  background:transparent;color:transparent;caret-color:#fff;z-index:1;resize:none;outline:none;
  -webkit-text-fill-color:transparent;
}
#codeInput::selection{background:rgba(61,139,253,.35)}
.c-key{color:#c586c0}
.c-str{color:#ce9178}
.c-num{color:#b5cea8}
.c-com{color:#5f6b73;font-style:italic}
.c-tag{color:#569cd6}
.c-att{color:#9cdcfe}

/* ============================================================
   ASSET MANAGER
   ============================================================ */
#assetsPane{background:#1e1e21}
#assetToolbar{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;
  border-bottom:1px solid var(--border);background:var(--panel-2);
}
#assetToolbar .title{font-size:12px;font-weight:600;color:#e8e8ea}
#assetGrid{
  flex:1;overflow:auto;padding:12px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;align-content:start;
}
.asset-card{
  background:var(--panel);border:1px solid var(--border);border-radius:7px;overflow:hidden;
  display:flex;flex-direction:column;transition:border-color .12s,transform .1s;
}
.asset-card:active{transform:scale(.985)}
.asset-card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.asset-card .preview{
  height:96px;background:#141416;display:flex;align-items:center;justify-content:center;
  background-size:cover;background-position:center;color:var(--dim-2);font-size:22px;position:relative;
}
.asset-card .preview .ext{
  position:absolute;right:6px;bottom:5px;font-size:9px;font-weight:700;letter-spacing:.5px;
  background:rgba(0,0,0,.6);border-radius:3px;padding:2px 4px;color:#b9b9c0;
}
.asset-card .info{padding:7px 9px;border-top:1px solid var(--border)}
.asset-card .info .n{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.asset-card .info .s{font-size:10px;color:var(--dim-2);display:block;margin-top:1px}
.asset-card .acts{display:flex;gap:1px;border-top:1px solid var(--border);background:var(--panel-2)}
.asset-card .acts button{
  flex:1;border:0;background:transparent;color:var(--dim);font:inherit;font-size:10.5px;
  padding:7px 2px;cursor:pointer;min-height:32px;
}
.asset-card .acts button:hover{background:var(--panel-3);color:var(--text)}

/* ============================================================
   PLAY MODE
   ============================================================ */
body.playing #toolbar,
body.playing #left,
body.playing #right,
body.playing #statusbar{display:none!important}
body.playing #center{
  position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;z-index:900;
}
#playHud{
  position:fixed;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));
  display:none;gap:8px;z-index:1000;align-items:center;
}
body.playing #playHud{display:flex}
#playHud .stat{
  background:rgba(20,20,23,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.1);border-radius:7px;padding:8px 12px;
  font-size:11.5px;color:#cfcfd6;font-variant-numeric:tabular-nums;
}
#btnStop{
  background:rgba(224,82,82,.92);color:#fff;border:1px solid rgba(255,255,255,.15);
  border-radius:7px;padding:10px 18px;font:inherit;font-size:12.5px;font-weight:600;
  cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 6px 20px rgba(0,0,0,.4);
}
#btnStop:active{background:#c94545}

/* ============================================================
   DRAG GHOST / TOAST / MODAL
   ============================================================ */
.drag-ghost{
  position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%);
  background:rgba(35,35,40,.95);border:1px solid var(--accent);border-radius:5px;
  padding:6px 11px;font-size:11.5px;color:#fff;white-space:nowrap;
  box-shadow:0 8px 28px rgba(0,0,0,.55);backdrop-filter:blur(8px);
}
#toast{
  position:fixed;left:50%;bottom:52px;transform:translate(-50%,16px);
  background:rgba(38,38,44,.97);border:1px solid var(--border-2);border-radius:7px;
  padding:10px 18px;font-size:12.5px;color:#eaeAec;z-index:10000;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
  box-shadow:0 10px 34px rgba(0,0,0,.6);max-width:min(80vw,440px);text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

#modalBack{
  position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:8000;display:none;
  align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px);
}
#modalBack.show{display:flex}
#modal{
  background:var(--panel);border:1px solid var(--border-2);border-radius:10px;
  min-width:min(420px,90vw);max-height:80vh;overflow:auto;
  box-shadow:0 24px 70px rgba(0,0,0,.7);
}
#modal h3{margin:0;padding:14px 16px;font-size:13.5px;border-bottom:1px solid var(--border);font-weight:600}
#modal .body{padding:14px 16px}
#modal .body p{margin:0 0 10px;font-size:12.5px;color:var(--dim);line-height:1.6}
#modal .foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}

/* ============================================================
   RESPONSIVE (iPad portrait / split view)
   ============================================================ */
@media (max-width: 1024px){
  #left{width:230px}
  #right{width:250px}
}
@media (max-width: 860px) and (orientation: portrait){
  #left{width:210px}
  #right{
    position:absolute;right:0;top:0;bottom:0;z-index:30;width:272px;
    box-shadow:-14px 0 40px rgba(0,0,0,.5);
  }
  #right.collapsed{box-shadow:none}
}
.hidden{display:none!important}
</style>
</head>
<body>

<script type="text/x-forge-runtime" id="exportRuntime">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

const DATA = JSON.parse(document.getElementById('gd-data').textContent);
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17171a);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 4000);
camera.position.set(7, 6, 10);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 1;
controls.maxDistance = 400;

const hemi = new THREE.HemisphereLight(0xdfe8ff, 0x2a2a33, 1.15);
scene.add(hemi);

const gltfLoader = new GLTFLoader();
const objLoader = new OBJLoader();
const texLoader = new THREE.TextureLoader();
const texCache = {};

function fileData(id) { const f = DATA.files[id]; return f ? f.data : null; }

function loadTex(id, srgb) {
  if (!id) return null;
  const key = id + (srgb ? '_s' : '_l');
  if (texCache[key]) return texCache[key];
  const f = DATA.files[id];
  if (!f) return null;
  const t = texLoader.load(f.data);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  texCache[key] = t;
  return t;
}

function makeGeometry(type) {
  switch (type) {
    case 'sphere':   return new THREE.SphereGeometry(0.5, 40, 28);
    case 'plane':    return new THREE.PlaneGeometry(1, 1, 1, 1);
    case 'cylinder': return new THREE.CylinderGeometry(0.5, 0.5, 1, 40);
    case 'cone':     return new THREE.ConeGeometry(0.5, 1, 40);
    case 'torus':    return new THREE.TorusGeometry(0.4, 0.16, 20, 48);
    default:         return new THREE.BoxGeometry(1, 1, 1);
  }
}

async function buildScene() {
  const defs = DATA.scene || [];
  const built = {};

  for (const def of defs) {
    let obj = null;

    if (def.type === 'light') {
      obj = new THREE.DirectionalLight(def.material.color || '#ffffff', def.material.intensity != null ? def.material.intensity : 2);
      obj.castShadow = true;
      obj.shadow.mapSize.set(1024, 1024);
      obj.shadow.camera.near = 0.5;
      obj.shadow.camera.far = 120;
      const d = 22;
      obj.shadow.camera.left = -d; obj.shadow.camera.right = d;
      obj.shadow.camera.top = d;   obj.shadow.camera.bottom = -d;
      obj.shadow.bias = -0.0008;
    } else if (def.type === 'pointLight') {
      obj = new THREE.PointLight(def.material.color || '#ffffff', def.material.intensity != null ? def.material.intensity : 3, 0, 2);
    } else if (def.type === 'model') {
      obj = new THREE.Group();
      const f = DATA.files[def.asset];
      if (f) {
        const ext = (f.name.split('.').pop() || '').toLowerCase();
        try {
          let loaded = null;
          if (ext === 'glb' || ext === 'gltf') {
            const g = await gltfLoader.loadAsync(f.data);
            loaded = g.scene;
          } else if (ext === 'obj') {
            loaded = await objLoader.loadAsync(f.data);
          }
          if (loaded) {
            loaded.traverse(function (o) {
              if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
            });
            obj.add(loaded);
          }
        } catch (err) { console.warn('Model load failed:', f.name, err); }
      }
    } else {
      const m = def.material || {};
      const mat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(m.color || '#cccccc'),
        metalness: m.metalness != null ? m.metalness : 0.1,
        roughness: m.roughness != null ? m.roughness : 0.6,
        opacity: m.opacity != null ? m.opacity : 1,
        transparent: (m.opacity != null ? m.opacity : 1) < 1,
        wireframe: !!m.wireframe,
        emissive: new THREE.Color(m.emissive || '#000000'),
        emissiveIntensity: m.emissiveIntensity != null ? m.emissiveIntensity : 1,
        side: m.side === 'double' ? THREE.DoubleSide : THREE.FrontSide
      });
      const map = loadTex(m.map, true);            if (map) mat.map = map;
      const nrm = loadTex(m.normalMap, false);     if (nrm) mat.normalMap = nrm;
      const rgh = loadTex(m.roughnessMap, false);  if (rgh) mat.roughnessMap = rgh;
      const mtl = loadTex(m.metalnessMap, false);  if (mtl) mat.metalnessMap = mtl;
      obj = new THREE.Mesh(makeGeometry(def.type), mat);
      obj.castShadow = true;
      obj.receiveShadow = true;
    }

    if (!obj) continue;
    obj.name = def.name || def.type;
    obj.position.fromArray(def.position || [0, 0, 0]);
    obj.rotation.fromArray(def.rotation || [0, 0, 0]);
    obj.scale.fromArray(def.scale || [1, 1, 1]);
    obj.visible = def.visible !== false;
    obj.userData.__id = def.id;
    scene.add(obj);
    built[def.id] = obj;
  }

  if (!defs.some(function (d) { return d.type === 'light'; })) {
    const dl = new THREE.DirectionalLight(0xffffff, 2.2);
    dl.position.set(6, 12, 8);
    dl.castShadow = true;
    dl.shadow.mapSize.set(1024, 1024);
    dl.shadow.camera.left = -20; dl.shadow.camera.right = 20;
    dl.shadow.camera.top = 20; dl.shadow.camera.bottom = -20;
    scene.add(dl);
  }
  return built;
}

/* ---------------- Script runtime ---------------- */
const instances = [];
const keys = {};

window.addEventListener('keydown', function (e) { keys[e.key] = true; });
window.addEventListener('keyup', function (e) { keys[e.key] = false; });

function makeCtx(obj) {
  return {
    object: obj,
    scene: scene,
    camera: camera,
    renderer: renderer,
    THREE: THREE,
    input: {
      keys: keys,
      isDown: function (k) { return !!keys[k]; }
    },
    time: 0,
    delta: 0,
    find: function (name) { return scene.getObjectByName(name); }
  };
}

function compileScript(code) {
  const body = '"use strict";\n' + code +
    '\n;return { init: (typeof init === "function") ? init : null, update: (typeof update === "function") ? update : null };';
  return new Function('ctx', 'THREE', body);
}

async function runScripts(built) {
  const defs = DATA.scene || [];
  for (const def of defs) {
    if (!def.scripts || !def.scripts.length) continue;
    const obj = built[def.id];
    if (!obj) continue;
    for (const sid of def.scripts) {
      const f = DATA.files[sid];
      if (!f || !f.data) continue;
      try {
        const factory = compileScript(f.data);
        const mod = factory(makeCtx(obj), THREE);
        const inst = { obj: obj, mod: mod, ctx: makeCtx(obj) };
        instances.push(inst);
        if (mod.init) mod.init(inst.ctx);
      } catch (err) {
        console.error('Script error in ' + f.name + ':', err);
      }
    }
  }
}

/* ---------------- Loop ---------------- */
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });

const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  for (let i = 0; i < instances.length; i++) {
    const inst = instances[i];
    inst.ctx.time = elapsed;
    inst.ctx.delta = dt;
    if (inst.mod.update) {
      try { inst.mod.update(inst.ctx, dt); } catch (e) { console.error(e); }
    }
  }
  controls.update();
  renderer.render(scene, camera);
}

(async function () {
  resize();
  const built = await buildScene();
  await runScripts(built);
  renderer.setAnimationLoop(animate);
  window.__FORGE_READY__ = true;
})();
</script>

}

function extOf(name) {
  const i = String(name).lastIndexOf('.');
  return i < 0 ? '' : name.slice(i + 1).toLowerCase();
}

const EXT_KIND = {
  glb: 'model', gltf: 'model', obj: 'model', fbx: 'model', stl: 'model', ply: 'model', dae: 'model',

   ============================================================ */
function findNode(id, node = state.root) {
  if (!node) return null;
  if (node.id === id) return node;
  const kids = node.children || [];
  for (let i = 0; i < kids.length; i++) {
    const r = findNode(id, kids[i]);
    if (r) return r;
  }
  return null;
}
function findParent(id, node = state.root) {
  if (!node) return null;
  const kids = node.children || [];
  for (let i = 0; i < kids.length; i++) {
    if (kids[i].id === id) return node;
    const r = findParent(id, kids[i]);
    if (r) return r;
  }
  return null;
}
function ensureFolder(path, root = state.root) {
  let cur = root;
  for (const name of path) {
    cur.children = cur.children || [];
    let next = cur.children.find(c => c.type === 'folder' && c.name === name);
    if (!next) {
      next = { id: uid('d'), type: 'folder', name, children: [], expanded: true };
      cur.children.push(next);
    }
    cur = next;
  }
  return cur;
}
function walkFiles(node, fn) {
  if (!node) return;
  if (node.type === 'file') fn(node);
  (node.children || []).forEach(c => walkFiles(c, fn));
}
function allFiles() {
  const out = [];
  walkFiles(state.root, f => out.push(f));
  return out;
}

  if (kind === 'model') return ensureFolder(['Assets', 'Models']);

      id: uid('o'), name: 'Sun', type: 'light', asset: null,
      position: [6, 11, 7], rotation: [0, 0, 0], scale: [1, 1, 1],
      visible: true,
      material: { color: '#fff6e8', intensity: 2.4, metalness: 0, roughness: 0, opacity: 1, emissive: '#000000', emissiveIntensity: 0, wireframe: false, side: 'front' },
      scripts: []
    }
  ];
}

/* ============================================================
   THREE.JS — RENDERER / SCENE / CAMERAS
   ============================================================ */
const canvas = $('#viewport');
const viewportWrap = $('#viewportWrap');

const renderer = new THREE.WebGLRenderer({
  canvas, antialias: true, alpha: false,
  powerPreference: 'high-performance',
  stencil: false
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17171a);

const editorCamera = new THREE.PerspectiveCamera(55, 1, 0.1, 4000);
editorCamera.position.set(8, 7, 11);

const gameCamera = new THREE.PerspectiveCamera(60, 1, 0.1, 4000);
gameCamera.position.set(0, 3.5, 11);
gameCamera.lookAt(0, 1, 0);

const controls = new OrbitControls(editorCamera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.085;
controls.screenSpacePanning = true;
controls.minDistance = 0.5;
controls.maxDistance = 500;
controls.maxPolarAngle = Math.PI * 0.495;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

/* --- Editor helpers (hidden during play) --- */
const helpers = new THREE.Group();
helpers.name = '__helpers';
scene.add(helpers);

const grid = new THREE.GridHelper(60, 60, 0x50505a, 0x303038);
grid.position.y = 0.002;
grid.material.transparent = true;
grid.material.opacity = 0.85;
helpers.add(grid);

const axes = new THREE.AxesHelper(1.2);
axes.position.y = 0.003;
helpers.add(axes);

/* --- Ambient lighting for the editor --- */

scene.add(hemi);

/* --- Transform gizmo --- */
const transform = new TransformControls(editorCamera, renderer.domElement);
transform.setSize(0.9);
scene.add(transform);

transform.addEventListener('dragging-changed', e => {
  controls.enabled = !e.value;
});
transform.addEventListener('objectChange', () => {
  syncInspectorTransform();
  markDirty();
});

/* ============================================================
   LOADERS & CACHES
   ============================================================ */
const gltfLoader = new GLTFLoader();
const objLoader = new OBJLoader();
const texLoader = new THREE.TextureLoader();
const texCache = new Map();

function loadTexture(fileNode, srgb) {
  const key = fileNode.id + (srgb ? '_s' : '_l');
  if (texCache.has(key)) return texCache.get(key);
  const t = texLoader.load(fileNode.data);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  texCache.set(key, t);
  return t;
}

function geometryFor(type) {
  switch (type) {
    case 'sphere':   return new THREE.SphereGeometry(0.5, 40, 28);
    case 'plane':    return new THREE.PlaneGeometry(1, 1, 1, 1);
    case 'cylinder': return new THREE.CylinderGeometry(0.5, 0.5, 1, 40);
    case 'cone':     return new THREE.ConeGeometry(0.5, 1, 40);
    case 'torus':    return new THREE.TorusGeometry(0.4, 0.16, 20, 48);
    default:         return new THREE.BoxGeometry(1, 1, 1);
  }
}

/* ============================================================
   SCENE OBJECT MANAGEMENT
   ============================================================ */
function getItem(id) {
  return state.objects.find(o => o.id === id) || null;
}
function tagObject(obj, id) {
  obj.traverse(o => { o.userData.itemId = id; });
}

function defaultMaterial() {
  return {
    color: '#b9b9c2', metalness: 0.1, roughness: 0.6, opacity: 1,
    emissive: '#000000', emissiveIntensity: 0, wireframe: false,
    side: 'front', intensity: 2.4,
    map: null, normalMap: null, roughnessMap: null, metalnessMap: null
  };
}

function createObject3D(def) {
  let obj;

  if (def.type === 'light') {
    obj = new THREE.DirectionalLight(
      new THREE.Color(def.material.color || '#ffffff'),
      def.material.intensity != null ? def.material.intensity : 2.4
    );
    obj.castShadow = true;
    obj.shadow.mapSize.set(1024, 1024);
    obj.shadow.camera.near = 0.5;
    obj.shadow.camera.far = 120;
    const d = 24;
    obj.shadow.camera.left = -d; obj.shadow.camera.right = d;
    obj.shadow.camera.top = d;   obj.shadow.camera.bottom = -d;
    obj.shadow.bias = -0.0008;
    const helper = new THREE.DirectionalLightHelper(obj, 0.7, 0xffd479);
    helper.name = '__lightHelper';
    helpers.add(helper);
    obj.userData.__helper = helper;

  } else if (def.type === 'pointLight') {
    obj = new THREE.PointLight(
      new THREE.Color(def.material.color || '#ffffff'),
      def.material.intensity != null ? def.material.intensity : 3, 0, 2
    );

  } else if (def.type === 'model') {
    obj = new THREE.Group();

  } else {
    const m = def.material;
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(m.color || '#cccccc'),
      metalness: m.metalness != null ? m.metalness : 0.1,
      roughness: m.roughness != null ? m.roughness : 0.6,
      opacity: m.opacity != null ? m.opacity : 1,
      transparent: (m.opacity != null ? m.opacity : 1) < 1,
      wireframe: !!m.wireframe,
      emissive: new THREE.Color(m.emissive || '#000000'),
      emissiveIntensity: m.emissiveIntensity != null ? m.emissiveIntensity : 0,
      side: m.side === 'double' ? THREE.DoubleSide : THREE.FrontSide
    });
    obj = new THREE.Mesh(geometryFor(def.type), mat);
    obj.castShadow = true;
    obj.receiveShadow = true;

    // Restore textures
    const fmap = def.material.map && findNode(def.material.map);
    if (fmap) mat.map = loadTexture(fmap, true);
    const fnrm = def.material.normalMap && findNode(def.material.normalMap);
    if (fnrm) mat.normalMap = loadTexture(fnrm, false);
    const frgh = def.material.roughnessMap && findNode(def.material.roughnessMap);
    if (frgh) mat.roughnessMap = loadTexture(frgh, false);
    const fmtl = def.material.metalnessMap && findNode(def.material.metalnessMap);
    if (fmtl) mat.metalnessMap = loadTexture(fmtl, false);
  }

  obj.name = def.name;
  obj.position.fromArray(def.position);
  obj.rotation.fromArray(def.rotation);
  obj.scale.fromArray(def.scale);
  obj.visible = def.visible !== false;
  return obj;
}

async function loadModelAsset(item) {
  const file = findNode(item.asset);
  if (!file) return;
  const ext = extOf(file.name);
  const group = item.object3d;
  // remove previous
  while (group.children.length) {
    const c = group.children.pop();
    c.traverse(o => { if (o.isMesh && o.geometry) o.geometry.dispose(); });
  }
  try {
    let loaded = null;
    if (ext === 'glb' || ext === 'gltf') {
      const g = await gltfLoader.loadAsync(file.data);
      loaded = g.scene;
    } else if (ext === 'obj') {
      loaded = await objLoader.loadAsync(file.data);
    } else {
      toast('Unsupported model format: .' + ext);
      return;
    }
    if (loaded) {
      loaded.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
      group.add(loaded);
      tagObject(group, item.id);
      setStatus('Loaded model: ' + file.name);
    }
  } catch (err) {
    console.error(err);
    toast('Failed to load ' + file.name);
  }
}

function addObjectFromDef(def, select = true) {
  const obj = createObject3D(def);
  scene.add(obj);
  tagObject(obj, def.id);

  const item = {
    id: def.id,
    name: def.name,
    type: def.type,
    asset: def.asset || null,
    material: Object.assign(defaultMaterial(), def.material || {}),
    scripts: (def.scripts || []).slice(),
    object3d: obj
  };
  state.objects.push(item);

  if (def.type === 'model' && def.asset) loadModelAsset(item);

  refreshHierarchy();
  updateStatusBar();
  if (select) selectObject(def.id);
  return item;
}

function removeObject(id) {
  const idx = state.objects.findIndex(o => o.id === id);
  if (idx < 0) return;
  const item = state.objects[idx];
  if (transform.object === item.object3d) transform.detach();

  if (item.object3d.userData.__helper) {
    helpers.remove(item.object3d.userData.__helper);
    item.object3d.userData.__helper.dispose && item.object3d.userData.__helper.dispose();
  }
  scene.remove(item.object3d);
  item.object3d.traverse(o => {
    if (o.isMesh) {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach(m => m.dispose && m.dispose());
      }
    }
  });
  state.objects.splice(idx, 1);
  if (state.selectedId === id) selectObject(null);
  refreshHierarchy();
  updateStatusBar();
  markDirty();
}

function selectObject(id) {
  state.selectedId = id;
  const item = getItem(id);
  if (item && item.object3d) {
    transform.attach(item.object3d);
    transform.enabled = true;
    transform.visible = !state.playing;
  } else {
    transform.detach();
  }
  renderInspector();
  refreshHierarchy();
  updateStatusBar();
}

/* ============================================================
   SCENE SERIALIZATION
   ============================================================ */
function serializeScene() {
  return state.objects.map(it => ({
    id: it.id,
    name: it.name,
    type: it.type,
    asset: it.asset,
    position: it.object3d.position.toArray(),
    rotation: [it.object3d.rotation.x, it.object3d.rotation.y, it.object3d.rotation.z],
    scale: it.object3d.scale.toArray(),
    visible: it.object3d.visible,
    material: Object.assign({}, it.material),
    scripts: it.scripts.slice()
  }));
}

function serializeFiles() {
  const out = {};
  allFiles().forEach(f => {
    out[f.id] = { name: f.name, kind: f.kind, data: f.data };
  });
  return out;
}

/* ============================================================
   FILE TREE RENDERING
   ============================================================ */
const treeEl = $('#fileTree');

function renderTree() {
  treeEl.innerHTML = '';
  if (!state.root) return;

  const build = (node, depth) => {
    const row = document.createElement('div');
    row.className = 'tree-row' + (node.id === state.selectedFileId ? ' sel' : '');
    row.style.paddingLeft = (6 + depth * 13) + 'px';
    row.dataset.id = node.id;

    if (node.type === 'folder') {
      const arrow = document.createElement('span');
      arrow.className = 'arrow';
      arrow.textContent = node.expanded ? '▾' : '▸';
      row.appendChild(arrow);

      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = '#5a5a66';
      dot.style.borderRadius = '2px';
      row.appendChild(dot);

      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = node.name;
      row.appendChild(label);

      row.addEventListener('click', e => {
        e.stopPropagation();
        node.expanded = !node.expanded;
        state.currentFolderId = node.id;
        state.selectedFileId = node.id;
        renderTree();
      });

      if (node.expanded) {
        treeEl.appendChild(row);
        (node.children || []).forEach(c => build(c, depth + 1));
      } else {
        treeEl.appendChild(row);
      }
    } else {
      const spacer = document.createElement('span');
      spacer.className = 'arrow';
      row.appendChild(spacer);

      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = KIND_COLOR[node.kind] || '#8a8a92';
      row.appendChild(dot);

      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = node.name;
      row.appendChild(label);

      if (node.binary) {
        const b = document.createElement('span');
        b.className = 'badge';
        b.textContent = 'bin';
        row.appendChild(b);
      }

      row.addEventListener('click', e => {
        e.stopPropagation();
        state.selectedFileId = node.id;
        const p = findParent(node.id);
        state.currentFolderId = p ? p.id : 'root';
        renderTree();
        if (isTextKind(node.kind)) openFile(node);
      });

      row.addEventListener('dblclick', e => {
        e.stopPropagation();
        quickAddAsset(node);
      });

      row.addEventListener('pointerdown', e => {
        if (node.kind === 'model' || node.kind === 'texture' || node.kind === 'script') {
          beginTreeDrag(e, node, row);
        }
      });

      treeEl.appendChild(row);
    }
  };

  (state.root.children || []).forEach(c => build(c, 0));
}

function isTextKind(kind) {
  return ['script', 'html', 'css', 'json', 'text'].indexOf(kind) >= 0;
}

/* --- Tree drag to viewport --- */
function beginTreeDrag(ev, node, row) {
  let started = false;
  const startX = ev.clientX, startY = ev.clientY;
  let ghost = null;

  const move = e => {
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (!started && Math.hypot(dx, dy) < 8) return;
    if (!started) {
      started = true;
      ghost = document.createElement('div');
      ghost.className = 'drag-ghost';
      ghost.textContent = node.name;
      document.body.appendChild(ghost);
      if (state.mode !== 'scene') setMode('scene');
    }
    ghost.style.left = e.clientX + 'px';
    ghost.style.top = e.clientY + 'px';

    const r = viewportWrap.getBoundingClientRect();
    const over = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    viewportWrap.classList.toggle('drop-target', over);

    // texture slot highlight
    highlightTexSlots(node.kind === 'texture');
  };

  const up = e => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
    if (ghost) ghost.remove();
    viewportWrap.classList.remove('drop-target');
    highlightTexSlots(false);
    if (!started) return;

    const r = viewportWrap.getBoundingClientRect();
    const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    if (inside) handleViewportDrop(node, e.clientX, e.clientY);
  };

  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
}

function highlightTexSlots(on) {
  $$('.tex-slot').forEach(el => el.classList.toggle('droppable', on));
}

/* ============================================================
   VIEWPORT DROP HANDLING
   ============================================================ */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

function toNDC(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  pointerNDC.x = ((clientX - r.left) / r.width) * 2 - 1;
  pointerNDC.y = -((clientY - r.top) / r.height) * 2 + 1;
  return pointerNDC;
}

function pickItem(clientX, clientY) {
  raycaster.setFromCamera(toNDC(clientX, clientY), state.playing ? gameCamera : editorCamera);
  const roots = state.objects.map(o => o.object3d).filter(o => o && o.visible);
  const hits = raycaster.intersectObjects(roots, true);
  for (const h of hits) {
    let n = h.object;
    while (n) {
      if (n.userData && n.userData.itemId) {
        const item = getItem(n.userData.itemId);
        if (item) return { item, point: h.point };
      }
      n = n.parent;
    }
  }
  return null;
}

function groundPoint(clientX, clientY) {
  raycaster.setFromCamera(toNDC(clientX, clientY), editorCamera);
  const p = new THREE.Vector3();
  const ok = raycaster.ray.intersectPlane(groundPlane, p);
  return ok ? p : new THREE.Vector3(0, 0, 0);
}

function handleViewportDrop(fileNode, cx, cy) {
  if (fileNode.kind === 'model') {
    const p = groundPoint(cx, cy);
    const def = {
      id: uid('o'), name: fileNode.name.replace(/\.[^.]+$/, ''), type: 'model',
      asset: fileNode.id,
      position: [p.x, 0, p.z], rotation: [0, 0, 0], scale: [1, 1, 1],
      visible: true, material: defaultMaterial(), scripts: []
    };
    addObjectFromDef(def);
    toast('Placed ' + fileNode.name);
    return;
  }

  if (fileNode.kind === 'texture') {
    const hit = pickItem(cx, cy);
    if (!hit) { toast('Drop textures onto a mesh in the scene'); return; }
    const slot = guessTextureSlot(fileNode.name);
    applyTexture(hit.item, fileNode, slot);
    return;
  }

  if (fileNode.kind === 'script') {
    const hit = pickItem(cx, cy);
    if (!hit) { toast('Drop scripts onto an object to attach'); return; }
    if (hit.item.scripts.indexOf(fileNode.id) < 0) hit.item.scripts.push(fileNode.id);
    toast('Attached ' + fileNode.name + ' → ' + hit.item.name);
    renderInspector();
    markDirty();
    return;
  }

  if (fileNode.kind === 'audio') {
    toast('Audio asset ready — reference it from a script');
    return;
  }

  toast('Drop a model, texture, or script into the viewport');
}

function guessTextureSlot(name) {
  const n = name.toLowerCase();
  if (n.includes('normal') || n.includes('_nrm') || n.includes('_n.')) return 'normalMap';
  if (n.includes('rough')) return 'roughnessMap';
  if (n.includes('metal')) return 'metalnessMap';
  if (n.includes('ao') || n.includes('occlusion')) return 'roughnessMap';
  if (n.includes('emissive') || n.includes('glow')) return 'map';
  return 'map';
}

function applyTexture(item, fileNode, slot) {
  if (!item || item.type === 'light' || item.type === 'pointLight') {
    toast('Cannot apply textures to lights');
    return;
  }
  const mat = item.object3d.material;
  if (!mat) { toast('Object has no editable material'); return; }

  const srgb = (slot === 'map');
  const tex = loadTexture(fileNode, srgb);
  tex.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  mat[slot] = tex;
  mat.needsUpdate = true;
  item.material[slot] = fileNode.id;

  const labels = { map: 'Base Color', normalMap: 'Normal', roughnessMap: 'Roughness', metalnessMap: 'Metalness' };
  toast(labels[slot] + ' ← ' + fileNode.name);
  renderInspector();
  markDirty();
}

function quickAddAsset(node) {
  if (node.kind === 'model') {
    const def = {
      id: uid('o'), name: node.name.replace(/\.[^.]+$/, ''), type: 'model',
      asset: node.id, position: [0, 0, 0], rotation: [0, 0, 0], scale: [1, 1, 1],
      visible: true, material: defaultMaterial(), scripts: []
    };
    addObjectFromDef(def);
    setMode('scene');
    toast('Added ' + node.name + ' to scene');
  } else if (node.kind === 'texture') {
    const item = getItem(state.selectedId);
    if (!item) { toast('Select an object first'); return; }
    applyTexture(item, node, guessTextureSlot(node.name));
  }
}

/* ============================================================
   HIERARCHY RENDERING
   ============================================================ */
const hierEl = $('#hierarchy');

const TYPE_GLYPH = {
  box: '▣', sphere: '◯', plane: '▭', cylinder: '▮', cone: '△', torus: '◎',
  model: '⬡', light: '☀', pointLight: '✦'
};

function refreshHierarchy() {
  hierEl.innerHTML = '';
  if (!state.objects.length) {
    hierEl.innerHTML = '<div class="empty">Scene is empty.<br>Drag a model into the viewport or press ＋.</div>';
    return;
  }
  state.objects.forEach(item => {
    const row = document.createElement('div');
    row.className = 'hier-row' + (item.id === state.selectedId ? ' sel' : '');

    const g = document.createElement('span');
    g.className = 'glyph';
    g.textContent = TYPE_GLYPH[item.type] || '▣';
    g.style.color = item.type === 'light' ? '#ffd479' : (item.type === 'model' ? '#e5c07b' : '');
    row.appendChild(g);

    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = item.name;
    row.appendChild(label);

    // visibility toggle
    const vis = document.createElement('button');
    vis.className = 'act' + (item.object3d.visible ? ' on' : '');
    vis.textContent = item.object3d.visible ? '◉' : '◎';
    vis.title = 'Toggle visibility';
    vis.onclick = e => {
      e.stopPropagation();
      item.object3d.visible = !item.object3d.visible;
      refreshHierarchy();
      markDirty();
    };
    row.appendChild(vis);

    // script quick menu
    const scr = document.createElement('button');
    scr.className = 'act';
    scr.textContent = '</>';
    scr.title = 'Attach script';
    scr.onclick = e => {
      e.stopPropagation();
      selectObject(item.id);
      openScriptAttachModal(item);
    };
    row.appendChild(scr);

    row.addEventListener('click', () => selectObject(item.id));
    hierEl.appendChild(row);
  });
}

function openScriptAttachModal(item) {
  const scripts = allFiles().filter(f => f.kind === 'script');
  let html = '<p>Attach a behaviour script to <b>' + escHTML(item.name) + '</b>.</p>';
  if (!scripts.length) {
    html += '<p style="color:var(--dim-2)">No scripts found. Create one in the Explorer.</p>';
  } else {
    html += '<div class="chip-list" style="padding:0">';
    scripts.forEach(s => {
      const on = item.scripts.indexOf(s.id) >= 0;
      html += '<div class="chip" data-sid="' + s.id + '" style="cursor:pointer;' +
        (on ? 'border-color:var(--accent)' : '') + '">' +
        '<span class="dot" style="width:7px;height:7px;border-radius:2px;background:' + KIND_COLOR.script + '"></span>' +
        escHTML(s.name) + (on ? ' ✓' : '') + '</div>';
    });
    html += '</div>';
  }
  showModal('Scripts — ' + item.name, html, [
    { label: 'New Script', cls: 'tbtn', action: () => { createScriptFor(item); } },
    { label: 'Done', cls: 'tbtn primary' }
  ]);

  $$('#modalBody .chip').forEach(chip => {
    chip.onclick = () => {
      const sid = chip.dataset.sid;
      const i = item.scripts.indexOf(sid);
      if (i >= 0) item.scripts.splice(i, 1);
      else item.scripts.push(sid);
      markDirty();
      renderInspector();
      openScriptAttachModal(item);
    };
  });
}

function createScriptFor(item) {
  const name = prompt('Script file name:', item.name.replace(/\s+/g, '_') + '.js');
  if (!name) return;
  const fileName = name.endsWith('.js') ? name : name + '.js';
  const folder = ensureFolder(['Scripts']);
  const node = makeFile(fileName, 'script', 'let t = 0;\n\nfunction init(ctx) {\n  // runs once when play starts\n}\n\nfunction update(ctx, dt) {\n  t += dt;\n  // ctx.object.rotation.y += dt;\n}\n');
  folder.children.push(node);
  item.scripts.push(node.id);
  closeModal();
  renderTree();
  renderInspector();
  openFile(node);
  markDirty();
}

/* ============================================================
   INSPECTOR
   ============================================================ */
const inspectorEl = $('#inspector');

function row(labelText, controlEl) {
  const r = document.createElement('div');
  r.className = 'row';
  const l = document.createElement('label');
  l.textContent = labelText;
  r.appendChild(l);
  const c = document.createElement('div');
  c.className = 'ctl';
  if (controlEl) c.appendChild(controlEl);
  r.appendChild(c);
  return r;
}

function section(title) {
  const s = document.createElement('div');
  s.className = 'insp-section';
  if (title) {
    const h = document.createElement('h4');
    h.textContent = title;
    s.appendChild(h);
  }
  return s;
}

function numInput(value, step, onChange) {
  const i = document.createElement('input');
  i.type = 'number';
  i.step = step || 0.1;
  i.value = fmt(value);
  i.addEventListener('input', () => {
    const v = parseFloat(i.value);
    if (!isNaN(v)) onChange(v);
  });
  return i;
}

function vec3Row(label, vec, opts) {
  opts = opts || {};
  const deg = !!opts.deg;
  const scale = deg ? 180 / Math.PI : 1;

  const wrap = document.createElement('div');
  wrap.style.display = 'flex';
  wrap.style.gap = '4px';
  wrap.style.width = '100%';

  ['X', 'Y', 'Z'].forEach((ax, i) => {
    const inp = document.createElement('input');
    inp.type = 'number';
    inp.step = opts.step || 0.1;
    inp.value = fmt(vec.getComponent(i) * scale);
    inp.dataset.vec = opts.key;
    inp.dataset.axis = String(i);
    inp.dataset.deg = deg ? '1' : '0';
    inp.title = ax;
    inp.addEventListener('input', () => {
      const v = parseFloat(inp.value);
      if (isNaN(v)) return;
      vec.setComponent(i, deg ? v * Math.PI / 180 : v);
      markDirty();
      updateStatusBar();
    });
    wrap.appendChild(inp);
  });

  const r = document.createElement('div');
  r.className = 'row';
  const l = document.createElement('label');
  l.textContent = label;
  r.appendChild(l);
  const c = document.createElement('div');
  c.className = 'ctl';
  c.appendChild(wrap);
  r.appendChild(c);
  return r;
}

function sliderRow(label, value, min, max, step, onChange) {
  const wrap = document.createElement('div');
  wrap.style.display = 'flex';
  wrap.style.alignItems = 'center';
  wrap.style.gap = '8px';
  wrap.style.width = '100%';

  const r = document.createElement('input');
  r.type = 'range';
  r.min = min; r.max = max; r.step = step; r.value = value;

  const v = document.createElement('span');
  v.className = 'slider-val';
  v.textContent = (+value).toFixed(2);

  r.addEventListener('input', () => {
    const n = parseFloat(r.value);
    v.textContent = n.toFixed(2);
    onChange(n);
  });

  wrap.appendChild(r);
  wrap.appendChild(v);

  const rowEl = document.createElement('div');
  rowEl.className = 'row';
  const l = document.createElement('label');
  l.textContent = label;
  rowEl.appendChild(l);
  const c = document.createElement('div');
  c.className = 'ctl';
  c.appendChild(wrap);
  rowEl.appendChild(c);
  return rowEl;
}

function colorRow(label, value, onChange) {
  const wrap = document.createElement('div');
  wrap.style.display = 'flex';
  wrap.style.alignItems = 'center';
  wrap.style.gap = '8px';
  wrap.style.width = '100%';

  const c = document.createElement('input');
  c.type = 'color';
  c.value = value || '#ffffff';

  const t = document.createElement('input');
  t.type = 'text';
  t.value = (value || '#ffffff').toUpperCase();
  t.style.flex = '1';

  c.addEventListener('input', () => { t.value = c.value.toUpperCase(); onChange(c.value); });
  t.addEventListener('change', () => {
    if (/^#[0-9a-f]{6}$/i.test(t.value)) { c.value = t.value; onChange(t.value); }
  });

  wrap.appendChild(c);
  wrap.appendChild(t);

  const rowEl = document.createElement('div');
  rowEl.className = 'row';
  const l = document.createElement('label');
  l.textContent = label;
  rowEl.appendChild(l);
  const ctl = document.createElement('div');
  ctl.className = 'ctl';
  ctl.appendChild(wrap);
  rowEl.appendChild(ctl);
  return rowEl;
}

function toggleRow(label, value, onChange) {
  const lbl = document.createElement('label');
  lbl.className = 'chk';
  const inp = document.createElement('input');
  inp.type = 'checkbox';
  inp.checked = !!value;
  inp.addEventListener('change', () => onChange(inp.checked));
  lbl.appendChild(inp);
  const span = document.createElement('span');
  span.textContent = label;
  lbl.appendChild(span);

  const r = document.createElement('div');
  r.className = 'row';
  const c = document.createElement('div');
  c.className = 'ctl';
  c.appendChild(lbl);
  r.appendChild(c);
  return r;
}

function textureSlotRow(label, slot, item) {
  const fileId = item.material[slot];
  const fileNode = fileId ? findNode(fileId) : null;

  const wrap = document.createElement('div');
  wrap.className = 'tex-slot droppable';
  wrap.dataset.slot = slot;

  const thumb = document.createElement('div');
  thumb.className = 'thumb';
  if (fileNode) {
    thumb.style.backgroundImage = 'url(' + fileNode.data + ')';
  } else {
    thumb.textContent = '—';
  }
  wrap.appendChild(thumb);

  const meta = document.createElement('div');
  meta.className = 'meta';
  const n = document.createElement('span');
  n.className = 'n';
  n.textContent = label;
  const v = document.createElement('span');
  v.className = 'v';
  v.textContent = fileNode ? fileNode.name : 'None';
  v.style.color = fileNode ? '#d6d6d8' : '#5f5f68';
  meta.appendChild(n);
  meta.appendChild(v);
  wrap.appendChild(meta);

  const clr = document.createElement('button');
  clr.className = 'clr';
  clr.textContent = '✕';
  clr.title = 'Clear';
  clr.onclick = () => {
    const mat = item.object3d.material;
    if (mat) { mat[slot] = null; mat.needsUpdate = true; }
    item.material[slot] = null;
    renderInspector();
    markDirty();
  };
  wrap.appendChild(clr);

  // Drop handling (pointer based, for iPad)
  wrap.addEventListener('pointerdown', e => {
    e.stopPropagation();
  });

  // HTML5 fallback (desktop)
  wrap.addEventListener('dragover', e => { e.preventDefault(); wrap.classList.add('hot'); });
  wrap.addEventListener('dragleave', () => wrap.classList.remove('hot'));

  return wrap;
}

function renderInspector() {
  inspectorEl.innerHTML = '';
  const item = getItem(state.selectedId);

  if (!item) {
    inspectorEl.innerHTML =
      '<div class="empty">No selection.<br><br>' +
      '• Tap an object in the Hierarchy<br>' +
      '• Drag a model from the Explorer into the viewport<br>' +
      '• Drop a texture onto a mesh to apply it</div>';
    return;
  }

  /* ---- Title ---- */
  const title = document.createElement('div');
  title.className = 'insp-title';
  const dot = document.createElement('span');
  dot.className = 'dot';
  dot.style.cssText = 'width:8px;height:8px;border-radius:2px;background:' +
    (item.type === 'light' ? '#ffd479' : (item.type === 'model' ? '#e5c07b' : '#4a86c9'));
  title.appendChild(dot);
  title.appendChild(document.createTextNode(item.name));
  const tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = item.type;
  title.appendChild(tag);
  inspectorEl.appendChild(title);

  /* ---- General ---- */
  const gen = section('Object');
  const nameInp = document.createElement('input');
  nameInp.type = 'text';
  nameInp.value = item.name;
  nameInp.addEventListener('input', () => {
    item.name = nameInp.value || 'Object';
    item.object3d.name = item.name;
    refreshHierarchy();
    markDirty();
  });
  gen.appendChild(row('Name', nameInp));

  if (item.type === 'model' && item.asset) {
    const f = findNode(item.asset);
    const info = document.createElement('div');
    info.className = 'empty';
    info.style.cssText = 'padding:4px 10px 0;text-align:left;font-size:11px';
    info.textContent = 'Asset: ' + (f ? f.name : 'missing');
    gen.appendChild(info);
  }

  gen.appendChild(toggleRow('Visible', item.object3d.visible, v => {
    item.object3d.visible = v;
    refreshHierarchy();
    markDirty();
  }));
  inspectorEl.appendChild(gen);

  /* ---- Transform ---- */
  const tr = section('Transform');
  tr.appendChild(vec3Row('Position', item.object3d.position, { key: 'position', step: 0.1 }));
  tr.appendChild(vec3Row('Rotation', item.object3d.rotation, { key: 'rotation', step: 1, deg: true }));
  tr.appendChild(vec3Row('Scale', item.object3d.scale, { key: 'scale', step: 0.1 }));

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';
  const resetBtn = document.createElement('button');
  resetBtn.className = 'tbtn';
  resetBtn.textContent = 'Reset Transform';
  resetBtn.onclick = () => {
    item.object3d.position.set(0, 0, 0);
    item.object3d.rotation.set(0, 0, 0);
    item.object3d.scale.set(1, 1, 1);
    renderInspector();
    markDirty();
  };
  btnRow.appendChild(resetBtn);
  tr.appendChild(btnRow);
  inspectorEl.appendChild(tr);

  /* ---- Light properties ---- */
  if (item.type === 'light' || item.type === 'pointLight') {
    const li = section('Light');
    li.appendChild(colorRow('Color', item.material.color, v => {
      item.material.color = v;
      item.object3d.color.set(v);
      markDirty();
    }));
    li.appendChild(sliderRow('Intensity', item.material.intensity != null ? item.material.intensity : 2.4, 0, 12, 0.05, v => {
      item.material.intensity = v;
      item.object3d.intensity = v;
      markDirty();
    }));
    inspectorEl.appendChild(li);
  }

  /* ---- Material ---- */
  if (item.type !== 'light' && item.type !== 'pointLight') {
    const mat = item.object3d.material;
    const ms = section('Material');

    ms.appendChild(colorRow('Base Color', item.material.color, v => {
      item.material.color = v;
      if (mat) { mat.color.set(v); mat.needsUpdate = true; }
      markDirty();
    }));

    ms.appendChild(sliderRow('Metalness', item.material.metalness, 0, 1, 0.01, v => {
      item.material.metalness = v;
      if (mat) mat.metalness = v;
      markDirty();
    }));

    ms.appendChild(sliderRow('Roughness', item.material.roughness, 0, 1, 0.01, v => {
      item.material.roughness = v;
      if (mat) mat.roughness = v;
      markDirty();
    }));

    ms.appendChild(sliderRow('Opacity', item.material.opacity, 0, 1, 0.01, v => {
      item.material.opacity = v;
      if (mat) { mat.opacity = v; mat.transparent = v < 1; mat.needsUpdate = true; }
      markDirty();
    }));

    ms.appendChild(colorRow('Emissive', item.material.emissive, v => {
      item.material.emissive = v;
      if (mat) { mat.emissive.set(v); }
      markDirty();
    }));

    ms.appendChild(toggleRow('Wireframe', item.material.wireframe, v => {
      item.material.wireframe = v;
      if (mat) mat.wireframe = v;
      markDirty();
    }));

    const sideSel = document.createElement('select');
    ['front', 'double'].forEach(s => {
      const o = document.createElement('option');
      o.value = s;
      o.textContent = s === 'front' ? 'Front Side' : 'Double Side';
      if (item.material.side === s) o.selected = true;
      sideSel.appendChild(o);
    });
    sideSel.addEventListener('change', () => {
      item.material.side = sideSel.value;
      if (mat) { mat.side = sideSel.value === 'double' ? THREE.DoubleSide : THREE.FrontSide; mat.needsUpdate = true; }
      markDirty();
    });
    ms.appendChild(row('Sides', sideSel));

    inspectorEl.appendChild(ms);

    /* ---- Texture maps ---- */
    const texSec = section('Textures');
    texSec.appendChild(textureSlotRow('Base Color', 'map', item));
    texSec.appendChild(textureSlotRow('Normal', 'normalMap', item));
    texSec.appendChild(textureSlotRow('Roughness', 'roughnessMap', item));
    texSec.appendChild(textureSlotRow('Metalness', 'metalnessMap', item));

    const hint = document.createElement('div');
    hint.className = 'empty';
    hint.style.cssText = 'padding:6px 10px 0;font-size:10.5px;text-align:left';
    hint.textContent = 'Drag a texture from the Explorer and drop it onto the mesh, or use the slot buttons above.';
    texSec.appendChild(hint);

    inspectorEl.appendChild(texSec);
  }

  /* ---- Scripts ---- */
  const sc = section('Scripts');
  if (item.scripts.length) {
    const list = document.createElement('div');
    list.className = 'chip-list';
    item.scripts.forEach(sid => {
      const f = findNode(sid);
      const chip = document.createElement('div');
      chip.className = 'chip';
      const nm = document.createElement('span');
      nm.textContent = f ? f.name : 'missing';
      chip.appendChild(nm);

      const edit = document.createElement('button');
      edit.textContent = '✎';
      edit.title = 'Edit';
      edit.onclick = () => { if (f) openFile(f); };
      chip.appendChild(edit);

      const rm = document.createElement('button');
      rm.textContent = '✕';
      rm.title = 'Detach';
      rm.onclick = () => {
        const i = item.scripts.indexOf(sid);
        if (i >= 0) item.scripts.splice(i, 1);
        renderInspector();
        markDirty();
      };
      chip.appendChild(rm);

      list.appendChild(chip);
    });
    sc.appendChild(list);
  } else {
    const e = document.createElement('div');
    e.className = 'empty';
    e.style.padding = '6px 10px';
    e.textContent = 'No scripts attached.';
    sc.appendChild(e);
  }

  const sbtn = document.createElement('div');
  sbtn.className = 'btn-row';
  const attach = document.createElement('button');
  attach.className = 'tbtn';
  attach.textContent = 'Attach Script…';
  attach.onclick = () => openScriptAttachModal(item);
  sbtn.appendChild(attach);
  sc.appendChild(sbtn);
  inspectorEl.appendChild(sc);

  /* ---- Danger zone ---- */
  const dz = section('');
  const drow = document.createElement('div');
  drow.className = 'btn-row';
  const del = document.createElement('button');
  del.className = 'tbtn danger';
  del.textContent = 'Delete Object';
  del.onclick = () => { removeObject(item.id); };
  drow.appendChild(del);
  dz.appendChild(drow);
  inspectorEl.appendChild(dz);
}

function syncInspectorTransform() {
  const item = getItem(state.selectedId);
  if (!item) return;
  $$('#inspector [data-vec]').forEach(inp => {
    const key = inp.dataset.vec;
    const axis = parseInt(inp.dataset.axis, 10);
    const deg = inp.dataset.deg === '1';
    const vec = item.object3d[key];
    if (!vec) return;
    const v = vec.getComponent(axis) * (deg ? 180 / Math.PI : 1);
    if (document.activeElement !== inp) inp.value = fmt(v);
  });
  updateStatusBar();
}

/* ============================================================
   CODE EDITOR
   ============================================================ */
const tabBar = $('#tabBar');
const codeInput = $('#codeInput');
const highlightEl = $('#highlight');
const gutterEl = $('#gutter');

const JS_KEYWORDS = /\b(const|let|var|function|return|if|else|for|while|do|new|class|extends|import|export|from|default|this|typeof|instanceof|try|catch|finally|throw|switch|case|break|continue|await|async|of|in|delete|void|yield|null|true|false|undefined|static|get|set)\b/;

function highlightJS(src) {
  const re = /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|('(?:\\.|[^'\\])*'|"(?:\\.|[^"\\])*"|`(?:\\.|[^`\\])*`)|\b(const|let|var|function|return|if|else|for|while|do|new|class|extends|import|export|from|default|this|typeof|instanceof|try|catch|finally|throw|switch|case|break|continue|await|async|of|in|delete|void|yield|null|true|false|undefined|static)\b|\b(\d+\.?\d*)\b/g;
  let out = '';
  let last = 0;
  let m;
  while ((m = re.exec(src)) !== null) {
    out += escHTML(src.slice(last, m.index));
    let cls = 'c-com';
    if (m[2]) cls = 'c-str';
    else if (m[3]) cls = 'c-key';
    else if (m[4]) cls = 'c-num';
    out += '<span class="' + cls + '">' + escHTML(m[0]) + '</span>';
    last = m.index + m[0].length;
  }
  out += escHTML(src.slice(last));
  return out;
}

function highlightHTML(src) {
  return escHTML(src)
    .replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="c-com">$1</span>')
    .replace(/(&lt;\/?)([a-zA-Z][a-zA-Z0-9-]*)/g, '$1<span class="c-tag">$2</span>')
    .replace(/([a-zA-Z-]+)=(&quot;|")/g, '<span class="c-att">$1</span>=$2');
}

function highlightCSS(src) {
  return escHTML(src)
    .replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="c-com">$1</span>')
    .replace(/([a-z-]+)(\s*:)/g, '<span class="c-att">$1</span>$2')
    .replace(/(#[0-9a-fA-F]{3,8})\b/g, '<span class="c-num">$1</span>');
}

function highlightFor(kind, src) {
  if (kind === 'script') return highlightJS(src);
  if (kind === 'html') return highlightHTML(src);
  if (kind === 'css') return highlightCSS(src);
  if (kind === 'json') return highlightJS(src);
  return escHTML(src);
}

let saveTimer = null;

function openFile(node) {
  if (!node || node.type !== 'file') return;
  if (!isTextKind(node.kind)) {
    if (node.kind === 'texture') { setMode('assets'); toast('Texture: ' + node.name); }
    return;
  }
  if (!state.openTabs.some(t => t.id === node.id)) {
    state.openTabs.push({ id: node.id });
  }
  state.activeTabId = node.id;
  state.selectedFileId = node.id;
  setMode('code');
  renderTabs();
  loadEditor(node);
  renderTree();
}

function renderTabs() {
  tabBar.innerHTML = '';
  state.openTabs.forEach(t => {
    const node = findNode(t.id);
    if (!node) return;
    const el = document.createElement('div');
    el.className = 'tab' + (t.id === state.activeTabId ? ' active' : '');

    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = KIND_COLOR[node.kind] || '#8a8a92';
    el.appendChild(dot);

    const nm = document.createElement('span');
    nm.textContent = node.name;
    el.appendChild(nm);

    const x = document.createElement('span');
    x.className = 'x';
    x.textContent = '✕';
    x.onclick = ev => {
      ev.stopPropagation();
      const i = state.openTabs.findIndex(tt => tt.id === t.id);
      if (i >= 0) state.openTabs.splice(i, 1);
      if (state.activeTabId === t.id) {
        state.activeTabId = state.openTabs.length ? state.openTabs[state.openTabs.length - 1].id : null;
        if (state.activeTabId) loadEditor(findNode(state.activeTabId));
        else { codeInput.value = ''; updateHighlight(); }
      }
      renderTabs();
    };
    el.appendChild(x);

    el.onclick = () => {
      state.activeTabId = t.id;
      state.selectedFileId = t.id;
      renderTabs();
      loadEditor(node);
      renderTree();
    };

    tabBar.appendChild(el);
  });
}

function loadEditor(node) {
  codeInput.value = node.data || '';
  updateHighlight();
  setStatus('Editing ' + node.name);
}

function updateHighlight() {
  const node = findNode(state.activeTabId);
  const kind = node ? node.kind : 'text';
  const text = codeInput.value;
  highlightEl.innerHTML = '<code>' + highlightFor(kind, text) + '\n</code>';
  const lines = text.split('\n').length;
  let g = '';
  for (let i = 1; i <= lines; i++) g += '<div>' + i + '</div>';
  gutterEl.innerHTML = g;
  highlightEl.scrollTop = codeInput.scrollTop;
  highlightEl.scrollLeft = codeInput.scrollLeft;
  gutterEl.scrollTop = codeInput.scrollTop;
}

codeInput.addEventListener('input', () => {
  updateHighlight();
  const node = findNode(state.activeTabId);
  if (!node) return;
  node.data = codeInput.value;
  markDirty();
  clearTimeout(saveTimer);
  setStatus('Saving…');
  saveTimer = setTimeout(() => {
    node.data = codeInput.value;
    persist();
    setStatus('Saved ' + node.name);
  }, 700);
});

codeInput.addEventListener('scroll', () => {
  highlightEl.scrollTop = codeInput.scrollTop;
  highlightEl.scrollLeft = codeInput.scrollLeft;
  gutterEl.scrollTop = codeInput.scrollTop;
});

codeInput.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') {
    e.preventDefault();
    const node = findNode(state.activeTabId);
    if (node) { node.data = codeInput.value; persist(); toast('Saved ' + node.name); }
  }
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = codeInput.selectionStart, en = codeInput.selectionEnd;
    codeInput.value = codeInput.value.slice(0, s) + '  ' + codeInput.value.slice(en);
    codeInput.selectionStart = codeInput.selectionEnd = s + 2;
    updateHighlight();
  }
});

/* ============================================================
   ASSET MANAGER
   ============================================================ */
const assetGrid = $('#assetGrid');

function renderAssets() {
  assetGrid.innerHTML = '';
  const files = allFiles().filter(f =>
    ['texture', 'model', 'audio', 'video', 'font'].indexOf(f.kind) >= 0
  );

  if (!files.length) {
    assetGrid.innerHTML = '<div class="empty" style="grid-column:1/-1;padding:60px 20px">' +
      'No assets yet.<br><br>Tap <b>Import Files</b> to add models, textures, audio, fonts and more.</div>';
    return;
  }

  files.forEach(f => {
    const card = document.createElement('div');
    card.className = 'asset-card' + (f.id === state.selectedFileId ? ' sel' : '');

    const prev = document.createElement('div');
    prev.className = 'preview';
    if (f.kind === 'texture') {
      prev.style.backgroundImage = 'url(' + f.data + ')';
    } else {
      prev.textContent = KIND_ICON[f.kind] || '?';
      prev.style.color = KIND_COLOR[f.kind] || '#8a8a92';
    }
    const ext = document.createElement('span');
    ext.className = 'ext';
    ext.textContent = (extOf(f.name) || '?').toUpperCase();
    prev.appendChild(ext);
    card.appendChild(prev);

    const info = document.createElement('div');
    info.className = 'info';
    const n = document.createElement('span');
    n.className = 'n';
    n.textContent = f.name;
    const s = document.createElement('span');
    s.className = 's';
    s.textContent = f.kind + (f.binary ? ' · binary' : ' · text');
    info.appendChild(n);
    info.appendChild(s);
    card.appendChild(info);

    const acts = document.createElement('div');
    acts.className = 'acts';

    const addBtn = document.createElement('button');
    addBtn.textContent = '＋ Scene';
    addBtn.onclick = ev => {
      ev.stopPropagation();
      state.selectedFileId = f.id;
      quickAddAsset(f);
    };
    acts.appendChild(addBtn);

    if (f.kind === 'texture') {
      const applyBtn = document.createElement('button');
      applyBtn.textContent = 'Apply';
      applyBtn.onclick = ev => {
        ev.stopPropagation();
        const item = getItem(state.selectedId);
        if (!item) { toast('Select an object first'); return; }
        applyTexture(item, f, guessTextureSlot(f.name));
      };
      acts.appendChild(applyBtn);
    }

    if (f.kind === 'audio') {
      const playBtn = document.createElement('button');
      playBtn.textContent = '▶';
      playBtn.onclick = ev => {
        ev.stopPropagation();
        const a = new Audio(f.data);
        a.play().catch(() => toast('Audio preview unavailable'));
      };
      acts.appendChild(playBtn);
    }

    card.appendChild(acts);

/* ============================================================
   RENDER LOOP
   ============================================================ */
let fpsAccum = 0, fpsFrames = 0, fpsValue = 60;
let lastTime = performance.now();
const clock = new THREE.Clock();
let playTime = 0;

function renderLoop() {
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  fpsAccum += dt;
  fpsFrames++;
  if (fpsAccum >= 0.4) {
    fpsValue = Math.round(fpsFrames / fpsAccum);
    fpsAccum = 0;
    fpsFrames = 0;
    $('#hudFps').textContent = fpsValue + ' fps';
    $('#playStats').textContent = fpsValue + ' fps';
  }

  if (state.playing) {
    playTime += dt;
    runScriptUpdates(dt, playTime);
  }

  controls.update();

  // update light helpers
  state.objects.forEach(it => {
    if (it.object3d.userData.__helper && it.object3d.userData.__helper.update) {
      it.object3d.userData.__helper.update();
    }
  });

  const cam = state.playing ? gameCamera : editorCamera;
  renderer.render(scene, cam);
}

renderer.setAnimationLoop(renderLoop);

/* ============================================================
   SCRIPT RUNTIME (in-editor play mode)
   ============================================================ */
let scriptInstances = [];
const keyState = {};

window.addEventListener('keydown', e => { keyState[e.key] = true; });
window.addEventListener('keyup', e => { keyState[e.key] = false; });

function makeCtx(item) {
  return {
    object: item.object3d,
    scene: scene,
    camera: gameCamera,
    renderer: renderer,
    THREE: THREE,
    input: {
      keys: keyState,
      isDown: k => !!keyState[k]
    },
    time: 0,
    delta: 0,
    find: name => scene.getObjectByName(name)
  };
}

function startScripts() {
  scriptInstances = [];
  state.objects.forEach(item => {
    (item.scripts || []).forEach(sid => {
      const f = findNode(sid);
      if (!f || !f.data) return;
      try {
        const factory = new Function('ctx', 'THREE',
          '"use strict";\n' + f.data +
          '\n;return { init: (typeof init === "function") ? init : null, update: (typeof update === "function") ? update : null };');
        const mod = factory(makeCtx(item), THREE);
        const inst = { item, mod, ctx: makeCtx(item) };
        scriptInstances.push(inst);
        if (mod.init) mod.init(inst.ctx);
      } catch (err) {
        console.error('Script error in ' + f.name + ':', err);
        toast('Script error: ' + f.name);
      }
    });
  });
  if (scriptInstances.length) setStatus('Running ' + scriptInstances.length + ' script(s)');
}

function runScriptUpdates(dt, t) {
  for (let i = 0; i < scriptInstances.length; i++) {
    const inst = scriptInstances[i];
    inst.ctx.time = t;
    inst.ctx.delta = dt;
    if (inst.mod.update) {
      try { inst.mod.update(inst.ctx, dt); }
      catch (e) { console.error(e); }
    }
  }
}

function enterPlay() {
  state.playing = true;

  document.body.classList.add('playing');
