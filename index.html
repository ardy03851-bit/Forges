<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark">
<title>Timeline</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg0:#0A0A0B;--bg1:#131316;--bg2:#191920;--bg3:#212128;--bg4:#2A2A33;
  --line:#26262E;--line2:#34343F;--line3:#48485A;
  --txt0:#ECECF1;--txt1:#8C8C97;--txt2:#5B5B67;
  --accent:#4B8BF5;--accent-dim:#2658B8;--accent-glow:rgba(75,139,245,.35);
  --danger:#E5484D;--warn:#E5A50A;--ok:#30A46C;--purple:#9B6BF2;
  --sh-2:0 2px 6px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.04) inset;
  --sh-3:0 6px 22px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.05) inset;
  --sh-4:0 12px 42px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.05) inset;
  --saf-t:env(safe-area-inset-top,0px);--saf-b:env(safe-area-inset-bottom,0px);
  --saf-l:env(safe-area-inset-left,0px);--saf-r:env(safe-area-inset-right,0px);
  --tl-h:280px;--panel-l:230px;--panel-r:300px;
}
html,body{margin:0;padding:0;height:100%;width:100%;background:var(--bg0);color:var(--txt0);
  font:12px/1.35 -apple-system,"SF Pro Text",Inter,system-ui,sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
  overflow:hidden;position:fixed;inset:0}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2e2e38;border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#3e3e4a;background-clip:content-box}
.num{font-variant-numeric:tabular-nums}
.lbl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--txt2);font-weight:700}

#app{position:absolute;inset:0;display:grid;
  grid-template-columns:var(--panel-l) 1fr var(--panel-r);
  grid-template-rows:38px 1fr var(--tl-h);
  grid-template-areas:"menu menu menu" "assets preview inspector" "timeline timeline timeline";
  padding:var(--saf-t) var(--saf-r) var(--saf-b) var(--saf-l);
  background:radial-gradient(1200px 600px at 30% -10%,#17171d 0%,var(--bg0) 60%)}
#app.portrait{grid-template-columns:1fr;grid-template-rows:38px 1fr 50px;
  grid-template-areas:"menu" "main" "tabs"}
#app.portrait .panel{display:none}
#app.portrait .panel.active{display:flex}
#app.portrait #timelineWrap{display:none}
#app.portrait #timelineWrap.active{display:flex}
#app.portrait #assetsPanel.active,#app.portrait #inspectorPanel.active{grid-area:main}
#app.portrait #previewPanel{grid-area:main}
#app.portrait #previewPanel:not(.active){display:none}
#app.portrait #timelineWrap{grid-area:main}

#menuBar{grid-area:menu;display:flex;align-items:center;gap:4px;padding:0 8px;
  background:linear-gradient(180deg,#18181f 0%,#131319 100%);
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 4px 14px rgba(0,0,0,.45);
  height:38px;overflow-x:auto;overflow-y:hidden;z-index:10;scrollbar-width:none}
#menuBar::-webkit-scrollbar{display:none}
#assetsPanel{grid-area:assets;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#15151a 0%,#101014 100%);
  border-right:1px solid var(--line);overflow:hidden;min-width:0}
#previewPanel{grid-area:preview;display:flex;flex-direction:column;
  background:var(--bg0);overflow:hidden;min-width:0;min-height:0}
#inspectorPanel{grid-area:inspector;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#15151a 0%,#101014 100%);
  border-left:1px solid var(--line);overflow:hidden;min-width:0}
#timelineWrap{grid-area:timeline;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#141419 0%,#0e0e12 100%);
  border-top:1px solid var(--line);position:relative;overflow:hidden;min-height:0}
#tlResize{position:absolute;top:-8px;left:0;right:0;height:16px;cursor:ns-resize;z-index:20;touch-action:none}
#tlResize::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:44px;height:4px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--line3),transparent);
  opacity:.5;transition:opacity .15s,background .15s}
#tlResize:hover::after{opacity:1;background:linear-gradient(90deg,transparent,var(--accent),transparent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;
  height:28px;min-width:28px;padding:0 8px;border-radius:6px;color:var(--txt1);
  font-size:12px;font-weight:500;
  background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(0,0,0,.05));
  border:1px solid transparent;
  transition:background .12s,color .12s,border-color .12s,box-shadow .12s,transform .06s;flex:none}
.btn:hover{background:linear-gradient(180deg,var(--bg3),var(--bg2));color:var(--txt0);border-color:var(--line2);
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 2px 6px rgba(0,0,0,.3)}
.btn:active{background:linear-gradient(180deg,var(--bg2),var(--bg3));transform:translateY(1px)}
.btn.on{color:var(--accent);background:linear-gradient(180deg,rgba(75,139,245,.22),rgba(75,139,245,.1));
  border-color:rgba(75,139,245,.4);
  box-shadow:0 0 0 1px rgba(75,139,245,.15),0 0 12px -2px var(--accent-glow)}
.btn.icon{width:28px;padding:0}
.btn.sm{height:22px;font-size:11px;padding:0 6px;min-width:22px}
.btn.primary{background:linear-gradient(180deg,#5a95f6,#3b7be8);color:#fff;border-color:#2d63c9;
  box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 2px 8px rgba(59,123,232,.3)}
.btn.primary:hover{background:linear-gradient(180deg,#699ff8,#4585ee)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:rgba(229,72,77,.12);border-color:rgba(229,72,77,.4)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn svg{display:block;flex:none}
.sep{width:1px;height:18px;background:var(--line);margin:0 3px;flex:none}

#projName{background:rgba(0,0,0,.25);border:1px solid transparent;color:var(--txt0);
  font:600 12px/1 inherit;padding:6px 9px;border-radius:6px;width:150px;outline:none}
#projName:hover{background:rgba(0,0,0,.35)}
#projName:focus{border-color:var(--accent);background:rgba(0,0,0,.4);box-shadow:0 0 0 2px var(--accent-glow)}
.menuSpacer{flex:1}
.tcDisplay{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600;font-size:12px;
  letter-spacing:.03em;padding:0 8px;white-space:nowrap;text-shadow:0 0 8px rgba(75,139,245,.4)}
.tcBadge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:5px;
  background:rgba(0,0,0,.35);border:1px solid var(--line);box-shadow:0 1px 0 rgba(255,255,255,.03) inset}

.pHead{display:flex;align-items:center;gap:2px;height:32px;padding:0 6px 0 10px;
  border-bottom:1px solid var(--line);flex:none;
  background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(0,0,0,.05))}
.pHead .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pBody{flex:1;overflow:auto;overflow-x:hidden;min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pFoot{flex:none;border-top:1px solid var(--line);padding:6px 10px;font-size:10px;color:var(--txt2);background:rgba(0,0,0,.15)}

#assetSearch{flex:1;min-width:0;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--txt0);
  height:24px;border-radius:6px;padding:0 8px;font-size:11px;outline:none}
#assetSearch:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
#assetGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.assetCard{position:relative;background:linear-gradient(180deg,#1c1c23,#151519);
  border:1px solid var(--line);border-radius:8px;overflow:hidden;aspect-ratio:16/10;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .15s,box-shadow .15s,transform .12s;
  box-shadow:0 2px 8px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.03) inset;
  touch-action:pan-y}
.assetCard:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.05) inset}
.assetCard.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 14px -2px var(--accent-glow)}
.assetCard.dragging{opacity:.35}
.assetCard canvas,.assetCard img{width:100%;height:100%;object-fit:cover;display:block}
.assetCard .ph{color:var(--txt2)}
.assetCard .badge{position:absolute;left:5px;bottom:5px;background:rgba(0,0,0,.78);color:var(--txt0);
  font-size:9px;padding:2px 5px;border-radius:4px;font-variant-numeric:tabular-nums;backdrop-filter:blur(4px)}
.assetCard .tbadge{position:absolute;right:5px;top:5px;background:rgba(0,0,0,.7);color:var(--txt0);
  padding:3px 4px;border-radius:4px;line-height:0;backdrop-filter:blur(4px)}
.assetCard .un{position:absolute;left:0;right:0;bottom:0;
  background:linear-gradient(180deg,rgba(229,72,77,.9),rgba(180,50,55,.9));
  color:#fff;font-size:9px;text-align:center;padding:2px}
.assetCard .tag{position:absolute;left:5px;top:5px;background:rgba(75,139,245,.9);color:#fff;
  font-size:9px;padding:2px 5px;border-radius:4px;font-weight:600}
#assetList{padding:0}
.assetRow{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;
  border-bottom:1px solid var(--line);font-size:11px;transition:background .1s;touch-action:pan-y}
.assetRow:hover{background:rgba(255,255,255,.025)}
.assetRow.sel{background:linear-gradient(90deg,rgba(75,139,245,.15),rgba(75,139,245,.03));box-shadow:2px 0 0 var(--accent) inset}
.assetRow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.assetRow .meta{color:var(--txt2);font-size:10px;font-variant-numeric:tabular-nums;flex:none}
.emptyMsg{padding:28px 16px;text-align:center;color:var(--txt2);font-size:11px;line-height:1.7}
.dropHint{border:1.5px dashed var(--line2);border-radius:8px;margin:8px;padding:18px 14px;text-align:center;
  color:var(--txt2);font-size:11px;background:rgba(255,255,255,.01)}

#previewStage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,#0d0d10 0%,#000 100%);
  overflow:hidden;touch-action:none;min-height:0;box-shadow:0 0 0 1px var(--line) inset}
#glCanvas{max-width:100%;max-height:100%;display:block;touch-action:none;background:#000;
  box-shadow:0 0 24px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.04)}
#safeGuides{position:absolute;inset:0;pointer-events:none;display:none}
#safeGuides.on{display:block}
#transformOverlay{position:absolute;pointer-events:none;display:none;z-index:6}
#transformOverlay.on{display:block}
.xf-handle{position:absolute;width:16px;height:16px;border-radius:50%;
  background:linear-gradient(180deg,#6ea4ff,#4B8BF5);border:2px solid #fff;
  box-shadow:0 2px 6px rgba(0,0,0,.6);pointer-events:auto;cursor:pointer;
  transform:translate(-50%,-50%);touch-action:none}
.xf-handle.corner{width:18px;height:18px;border-radius:4px}
.xf-handle.rotate{background:linear-gradient(180deg,#30A46C,#1e7a4f);cursor:grab}
.xf-box{position:absolute;border:1.5px solid var(--accent);pointer-events:none;
  box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 12px rgba(75,139,245,.3)}
#transport{flex:none;height:42px;display:flex;align-items:center;gap:3px;padding:0 10px;
  background:linear-gradient(180deg,#16161c,#101014);border-top:1px solid var(--line);
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#transport::-webkit-scrollbar{display:none}
#scrubBar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);cursor:pointer}
#scrubBar:hover{height:8px}
#scrubFill{position:absolute;left:0;top:0;bottom:0;
  background:linear-gradient(90deg,var(--accent),#6ea4ff);width:0%;box-shadow:0 0 8px var(--accent-glow)}

.inspSection{border-bottom:1px solid var(--line)}
.inspSection>.lbl{padding:9px 12px 4px;display:block}
.inspRow{display:flex;align-items:center;gap:6px;padding:4px 12px;min-height:28px}
.inspRow>label{flex:none;width:82px;color:var(--txt1);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inspRow input[type=text],.inspRow input[type=number],.inspRow select,.inspRow textarea{
  flex:1;min-width:0;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--txt0);
  height:24px;border-radius:6px;padding:0 8px;font-size:11px;outline:none;
  font-variant-numeric:tabular-nums;transition:border-color .12s,box-shadow .12s}
.inspRow input:focus,.inspRow select:focus,.inspRow textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
.inspRow input[type=range]{flex:1;min-width:0;height:22px;accent-color:var(--accent);background:transparent}
.inspRow input[type=color]{width:28px;height:24px;padding:0;border:1px solid var(--line);border-radius:6px;background:rgba(0,0,0,.35);cursor:pointer}
.inspRow .val{flex:none;width:48px;text-align:right;color:var(--txt1);font-size:10px;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.05));
  border:1px solid var(--line);border-radius:11px;font-size:11px;color:var(--txt1);
  transition:border-color .12s,background .12s,color .12s,box-shadow .12s;cursor:pointer}
.chip:hover{border-color:var(--line2);color:var(--txt0)}
.chip.on{border-color:var(--accent);color:var(--accent);
  background:linear-gradient(180deg,rgba(75,139,245,.2),rgba(75,139,245,.08));
  box-shadow:0 0 8px -2px var(--accent-glow)}

#tlToolbar{flex:none;height:34px;display:flex;align-items:center;gap:3px;padding:0 8px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(0,0,0,.08));
  overflow-x:auto;scrollbar-width:none}
#tlToolbar::-webkit-scrollbar{display:none}
#tlBody{flex:1;position:relative;display:flex;min-height:0;overflow:hidden}
#tlHeaders{flex:none;width:160px;background:linear-gradient(90deg,#141419,#101014);
  border-right:1px solid var(--line);overflow:hidden;position:relative}
#tlHeaders .rulerSpacer{height:24px;border-bottom:1px solid var(--line);position:sticky;top:0;
  background:linear-gradient(180deg,#17171d,#121217);z-index:3;
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
#trackHeaders{position:relative;will-change:transform}
.trackHead{display:flex;align-items:center;gap:3px;padding:0 4px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(0,0,0,.02));overflow:hidden;
  transition:background .12s;cursor:pointer}
.trackHead:hover{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.03))}
.trackHead.sel{background:linear-gradient(180deg,rgba(75,139,245,.1),rgba(75,139,245,.03))}
.trackHead .tname{flex:1;min-width:0;font-size:10px;color:var(--txt1);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;padding:2px 4px;background:transparent;border:0;outline:none}
.trackHead .tname:focus{background:rgba(0,0,0,.4);color:var(--txt0);border-radius:4px;box-shadow:0 0 0 1px var(--accent-glow)}
.tbtn{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:4px;color:var(--txt2);flex:none;transition:color .12s,background .12s,transform .1s}
.tbtn.on{color:var(--accent);background:rgba(75,139,245,.12)}
.tbtn.warn{color:var(--warn);background:rgba(229,165,10,.12)}
.tbtn.mute{color:var(--danger);background:rgba(229,72,77,.12)}
.tbtn:hover{background:rgba(255,255,255,.06);color:var(--txt0)}
.tbtn:active{transform:scale(.92)}
#tlScroll{flex:1;position:relative;overflow:hidden;touch-action:none}
#tlCanvas{position:absolute;inset:0;display:block;touch-action:none}
#playheadH{position:absolute;top:0;bottom:0;width:1px;
  background:linear-gradient(180deg,var(--accent),rgba(75,139,245,.4));
  pointer-events:none;z-index:5;will-change:transform;box-shadow:0 0 8px var(--accent-glow)}
#playheadH::before{content:'';position:absolute;top:0;left:-6px;width:13px;height:13px;
  background:linear-gradient(180deg,#6ea4ff,var(--accent));
  clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
#zoomBadge{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.78);color:var(--txt1);
  font-size:10px;padding:3px 8px;border-radius:5px;pointer-events:none;
  font-variant-numeric:tabular-nums;backdrop-filter:blur(6px);border:1px solid var(--line)}
/* Vertical scrollbar for the track column */
#trackScrollbar{position:absolute;right:2px;top:24px;bottom:34px;width:8px;
  border-radius:4px;background:rgba(255,255,255,.03);z-index:4;cursor:pointer}
#trackScrollbar .thumb{position:absolute;left:1px;right:1px;border-radius:3px;
  background:linear-gradient(180deg,#4c4c5a,#33333d);transition:background .12s}
#trackScrollbar:hover .thumb{background:linear-gradient(180deg,#6ea4ff,#4B8BF5)}
/* Add track tongue */
#addTrackTongue{position:absolute;left:0;right:0;bottom:0;height:32px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  background:linear-gradient(180deg,rgba(20,20,25,.6),rgba(10,10,14,.95));
  border-top:1px solid var(--line);cursor:pointer;font-size:11px;color:var(--txt1);
  backdrop-filter:blur(6px);z-index:3;transition:color .12s,background .12s}
#addTrackTongue:hover{color:var(--accent);background:linear-gradient(180deg,rgba(75,139,245,.1),rgba(10,10,14,.95))}
#addTrackTongue::before{content:'';position:absolute;top:-1px;left:50%;transform:translateX(-50%);
  width:60px;height:2px;border-radius:1px;background:var(--line3)}

#tabBar{grid-area:tabs;display:none;background:linear-gradient(180deg,#16161c,#101014);border-top:1px solid var(--line)}
#app.portrait #tabBar{display:flex}
#tabBar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;color:var(--txt2);font-size:9px;letter-spacing:.05em;text-transform:uppercase;
  transition:color .15s;font-weight:600}
#tabBar button.on{color:var(--accent);box-shadow:0 -2px 0 var(--accent) inset}

#modalRoot{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.62);backdrop-filter:blur(3px)}
#modalRoot.on{display:flex;animation:mFade .16s ease-out}
@keyframes mFade{from{opacity:0}to{opacity:1}}
#modalRoot.center{align-items:center}
.sheet{background:linear-gradient(180deg,#20202a,#181820);border:1px solid var(--line2);
  border-radius:14px 14px 0 0;width:100%;max-width:540px;max-height:82vh;display:flex;flex-direction:column;
  padding-bottom:var(--saf-b);box-shadow:var(--sh-4);animation:mUp .22s cubic-bezier(.2,.9,.3,1)}
@keyframes mUp{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}
#modalRoot.center .sheet{border-radius:14px;margin:16px;padding-bottom:0}
.sheet.wide{max-width:640px}
.sheetHead{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheetHead h2{margin:0;font-size:13px;font-weight:600;flex:1;letter-spacing:.01em}
.sheetBody{overflow:auto;padding:8px 0;flex:1;min-height:0}
.sheetFoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 14px;border-top:1px solid var(--line);background:rgba(0,0,0,.15)}
.menuItem{display:flex;align-items:center;gap:10px;padding:0 16px;height:40px;font-size:12.5px;
  color:var(--txt0);width:100%;text-align:left;transition:background .1s}
.menuItem:hover{background:rgba(255,255,255,.05)}
.menuItem.danger{color:var(--danger)}
.menuItem svg{color:var(--txt1);flex:none}
.menuItem.danger svg{color:var(--danger)}

/* Templates */
.tplGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:10px 14px}
.tplCard{position:relative;background:linear-gradient(180deg,#1e1e26,#161620);
  border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;
  transition:border-color .15s,box-shadow .15s,transform .12s;overflow:hidden}

/* Voice recorder */
.recPanel{padding:18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.recBtn{width:80px;height:80px;border-radius:50%;
  background:linear-gradient(180deg,#E5484D,#b02b30);border:3px solid rgba(255,255,255,.15);

.recBtn.recording{animation:pulse 1.4s ease-in-out infinite;background:linear-gradient(180deg,#ff5a5f,#c93035)}
@keyframes pulse{0%,100%{box-shadow:0 8px 24px rgba(229,72,77,.5),0 0 0 4px rgba(229,72,77,.12)}

.recTimer{font-size:24px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:.04em;color:var(--txt0)}
.recLevel{width:100%;max-width:280px;height:8px;background:rgba(0,0,0,.5);border-radius:4px;overflow:hidden;

.recLevelFill{height:100%;width:0%;background:linear-gradient(90deg,#30A46C,#E5A50A,#E5484D);

/* -------------------------------- IDB ----------------------------------- */
const IDB = (() => {
  const NAME = 'nle-db', VER = 1;
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      if (!('indexedDB' in window)) { rej(new Error('No IndexedDB')); return; }
      const rq = indexedDB.open(NAME, VER);
      rq.onupgradeneeded = () => {
        const db = rq.result;
        if (!db.objectStoreNames.contains('blobs')) db.createObjectStore('blobs');
        if (!db.objectStoreNames.contains('project')) db.createObjectStore('project');
      };
      rq.onsuccess = () => { const db = rq.result; db.onversionchange = () => db.close(); res(db); };
      rq.onerror = () => rej(rq.error || new Error('IDB open failed'));
    }).catch(e => { dbp = null; throw e; });
    return dbp;
  }
  function tx(store, mode, fn) {
    return open().then(db => new Promise((res, rej) => {
      const t = db.transaction(store, mode);
      const s = t.objectStore(store);
      let out;
      try { out = fn(s); } catch (e) { rej(e); return; }
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('aborted'));
    }));
  }
  return {
    put: (store, key, val) => tx(store, 'readwrite', s => s.put(val, key)),
    get: (store, key) => tx(store, 'readonly', s => s.get(key)),
    del: (store, key) => tx(store, 'readwrite', s => s.delete(key)),
    keys: (store) => tx(store, 'readonly', s => s.getAllKeys()),
    clear: (store) => tx(store, 'readwrite', s => s.clear()),
    open
  };
})();

/* ------------------------------- Undo ----------------------------------- */
const Undo = (() => {
  const MAX = 120;
  const stack = [];
  let idx = -1;
  let suppress = false;
  function snapshot() { return { project: deepClone(State.project), selection: Array.from(State.selection) }; }
  function push(label) {
    if (suppress) return;
    const snap = snapshot();
    stack.splice(idx + 1);
    stack.push({ label: label, snap: snap, t: Date.now() });
    if (stack.length > MAX) stack.shift();
    idx = stack.length - 1;
    updateButtons();
  }
  function undo() { if (idx <= 0) return; idx--; apply(stack[idx].snap); toast('Undo: ' + (stack[idx + 1] ? stack[idx + 1].label : '')); }
  function redo() { if (idx >= stack.length - 1) return; idx++; apply(stack[idx].snap); toast('Redo: ' + stack[idx].label); }
  function apply(snap) {
    suppress = true;
    State.project = deepClone(snap.project);
    State.selection = new Set(snap.selection);
    suppress = false;
    renderAll();
    updateButtons();
  }
  function reset() {
    stack.length = 0; idx = -1;
    stack.push({ label: 'Init', snap: snapshot(), t: Date.now() });
    idx = 0; updateButtons();
  }
  function updateButtons() {
    const u = $('#btnUndo'), r = $('#btnRedo');
    if (u) u.disabled = idx <= 0;
    if (r) r.disabled = idx >= stack.length - 1;
  }
  function run(label, fn) { push(label); fn(); markDirty(); renderAll(); }
  return { push, undo, redo, reset, run, updateButtons };
})();

/* ------------------------- Toast / Modal / Progress ---------------------- */
function toast(msg, code) {
  const root = $('#toastRoot');
  const el = document.createElement('div');
  el.className = 'toast' + (code ? ' err' : '');
  el.innerHTML = (code ? '<span class="code num">' + escapeHtml(code) + '</span>' : '') + '<span>' + escapeHtml(msg) + '</span>';
  const close = document.createElement('button');
  close.innerHTML = icon('close', 14);
  close.onclick = () => el.remove();
  el.appendChild(close);
  root.appendChild(el);
  setTimeout(() => { if (el.parentNode) el.remove(); }, code ? 6500 : 3200);
}
function errToast(e, code) {
  const msg = (e && e.message) ? e.message : String(e);
  toast(msg.slice(0, 160), code || 'ERR');
  if (window.console && console.warn) console.warn('[nle]', e);
}

const Modal = (() => {
  const root = $('#modalRoot');
  let onCloseCb = null;
  function open(opts) {
    opts = opts || {};
    $('#sheetTitle').textContent = opts.title || '';
    const body = $('#sheetBody');
    body.innerHTML = '';
    if (typeof opts.body === 'string') body.innerHTML = opts.body;
    else if (opts.body) body.appendChild(opts.body);
    const foot = $('#sheetFoot');
    foot.innerHTML = '';
    (opts.actions || []).forEach(a => {
      const b = document.createElement('button');
      b.className = 'btn ' + (a.kind || '');
      b.textContent = a.label;
      b.onclick = () => { if (a.onClick) a.onClick(); if (a.keepOpen !== true) close(); };
      foot.appendChild(b);
    });
    if (!opts.actions || !opts.actions.length) foot.style.display = 'none';
    else foot.style.display = 'flex';
    root.classList.toggle('center', !!opts.center);
    root.classList.add('on');
    const sheet = root.querySelector('.sheet');
    sheet.classList.toggle('wide', !!opts.wide);
    onCloseCb = opts.onClose || null;
    hydrateIcons(root);
  }
  function close() {
    root.classList.remove('on');
    $('#sheetBody').innerHTML = '';
    if (onCloseCb) { const c = onCloseCb; onCloseCb = null; c(); }
  }
  $('#sheetClose').onclick = close;
  root.addEventListener('pointerdown', e => { if (e.target === root) close(); });
  function menu(title, items) {
    const wrap = document.createElement('div');
    items.forEach(it => {
      const b = document.createElement('button');
      b.className = 'menuItem' + (it.danger ? ' danger' : '');
      b.innerHTML = icon(it.icon || 'chevron') + '<span>' + escapeHtml(it.label) + '</span>';
      b.onclick = () => { close(); setTimeout(() => { try { it.action(); } catch (e) { errToast(e, 'MENU'); } }, 0); };
      wrap.appendChild(b);
    });
    open({ title: title, body: wrap, center: true });
  }
  function confirm(title, message, onYes, danger) {
    const d = document.createElement('div');
    d.style.cssText = 'padding:6px 16px 14px;font-size:12.5px;color:var(--txt1);line-height:1.55';
    d.textContent = message;
    open({
      title: title, body: d, center: true,
      actions: [{ label: 'Cancel' }, { label: 'Confirm', kind: danger ? 'danger' : 'primary', onClick: onYes }]
    });
  }
  return { open, close, menu, confirm };
})();

function assetKindFromMime(mime, name) {
  const m = (mime || '').toLowerCase();
  const ext = (name || '').split('.').pop().toLowerCase();
  if (m.startsWith('video/')) return 'video';
  if (m.startsWith('audio/')) return 'audio';
  if (m.startsWith('image/')) return 'image';
  if (['mp4','m4v','mov','webm','mkv','avi','mpg','mpeg','3gp','ts','m2ts'].indexOf(ext) >= 0) return 'video';
  if (['mp3','m4a','aac','wav','aif','aiff','flac','ogg','opus','caf','wma'].indexOf(ext) >= 0) return 'audio';
  if (['png','jpg','jpeg','webp','avif','heic','heif','gif','svg','bmp','tiff','tif'].indexOf(ext) >= 0) return 'image';
  if (['srt','vtt','ass','json','csv'].indexOf(ext) >= 0) return 'data';
  return 'unknown';
}
function getAsset(id) { return State.assets.find(a => a.id === id) || null; }

async function importFiles(fileList) {
  const files = Array.prototype.slice.call(fileList || []);
  if (!files.length) return;
  const total = files.length;
  let done = 0;
  Progress.show('Importing media', () => { importAbort = true; });
  for (const f of files) {
    if (importAbort) break;
    try {
      await importOne(f, (fraction, detail) => {
        Progress.set((done + fraction) / total, detail || ((done + fraction).toFixed(0) + '/' + total));
      });
    } catch (e) { errToast(e, 'IMPORT'); }
    done++;
    Progress.set(done / total, done + ' of ' + total);

      const startH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--tl-h')) || 280;
      const move = ev => {
        const h = clamp(startH + (startY - ev.clientY), 120, window.innerHeight - 140);
        document.documentElement.style.setProperty('--tl-h', h + 'px');

      const up = () => {
        rz.removeEventListener('pointermove', move);

        const thumbH = Math.max(30, scrollbarEl.clientHeight * (($('#tlScroll').clientHeight - RULER_H) / Math.max(1, totalTrackHeight())));

        { icon: 'music', label: 'Audio track', action: () => { Undo.run('Add audio track', () => { State.project.tracks.push(makeTrack('audio', 'A' + (State.project.tracks.filter(t => t.kind === 'audio').length + 1), State.project.tracks.length)); }); resize(); } },
        { icon: 'type', label: 'Text track', action: () => { Undo.run('Add text track', () => { State.project.tracks.push(makeTrack('text', 'T' + (State.project.tracks.filter(t => t.kind === 'text').length + 1), State.project.tracks.length)); }); resize(); } }

  function resize() {
    const rect = $('#tlScroll').getBoundingClientRect();

    canvas.width = Math.max(2, Math.floor(rect.width * dpr));
    canvas.height = Math.max(2, Math.floor(rect.height * dpr));

    canvas.style.height = rect.height + 'px';

  function requestRender() {

  function secToPx(s) { return (s - State.scrollX) * State.zoom; }

    return y;

  function trackAtY(y) {
    let acc = 0;

  }

    scrollbarEl.classList.remove('hidden');
    const track = scrollbarEl.clientHeight;
    const thumbH = Math.max(30, track * bodyH / total);
    const maxScroll = total - bodyH;

    scrollbarThumb.style.top = thumbTop + 'px';

  function renderHeaders() {
    const wrap = headersEl;

      const h = document.createElement('div');

      h.style.height = t.height + 'px';
      h.dataset.trackId = t.id;
      const kindIcon = t.kind === 'audio' ? 'waveform' : t.kind === 'text' ? 'type' : 'film';
      h.innerHTML =

        '<input class="tname" value="' + escapeHtml(t.name) + '" spellcheck="false">' +
        '<button class="tbtn ' + (t.hidden ? '' : 'on') + '" data-act="hide">' + icon(t.hidden ? 'eyeOff' : 'eye', 13) + '</button>' +
        '<button class="tbtn ' + (t.muted ? 'mute' : '') + '" data-act="mute">' + icon('mute', 13) + '</button>' +
        (t.kind !== 'text' ? '<button class="tbtn ' + (t.solo ? 'warn' : '') + '" data-act="solo">' + icon('solo', 13) + '</button>' : '') +

  function showTrackMenu(track, index) {

  function render() {

      ctx.fillRect(x1 - 0.5, RULER_H, 1, h - RULER_H);

  }

  function drawClip(ctx, c, track, top, w, h) {
    const x = secToPx(c.start);
    const cw = c.duration * State.zoom;
    if (x + cw < 0 || x > w) return;

    const radius = 4;

    ctx.beginPath();
    roundRect(ctx, cl, y + 1, cr - cl, ch - 2, radius);
    ctx.clip();
    const baseColor = track.color;

    ctx.fillStyle = hexA(baseColor, c.enabled ? 0.6 : 0.22);
    ctx.fillRect(cl, y + 1, cr - cl, Math.min(15, ch - 2));

      ctx.font = '600 10px -apple-system, system-ui, sans-serif';

    roundRect(ctx, cl + 0.5, y + 1.5, cr - cl - 1, ch - 3, radius);
    ctx.stroke();
    ctx.shadowBlur = 0;

      const bw = 38, bh = 13;
      roundRect(ctx, cr - bw - 4, y + ch - bh - 4, bw, bh, 3);
      ctx.fill();
      ctx.fillStyle = '#E5A50A';
      ctx.font = '600 9px -apple-system, system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(c.speed.toFixed(2) + '×', cr - bw / 2 - 4, y + ch - bh / 2 - 4);

    }
  }
  function drawWaveform(ctx, c, x0, x1, y, h) {
    const asset = getAsset(c.assetId);

    const pps = asset.peaksPerSec || 60;
    const peaks = asset.peaks;
    const n = asset.peaksBuckets;
    const mid = y + h / 2;
    const amp = h / 2 - 1;
    const grad = ctx.createLinearGradient(0, y, 0, y + h);
    grad.addColorStop(0, 'rgba(255,255,255,.7)');
    grad.addColorStop(1, 'rgba(255,255,255,.35)');
    ctx.fillStyle = grad;
    const pxStart = Math.max(0, Math.floor(x0));

  function drawThumbs(ctx, c, x0, x1, y, h) {

  }
  function updatePlayheadDOM() {
    const px = secToPx(State.playhead);
    const ph = $('#playheadH');
    ph.style.transform = 'translateX(' + px + 'px)';
    ph.style.display = px >= -2 ? 'block' : 'none';
  }
  function updateZoomBadge() { $('#zoomBadge').textContent = Math.round(State.zoom) + ' px/s'; }

  function getLocal(e) {
    const r = $('#tlScroll').getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function hitTest(x, y) {
    if (y < RULER_H) return { type: 'ruler', time: pxToSec(x) };
    const tr = trackAtY(y + State.scrollY);
    if (!tr) return { type: 'empty' };
    const t = tr.track;
    const tTop = trackTop(tr.index) - State.scrollY;
    for (let i = t.clips.length - 1; i >= 0; i--) {
      const c = t.clips[i];
      const cx0 = secToPx(c.start);
      const cx1 = secToPx(c.start + c.duration);
      if (x >= cx0 && x <= cx1 && y >= tTop && y <= tTop + t.height) {
        const edge = 8;
        let mode = 'move';
        if (x < cx0 + edge) mode = 'trimLeft';
        else if (x > cx1 - edge) mode = 'trimRight';
        return { type: 'clip', clip: c, track: t, trackIndex: tr.index, mode: mode, x: x, y: y, cx0: cx0, cx1: cx1, tTop: tTop };
      }
    }
    return { type: 'track', track: t, trackIndex: tr.index, time: pxToSec(x) };
  }

  function onPointerDown(e) {
    if (e.button !== undefined && e.button !== 0) return;
    canvas.setPointerCapture(e.pointerId);
    const p = getLocal(e);
    const hit = hitTest(p.x, p.y);
    if (State.playing) Player.pause();

    if (State.razorMode && hit.type === 'clip') {
      const t = pxToSec(p.x);
      razorCutAt(t, hit.clip);
      requestRender();
      return;
    }

    if (hit.type === 'ruler') { scrubbing = true; setPlayhead(hit.time); return; }
    if (hit.type === 'track' || hit.type === 'empty') {

      marquee = { x0: p.x, y0: p.y, x1: p.x, y1: p.y, additive: e.shiftKey || e.metaKey };
      if (!marquee.additive) State.selection.clear();
      Inspector.render();
      requestRender();
      return;
    }
    if (hit.type === 'clip') {
      if (hit.track.locked) { toast('Track is locked'); return; }
      const additive = e.shiftKey || e.metaKey;

        if (!State.selection.has(hit.clip.id)) { State.selection.clear(); State.selection.add(hit.clip.id); }
      } else {
        if (State.selection.has(hit.clip.id)) State.selection.delete(hit.clip.id);
        else State.selection.add(hit.clip.id);
      }
      Inspector.render();
      requestRender();
      const clip = hit.clip;
      dragging = {
        mode: hit.mode, clipId: clip.id, trackId: hit.track.id,
        trackIndex: hit.trackIndex, startX: p.x, startY: p.y,
        origStart: clip.start, origDur: clip.duration, origIn: clip.inPoint,
        origTrackIndex: hit.trackIndex, origClip: deepClone(clip),
        moved: false, groupOrig: []

        const found = findClip(id);
        if (found && found.clip.id !== clip.id) {

    }
  }

    }
    if (!dragging && !scrubbing) return;
    if (scrubbing) { setPlayhead(pxToSec(p.x)); return; }
    if (dragging) {
      const dx = p.x - dragging.startX;
      const dy = p.y - dragging.startY;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragging.moved = true;
      const dSec = dx / State.zoom;

      if (!found) return;
      const clip = found.clip, track = found.track;
      if (dragging.mode === 'move') {
        let newStart = Math.max(0, dragging.origStart + dSec);
        const targetIndex = clamp(dragging.origTrackIndex + Math.round(dy / Math.max(20, track.height)), 0, State.project.tracks.length - 1);
        const targetTrack = State.project.tracks[targetIndex];
        if (targetTrack && targetTrack.kind === track.kind && targetTrack !== track) moveClipToTrack(clip, track, targetTrack);
        if (State.snapping) {
          const snap = findSnapPoint(newStart, clip, track);
          if (snap !== null) newStart = snap;
        }
        clip.start = Math.max(0, newStart);
        if (dragging.groupOrig && dragging.groupOrig.length) {
          const delta = clip.start - dragging.origStart;
          dragging.groupOrig.forEach(o => {

        let ni = dragging.origIn + dSec * (clip.speed || 1);
        const minDur = 1 / State.project.fps;
        if (nd < minDur) { nd = minDur; ns = dragging.origStart + dragging.origDur - minDur; ni = dragging.origIn + (dragging.origDur - minDur) * (clip.speed || 1); }
        if (ni < 0) { ni = 0; ns = dragging.origStart + dragging.origIn / (clip.speed || 1); nd = dragging.origDur - (ns - dragging.origStart); }
        if (State.snapping) {
          const snap = findSnapPoint(ns, clip, track, true);
          if (snap !== null) { const delta = snap - ns; ns += delta; nd -= delta; }

        clip.start = Math.max(0, ns);
        clip.duration = Math.max(minDur, nd);
        clip.inPoint = Math.max(0, ni);
      } else if (dragging.mode === 'trimRight') {
        let nd = dragging.origDur + dSec;
        const minDur = 1 / State.project.fps;
        if (nd < minDur) nd = minDur;
        const asset = getAsset(clip.assetId);
        if (asset && asset.duration > 0) {
          const maxDur = (asset.duration - clip.inPoint) / (clip.speed || 1);
          if (nd > maxDur) nd = maxDur;
        }
        let ne = clip.start + nd;
        if (State.snapping) {
          const snap = findSnapPoint(ne, clip, track, true);
          if (snap !== null) nd = snap - clip.start;
        }
        clip.duration = Math.max(minDur, nd);
      }
      requestRender();
      markDirty();
    }
  }

  function updateMarquee() {
    const m = $('#marquee');
    if (!marquee) { m.style.display = 'none'; return; }
    const x0 = Math.min(marquee.x0, marquee.x1);
    const y0 = Math.min(marquee.y0, marquee.y1);
    const x1 = Math.max(marquee.x0, marquee.x1);
    const y1 = Math.max(marquee.y0, marquee.y1);
    if (x1 - x0 < 3 && y1 - y0 < 3) { m.style.display = 'none'; return; }
    m.style.display = 'block';
    m.style.left = x0 + 'px'; m.style.top = y0 + 'px';
    m.style.width = (x1 - x0) + 'px'; m.style.height = (y1 - y0) + 'px';
    // Select clips intersecting the marquee
    if (!marquee.additive) State.selection.clear();
    const t0 = pxToSec(x0), t1 = pxToSec(x1);
    State.project.tracks.forEach((t, i) => {
      const top = trackTop(i) - State.scrollY + RULER_H;
      const bottom = top + t.height;
      if (bottom < y0 || top > y1) return;
      t.clips.forEach(c => {
        if (c.start + c.duration < t0 || c.start > t1) return;

    });

  }

  function onPointerUp() {

      dragging = null;
      if (wasMoved) Player.rescheduleAudio();
      requestRender();
      Inspector.render();
    }
  }

  function onWheel(e) {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) {
      const r = $('#tlScroll').getBoundingClientRect();
      const mx = e.clientX - r.left;
      const t = pxToSec(mx);
      const factor = Math.exp(-e.deltaY * 0.003);

      State.scrollX = t - mx / State.zoom;
      clampScroll();
      requestRender();
    } else {
      State.scrollX += e.deltaX / State.zoom;
      State.scrollY += e.deltaY;
      clampScroll();
      applyScrollY();
      requestRender();
    }
  }

  function clampScroll() {
    if (State.scrollX < 0) State.scrollX = 0;
    const maxY = Math.max(0, totalTrackHeight() - ($('#tlScroll').clientHeight - RULER_H));
    if (State.scrollY < 0) State.scrollY = 0;
    if (State.scrollY > maxY) State.scrollY = maxY;
  }
  function findClip(id) {
    for (const t of State.project.tracks) {
      for (const c of t.clips) if (c.id === id) return { clip: c, track: t };

    return null;
  }
  function moveClipToTrack(clip, fromTrack, toTrack) {

    toTrack.clips.push(clip);
  }
  function findSnapPoint(t, excludeClip, excludeTrack, edgesOnly) {
    const thresh = 8 / State.zoom;
    let best = null, bestD = thresh;
    if (Math.abs(t - State.playhead) < bestD) { bestD = Math.abs(t - State.playhead); best = State.playhead; }
    if (Math.abs(t - 0) < bestD) { bestD = Math.abs(t - 0); best = 0; }
    State.project.markers.forEach(m => { if (Math.abs(t - m.time) < bestD) { bestD = Math.abs(t - m.time); best = m.time; } });
    if (State.inPoint !== null && Math.abs(t - State.inPoint) < bestD) { bestD = Math.abs(t - State.inPoint); best = State.inPoint; }
    if (State.outPoint !== null && Math.abs(t - State.outPoint) < bestD) { bestD = Math.abs(t - State.outPoint); best = State.outPoint; }
    State.project.tracks.forEach(tr => {
      tr.clips.forEach(c => {
        if (c === excludeClip) return;
        [c.start, c.start + c.duration].forEach(e => {
          if (Math.abs(t - e) < bestD) { bestD = Math.abs(t - e); best = e; }
        });
      });
    });
    return best;
  }

  function setPlayhead(t, silent) {
    t = Math.max(0, t);
    State.playhead = t;
    updatePlayheadDOM();
    if (!silent) Preview.render(t);
    updateTC();
    if (State.followPlayhead && State.playing) {
      const w = $('#tlScroll').clientWidth;
      const px = secToPx(t);
      const margin = w * 0.35;
      if (px > w - margin) { State.scrollX = t - (w - margin) / State.zoom; clampScroll(); requestRender(); }
      else if (px < margin) { State.scrollX = Math.max(0, t - margin / State.zoom); clampScroll(); requestRender(); }
    }
  }
  function updateTC() {
    const p = State.project;
    const s = fmtTC(State.playhead, p ? p.fps : 30);
    const a = $('#tcMain'), b = $('#tcPreview');
    if (a) a.textContent = s;
    if (b) b.textContent = s;
    const scrub = $('#scrubFill');
    const dur = Math.max(0.001, totalDuration());
    if (scrub) scrub.style.width = clamp(State.playhead / dur, 0, 1) * 100 + '%';
  }
  function zoomToFit() {
    const w = $('#tlScroll').clientWidth;
    const dur = Math.max(1, totalDuration());
    State.zoom = clamp((w - 40) / dur, 4, 4000);
    State.scrollX = 0;
    requestRender();
  }
  function zoomToSelection() {
    if (!State.selection.size) return zoomToFit();
    let min = Infinity, max = -Infinity;
    State.selection.forEach(id => {
      const f = findClip(id);
      if (!f) return;
      min = Math.min(min, f.clip.start);
      max = Math.max(max, f.clip.start + f.clip.duration);
    });
    if (!isFinite(min)) return;
    const w = $('#tlScroll').clientWidth;
    const dur = Math.max(0.5, max - min);

  }
  function razorCutAt(t, clip) {
    const found = findClip(clip.id);
    if (!found) return;
    const tr = found.track;
    if (tr.locked) { toast('Track is locked'); return; }
    if (t <= clip.start + 0.001 || t >= clip.start + clip.duration - 0.001) return;
    Undo.run('Cut', () => {
      const leftDur = t - clip.start;
      const right = deepClone(clip);
      right.id = uid('c');
      right.start = t;
      right.duration = clip.duration - leftDur;
      right.inPoint = clip.inPoint + leftDur * (clip.speed || 1);
      right.keyframes = shiftKeyframes(clip.keyframes, -leftDur);

  }
  function shiftKeyframes(kfs, delta) {
    const out = {};
    for (const k in kfs) {
      out[k] = kfs[k].map(kf => ({ t: Math.max(0, kf.t + delta), v: kf.v, ease: kf.ease })).filter(kf => kf.t >= 0);
    }
    return out;
  }

  return {
    init, resize, render, requestRender, setPlayhead, updateTC, zoomToFit, zoomToSelection,
    totalDuration, findClip, secToPx, pxToSec, findSnapPoint, clampScroll, razorCutAt, shiftKeyframes,
    get RULER_H() { return RULER_H; },
    setScrollX(v) { State.scrollX = v; clampScroll(); requestRender(); }
  };
})();

/* ------------------------------ Player ---------------------------------- */
const Player = (() => {
  let raf = 0, lastT = 0, wakeLock = null;

  function play() {
    if (State.playing || State.exporting) return;
    State.playing = true;
    updatePlayButton();
    Audio.ensure();
    if (Audio.ctx && Audio.ctx.state === 'suspended') Audio.ctx.resume().catch(() => { });
    lastT = now();
    if (State.loopEnabled && State.inPoint !== null && State.outPoint !== null) {
      if (State.playhead < State.inPoint || State.playhead >= State.outPoint) State.playhead = State.inPoint;
    }
    syncMedia(true);
    requestWakeLock();
    raf = requestAnimationFrame(tick);
  }
  function pause() {
    if (!State.playing) return;
    State.playing = false;
    updatePlayButton();
    cancelAnimationFrame(raf);
    raf = 0;
    pauseAllMedia();
    releaseWakeLock();
    Preview.render(State.playhead);
  }
  function toggle() { State.playing ? pause() : play(); }
  function tick() {
    if (!State.playing) return;
    const t = now();
    const dt = (t - lastT) / 1000;
    lastT = t;
    State.playhead += dt;
    const dur = Timeline.totalDuration();
    if (State.loopEnabled && State.inPoint !== null && State.outPoint !== null) {
      if (State.playhead >= State.outPoint) { State.playhead = State.inPoint; rescheduleAudio(); }
    } else if (State.playhead > dur + 0.05) {
      State.playhead = dur;
      Timeline.setPlayhead(State.playhead);
      Preview.render(State.playhead);
      Timeline.updateTC();
      pause();
      return;
    }
    Timeline.setPlayhead(State.playhead);
    syncMedia(false);
    Audio.updateDucking();
    Preview.render(State.playhead);
    Timeline.updateTC();
    Timeline.requestRender();
    raf = requestAnimationFrame(tick);
  }
  function activeClipsAt(time) {
    const out = [];
    if (!State.project) return out;
    const anySolo = State.project.tracks.some(x => x.solo);
    for (const tr of State.project.tracks) {
      if (tr.kind === 'text' || tr.muted) continue;
      if (anySolo && !tr.solo) continue;
      for (const c of tr.clips) {
        if (!c.enabled) continue;
        if (time >= c.start && time < c.start + c.duration) out.push({ clip: c, track: tr });
      }
    }
    return out;
  }
  function syncMedia(force) {
    const active = activeClipsAt(State.playhead);
    for (const a of active) {
      const asset = getAsset(a.clip.assetId);
      if (!asset || asset.type === 'image') continue;
      const m = getMediaFor(asset);
      if (!m) continue;
      const el = m.el;
      const sourceT = (State.playhead - a.clip.start) * (a.clip.speed || 1) + a.clip.inPoint;
      if (force || Math.abs((el.currentTime || 0) - sourceT) > 0.22) {
        try { el.currentTime = Math.max(0, sourceT); } catch (e) { }
      }
      try { el.playbackRate = clamp(a.clip.speed || 1, 0.0625, 16); } catch (e) { }
      if (el.paused) { el.play().catch(() => { }); }
      if (m.gain && Audio.ctx) {
        let vol = Preview.getAnimValue(a.clip, 'volume', State.playhead);
        const tIn = State.playhead - a.clip.start;
        if (a.clip.fadeIn > 0 && tIn < a.clip.fadeIn) vol *= clamp(tIn / a.clip.fadeIn, 0, 1);
        const tOut = a.clip.duration - tIn;
        if (a.clip.fadeOut > 0 && tOut < a.clip.fadeOut) vol *= clamp(tOut / a.clip.fadeOut, 0, 1);
        if (a.track.muted) vol = 0;
        const anySolo = State.project.tracks.some(x => x.solo);
        if (anySolo && !a.track.solo) vol = 0;
        m.gain.gain.setTargetAtTime(vol, Audio.ctx.currentTime, 0.02);
      }
    }
    State.mediaPool.forEach((m, assetId) => {
      const stillUsed = active.some(a => a.clip.assetId === assetId);
      if (!stillUsed && m.el && !m.el.paused) { try { m.el.pause(); } catch (e) { } }
    });
  }
  function pauseAllMedia() { State.mediaPool.forEach(m => { if (m.el && !m.el.paused) { try { m.el.pause(); } catch (e) { } } }); }
  function rescheduleAudio() { pauseAllMedia(); syncMedia(true); }
  function updatePlayButton() {
    const b = $('#btnPlay');
    if (!b) return;
    b.innerHTML = icon(State.playing ? 'pause' : 'play');
  }
  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try { if (wakeLock) return; wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } catch (e) { }
  }
  function releaseWakeLock() { if (wakeLock) { try { wakeLock.release(); } catch (e) { } wakeLock = null; } }

  return { play, pause, toggle, syncMedia, pauseAllMedia, rescheduleAudio, requestWakeLock, releaseWakeLock };
})();

/* ---------------------- Cut / Razor / Split helpers --------------------- */
function cutAtPlayhead(kind) {
  const t = State.playhead;
  let count = 0;
  Undo.run('Cut ' + kind, () => {
    State.project.tracks.forEach(track => {
      if (track.locked) return;
      if (kind === 'video' && track.kind !== 'video' && track.kind !== 'image') return;
      if (kind === 'audio' && track.kind !== 'audio') return;
      if (kind === 'both' && track.kind === 'text') return;
      const additions = [];
      track.clips.forEach(c => {
        if (t > c.start + 0.001 && t < c.start + c.duration - 0.001) {
          const right = deepClone(c);
          right.id = uid('c');
          const leftDur = t - c.start;
          right.start = t;
          right.duration = c.duration - leftDur;
          right.inPoint = c.inPoint + leftDur * (c.speed || 1);
          right.keyframes = Timeline.shiftKeyframes(c.keyframes, -leftDur);
          c.duration = leftDur;
          additions.push(right);
          count++;
        }
      });
      additions.forEach(a => track.clips.push(a));
    });
  });
  if (count) { toast('Cut ' + count + ' clip(s)'); Timeline.requestRender(); }
  else toast('Nothing to cut at playhead');
  Player.rescheduleAudio();
  Inspector.render();
}
function splitSelectionAtPlayhead() {
  const t = State.playhead;
  let did = false;
  Undo.run('Split', () => {
    State.project.tracks.forEach(track => {
      if (track.locked) return;
      const additions = [];
      track.clips.forEach(c => {
        if (t > c.start + 0.001 && t < c.start + c.duration - 0.001) {
          if (State.selection.size && !State.selection.has(c.id)) return;
          const right = deepClone(c);
          right.id = uid('c');
          const leftDur = t - c.start;
          right.start = t;
          right.duration = c.duration - leftDur;
          right.inPoint = c.inPoint + leftDur * (c.speed || 1);
          right.keyframes = Timeline.shiftKeyframes(c.keyframes, -leftDur);
          c.duration = leftDur;
          additions.push(right);
          did = true;
        }
      });
      additions.forEach(a => track.clips.push(a));
    });
  });
  if (did) { toast('Split at playhead'); Timeline.requestRender(); Inspector.render(); }
  else toast('Playhead is not over a clip');
}
function toggleRazorMode() {
  State.razorMode = !State.razorMode;
  $('#btnRazor').classList.toggle('on', State.razorMode);
  document.body.classList.toggle('razor', State.razorMode);
  toast('Razor ' + (State.razorMode ? 'on — click a clip to cut' : 'off'));
}

/* ---------------------- Templates ----------------------- */
function openTemplates() {
  const body = document.createElement('div');
  const grid = document.createElement('div');
  grid.className = 'tplGrid';
  TEMPLATES.forEach(tp => {
    const card = document.createElement('div');
    card.className = 'tplCard';
    card.dataset.id = tp.id;
    const ar = tp.id === 'custom' ? 1 : (tp.w / tp.h);
    const W = 80, H = clamp(W / ar, 20, 60);
    const brand = tp.brand ? '<span class="brand">' + brandIcon(tp.brand, 18) + '</span>' : '';
    card.innerHTML =
      '<div class="swatch"><div class="ratio" style="width:' + W + 'px;height:' + H + 'px"></div></div>' +
      '<div class="name">' + brand + escapeHtml(tp.name) + '</div>' +
      '<div class="spec">' + (tp.id === 'custom' ? 'Custom' : tp.w + '×' + tp.h + ' · ' + tp.fps + ' fps') + '</div>' +
      (tp.desc ? '<div class="spec" style="margin-top:2px;opacity:.7">' + escapeHtml(tp.desc) + '</div>' : '');
    card.addEventListener('click', () => {
      grid.querySelectorAll('.tplCard').forEach(c => c.classList.remove('sel'));
      card.classList.add('sel');
      applyTemplate(tp);
      setTimeout(() => Modal.close(), 120);
    });
    grid.appendChild(card);
  });
  body.appendChild(grid);
  Modal.open({
    title: 'Choose a template',
    body: body,
    center: true,
    wide: true,
    actions: [{ label: 'Cancel' }]
  });
}
function applyTemplate(tp) {
  if (tp.id === 'custom') {
    const d = document.createElement('div');
    d.innerHTML =
      '<div class="inspRow"><label>Width</label><input type="number" id="tw" value="' + State.project.width + '"></div>' +
      '<div class="inspRow"><label>Height</label><input type="number" id="th" value="' + State.project.height + '"></div>' +
      '<div class="inspRow"><label>FPS</label><input type="number" id="tf" value="' + State.project.fps + '"></div>';
    Modal.open({
      title: 'Custom resolution', body: d, center: true,
      actions: [{ label: 'Cancel' }, { label: 'Apply', kind: 'primary', onClick: () => {
        Undo.run('Template', () => {
          State.project.width = Math.max(2, parseInt($('#tw').value) || 1920);
          State.project.height = Math.max(2, parseInt($('#th').value) || 1080);
          State.project.fps = Math.max(1, parseInt($('#tf').value) || 30);
        });
        Preview.setSize(); Preview.render(State.playhead);
        toast('Applied custom resolution');
      }}]
    });
    return;
  }
  Undo.run('Template', () => {
    State.project.width = tp.w;
    State.project.height = tp.h;
    State.project.fps = tp.fps;
  });
  Preview.setSize();
  Preview.render(State.playhead);
  Timeline.updateTC();
  toast('Applied ' + tp.name + ' (' + tp.w + '×' + tp.h + ')');
}

/* ------------------------------ Inspector ------------------------------- */
const Inspector = (() => {
  function render() {
    const body = $('#inspBody');

  function drawCurve(cv, c, sel) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = cv.getBoundingClientRect();
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    const g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const W = r.width, H = r.height;
    const grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, 'rgba(75,139,245,.05)');
    grad.addColorStop(1, 'rgba(75,139,245,0)');
    g.fillStyle = grad; g.fillRect(0, 0, W, H);
    g.strokeStyle = 'rgba(255,255,255,.05)';
    g.lineWidth = 1;
    for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(0, H * i / 4); g.lineTo(W, H * i / 4); g.stroke(); }
    const tInClip = clamp(State.playhead - c.start, 0, c.duration);
    const pxh = tInClip / c.duration * W;
    g.strokeStyle = 'rgba(75,139,245,.5)';
    g.setLineDash([3, 3]);
    g.beginPath(); g.moveTo(pxh, 0); g.lineTo(pxh, H); g.stroke();
    g.setLineDash([]);
    const kfs = (c.keyframes[sel.key] || []).slice().sort((a, b) => a.t - b.t);
    if (!kfs.length) {
      g.fillStyle = '#5B5B67';
      g.font = '11px -apple-system, system-ui, sans-serif';
      g.textAlign = 'center';
      g.fillText('No keyframes yet — add one to see the curve', W / 2, H / 2);
      return;
    }
    const minV = Math.min.apply(null, kfs.map(k => k.v));
    const maxV = Math.max.apply(null, kfs.map(k => k.v));
    const spanV = Math.max(0.0001, maxV - minV);
    const pad = 12;
    const plotH = H - pad * 2;
    function toX(t) { return t / c.duration * W; }
    function toY(v) { return pad + (1 - (v - minV) / spanV) * plotH; }
    g.beginPath();
    g.strokeStyle = sel.color;
    g.lineWidth = 2;
    g.lineJoin = 'round';
    const SAMPLES = 200;
    for (let i = 0; i <= SAMPLES; i++) {
      const t = i / SAMPLES * c.duration;
      const v = Preview.evalKeyframes(kfs, t);
      const x = toX(t), y = toY(v);
      if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.stroke();
    kfs.forEach(kf => {
      const x = toX(kf.t), y = toY(kf.v);
      g.fillStyle = sel.color;
      g.beginPath(); g.arc(x, y, 4, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#fff'; g.lineWidth = 1.2; g.stroke();
    });
  }
  function addKeyframe(c, prop) {
    let v = 1;
    if (prop === 'opacity') v = c.opacity;
    if (prop === 'volume') v = c.volume;
    if (prop === 'scale') v = c.transform.scale;
    if (prop === 'rotation') v = c.transform.rotation;
    if (prop === 'x') v = c.transform.x;
    if (prop === 'y') v = c.transform.y;
    const t = State.playhead - c.start;
    if (t < 0 || t > c.duration) { toast('Playhead must be inside the clip'); return; }
    Undo.run('Add keyframe', () => {
      if (!c.keyframes[prop]) c.keyframes[prop] = [];
      c.keyframes[prop].push({ t: t, v: v, ease: 'smooth' });
      c.keyframes[prop].sort((a, b) => a.t - b.t);
    });
    render();
  }
  function punchIn(c) {
    Undo.run('Punch in', () => {
      const t = State.playhead - c.start;
      if (t < 0 || t > c.duration) { toast('Move playhead inside the clip first'); return; }
      const kfs = c.keyframes.scale || [];
      const pre = Math.max(0, t - 0.5);
      const post = Math.min(c.duration, t + 0.5);
      kfs.push({ t: pre, v: c.transform.scale, ease: 'smooth' });
      kfs.push({ t: t, v: c.transform.scale * 1.25, ease: 'smooth' });
      kfs.push({ t: post, v: c.transform.scale, ease: 'smooth' });
      kfs.sort((a, b) => a.t - b.t);
      c.keyframes.scale = kfs;
    });
    render();
    Preview.render(State.playhead);
  }
  return { render, addKeyframe, punchIn, drawCurve };
})();

/* ---------------------- Clip operations --------------------- */
function duplicateSelection() {
  if (!State.selection.size) return;
  Undo.run('Duplicate', () => {
    const newIds = [];
    State.project.tracks.forEach(t => {
      const added = [];
      t.clips.forEach(c => {
        if (State.selection.has(c.id)) {
          const nc = deepClone(c);
          nc.id = uid('c');
          nc.start = c.start + c.duration;
          t.clips.push(nc);
          added.push(nc.id);
        }
      });
      added.forEach(id => newIds.push(id));
    });
    State.selection = new Set(newIds);
  });
  Inspector.render();
}
function deleteSelection() {
  if (!State.selection.size) return;
  Undo.run('Delete', () => {
    State.project.tracks.forEach(t => { t.clips = t.clips.filter(c => !State.selection.has(c.id)); });
    State.selection.clear();
  });
  Inspector.render();
}
function rippleDelete() {
  if (!State.selection.size) return;
  Undo.run('Ripple delete', () => {
    State.project.tracks.forEach(t => {
      const sorted = t.clips.slice().sort((a, b) => a.start - b.start);
      let removed = 0;
      t.clips = sorted.filter(c => {
        if (State.selection.has(c.id)) { removed += c.duration; return false; }
        if (removed > 0) c.start = Math.max(0, c.start - removed);
        return true;
      });
    });
    State.selection.clear();
  });
  Inspector.render();
}
function setEnabledSelection(v) {
  Undo.run('Enable toggle', () => {
    State.project.tracks.forEach(t => t.clips.forEach(c => { if (State.selection.has(c.id)) c.enabled = v; }));
  });
  Inspector.render();
}
function copySelection() {
  State.clipboard = [];
  State.project.tracks.forEach(t => {
    t.clips.forEach(c => { if (State.selection.has(c.id)) State.clipboard.push({ clip: deepClone(c), trackId: t.id }); });
  });
  toast('Copied ' + State.clipboard.length + ' clip(s)');
}
function pasteClipboard() {
  if (!State.clipboard.length) return;
  const at = State.playhead;
  Undo.run('Paste', () => {
    const base = Math.min.apply(null, State.clipboard.map(x => x.clip.start));
    const newIds = [];
    State.clipboard.forEach(x => {
      const t = State.project.tracks.find(tt => tt.id === x.trackId) || State.project.tracks[0];
      if (!t) return;
      const nc = deepClone(x.clip);
      nc.id = uid('c');
      nc.start = at + (x.clip.start - base);
      t.clips.push(nc);
      newIds.push(nc.id);
    });
    State.selection = new Set(newIds);
  });
  Inspector.render();
  Timeline.requestRender();
}
function nudgeClips(dt) {
  if (!State.selection.size) return;
  Undo.run('Nudge', () => {
    State.selection.forEach(id => {
      const f = Timeline.findClip(id);
      if (f) f.clip.start = Math.max(0, f.clip.start + dt);
    });
  });
  Timeline.requestRender();
  Preview.render(State.playhead);
}

/* ------------------------------- Markers -------------------------------- */
function addMarkerAtPlayhead() {
  Undo.run('Add marker', () => {
    State.project.markers.push({ id: uid('m'), time: State.playhead, name: 'Chapter ' + (State.project.markers.length + 1), color: '#E5A50A' });
    State.project.markers.sort((a, b) => a.time - b.time);
  });
  toast('Marker added');
  Inspector.render();
  Timeline.requestRender();
}
function jumpToMarker(dir) {
  const markers = State.project.markers.slice().sort((a, b) => a.time - b.time);
  if (!markers.length) { toast('No markers'); return; }
  if (dir > 0) { const next = markers.find(m => m.time > State.playhead + 0.01); if (next) Timeline.setPlayhead(next.time); else toast('Last marker'); }
  else { const prev = markers.slice().reverse().find(m => m.time < State.playhead - 0.01); if (prev) Timeline.setPlayhead(prev.time); else toast('First marker'); }
  Preview.render(State.playhead);
}
function jumpToClipEdge(dir) {
  const edges = [0];
  State.project.tracks.forEach(t => t.clips.forEach(c => { edges.push(c.start); edges.push(c.start + c.duration); }));
  edges.sort((a, b) => a - b);
  const uniq = edges.filter((v, i) => i === 0 || Math.abs(v - edges[i - 1]) > 0.001);
  if (dir > 0) {
    const next = uniq.find(e => e > State.playhead + 0.001);
    if (next !== undefined) Timeline.setPlayhead(next);
  } else {
    const prev = uniq.slice().reverse().find(e => e < State.playhead - 0.001);
    if (prev !== undefined) Timeline.setPlayhead(prev);
  }
  Preview.render(State.playhead);
}

/* ------------------------------ Voice recorder -------------------------- */
const VoiceRecorder = (() => {
  const takes = [];

  let barEl = null, timerEl = null, listEl = null, btnEl = null;

  function open() {

      '<div style="font-size:11px;color:var(--txt2);max-width:280px;line-height:1.5">Tap the mic to start. Voiceover lands on the timeline at the current playhead position.</div>' +
      '<div class="takeList" id="takeList"></div>';
    Modal.open({
      title: 'Voice recorder', body: body, center: true,
      actions: [{ label: 'Done', kind: 'primary', onClick: () => { if (recording) stop(); } }],
      onClose: () => { if (recording) stop(); Audio.meterLoop(false); }
    });
    btnEl = document.getElementById('recMain');
    timerEl = document.getElementById('recTimer');
    listEl = document.getElementById('takeList');
    barEl = document.getElementById('recLvl');

  async function runExport(W, H, fps, brMbps, startT, endT, mime) {

/* ------------------------------- SFX ------------------------------------ */
function generateSFX(kind) {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return Promise.reject(new Error('No AudioContext'));
  const sr = 48000;
  const dur = kind === 'riser' ? 2.5 : kind === 'subdrop' ? 1.5 : 0.5;
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const ctx = new OAC(1, Math.ceil(dur * sr), sr);
  const g = ctx.createGain(); g.connect(ctx.destination);
  if (kind === 'click') {
    const o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = 1800;
    const env = ctx.createGain();
    env.gain.setValueAtTime(0.4, 0); env.gain.exponentialRampToValueAtTime(0.001, 0.05);
    o.connect(env); env.connect(g); o.start(0); o.stop(0.06);
  } else if (kind === 'pop') {
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(880, 0); o.frequency.exponentialRampToValueAtTime(220, 0.15);
    const env = ctx.createGain();
    env.gain.setValueAtTime(0.5, 0); env.gain.exponentialRampToValueAtTime(0.001, 0.2);
    o.connect(env); env.connect(g); o.start(0); o.stop(0.25);
  } else if (kind === 'ding') {
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = 1320;
    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = 1980;
    const env = ctx.createGain();
    env.gain.setValueAtTime(0.3, 0); env.gain.exponentialRampToValueAtTime(0.001, 0.8);
    o.connect(env); o2.connect(env); env.connect(g); o.start(0); o.stop(0.9); o2.start(0); o2.stop(0.9);
  } else if (kind === 'whoosh') {
    const buf = ctx.createBuffer(1, Math.ceil(0.5 * sr), sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const flt = ctx.createBiquadFilter(); flt.type = 'bandpass'; flt.Q.value = 1.2;
    flt.frequency.setValueAtTime(200, 0); flt.frequency.exponentialRampToValueAtTime(3500, 0.5);
    const env = ctx.createGain();
    env.gain.setValueAtTime(0.6, 0); env.gain.exponentialRampToValueAtTime(0.001, 0.5);
    src.connect(flt); flt.connect(env); env.connect(g); src.start(0);
  } else if (kind === 'riser') {
    const o = ctx.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(120, 0); o.frequency.exponentialRampToValueAtTime(1800, 2.4);
    const flt = ctx.createBiquadFilter(); flt.type = 'lowpass'; flt.Q.value = 4;
    flt.frequency.setValueAtTime(400, 0); flt.frequency.exponentialRampToValueAtTime(4000, 2.4);
    const env = ctx.createGain();
    env.gain.setValueAtTime(0.01, 0); env.gain.exponentialRampToValueAtTime(0.55, 2.3);
    env.gain.exponentialRampToValueAtTime(0.001, 2.5);
    o.connect(flt); flt.connect(env); env.connect(g); o.start(0); o.stop(2.5);
  } else if (kind === 'subdrop') {
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(180, 0); o.frequency.exponentialRampToValueAtTime(30, 1.4);
    const env = ctx.createGain();
    env.gain.setValueAtTime(0.6, 0); env.gain.exponentialRampToValueAtTime(0.001, 1.5);
    o.connect(env); env.connect(g); o.start(0); o.stop(1.5);
  } else if (kind === 'shutter') {
    for (let i = 0; i < 3; i++) {
      const t0 = i * 0.03;
      const buf = ctx.createBuffer(1, Math.ceil(0.02 * sr), sr);
      const d = buf.getChannelData(0);
      for (let j = 0; j < d.length; j++) d[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / d.length, 3);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const env = ctx.createGain(); env.gain.value = 0.5;
      src.connect(env); env.connect(g); src.start(t0);
    }
  }
  return ctx.startRendering().then(audioBuf => {
    const wav = Export.encodeWav(audioBuf);
    const blob = new Blob([wav], { type: 'audio/wav' });
    const f = new File([blob], 'SFX_' + kind + '_' + Date.now() + '.wav', { type: 'audio/wav' });
    return importOne(f, null);
  });
}

/* ------------------------------ Shortcuts -------------------------------- */
const Shortcuts = (() => {
  function init() {
    document.addEventListener('keydown', e => {
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable)) return;
      const meta = e.metaKey || e.ctrlKey;
      const k = e.key;

      if (meta && k.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) Undo.redo(); else Undo.undo(); return; }
      if (meta && k.toLowerCase() === 'd') { e.preventDefault(); duplicateSelection(); return; }
      if (meta && k.toLowerCase() === 's') { e.preventDefault(); saveProject().then(() => toast('Project saved')); return; }
      if (meta && k.toLowerCase() === 'c') { e.preventDefault(); copySelection(); return; }
      if (meta && k.toLowerCase() === 'v') { e.preventDefault(); pasteClipboard(); return; }
      if (meta && k.toLowerCase() === 'a') {
        e.preventDefault();
        State.selection.clear();
        State.project.tracks.forEach(t => t.clips.forEach(c => State.selection.add(c.id)));
        Inspector.render(); Timeline.requestRender(); return;
      }
      if (k === ' ') { e.preventDefault(); Player.toggle(); return; }
      if (k === 'j') { e.preventDefault(); nudgePlayhead(-1 / State.project.fps * (e.shiftKey ? 10 : 1)); return; }
      if (k === 'k') { e.preventDefault(); Player.pause(); return; }
      if (k === 'l') { e.preventDefault(); nudgePlayhead(1 / State.project.fps * (e.shiftKey ? 10 : 1)); return; }
      if (k === 'i') { e.preventDefault(); State.inPoint = State.playhead; toast('In: ' + fmtTC(State.inPoint, State.project.fps)); Timeline.requestRender(); return; }
      if (k === 'o') { e.preventDefault(); State.outPoint = State.playhead; toast('Out: ' + fmtTC(State.outPoint, State.project.fps)); Timeline.requestRender(); return; }
      if (k === 'm') { e.preventDefault(); addMarkerAtPlayhead(); return; }
      if (k === 's' && !meta) { e.preventDefault(); splitSelectionAtPlayhead(); return; }
      if (k === 'v' && !meta) { e.preventDefault(); cutAtPlayhead('video'); return; }
      if (k === 'b' && !meta) { e.preventDefault(); cutAtPlayhead('audio'); return; }
      if (k === 'r' && !meta) { e.preventDefault(); toggleRazorMode(); return; }
      if (k === 'n' && !meta) { e.preventDefault(); State.snapping = !State.snapping; $('#btnSnap').classList.toggle('on', State.snapping); toast('Snapping ' + (State.snapping ? 'on' : 'off')); return; }
      if (k === 't' && !meta) { e.preventDefault(); State.followPlayhead = !State.followPlayhead; $('#btnFollow').classList.toggle('on', State.followPlayhead); toast('Auto-scroll ' + (State.followPlayhead ? 'on' : 'off')); return; }
      if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); deleteSelection(); return; }
      if (k === '[' && !meta) { e.preventDefault(); nudgeClips(-1 / State.project.fps); return; }
      if (k === ']' && !meta) { e.preventDefault(); nudgeClips(1 / State.project.fps); return; }
      if (k === 'ArrowLeft') {
        if (e.altKey) { e.preventDefault(); jumpToClipEdge(-1); return; }
        e.preventDefault(); nudgePlayhead(-1 / State.project.fps * (e.shiftKey ? 10 : 1)); return;
      }
      if (k === 'ArrowRight') {
        if (e.altKey) { e.preventDefault(); jumpToClipEdge(1); return; }
        e.preventDefault(); nudgePlayhead(1 / State.project.fps * (e.shiftKey ? 10 : 1)); return;
      }
      if (k === 'ArrowUp') { e.preventDefault(); nudgeSelectedY(-0.01 * (e.shiftKey ? 5 : 1)); return; }
      if (k === 'ArrowDown') { e.preventDefault(); nudgeSelectedY(0.01 * (e.shiftKey ? 5 : 1)); return; }
      if (k === 'Home') { e.preventDefault(); Timeline.setPlayhead(0); return; }
      if (k === 'End') { e.preventDefault(); Timeline.setPlayhead(Timeline.totalDuration()); return; }
      if (k === '+' || k === '=') { e.preventDefault(); State.zoom = clamp(State.zoom * 1.25, 4, 4000); Timeline.requestRender(); return; }
      if (k === '-') { e.preventDefault(); State.zoom = clamp(State.zoom / 1.25, 4, 4000); Timeline.requestRender(); return; }
      if (k === 'f' && !meta) { e.preventDefault(); Timeline.zoomToFit(); return; }
      if (k === 'g' && !meta) { e.preventDefault(); Timeline.zoomToSelection(); return; }
      if (k === 'Escape') { Modal.close(); if (State.razorMode) toggleRazorMode(); return; }
    });
  }
  function nudgePlayhead(dt) { Timeline.setPlayhead(Math.max(0, State.playhead + dt)); }
  function nudgeSelectedY(dy) {
    State.selection.forEach(id => {
      const f = Timeline.findClip(id);
      if (f) f.clip.transform.y = clamp(f.clip.transform.y + dy, -1, 1);
    });
    Preview.render(State.playhead);
    Inspector.render();
  }
  return { init };
})();

/* Robust asset drag: touch-action: pan-y means vertical scroll is left to the
   browser, and we only engage a drag once the gesture is clearly horizontal.
   Any scroll event or pointercancel aborts the drag cleanly. */
function attachAssetInteractions(el, asset) {
  let downX = 0, downY = 0, downT = 0, moved = false, lp = 0, longPressFired = false;
  let dragActive = false, dragStarted = false;
  let dragMove = null, dragUp = null;
  el.addEventListener('pointerdown', e => {
    if (e.button !== undefined && e.button !== 0) return;
    e.stopPropagation();
    downX = e.clientX; downY = e.clientY; downT = now();
    moved = false; longPressFired = false; dragActive = true; dragStarted = false;
    lp = setTimeout(() => { longPressFired = true; showAssetMenu(asset); }, 520);
  });
  el.addEventListener('pointermove', e => {
    if (!dragActive) return;
    const dx = e.clientX - downX, dy = e.clientY - downY;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    if (!dragStarted) {
      if (adx < 10 && ady < 10) return;
      if (ady > adx * 1.1) {
        // Vertical intent — cancel everything, let browser scroll
        dragActive = false;
        if (lp) { clearTimeout(lp); lp = 0; }
        return;
      }
      // Horizontal intent — engage drag
      dragStarted = true;
      if (lp) { clearTimeout(lp); lp = 0; }
      startAssetDrag(asset, e);
      el.classList.add('dragging');
      dragMove = ev => {
        if (!dragStarted) return;
        moveGhost(ev.clientX, ev.clientY);
        updateDropLine(ev);
      };
      dragUp = ev => {
        if (!dragStarted) return;
        if (dragMove) document.removeEventListener('pointermove', dragMove);
        if (dragUp) document.removeEventListener('pointerup', dragUp);
        document.removeEventListener('pointercancel', dragUp);
        document.removeEventListener('scroll', dragUp, true);
        const ghost = $('#dragGhost');
        ghost.style.display = 'none';
        $('#dropLine').style.display = 'none';
        el.classList.remove('dragging');
        const drop = computeDrop(ev);
        if (drop) dropAsset(asset, drop, ev);
        assetDrag = null;
        dragActive = false;
        dragStarted = false;
      };
      document.addEventListener('pointermove', dragMove, { passive: false });
      document.addEventListener('pointerup', dragUp);
      document.addEventListener('pointercancel', dragUp);
      // Abort if the page starts scrolling (e.g. user manages to trigger it)
      document.addEventListener('scroll', dragUp, true);
      return;
    }
  });
  el.addEventListener('pointerup', () => {
    if (lp) { clearTimeout(lp); lp = 0; }
    if (longPressFired) { dragActive = false; return; }
    if (!moved && !dragStarted && now() - downT < 500) {
      State.selectedAsset = asset.id;
      renderAssetPanel();
      previewAsset(asset);
    }
    dragActive = false;
  });
  el.addEventListener('pointercancel', () => {
    if (lp) { clearTimeout(lp); lp = 0; }
    dragActive = false;
  });
  el.addEventListener('contextmenu', e => { e.preventDefault(); showAssetMenu(asset); });
}
function previewAsset(asset) {
  for (const t of State.project.tracks) {
    for (const c of t.clips) {
      if (c.assetId === asset.id) { Timeline.setPlayhead(c.start); Preview.render(c.start); return; }
    }
  }
}
function showAssetMenu(asset) {
  const items = [
    { icon: 'play', label: 'Add to timeline at playhead', action: () => addAssetToTimeline(asset) },
    { icon: 'layers', label: 'Add as overlay above playhead', action: () => addAssetAsOverlay(asset) },
    { icon: 'type', label: 'Rename…', action: () => renameAsset(asset) },
    { icon: 'sliders', label: 'Show metadata', action: () => showAssetMetadata(asset) },
    { icon: 'copy', label: 'Duplicate in bin', action: () => duplicateAsset(asset) },
    { icon: 'trash', label: 'Delete from bin', danger: true, action: () => deleteAsset(asset) }
  ];
  if (asset.type === 'video' && State.selection.size) {
    items.splice(1, 0, { icon: 'swap', label: 'Replace selected clip', action: () => replaceSelectedClip(asset) });
  }
  Modal.menu(asset.name, items);
}
function addAssetToTimeline(asset) {
  let track = null;
  if (asset.type === 'audio') track = State.project.tracks.find(t => t.kind === 'audio');
  else track = State.project.tracks.find(t => t.kind === 'video');
  if (!track) { toast('No compatible track'); return; }
  const dur = asset.type === 'image' ? 5 : (asset.duration || 5);
  Undo.run('Add clip', () => {
    const c = makeClip(asset.id, asset.type, State.playhead, dur, 0);
    if (State.rippleEdit) rippleInsert(track, c);
    else track.clips.push(c);
    State.selection = new Set([c.id]);
  });
  Inspector.render();
  Timeline.requestRender();
}
function addAssetAsOverlay(asset) {
  let track = State.project.tracks.filter(t => t.kind === 'video')[1] || State.project.tracks.find(t => t.kind === 'video');
  if (!track) { toast('No video track'); return; }
  const dur = asset.type === 'image' ? 3 : Math.min(asset.duration || 3, 8);
  Undo.run('Add overlay', () => {
    const c = makeClip(asset.id, asset.type, State.playhead, dur, 0);
    c.transform.scale = 0.35; c.transform.x = 0.55; c.transform.y = -0.55;
    track.clips.push(c);
    State.selection = new Set([c.id]);
  });
  Inspector.render();
  Timeline.requestRender();
}
function rippleInsert(track, newClip) {
  const at = newClip.start;
  track.clips.forEach(c => { if (c.start >= at) c.start += newClip.duration; });
  track.clips.push(newClip);
}
function renameAsset(asset) {
  const wrap = document.createElement('div');
  wrap.style.padding = '10px 14px';
  const inp = document.createElement('input');
  inp.type = 'text'; inp.value = asset.name;

  wrap.appendChild(inp);
  Modal.open({
    title: 'Rename', body: wrap, center: true,

  });
  setTimeout(() => inp.focus(), 50);
}
function showAssetMetadata(asset) {
  const rows = [
    ['Name', asset.name], ['Type', asset.type], ['MIME', asset.mime || '—'],
    ['Size', fmtBytes(asset.size)],
    ['Duration', asset.duration ? fmtDur(asset.duration) : '—'],
    ['Resolution', asset.width ? asset.width + '×' + asset.height : '—'],
    ['Sample rate', asset.sampleRate ? asset.sampleRate + ' Hz' : '—'],

  ];
