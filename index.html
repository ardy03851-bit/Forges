<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0b0d">
<title>Forge</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
:root{
  --bg:#0b0b0d;--panel:#131316;--panel-2:#19191c;--panel-3:#202024;
  --border:#25252a;--border-2:#2f2f35;--border-3:#3a3a42;
  --text:#d8d8dc;--text-2:#a0a0a8;--dim:#6e6e77;--dim-2:#4a4a52;
  --accent:#4a9eff;--accent-2:#2a7fd4;
  --green:#4ade80;--amber:#f5b942;--red:#f0776c;--purple:#b68cf0;--cyan:#4fd1c5;--orange:#e59966;
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --tb:42px;--sb:22px;--rad:4px;
}
body{background:var(--bg);color:var(--text);font:13px/1.4 var(--font-ui);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a2a30;border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#3a3a42;background-clip:content-box}
button{font:inherit;color:inherit}
svg{display:block;flex:0 0 auto}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100vw}

#toolbar{height:var(--tb);flex:0 0 auto;display:flex;align-items:center;gap:4px;
  padding:0 max(8px,env(safe-area-inset-left));background:var(--panel);border-bottom:1px solid var(--border);z-index:50}
.brand-mark{width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:var(--accent);margin-right:2px}
.sep{width:1px;height:20px;background:var(--border-2);margin:0 5px}
.mode-switch{display:flex;background:#0e0e10;border:1px solid var(--border);border-radius:5px;padding:2px;gap:2px}
.mode-btn{appearance:none;border:0;background:transparent;color:var(--text-2);font:inherit;font-size:12px;font-weight:500;
  padding:4px 11px;border-radius:3px;min-height:26px;cursor:pointer;display:flex;align-items:center;gap:5px;
  transition:background .1s,color .1s}
.mode-btn:hover{color:var(--text)}
.mode-btn.active{background:var(--panel-3);color:#fff;box-shadow:0 0 0 1px var(--border-3)}
.tb-btn{appearance:none;font:inherit;font-size:12px;font-weight:500;background:transparent;color:var(--text-2);
  border:0;border-radius:var(--rad);padding:6px 8px;min-height:28px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  transition:background .1s,color .1s}
.tb-btn:hover{background:var(--panel-3);color:var(--text)}
.tb-btn.primary{background:var(--accent);color:#fff}
.tb-btn.primary:hover{background:var(--accent-2)}
.tb-btn.pill{padding:6px 12px;border:1px solid var(--border-2)}
.tb-btn.pill:hover{border-color:var(--border-3)}
.tb-btn.icon{padding:6px;min-width:30px;justify-content:center}
.tb-btn.ghost{color:var(--dim)}
.tb-btn.ghost:hover{color:var(--text)}
.spacer{flex:1}

#main{flex:1;display:flex;min-height:0;position:relative}
.side{flex:0 0 auto;display:flex;flex-direction:column;background:var(--panel);min-height:0;transition:width .16s ease,opacity .16s}
#left{width:250px;border-right:1px solid var(--border)}
#right{width:300px;border-left:1px solid var(--border)}
.side.collapsed{width:0;overflow:hidden;opacity:0;border:0}
.panel{display:flex;flex-direction:column;min-height:0;flex:1 1 auto;overflow:hidden;border-bottom:1px solid var(--border)}
.panel:last-child{border-bottom:0}
.panel-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;height:28px;padding:0 4px 0 10px;
  background:var(--panel-2);font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);
  border-bottom:1px solid var(--border)}
.panel-head .title{display:flex;align-items:center;gap:6px}
.panel-actions{display:flex;gap:0}
.panel-actions button{appearance:none;border:0;background:transparent;color:var(--dim);width:24px;height:22px;border-radius:3px;
  cursor:pointer;display:flex;align-items:center;justify-content:center}
.panel-actions button:hover{background:var(--panel-3);color:var(--text)}
.panel-body{flex:1 1 auto;overflow:auto;min-height:0}
.panel-tabs{flex:0 0 auto;display:flex;background:var(--panel-2);border-bottom:1px solid var(--border);padding:0 4px;gap:0}
.panel-tab{appearance:none;border:0;background:transparent;color:var(--text-2);font:inherit;font-size:11.5px;font-weight:500;
  padding:8px 10px;cursor:pointer;display:flex;align-items:center;gap:6px;position:relative;
  border-bottom:1.5px solid transparent;margin-bottom:-1px}
.panel-tab:hover{color:var(--text)}
.panel-tab.active{color:#fff;border-bottom-color:var(--accent)}
.tab-view{flex:1 1 auto;overflow:auto;min-height:0;display:none}
.tab-view.active{display:block}

/* breadcrumb */
.breadcrumb{display:flex;align-items:center;gap:2px;padding:5px 8px;background:var(--panel-2);border-bottom:1px solid var(--border);
  font-size:11px;color:var(--text-2);overflow-x:auto;white-space:nowrap;flex:0 0 auto}
.breadcrumb::-webkit-scrollbar{height:0}
.breadcrumb .crumb{padding:2px 6px;border-radius:3px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.breadcrumb .crumb:hover{background:var(--panel-3);color:var(--text)}
.breadcrumb .crumb.current{color:var(--text)}
.breadcrumb .sep-c{color:var(--dim-2);font-size:10px}

.tree-row{display:flex;align-items:center;gap:6px;height:24px;padding-right:8px;
  font-size:12.5px;color:var(--text);cursor:pointer;white-space:nowrap;border-left:2px solid transparent}
.tree-row:hover{background:var(--panel-2)}
.tree-row.sel{background:#1a2436;border-left-color:var(--accent)}
.tree-row.drop-target{background:#1e2f1e;box-shadow:inset 0 0 0 1px var(--green)}
.tree-row .arrow{width:12px;height:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--dim-2)}
.tree-row .arrow.expanded{transform:rotate(90deg)}
.tree-row .ic{width:14px;height:14px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.tree-row .label{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.tree-row .badge{font-size:9.5px;color:var(--dim-2);font-variant-numeric:tabular-nums;letter-spacing:.3px}
.tree-row.dragging{opacity:.35}

.hier-row{display:flex;align-items:center;gap:6px;height:26px;padding:0 4px 0 10px;
  font-size:12.5px;cursor:pointer;border-left:2px solid transparent}
.hier-row:hover{background:var(--panel-2)}
.hier-row.sel{background:#1a2436;border-left-color:var(--accent)}
.hier-row .ic{width:14px;height:14px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.hier-row.sel .ic{color:var(--accent)}
.hier-row .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hier-row .act{border:0;background:transparent;color:var(--dim-2);width:22px;height:22px;border-radius:3px;
  cursor:pointer;display:flex;align-items:center;justify-content:center}
.hier-row .act:hover{background:var(--panel-3);color:var(--text)}
.hier-row .act.on{color:var(--accent)}

#center{flex:1 1 auto;position:relative;min-width:0;background:#000;overflow:hidden}
.pane{position:absolute;inset:0;display:none}
.pane.active{display:flex;flex-direction:column}

#viewportWrap{position:absolute;inset:0;touch-action:none;overflow:hidden}
#viewport{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#viewportWrap.drop-target::after{content:'';position:absolute;inset:0;border:1.5px dashed var(--accent);
  background:rgba(74,158,255,.06);pointer-events:none;z-index:5}
#viewportHud{position:absolute;left:10px;top:10px;display:flex;gap:6px;pointer-events:none;z-index:3;flex-wrap:wrap;max-width:60%}
.hud-chip{background:rgba(15,15,18,.72);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.06);
  border-radius:4px;padding:3px 8px;font:11px/1.3 var(--font-mono);color:var(--text-2);font-variant-numeric:tabular-nums}
#gizmoBar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:1px;
  background:rgba(15,15,18,.85);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);
  border-radius:6px;padding:3px;z-index:6;box-shadow:0 4px 20px rgba(0,0,0,.5)}
#gizmoBar button{appearance:none;border:0;background:transparent;color:var(--text-2);
  min-width:48px;height:32px;border-radius:4px;cursor:pointer;font:inherit;font-size:11px;font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:5px}
#gizmoBar button:hover{background:rgba(255,255,255,.06);color:var(--text)}
#gizmoBar button.on{background:var(--accent);color:#fff}
#gizmoSep{width:1px;background:rgba(255,255,255,.1);margin:5px 3px}

#editorPane{background:#0e0e10}
#tabBar{flex:0 0 auto;display:flex;align-items:stretch;height:32px;background:#0a0a0c;border-bottom:1px solid var(--border);
  overflow-x:auto;overflow-y:hidden}
#tabBar::-webkit-scrollbar{height:0}
.tab{display:flex;align-items:center;gap:6px;padding:0 8px 0 10px;font-size:12px;color:var(--text-2);background:#0a0a0c;
  border-right:1px solid var(--border);cursor:pointer;white-space:nowrap;flex:0 0 auto}
.tab.active{background:#0e0e10;color:#fff;box-shadow:inset 0 1.5px 0 var(--accent)}
.tab .x{color:var(--dim-2);padding:1px 3px;border-radius:2px;display:flex;align-items:center}
.tab .x:hover{background:var(--panel-3);color:var(--text)}
#editorBody{flex:1;display:flex;min-height:0;position:relative}
#gutter{flex:0 0 auto;width:48px;background:#0a0a0c;border-right:1px solid var(--border);overflow:hidden;padding:10px 0;
  font:12.5px/1.55 var(--font-mono);color:#3d3d44;text-align:right;user-select:none}
#gutter div{padding-right:10px}
#codeArea{position:relative;flex:1;min-width:0;overflow:hidden}
#highlight,#codeInput{position:absolute;inset:0;margin:0;padding:10px 14px;
  font:12.5px/1.55 var(--font-mono);white-space:pre;overflow:auto;border:0;tab-size:2;
  -webkit-user-select:text;user-select:text}
#highlight{color:#cfcfd4;pointer-events:none;z-index:0}
#codeInput{background:transparent;color:transparent;caret-color:#fff;z-index:1;resize:none;outline:none;-webkit-text-fill-color:transparent}
#codeInput::selection{background:rgba(74,158,255,.35)}
.c-key{color:#c586c0}.c-str{color:#ce9178}.c-num{color:#b5cea8}.c-com{color:#5a6670;font-style:italic}
.c-tag{color:#569cd6}.c-att{color:#9cdcfe}.c-fn{color:#dcdcaa}.c-op{color:#8a8a92}
.c-type{color:#4ec9b0}.c-shader-k{color:#b68cf0}.c-shader-t{color:#4ec9b0}

#autocomplete{position:absolute;background:#1a1a1e;border:1px solid var(--border-3);border-radius:4px;
  min-width:220px;max-height:220px;overflow:auto;z-index:100;box-shadow:0 6px 24px rgba(0,0,0,.6);
  display:none;padding:3px 0;font:12px var(--font-mono)}
#autocomplete.show{display:block}
#autocomplete .ac-item{padding:4px 10px;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
#autocomplete .ac-item:hover,#autocomplete .ac-item.sel{background:var(--accent);color:#fff}
#autocomplete .ac-item .k{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-left:auto}
#autocomplete .ac-item.sel .k{color:rgba(255,255,255,.7)}

#findBar{position:absolute;top:8px;right:16px;z-index:20;background:#1a1a1e;border:1px solid var(--border-3);
  border-radius:5px;padding:5px 6px;display:none;align-items:center;gap:4px;box-shadow:0 6px 24px rgba(0,0,0,.55)}
#findBar.show{display:flex}
#findBar input{background:#0e0e10;border:1px solid var(--border-2);border-radius:3px;color:var(--text);
  font:12px var(--font-mono);padding:4px 7px;width:150px;outline:none;-webkit-user-select:text;user-select:text}
#findBar input:focus{border-color:var(--accent)}
#findBar .fbtn{appearance:none;background:transparent;border:0;color:var(--text-2);padding:4px 6px;border-radius:3px;
  cursor:pointer;display:flex;align-items:center}
#findBar .fbtn:hover{background:var(--panel-3);color:var(--text)}

#assetsGrid{padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;align-content:start}
.asset-card{background:var(--panel-2);border:1px solid var(--border);border-radius:5px;overflow:hidden;
  display:flex;flex-direction:column;cursor:pointer;transition:border-color .1s}
.asset-card:hover{border-color:var(--border-3)}
.asset-card.sel{border-color:var(--accent)}
.asset-card .preview{height:80px;background:#0a0a0c;display:flex;align-items:center;justify-content:center;
  background-size:cover;background-position:center;color:var(--dim);position:relative}
.asset-card .preview .ext{position:absolute;right:4px;bottom:4px;font:9px/1 var(--font-mono);font-weight:600;
  letter-spacing:.5px;background:rgba(0,0,0,.65);border-radius:2px;padding:2px 4px;color:#c8c8ce}
.asset-card .info{padding:6px 8px;border-top:1px solid var(--border)}
.asset-card .info .n{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.asset-card .info .s{font-size:9.5px;color:var(--dim);display:block;margin-top:1px;font-variant-numeric:tabular-nums}

#inspector{padding-bottom:24px}
.insp-header{padding:10px 12px;background:var(--panel-2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.insp-header .dot{width:8px;height:8px;border-radius:2px;background:var(--accent)}
.insp-header .name{font-size:12.5px;font-weight:500;color:#eaeAec;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.insp-header .kind{font:9.5px/1 var(--font-mono);font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);
  background:var(--panel-3);border-radius:2px;padding:3px 5px}
.insp-group{border-bottom:1px solid var(--border)}
.insp-group > h4{margin:0;padding:8px 12px 5px;font-size:10px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;
  color:var(--dim);display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.insp-group > h4 .caret{margin-left:auto;color:var(--dim-2);transition:transform .15s}
.insp-group.collapsed > h4 .caret{transform:rotate(-90deg)}
.insp-group.collapsed > .insp-group-body{display:none}
.insp-group-body{padding-bottom:8px}
.row{display:flex;align-items:center;gap:8px;padding:3px 12px;min-height:26px}
.row > label{flex:0 0 84px;font-size:11.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row > .ctl{flex:1;display:flex;gap:4px;min-width:0;align-items:center}
input[type=text],input[type=number],select{appearance:none;background:#0a0a0c;border:1px solid var(--border-2);border-radius:3px;
  color:var(--text);font:12px var(--font-ui);padding:4px 6px;min-width:0;width:100%;min-height:26px;
  -webkit-user-select:text;user-select:text}
input[type=number]{font-family:var(--font-mono);font-size:11.5px;text-align:right;padding-right:6px;font-variant-numeric:tabular-nums}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(74,158,255,.15)}
select{cursor:pointer;padding-right:20px}
input[type=color]{appearance:none;border:1px solid var(--border-2);border-radius:3px;background:#0a0a0c;
  width:32px;height:26px;padding:2px;cursor:pointer;flex:0 0 auto}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:none;border-radius:2px}
input[type=range]{appearance:none;-webkit-appearance:none;background:transparent;width:100%;height:22px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:#2a2a30;border-radius:1px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
  background:var(--accent);margin-top:-5px;border:2px solid #0e0e10;box-shadow:0 0 0 1px var(--accent)}
.slider-val{flex:0 0 40px;text-align:right;font:11px var(--font-mono);color:var(--dim);font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:11.5px;color:var(--text);user-select:none}
.chk input{appearance:none;width:28px;height:16px;border-radius:8px;background:#2a2a30;position:relative;
  transition:background .12s;cursor:pointer;flex:0 0 auto;margin:0}
.chk input::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;
  background:#9a9aa2;transition:transform .12s,background .12s}
.chk input:checked{background:var(--accent)}
.chk input:checked::after{transform:translateX(12px);background:#fff}

.tex-slot{display:flex;align-items:center;gap:8px;padding:5px 12px;margin:2px 0;border-radius:4px;
  border:1px solid transparent;transition:background .12s,border-color .12s}
.tex-slot.droppable{border-color:rgba(74,158,255,.2);border-style:dashed}
.tex-slot.hot{border-color:var(--accent);background:rgba(74,158,255,.08)}
.tex-slot .thumb{width:30px;height:30px;border-radius:3px;background:#0a0a0c;border:1px solid var(--border-2);
  flex:0 0 auto;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;
  color:var(--dim-2);overflow:hidden}
.tex-slot .meta{flex:1;min-width:0}
.tex-slot .meta .n{font-size:10.5px;color:var(--dim);display:block;text-transform:uppercase;letter-spacing:.4px}
.tex-slot .meta .v{font-size:11px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;margin-top:1px}
.tex-slot .meta .v.empty{color:var(--dim-2)}
.tex-slot .clr{border:0;background:transparent;color:var(--dim-2);cursor:pointer;width:22px;height:22px;border-radius:3px;
  flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.tex-slot .clr:hover{background:var(--panel-3);color:var(--red)}

.chip-list{display:flex;flex-wrap:wrap;gap:5px;padding:4px 12px}
.chip{display:flex;align-items:center;gap:5px;background:var(--panel-3);border:1px solid var(--border-2);
  border-radius:3px;padding:3px 6px;font-size:11px;color:var(--text)}
.chip button{border:0;background:transparent;color:var(--dim);cursor:pointer;padding:0;display:flex;align-items:center}
.chip button:hover{color:var(--text)}

.btn-row{display:flex;gap:6px;padding:6px 12px}
.btn-row .tb-btn{flex:1;justify-content:center;border:1px solid var(--border-2);background:var(--panel-2)}
.btn-row .tb-btn:hover{background:var(--panel-3);border-color:var(--border-3)}
.tb-btn.danger{color:#ffbdbd;border-color:#5a2b2b;background:#2a1818}
.tb-btn.danger:hover{background:#3a2020}
.empty{color:var(--dim-2);font-size:12px;padding:24px 16px;text-align:center;line-height:1.6}

#statusbar{height:var(--sb);flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;padding-bottom:env(safe-area-inset-bottom);background:var(--panel-2);border-top:1px solid var(--border);
  font:11px var(--font-ui);color:var(--text-2);z-index:40}
#statusbar .right{display:flex;gap:16px;font-variant-numeric:tabular-nums;font-family:var(--font-mono);font-size:10.5px}

.drag-ghost{position:fixed;z-index:9999;pointer-events:none;transform:translate(8px,8px);
  background:rgba(20,20,24,.95);border:1px solid var(--accent);border-radius:4px;padding:5px 10px;
  font:11.5px var(--font-ui);color:#fff;white-space:nowrap;box-shadow:0 8px 28px rgba(0,0,0,.6);backdrop-filter:blur(8px)}
#toast{position:fixed;left:50%;bottom:48px;transform:translate(-50%,12px);background:rgba(24,24,28,.97);
  border:1px solid var(--border-3);border-radius:5px;padding:9px 16px;font-size:12.5px;color:#eaeAec;z-index:10000;
  opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;box-shadow:0 8px 28px rgba(0,0,0,.6);
  max-width:min(80vw,420px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#modalBack{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:8000;display:none;align-items:center;justify-content:center;
  padding:20px;backdrop-filter:blur(2px)}
#modalBack.show{display:flex}
#modal{background:var(--panel);border:1px solid var(--border-3);border-radius:8px;min-width:min(420px,90vw);max-width:560px;
  max-height:80vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.7)}
#modal h3{margin:0;padding:12px 16px;font-size:13px;border-bottom:1px solid var(--border);font-weight:600}
#modal .body{padding:12px 16px}
#modal .body p{margin:0 0 10px;font-size:12.5px;color:var(--text-2);line-height:1.55}
#modal .foot{padding:10px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}

.shader-list{padding:6px}
.shader-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:3px;font-size:12px;cursor:pointer}
.shader-item:hover{background:var(--panel-2)}
.shader-item.sel{background:#1a2436}
.shader-item .ic{color:var(--purple)}
.shader-item .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shader-item .act{opacity:0;color:var(--dim-2);cursor:pointer}
.shader-item:hover .act{opacity:1}
.shader-item .act:hover{color:var(--red)}

body.playing #toolbar,body.playing #left,body.playing #right,body.playing #statusbar{display:none!important}
body.playing #center{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;z-index:900}
#playHud{position:fixed;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));
  display:none;gap:8px;z-index:1000;align-items:center}
body.playing #playHud{display:flex}
#playHud .stat{background:rgba(15,15,18,.85);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.09);
  border-radius:5px;padding:7px 12px;font:11.5px var(--font-mono);color:#cfcfd6;font-variant-numeric:tabular-nums}
#btnStop{background:rgba(240,119,108,.92);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:5px;
  padding:8px 16px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
#btnStop:hover{background:#e05e52}
.hidden{display:none!important}
@media (max-width:900px){
  #left{width:210px}
  #right{position:absolute;right:0;top:0;bottom:0;z-index:30;width:280px;box-shadow:-10px 0 30px rgba(0,0,0,.5)}
  #right.collapsed{box-shadow:none}
}
</style>
</head>

<div id="app">
  <header id="toolbar">
    <div class="brand-mark"><svg width="18" height="18"><use href="#i-cube"/></svg></div>
    <div class="mode-switch">
      <button class="mode-btn active" data-mode="scene"><svg width="13" height="13"><use href="#i-cube"/></svg>Scene</button>
      <button class="mode-btn" data-mode="code"><svg width="13" height="13"><use href="#i-braces"/></svg>Code</button>
      <button class="mode-btn" data-mode="graphics"><svg width="13" height="13"><use href="#i-sparkle"/></svg>Graphics</button>
    </div>
    <div class="sep"></div>
    <button class="tb-btn icon ghost" id="btnToggleLeft" title="Toggle explorer"><svg width="14" height="14"><use href="#i-panel-left"/></svg></button>
    <button class="tb-btn icon ghost" id="btnToggleRight" title="Toggle inspector"><svg width="14" height="14"><use href="#i-panel-right"/></svg></button>
    <div class="spacer"></div>
    <button class="tb-btn pill" id="btnImport"><svg width="13" height="13"><use href="#i-import"/></svg>Import</button>
    <button class="tb-btn pill" id="btnExportHtml"><svg width="13" height="13"><use href="#i-download"/></svg>HTML</button>
    <button class="tb-btn pill" id="btnExportZip"><svg width="13" height="13"><use href="#i-download"/></svg>ZIP</button>
    <button class="tb-btn primary" id="btnPlay"><svg width="12" height="12"><use href="#i-play"/></svg>Play</button>
  </header>

  <div id="main">
    <aside id="left" class="side">
      <div class="panel" style="flex:0 0 45%">
        <div class="panel-head">
          <span class="title">Explorer</span>
          <div class="panel-actions">
            <button data-act="newFile" title="New file"><svg width="13" height="13"><use href="#i-plus"/></svg></button>
            <button data-act="newFolder" title="New folder"><svg width="13" height="13"><use href="#i-folder"/></svg></button>
            <button data-act="rename" title="Rename"><svg width="12" height="12"><use href="#i-pencil"/></svg></button>
            <button data-act="delete" title="Delete"><svg width="12" height="12"><use href="#i-trash"/></svg></button>
          </div>
        </div>
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="panel-body" id="fileTree"></div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <span class="title">Hierarchy</span>
          <div class="panel-actions">
            <button id="btnAddObj" title="Add object"><svg width="13" height="13"><use href="#i-plus"/></svg></button>
            <button id="btnDeleteObj" title="Delete"><svg width="12" height="12"><use href="#i-trash"/></svg></button>
          </div>
        </div>
        <div class="panel-body" id="hierarchy"></div>
      </div>
    </aside>

    <section id="center">
      <div class="pane active" id="scenePane">
        <div id="viewportWrap">
          <canvas id="viewport"></canvas>
          <div id="viewportHud">
            <div class="hud-chip" id="hudStats">0 tris</div>
            <div class="hud-chip" id="hudFps">— fps</div>
          </div>
          <div id="gizmoBar">
            <button data-gizmo="translate" class="on"><svg width="12" height="12"><use href="#i-move"/></svg>Move</button>
            <button data-gizmo="rotate"><svg width="12" height="12"><use href="#i-rotate"/></svg>Rotate</button>
            <button data-gizmo="scale"><svg width="12" height="12"><use href="#i-scale"/></svg>Scale</button>
            <div id="gizmoSep"></div>
            <button id="btnQuickTools"><svg width="12" height="12"><use href="#i-tools"/></svg>Tools</button>
            <button id="btnSpace"><svg width="12" height="12"><use href="#i-globe"/></svg>World</button>
          </div>
        </div>
      </div>

      <div class="pane" id="editorPane">
        <div id="tabBar"></div>
        <div id="editorBody">
          <div id="gutter"></div>
          <div id="codeArea">
            <pre id="highlight"><code></code></pre>
            <textarea id="codeInput" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" wrap="off"></textarea>
            <div id="findBar">
              <svg width="13" height="13" style="color:var(--dim);margin:0 2px"><use href="#i-search"/></svg>
              <input id="findInput" placeholder="Find">
              <input id="replaceInput" placeholder="Replace">
              <button class="fbtn" id="findPrev" title="Previous"><svg width="13" height="13"><use href="#i-arrow-up"/></svg></button>
              <button class="fbtn" id="findNext" title="Next"><svg width="13" height="13"><use href="#i-arrow-down"/></svg></button>
              <button class="fbtn" id="replaceOne" title="Replace"><svg width="13" height="13"><use href="#i-replace"/></svg></button>
              <button class="fbtn" id="replaceAll" title="Replace all"><svg width="13" height="13"><use href="#i-check"/></svg></button>
              <button class="fbtn" id="findClose" title="Close"><svg width="12" height="12"><use href="#i-x"/></svg></button>
            </div>
            <div id="autocomplete"></div>
          </div>
        </div>
      </div>

      <div class="pane" id="graphicsPane">
        <div style="flex:1;display:flex;min-height:0">
          <div style="flex:0 0 220px;border-right:1px solid var(--border);overflow:auto;background:var(--panel);display:flex;flex-direction:column">
            <div class="panel-head" style="flex:0 0 auto"><span class="title">Shaders</span>
              <div class="panel-actions">
                <button id="btnNewShader" title="New shader"><svg width="13" height="13"><use href="#i-plus"/></svg></button>
                <button id="btnPresets" title="Presets"><svg width="13" height="13"><use href="#i-sparkle"/></svg></button>
              </div>
            </div>
            <div class="shader-list" id="shaderList" style="flex:1"></div>
          </div>
          <div style="flex:1;display:flex;flex-direction:column;min-width:0;background:#0e0e10">
            <div style="flex:0 0 auto;padding:8px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--panel-2)">
              <span id="shaderName" style="font-size:12px;color:var(--text-2)">No shader selected</span>
              <span class="spacer" style="flex:1"></span>
              <button class="tb-btn pill" id="btnApplyShader">Apply to Selection</button>
            </div>
            <textarea id="shaderEditor" spellcheck="false" style="flex:1;background:#0e0e10;color:var(--text);border:0;outline:none;padding:12px;font:12.5px/1.55 var(--font-mono);resize:none;-webkit-user-select:text;user-select:text"></textarea>
          </div>
        </div>
      </div>
    </section>

    <aside id="right" class="side">
      <div class="panel">

/* ============ INDEXEDDB ============ */
const DB_NAME = 'forge-store', DB_VER = 3, STORE_FILES = 'files', STORE_META = 'meta';
let _db = null;
function openDB(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains(STORE_FILES)) db.createObjectStore(STORE_FILES);
      if(!db.objectStoreNames.contains(STORE_META)) db.createObjectStore(STORE_META);
    };
    req.onsuccess = () => { _db = req.result; res(_db); };
    req.onerror = () => rej(req.error);
  });
}
const FileStore = {
  cache: new Map(),
  urlCache: new Map(),
  async init(){ try { await openDB(); } catch(e){ console.warn('IDB unavailable', e); } },
  async put(id, value){
    this.cache.set(id, value);
    this._revokeURL(id);
    const db = await openDB();
    return new Promise((res,rej)=>{
      const tx = db.transaction(STORE_FILES, 'readwrite');
      tx.objectStore(STORE_FILES).put(value, id);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  },
  async get(id){
    if(this.cache.has(id)) return this.cache.get(id);
    const db = await openDB();
    return new Promise((res,rej)=>{
      const tx = db.transaction(STORE_FILES, 'readonly');
      const r = tx.objectStore(STORE_FILES).get(id);
      r.onsuccess = () => { this.cache.set(id, r.result); res(r.result); };
      r.onerror = () => rej(r.error);
    });
  },
  async del(id){
    this.cache.delete(id);
    this._revokeURL(id);
    const db = await openDB();
    return new Promise((res,rej)=>{
      const tx = db.transaction(STORE_FILES, 'readwrite');
      tx.objectStore(STORE_FILES).delete(id);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  },
  _revokeURL(id){
    const u = this.urlCache.get(id);
    if(u){ try{ URL.revokeObjectURL(u); }catch(e){} this.urlCache.delete(id); }
  },
  async getURL(id){
    if(this.urlCache.has(id)) return this.urlCache.get(id);
    const d = await this.get(id);
    if(d == null) return null;
    let url;
    if(d instanceof Blob) url = URL.createObjectURL(d);
    else if(typeof d === 'string' && d.startsWith('data:')) url = d;
    else url = 'data:text/plain;base64,' + btoa(unescape(encodeURIComponent(String(d))));
    this.urlCache.set(id, url);
    return url;
  },
  async saveMeta(meta){
    const db = await openDB();
    return new Promise((res,rej)=>{
      const tx = db.transaction(STORE_META, 'readwrite');
      tx.objectStore(STORE_META).put(meta, 'project');
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  },
  async loadMeta(){
    const db = await openDB();
    return new Promise((res,rej)=>{
      const tx = db.transaction(STORE_META, 'readonly');
      const r = tx.objectStore(STORE_META).get('project');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
};

/* ============ TREE ============ */
function findNode(id, node=state.root){
  if(!node) return null;
  if(node.id === id) return node;
  const kids = node.children;
  if(!kids) return null;
  for(let i = 0; i < kids.length; i++){
    const r = findNode(id, kids[i]);
    if(r) return r;
  }
  return null;
}
function findParent(id, node=state.root){
  if(!node || !node.children) return null;
  for(const c of node.children){
    if(c.id === id) return node;
    const r = findParent(id, c);
    if(r) return r;
  }
  return null;
}
function ensureFolder(path, root=state.root){
  let cur = root;
  for(const name of path){
    cur.children = cur.children || [];
    let next = cur.children.find(c => c.type==='folder' && c.name===name);
    if(!next){
      next = { id: uid('d'), type:'folder', name, children:[], expanded:false };
      cur.children.push(next);
    }
    cur = next;
  }
  return cur;
}
function walkFiles(node, fn){
  if(!node) return;
  if(node.type==='file') fn(node);
  if(node.children) for(const c of node.children) walkFiles(c, fn);
}
function walkAll(node, fn){
  if(!node) return;
  fn(node);
  if(node.children) for(const c of node.children) walkAll(c, fn);
}
function allFiles(){
  const out = [];
  walkFiles(state.root, f => out.push(f));
  return out;
}

function folderForKind(kind){
  if(kind==='model') return ensureFolder(['Assets','Models']);
  if(kind==='texture') return ensureFolder(['Assets','Textures']);
  if(kind==='audio'||kind==='video') return ensureFolder(['Assets','Media']);
  if(kind==='script') return ensureFolder(['Scripts']);
  if(kind==='shader') return ensureFolder(['Shaders']);
  if(kind==='font') return ensureFolder(['Assets','Fonts']);
  if(kind==='html'||kind==='css') return ensureFolder(['src']);
  if(kind==='json'||kind==='text') return ensureFolder(['src','data']);
  return ensureFolder(['Assets','Misc']);
}

const WIND_LEAF_SHADER = `// wind_leaf.gdshader — animates vegetation with realistic wind
// Apply to leaves, grass, bushes. Uses world position for phase offset
// so nearby plants sway together — like real wind gusts.

shader_type spatial;
render_mode cull_disabled, depth_draw_opaque;

uniform vec4 albedo : source_color = vec4(0.35, 0.65, 0.25, 1.0);
uniform float wind_strength : hint_range(0.0, 2.0) = 0.5;
uniform float wind_speed : hint_range(0.0, 5.0) = 1.2;
uniform float wind_frequency : hint_range(0.0, 2.0) = 0.35;
uniform float sway_axis : hint_range(0.0, 1.0) = 0.7;

void vertex() {
  // World-space phase so plants near each other move in unison
  float phase = VERTEX.x * wind_frequency + VERTEX.z * wind_frequency;
  float t = TIME * wind_speed;
  // Two overlapping sine waves give gusty, organic motion
  float wave = sin(t + phase) * 0.7 + sin(t * 2.3 + phase * 1.4) * 0.3;
  // Only the top of the mesh sways — like a stem bending
  float bendAmount = max(VERTEX.y, 0.0) * wind_strength;
  VERTEX.x += wave * bendAmount * sway_axis;
  VERTEX.z += wave * bendAmount * (1.0 - sway_axis);
}

void fragment() {
  ALBEDO = albedo.rgb;
  ROUGHNESS = 0.85;
}
`;

const WATER_SHADER = `// water.gdshader — animated water with fresnel and depth tint
shader_type spatial;
render_mode blend_mix, depth_draw_always;

uniform vec4 shallow_color : source_color = vec4(0.3, 0.65, 0.75, 1.0);
uniform vec4 deep_color : source_color = vec4(0.05, 0.15, 0.35, 1.0);
uniform float wave_speed = 0.8;
uniform float wave_scale = 0.4;
uniform float wave_height = 0.08;
uniform float fresnel_power = 3.0;

void vertex() {
  float t = TIME * wave_speed;
  float h = sin(VERTEX.x * wave_scale + t) * 0.5
          + sin(VERTEX.z * wave_scale * 1.4 - t * 1.2) * 0.5;
  VERTEX.y += h * wave_height;
}

void fragment() {
  float f = pow(1.0 - max(dot(NORMAL, VIEW), 0.0), fresnel_power);
  ALBEDO = mix(shallow_color.rgb, deep_color.rgb, f);
  ROUGHNESS = 0.05;
  METALLIC = 0.2;
}
`;

const TOON_SHADER = `// toon.gdshader — stylized two-tone cel shading
shader_type spatial;

uniform vec4 albedo : source_color = vec4(0.9, 0.7, 0.5, 1.0);
uniform vec4 shadow_tint : source_color = vec4(0.4, 0.4, 0.65, 1.0);
uniform float bands : hint_range(1.0, 6.0) = 2.0;

void fragment() {
  vec3 lightDir = normalize(vec3(0.5, 1.0, 0.3));
  float ndl = max(dot(NORMAL, lightDir), 0.0);
  float stepped = floor(ndl * bands) / bands;
  vec3 lit = mix(shadow_tint.rgb * albedo.rgb, albedo.rgb, stepped);
  ALBEDO = lit;
  ROUGHNESS = 0.9;
  METALLIC = 0.0;
}
`;

const GRASS_SHADER = `// grass.gdshader — instanced grass blade shader
shader_type spatial;
render_mode cull_disabled;

uniform vec4 bottom_color : source_color = vec4(0.2, 0.35, 0.1, 1.0);
uniform vec4 top_color : source_color = vec4(0.55, 0.85, 0.35, 1.0);
uniform float wind_strength = 0.35;
uniform float wind_speed = 1.5;

void vertex() {
  float h = clamp(VERTEX.y, 0.0, 1.0);
  float phase = VERTEX.x * 2.0 + VERTEX.z * 2.0;
  float t = TIME * wind_speed;
  float sway = sin(t + phase) * wind_strength * h;
  VERTEX.x += sway;
}

void fragment() {
  float h = clamp(VERTEX.y, 0.0, 1.0);
  ALBEDO = mix(bottom_color.rgb, top_color.rgb, h);
  ROUGHNESS = 0.9;
}
`;

const DISSOLVE_SHADER = `// dissolve.gdshader — noise-based dissolve effect
shader_type spatial;
render_mode blend_mix, depth_draw_opaque;

uniform vec4 albedo : source_color = vec4(0.8, 0.4, 0.2, 1.0);
uniform vec4 edge_color : source_color = vec4(1.0, 0.6, 0.1, 1.0);
uniform float threshold : hint_range(0.0, 1.0) = 0.5;
uniform float edge_width : hint_range(0.0, 0.2) = 0.05;

shader_type spatial;
render_mode blend_add, cull_disabled, depth_draw_never;

uniform vec4 tint : source_color = vec4(0.4, 0.9, 1.0, 1.0);
uniform float scan_freq = 60.0;
uniform float scan_speed = 2.0;

void fragment() {

const FORCEFIELD_SHADER = `// forcefield.gdshader — animated hex forcefield
shader_type spatial;
render_mode blend_add, cull_disabled, depth_draw_never;

uniform vec4 color : source_color = vec4(0.2, 0.6, 1.0, 1.0);
uniform float pattern_scale = 20.0;
uniform float pulse_speed = 1.5;

float hexDist(vec2 p) {
  p = abs(p);
  return max(dot(p, normalize(vec2(1.0, 1.73))), p.x);
}

void fragment() {
  vec2 p = (UV - 0.5) * pattern_scale;
  float d = hexDist(p);
  float grid = abs(sin(d * 3.14159)) * 0.5 + 0.5;
  float pulse = sin(TIME * pulse_speed) * 0.3 + 0.7;
  float fres = pow(1.0 - max(dot(NORMAL, VIEW), 0.0), 2.0);
  ALBEDO = color.rgb;
  EMISSION = color.rgb * grid * pulse * (fres + 0.3);
  ALPHA = (grid * 0.6 + fres * 0.4) * color.a;
}
`;

const gltfLoader = new GLTFLoader();
const objLoader = new OBJLoader();
const fbxLoader = new FBXLoader();
const stlLoader = new STLLoader();
const plyLoader = new PLYLoader();
const colladaLoader = new ColladaLoader();

/* ============ UNIFIED ASSET LOADER ============ */
async function loadModelByExt(file){
  const ext = extOf(file.name);
  const url = await FileStore.getURL(file.id);
  if(!url) throw new Error('No URL for ' + file.name);

  if(ext === 'glb' || ext === 'gltf'){
    const g = await gltfLoader.loadAsync(url);
    return g.scene;
  }
  if(ext === 'obj') return await objLoader.loadAsync(url);
  if(ext === 'fbx') return await fbxLoader.loadAsync(url);
  if(ext === 'stl'){
    const geo = await stlLoader.loadAsync(url);
    geo.computeVertexNormals();
    return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color:0xc0c0c8, roughness:0.6, metalness:0.1 }));
  }
  if(ext === 'ply'){
    const geo = await plyLoader.loadAsync(url);
    geo.computeVertexNormals();
    const hasColors = geo.attributes.color !== undefined;
    const mat = new THREE.MeshStandardMaterial({
      color: hasColors ? 0xffffff : 0xb0b0b8,
      vertexColors: hasColors,
      roughness: 0.7, metalness: 0.05
    });
    return new THREE.Mesh(geo, mat);
  }
  if(ext === 'dae'){
    const g = await colladaLoader.loadAsync(url);
    return g.scene;
  }
  if(ext === '3ds'){
    return await tdsLoader.loadAsync(url);
  }
  throw new Error('Unsupported model: .' + ext);
}

async function loadTextureFile(file, srgb=true){
  const ext = extOf(file.name);
  const url = await FileStore.getURL(file.id);
  if(!url) return null;
  let t;
  if(ext === 'hdr'){ t = await rgbeLoader.loadAsync(url); }
  else if(ext === 'exr'){ t = await exrLoader.loadAsync(url); }
  else if(ext === 'tga'){ t = await tgaLoader.loadAsync(url); }
  else if(ext === 'dds'){ t = ddsLoader.load(url); }
  else { t = await texLoader.loadAsync(url); }
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}

/* In-memory texture cache keyed by file id + srgb flag */
const _texCache = new Map();
async function getTextureCached(file, srgb){
  const key = file.id + (srgb ? '_s' : '_l');
  if(_texCache.has(key)) return _texCache.get(key);
  const t = await loadTextureFile(file, srgb);
  _texCache.set(key, t);
  return t;
}

/* ============ OBJECT MANAGEMENT ============ */
function getItem(id){ return state.objects.find(o => o.id === id) || null; }
function tagObj(obj, id){ obj.traverse(o => { o.userData.itemId = id; }); }

function applyMaterialProps(mat, m){
  mat.color = new THREE.Color(m.color || '#ffffff');
  mat.metalness = m.metalness; mat.roughness = m.roughness;
  mat.opacity = m.opacity; mat.transparent = m.transparent || m.opacity < 1;
  mat.emissive = new THREE.Color(m.emissive || '#000000');
  mat.emissiveIntensity = m.emissiveIntensity;
  mat.wireframe = m.wireframe;
  mat.flatShading = m.flatShading;
  mat.side = m.side === 'double' ? THREE.DoubleSide : THREE.FrontSide;
  mat.depthWrite = m.depthWrite; mat.depthTest = m.depthTest;
  mat.alphaTest = m.alphaTest; mat.alphaHash = m.alphaHash;
  mat.envMapIntensity = m.envMapIntensity;
  if(mat.clearcoat !== undefined){ mat.clearcoat = m.clearcoat; mat.clearcoatRoughness = m.clearcoatRoughness; }
  if(mat.sheen !== undefined){ mat.sheen = m.sheen; mat.sheenColor = new THREE.Color(m.sheenColor); mat.sheenRoughness = m.sheenRoughness; }
  if(mat.transmission !== undefined){ mat.transmission = m.transmission; mat.thickness = m.thickness; mat.ior = m.ior; }
  if(mat.iridescence !== undefined){ mat.iridescence = m.iridescence; mat.iridescenceIOR = m.iridescenceIOR; }
  if(mat.specularIntensity !== undefined){ mat.specularIntensity = m.specularIntensity; mat.specularColor = new THREE.Color(m.specularColor); }
  if(mat.anisotropy !== undefined){ mat.anisotropy = m.anisotropy; mat.anisotropyRotation = m.anisotropyRotation; }
  mat.needsUpdate = true;
}

async function assignTextureSlot(item, slot, fileId, srgb){
  const mat = item.object3d.material;
  if(!mat) return;
  if(!fileId){
    mat[slot] = null; item.material[slot] = null; mat.needsUpdate = true; return;
  }
  const f = findNode(fileId);
  if(!f) return;
  const tex = await getTextureCached(f, srgb);
  if(!tex) return;
  mat[slot] = tex;
  item.material[slot] = fileId;
  mat.needsUpdate = true;
}

/* createObject3D — synchronous, does NOT load external assets */
function createObject3D(def){
  let obj;
  const m = def.material || materialDefaults();

  if(def.type === 'light'){
    obj = new THREE.DirectionalLight(new THREE.Color(m.color), m.intensity);
    obj.castShadow = true;
    obj.shadow.mapSize.set(2048,2048);
    obj.shadow.camera.near = 0.5; obj.shadow.camera.far = 120;
    const d = 25;
    obj.shadow.camera.left = -d; obj.shadow.camera.right = d;
    obj.shadow.camera.top = d; obj.shadow.camera.bottom = -d;
    obj.shadow.bias = -0.0005; obj.shadow.normalBias = 0.02;
    const h = new THREE.DirectionalLightHelper(obj, 0.5, 0xffcc66);
    h.name = '__lh'; helpers.add(h);
    obj.userData.__helper = h;
  } else if(def.type === 'pointLight'){
    obj = new THREE.PointLight(new THREE.Color(m.color), m.intensity, 0, 2);
  } else if(def.type === 'spotLight'){
    obj = new THREE.SpotLight(new THREE.Color(m.color), m.intensity);
  } else if(def.type === 'ambientLight'){
    obj = new THREE.AmbientLight(new THREE.Color(m.color), m.intensity);
  } else if(def.type === 'model'){
    obj = new THREE.Group();
  } else {
    const mat = new THREE.MeshPhysicalMaterial({});
    applyMaterialProps(mat, m);
    obj = new THREE.Mesh((GEOM[def.type] || GEOM.box)(), mat);
    obj.castShadow = true; obj.receiveShadow = true;
  }
  obj.name = def.name;
  obj.position.fromArray(def.position||[0,0,0]);
  obj.rotation.fromArray(def.rotation||[0,0,0]);
  obj.scale.fromArray(def.scale||[1,1,1]);
  obj.visible = def.visible !== false;
  return obj;
}

async function loadModelAsset(item){
  const file = findNode(item.asset);
  if(!file) return;
  const group = item.object3d;
  // Clear previous
  while(group.children.length){
    const c = group.children.pop();
    c.traverse(o => { if(o.isMesh && o.geometry) o.geometry.dispose(); });
  }
  try{
    const loaded = await loadModelByExt(file);
    if(!loaded) throw new Error('Empty result');
    loaded.traverse(o => { if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
    group.add(loaded);
    tagObj(group, item.id);
    // Auto-fit to reasonable scale
    const box = new THREE.Box3().setFromObject(loaded);
    const size = new THREE.Vector3(); box.getSize(size);
    const maxDim = Math.max(size.x, size.y, size.z);
    if(maxDim > 4){
      const s = 2 / maxDim;
      loaded.scale.multiplyScalar(s);
    }
    setStatus('Loaded ' + file.name);
  } catch(err){
    console.error(err);
    toast('Failed to load ' + file.name + ': ' + err.message);
  }
}

/* addObjectFromDef — synchronous for primitives, async for models */
function addObjectFromDef(def, select=true){
  const obj = createObject3D(def);
  scene.add(obj);
  tagObj(obj, def.id);
  const item = {
    id: def.id, name: def.name, type: def.type,
    asset: def.asset || null,
    material: materialDefaults(def.material || {}),
    scripts: (def.scripts||[]).slice(),
    object3d: obj
  };
  state.objects.push(item);

  if(def.type === 'model' && def.asset){
    loadModelAsset(item);
  } else {
    // Re-apply stored textures (async, fire-and-forget)
    ['map','normalMap','roughnessMap','metalnessMap','aoMap','emissiveMap','displacementMap','alphaMap'].forEach(slot => {
      if(item.material[slot]){
        const srgb = slot === 'map' || slot === 'emissiveMap';
        assignTextureSlot(item, slot, item.material[slot], srgb);
      }
    });
  }

  refreshHierarchy();
  updateStatusBar();
  if(select) selectObject(def.id);
  return item;
}

function removeObject(id){
  const idx = state.objects.findIndex(o => o.id === id);
  if(idx < 0) return;
  const item = state.objects[idx];
  if(transform.object === item.object3d) transform.detach();
  if(item.object3d.userData.__helper){
    helpers.remove(item.object3d.userData.__helper);
    if(item.object3d.userData.__helper.dispose) item.object3d.userData.__helper.dispose();
  }
  scene.remove(item.object3d);
  item.object3d.traverse(o => {
    if(o.isMesh){
      if(o.geometry) o.geometry.dispose();
      if(o.material){
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach(m => m.dispose && m.dispose());
      }
    }
  });
  state.objects.splice(idx, 1);
  if(state.selectedId === id) selectObject(null);
  refreshHierarchy();
  updateStatusBar();
  scheduleSave();
}

function selectObject(id){
  state.selectedId = id;
  const item = getItem(id);
  if(item && item.object3d && !state.playing){
    transform.attach(item.object3d);
    transform.enabled = true;
    transform.visible = true;
  } else {
    transform.detach();
  }
  renderInspector();
  refreshHierarchy();
  updateStatusBar();
}

function serializeScene(){
  return state.objects.map(it => ({
    id: it.id, name: it.name, type: it.type, asset: it.asset,
    position: it.object3d.position.toArray(),
    rotation: [it.object3d.rotation.x, it.object3d.rotation.y, it.object3d.rotation.z],
    scale: it.object3d.scale.toArray(),
    visible: it.object3d.visible,
    material: Object.assign({}, it.material),
    scripts: it.scripts.slice()
  }));
}

/* ============ TREE RENDER ============ */
const treeEl = $('#fileTree');
const breadcrumbEl = $('#breadcrumb');
const TREE_PAGE_SIZE = 400;

function renderBreadcrumb(){
  breadcrumbEl.innerHTML = '';
  if(!state.currentFolderId || state.currentFolderId === 'root'){
    const c = document.createElement('span');
    c.className = 'crumb current';
    c.innerHTML = '<svg width="11" height="11"><use href="#i-folder"/></svg>Project';
    breadcrumbEl.appendChild(c);
    return;
  }
  const node = findNode(state.currentFolderId);
  if(!node){ state.currentFolderId = 'root'; return renderBreadcrumb(); }
  const chain = [];
  let cur = node;
  while(cur && cur.id !== 'root'){
    chain.unshift(cur);
    cur = findParent(cur.id);
  }
  const home = document.createElement('span');
  home.className = 'crumb';
  home.innerHTML = '<svg width="11" height="11"><use href="#i-folder"/></svg>Project';
  home.onclick = () => { state.currentFolderId = 'root'; renderTree(); };
  breadcrumbEl.appendChild(home);
  for(const n of chain){
    const s = document.createElement('span');
    s.className = 'sep-c';
    s.textContent = '/';
    breadcrumbEl.appendChild(s);
    const c = document.createElement('span');
    c.className = 'crumb' + (n === node ? ' current' : '');
    c.textContent = n.name;
    c.onclick = () => { state.currentFolderId = n.id; renderTree(); };
    breadcrumbEl.appendChild(c);
  }
}

function renderTree(){
  treeEl.innerHTML = '';
  renderBreadcrumb();
  if(!state.root) return;
  const frag = document.createDocumentFragment();
  const build = (node, depth) => {
    const row = document.createElement('div');
    row.className = 'tree-row' + (node.id === state.selectedFileId ? ' sel' : '');
    row.style.paddingLeft = (4 + depth * 12) + 'px';
    row.dataset.id = node.id;

    if(node.type === 'folder'){
      const arr = document.createElement('span');
      arr.className = 'arrow' + (node.expanded ? ' expanded' : '');
      arr.innerHTML = '<svg width="10" height="10"><use href="#i-chevron-right"/></svg>';
      row.appendChild(arr);
      const ic = document.createElement('span');
      ic.className = 'ic';
      ic.style.color = '#c8a55c';
      ic.innerHTML = `<svg width="14" height="14"><use href="#${node.expanded?'i-folder-open':'i-folder'}"/></svg>`;
      row.appendChild(ic);
      const label = document.createElement('span');
      label.className = 'label'; label.textContent = node.name;
      row.appendChild(label);
      if(node.children && node.children.length){
        const b = document.createElement('span');
        b.className = 'badge'; b.textContent = String(node.children.length);
        row.appendChild(b);
      }
      row.onclick = e => {
        e.stopPropagation();
        node.expanded = !node.expanded;
        state.currentFolderId = node.id;
        state.selectedFileId = node.id;
        renderTree();
      };
      // Folder drop target
      row.addEventListener('pointerenter', () => {
        if(dragState && dragState.node && dragState.node.id !== node.id && !isDescendant(node, dragState.node.id)){
          row.classList.add('drop-target');
        }
      });
      row.addEventListener('pointerleave', () => row.classList.remove('drop-target'));
      row.addEventListener('pointerup', e => {
        if(dragState && dragState.node && row.classList.contains('drop-target')){
          moveIntoFolder(dragState.node, node);
          e.stopPropagation();
        }
      });
      frag.appendChild(row);
      if(node.expanded){
        const kids = node.children || [];
        const showAll = node._showAll || kids.length <= TREE_PAGE_SIZE;
        const shown = showAll ? kids : kids.slice(0, TREE_PAGE_SIZE);
        shown.forEach(c => build(c, depth + 1));
        if(!showAll){
          const more = document.createElement('div');
          more.className = 'tree-row';
          more.style.paddingLeft = (4 + (depth+1) * 12) + 'px';
          more.style.color = 'var(--dim)';
          more.style.fontStyle = 'italic';
          more.textContent = '+ ' + (kids.length - TREE_PAGE_SIZE) + ' more…';
          more.onclick = () => { node._showAll = true; renderTree(); };
          frag.appendChild(more);
        }
      }
    } else {
      const spacer = document.createElement('span');
      spacer.className = 'arrow';
      row.appendChild(spacer);
      const ic = document.createElement('span');
      ic.className = 'ic';
      ic.style.color = KIND_COLOR[node.kind] || '#8a8a92';
      ic.innerHTML = `<svg width="13" height="13"><use href="#${KIND_ICON[node.kind] || 'i-file'}"/></svg>`;
      row.appendChild(ic);
      const label = document.createElement('span');
      label.className = 'label'; label.textContent = node.name;
      row.appendChild(label);
      if(node.size != null && node.size > 0){
        const b = document.createElement('span');
        b.className = 'badge'; b.textContent = fmtBytes(node.size);
        row.appendChild(b);
      }
      row.onclick = e => {
        e.stopPropagation();
        state.selectedFileId = node.id;
        const p = findParent(node.id);
        state.currentFolderId = p ? p.id : 'root';
        renderTree();
        if(isTextKind(node.kind)) openFile(node);
        else if(node.kind === 'texture'){ setRightTab('assets'); renderAssets(); }
      };
      row.addEventListener('dblclick', e => { e.stopPropagation(); quickAddAsset(node); });
      row.addEventListener('pointerdown', e => beginTreeDrag(e, node, row));
      frag.appendChild(row);
    }
  };
  (state.root.children||[]).forEach(c => build(c, 0));
  treeEl.appendChild(frag);
}

function isDescendant(folderNode, maybeChildId){
  let found = false;
  walkAll(folderNode, n => { if(n.id === maybeChildId) found = true; });
  return found;
}

function moveIntoFolder(fileNode, folderNode){
  const oldParent = findParent(fileNode.id);
  if(!oldParent) return;
  // Remove from old
  const i = oldParent.children.indexOf(fileNode);
  if(i >= 0) oldParent.children.splice(i, 1);
  // Add to new
  folderNode.children = folderNode.children || [];
  folderNode.children.push(fileNode);
  folderNode.expanded = true;
  renderTree();
  scheduleSave();
  toast('Moved to ' + folderNode.name);
}

/* ============ DRAG & DROP ============ */
let dragState = null;

function beginTreeDrag(ev, node, row){
  if(ev.button !== undefined && ev.button !== 0) return;
  const startX = ev.clientX, startY = ev.clientY;
  let ghost = null;
  let active = false;

  const move = e => {
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if(!active && Math.hypot(dx, dy) < 6) return;
    if(!active){
      active = true;
      dragState = { node };
      ghost = document.createElement('div');
      ghost.className = 'drag-ghost';
      ghost.textContent = node.name;
      document.body.appendChild(ghost);
      row.classList.add('dragging');
      if(state.mode !== 'scene') setMode('scene');
    }
    ghost.style.left = e.clientX + 'px';
    ghost.style.top = e.clientY + 'px';

    const r = wrap.getBoundingClientRect();
    const over = e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom;
    wrap.classList.toggle('drop-target', over);
    highlightTexSlots(node.kind === 'texture' && !over);

    // Auto-expand folder hover
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const treeRow = el && el.closest('.tree-row');
    if(treeRow && treeRow.dataset.id){
      const target = findNode(treeRow.dataset.id);
      if(target && target.type === 'folder' && target.id !== node.id && !isDescendant(node, target.id)){
        treeRow.classList.add('drop-target');
      }
    }
  };

  const up = e => {
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
    if(ghost) ghost.remove();
    row.classList.remove('dragging');
    wrap.classList.remove('drop-target');
    $$('.tree-row.drop-target').forEach(r => r.classList.remove('drop-target'));
    highlightTexSlots(false);
    const dropped = dragState;
    dragState = null;
    if(!active) return;

    // Viewport drop
    const r = wrap.getBoundingClientRect();
    if(e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom){
      handleViewportDrop(node, e.clientX, e.clientY);
      return;
    }

    // Inspector texture slot
    const el = document.elementFromPoint(e.clientX, e.clientY);
    if(el){
      const slot = el.closest('.tex-slot');
      if(slot && slot.dataset.slot){
        const item = getItem(state.selectedId);
        if(item){
          const srgb = slot.dataset.slot === 'map' || slot.dataset.slot === 'emissiveMap';
          assignTextureSlot(item, slot.dataset.slot, node.id, srgb).then(() => {
            toast('Applied to ' + slot.dataset.slot);
            renderInspector();
          });
        }
        return;
      }
      // Folder drop
      const treeRow = el.closest('.tree-row');
      if(treeRow && treeRow.dataset.id){
        const target = findNode(treeRow.dataset.id);
        if(target && target.type === 'folder' && target.id !== node.id && !isDescendant(node, target.id)){
          moveIntoFolder(node, target);
        }
      }
    }
  };

  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
}

function highlightTexSlots(on){
  $$('.tex-slot').forEach(el => el.classList.toggle('droppable', on));
}

/* ============ VIEWPORT ============ */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);

function toNDC(cx, cy){
  const r = canvas.getBoundingClientRect();
  ndc.x = ((cx - r.left) / r.width) * 2 - 1;
  ndc.y = -((cy - r.top) / r.height) * 2 + 1;
  return ndc;
}

function pickItem(cx, cy){
  raycaster.setFromCamera(toNDC(cx, cy), state.playing ? gameCam : editorCam);
  const roots = state.objects.map(o => o.object3d).filter(o => o && o.visible);
  const hits = raycaster.intersectObjects(roots, true);
  for(const h of hits){
    let n = h.object;
    while(n){
      if(n.userData && n.userData.itemId){
        const it = getItem(n.userData.itemId);
        if(it) return { item: it, point: h.point };
      }
      n = n.parent;
    }
  }
  return null;
}

function groundPoint(cx, cy){
  raycaster.setFromCamera(toNDC(cx, cy), editorCam);
  const p = new THREE.Vector3();
  return raycaster.ray.intersectPlane(groundPlane, p) ? p : new THREE.Vector3(0,0,0);
}

function handleViewportDrop(node, cx, cy){
  if(node.kind === 'model'){
    const p = groundPoint(cx, cy);
    addObjectFromDef({
      id: uid('o'), name: node.name.replace(/\.[^.]+$/, ''), type:'model',
      asset: node.id, position:[p.x, 0, p.z], rotation:[0,0,0], scale:[1,1,1],
      visible:true, material: materialDefaults({}), scripts: []
    });
    toast('Placed ' + node.name);
    return;
  }
  if(node.kind === 'texture'){
    const hit = pickItem(cx, cy);
    if(!hit){ toast('Drop a texture onto a mesh'); return; }
    const slot = guessTextureSlot(node.name);
    const srgb = slot === 'map' || slot === 'emissiveMap';
    assignTextureSlot(hit.item, slot, node.id, srgb).then(() => {
      toast(KIND_LABEL.texture + ' → ' + slot);
      renderInspector();
    });
    return;
  }
  if(node.kind === 'script' || node.kind === 'shader'){
    const hit = pickItem(cx, cy);
    if(!hit){ toast('Drop onto an object'); return; }
    if(hit.item.scripts.indexOf(node.id) < 0) hit.item.scripts.push(node.id);
    toast('Attached ' + node.name + ' → ' + hit.item.name);
    renderInspector();
    scheduleSave();
    return;
  }
  toast('Drop a model, texture, script or shader');
}

function guessTextureSlot(name){
  const n = name.toLowerCase();
  if(/_?normal|_nrm|_n\.|_norm/.test(n)) return 'normalMap';
  if(/rough/.test(n)) return 'roughnessMap';
  if(/metal/.test(n)) return 'metalnessMap';
  if(/[_\-\b]ao\b|occlusion/.test(n)) return 'aoMap';
  if(/emiss|glow/.test(n)) return 'emissiveMap';
  if(/height|disp/.test(n)) return 'displacementMap';
  if(/alpha|opac|mask/.test(n)) return 'alphaMap';
  return 'map';
}

/* ============ SMART MATERIAL LINK ============ */
async function smartLink(){
  const item = getItem(state.selectedId);
  if(!item){ toast('Select an object first'); return; }
  if(/light/i.test(item.type)){ toast('Cannot link on lights'); return; }
  const allTex = allFiles().filter(f => f.kind === 'texture');
  if(!allTex.length){ toast('No textures in project'); return; }

  const scores = { map:null, normalMap:null, roughnessMap:null, metalnessMap:null, aoMap:null, emissiveMap:null, displacementMap:null, alphaMap:null };
  const baseName = item.name.toLowerCase().split(/[\s_-]/)[0];
  let hits = 0;

  for(const f of allTex){
    const fn = f.name.toLowerCase();
    const slot = guessTextureSlot(f.name);
    const sharesName = baseName.length >= 3 && fn.includes(baseName);
    if(sharesName && scores[slot] == null) scores[slot] = f;
    else if(scores[slot] == null) scores[slot] = f;
  }

  for(const slot of Object.keys(scores)){
    if(scores[slot]){
      const srgb = slot === 'map' || slot === 'emissiveMap';
      await assignTextureSlot(item, slot, scores[slot].id, srgb);
      hits++;
    }
  }
  renderInspector();
  toast(hits ? 'Linked ' + hits + ' maps to ' + item.name : 'No matching textures');
  scheduleSave();
}

/* ============ HIERARCHY ============ */
const hierEl = $('#hierarchy');
const TYPE_ICON = { box:'i-cube', sphere:'i-cube', plane:'i-cube', cylinder:'i-cube', cone:'i-cube', torus:'i-cube',
  capsule:'i-cube', ring:'i-cube', icosahedron:'i-cube', dodecahedron:'i-cube', octahedron:'i-cube', tetrahedron:'i-cube',
  torusKnot:'i-cube', model:'i-cube', light:'i-sun', pointLight:'i-point', spotLight:'i-sun', ambientLight:'i-sun' };

function refreshHierarchy(){
  hierEl.innerHTML = '';
  if(!state.objects.length){
    hierEl.innerHTML = '<div class="empty">No objects in scene</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  for(const item of state.objects){
    const row = document.createElement('div');
    row.className = 'hier-row' + (item.id === state.selectedId ? ' sel' : '');
    const ic = document.createElement('span');
    ic.className = 'ic';
    ic.innerHTML = `<svg width="13" height="13"><use href="#${TYPE_ICON[item.type] || 'i-cube'}"/></svg>`;
    row.appendChild(ic);
    const label = document.createElement('span');
    label.className = 'label'; label.textContent = item.name;
    row.appendChild(label);

    const vis = document.createElement('button');
    vis.className = 'act' + (item.object3d.visible ? ' on' : '');
    vis.title = 'Toggle visibility';
    vis.innerHTML = `<svg width="13" height="13"><use href="#${item.object3d.visible?'i-eye':'i-eye-off'}"/></svg>`;
    vis.onclick = e => {
      e.stopPropagation();
      item.object3d.visible = !item.object3d.visible;
      refreshHierarchy();
      scheduleSave();
    };
    row.appendChild(vis);

    const sc = document.createElement('button');
    sc.className = 'act';
    sc.title = 'Scripts';
    sc.innerHTML = `<svg width="13" height="13"><use href="#i-code"/></svg>`;
    sc.onclick = e => { e.stopPropagation(); selectObject(item.id); openScriptModal(item); };
    row.appendChild(sc);

    row.onclick = () => selectObject(item.id);
    frag.appendChild(row);
  }
  hierEl.appendChild(frag);
}

function openScriptModal(item){
  const scripts = allFiles().filter(f => f.kind === 'script' || f.kind === 'shader');
  let html = '<p>Attach script/shader to <b>' + esc(item.name) + '</b></p>';
  if(!scripts.length){
    html += '<p style="color:var(--dim-2)">No scripts. Create one in the Explorer.</p>';
  } else {
    html += '<div class="chip-list" style="padding:0">';
    for(const s of scripts){
      const on = item.scripts.indexOf(s.id) >= 0;
      html += `<div class="chip" data-sid="${s.id}" style="cursor:pointer;${on?'border-color:var(--accent)':''}">
        <span style="width:6px;height:6px;border-radius:2px;background:${KIND_COLOR[s.kind]}"></span>${esc(s.name)}${on?' ✓':''}
      </div>`;
    }
    html += '</div>';
  }
  showModal('Scripts — ' + item.name, html, [
    { label:'New Script', action: () => { createScriptFor(item); return false; } },
    { label:'Close' }
  ]);
  $$('#modalBody .chip').forEach(chip => {
    chip.onclick = () => {
      const sid = chip.dataset.sid;
      const i = item.scripts.indexOf(sid);
      if(i >= 0) item.scripts.splice(i, 1);
      else item.scripts.push(sid);
      scheduleSave();
      renderInspector();
      openScriptModal(item);
    };
  });
}

function createScriptFor(item){
  const name = prompt('Script name:', (item.name.replace(/\s+/g,'_') || 'script') + '.js');
  if(!name) return false;
  const fn = /\.[a-z]+$/i.test(name) ? name : name + '.js';
  const folder = ensureFolder(['Scripts']);
  const node = makeFile(fn, kindOf(fn), `let t = 0;\n\nfunction init(ctx){\n  // runs once\n}\n\nfunction update(ctx, dt){\n  t += dt;\n  // ctx.object.rotation.y += dt * 0.5;\n}\n`);
  folder.children.push(node);
  FileStore.put(node.id, node.data);
  item.scripts.push(node.id);
  closeModal();
  renderTree();
  renderInspector();
  openFile(node);
  scheduleSave();
  return false;
}

/* ============ INSPECTOR ============ */
const inspectorEl = $('#inspector');
const groupCollapse = new Set();

function inspGroup(title, key){
  const g = document.createElement('div');
  g.className = 'insp-group' + (groupCollapse.has(key) ? ' collapsed' : '');
  const h = document.createElement('h4');
  h.innerHTML = esc(title) + '<span class="caret"><svg width="10" height="10"><use href="#i-chevron-down"/></svg></span>';
  h.onclick = () => {
    if(groupCollapse.has(key)) groupCollapse.delete(key);
    else groupCollapse.add(key);
    g.classList.toggle('collapsed');
  };
  g.appendChild(h);
  const body = document.createElement('div');
  body.className = 'insp-group-body';
  g.appendChild(body);
  g._body = body;
  return g;
}

function rowEl(label, ctl){
  const r = document.createElement('div');
  r.className = 'row';
  if(label != null){
    const l = document.createElement('label');
    l.textContent = label;
    l.title = label;
    r.appendChild(l);
  }
  const c = document.createElement('div');
  c.className = 'ctl';
  if(ctl) c.appendChild(ctl);
  r.appendChild(c);
  return r;
}

function vec3Inputs(vec, opts){
  opts = opts || {};
  const deg = !!opts.deg;
  const scale = deg ? 180/Math.PI : 1;
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;gap:4px;width:100%';
  ['X','Y','Z'].forEach((ax, i) => {
    const inp = document.createElement('input');
    inp.type = 'number';
    inp.step = opts.step || 0.1;
    inp.value = fmt(vec.getComponent(i) * scale);
    inp.dataset.vec = opts.key;
    inp.dataset.axis = i;
    inp.dataset.deg = deg ? '1' : '0';
    inp.title = ax;
    inp.addEventListener('input', () => {
      const v = parseFloat(inp.value);
      if(isNaN(v)) return;
      vec.setComponent(i, deg ? v * Math.PI/180 : v);
      scheduleSave();
    });
    wrap.appendChild(inp);
  });
  return wrap;
}

function sliderInput(value, min, max, step, onChange){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;align-items:center;gap:6px;width:100%';
  const r = document.createElement('input');
  r.type = 'range'; r.min = min; r.max = max; r.step = step; r.value = value;
  const v = document.createElement('span');
  v.className = 'slider-val'; v.textContent = (+value).toFixed(2);
  r.addEventListener('input', () => {
    const n = parseFloat(r.value);
    v.textContent = n.toFixed(2);
    onChange(n);
  });
  wrap.appendChild(r); wrap.appendChild(v);
  return wrap;
}

function colorInput(value, onChange){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;align-items:center;gap:6px;width:100%';
  const c = document.createElement('input');
  c.type = 'color'; c.value = value || '#ffffff';
  const t = document.createElement('input');
  t.type = 'text'; t.value = (value || '#ffffff').toUpperCase();
  t.style.flex = '1';
  c.addEventListener('input', () => { t.value = c.value.toUpperCase(); onChange(c.value); });
  t.addEventListener('change', () => {
    if(/^#[0-9a-f]{6}$/i.test(t.value)){ c.value = t.value; onChange(t.value); }
  });
  wrap.appendChild(c); wrap.appendChild(t);
  return wrap;
}

function toggleInput(value, onChange){
  const lbl = document.createElement('label');
  lbl.className = 'chk';
  const inp = document.createElement('input');
  inp.type = 'checkbox'; inp.checked = !!value;
  inp.addEventListener('change', () => onChange(inp.checked));
  lbl.appendChild(inp);
  return lbl;
}

function textureSlotRow(item, slot, label){
  const fileId = item.material[slot];
  const fileNode = fileId ? findNode(fileId) : null;
  const wrap = document.createElement('div');
  wrap.className = 'tex-slot';
  wrap.dataset.slot = slot;
  const thumb = document.createElement('div');
  thumb.className = 'thumb';
  if(fileNode){
    if(fileNode.data && typeof fileNode.data === 'string' && fileNode.data.startsWith('data:image')){
      thumb.style.backgroundImage = 'url(' + fileNode.data + ')';
    } else {
      // Async load from IndexedDB
      FileStore.getURL(fileNode.id).then(u => {
        if(u && /^(data:image|blob:)/.test(u)) thumb.style.backgroundImage = 'url(' + u + ')';
        else thumb.innerHTML = '<svg width="14" height="14"><use href="#i-image"/></svg>';
      });
    }
  } else {
    thumb.innerHTML = '<svg width="14" height="14"><use href="#i-image"/></svg>';
  }
  wrap.appendChild(thumb);
  const meta = document.createElement('div');
  meta.className = 'meta';
  const n = document.createElement('span');
  n.className = 'n'; n.textContent = label;
  const v = document.createElement('span');
  v.className = 'v' + (fileNode ? '' : ' empty');
  v.textContent = fileNode ? fileNode.name : 'None';
  meta.appendChild(n); meta.appendChild(v);
  wrap.appendChild(meta);
  const clr = document.createElement('button');
  clr.className = 'clr'; clr.title = 'Clear';
  clr.innerHTML = '<svg width="12" height="12"><use href="#i-x"/></svg>';
  clr.onclick = () => { assignTextureSlot(item, slot, null).then(renderInspector); scheduleSave(); };
  wrap.appendChild(clr);
  return wrap;
}

function renderInspector(){
  inspectorEl.innerHTML = '';
  const item = getItem(state.selectedId);
  if(!item){
    inspectorEl.innerHTML = '<div class="empty">No selection<br><br>Select an object in the Hierarchy,<br>or drag a model into the viewport.</div>';
    return;
  }

  const h = document.createElement('div');
  h.className = 'insp-header';
  const dot = document.createElement('span'); dot.className = 'dot';
  h.appendChild(dot);
  const nm = document.createElement('span'); nm.className = 'name'; nm.textContent = item.name;
  h.appendChild(nm);
  const k = document.createElement('span'); k.className = 'kind'; k.textContent = item.type;
  h.appendChild(k);
  inspectorEl.appendChild(h);

  const g = inspGroup('Object', 'object');
  const nameInp = document.createElement('input');
  nameInp.type = 'text'; nameInp.value = item.name;
  nameInp.addEventListener('input', () => {
    item.name = nameInp.value || 'Object';
    item.object3d.name = item.name;
    refreshHierarchy();
    scheduleSave();
  });
  g._body.appendChild(rowEl('Name', nameInp));
  g._body.appendChild(rowEl('Visible', toggleInput(item.object3d.visible, v => {
    item.object3d.visible = v;
    refreshHierarchy();
    scheduleSave();
  })));
  inspectorEl.appendChild(g);

  const tr = inspGroup('Transform', 'transform');
  tr._body.appendChild(rowEl('Position', vec3Inputs(item.object3d.position, { key:'position', step:0.1 })));
  tr._body.appendChild(rowEl('Rotation', vec3Inputs(item.object3d.rotation, { key:'rotation', step:1, deg:true })));
  tr._body.appendChild(rowEl('Scale', vec3Inputs(item.object3d.scale, { key:'scale', step:0.1 })));
  const resetBtn = document.createElement('button');
  resetBtn.className = 'tb-btn'; resetBtn.textContent = 'Reset';
  resetBtn.onclick = () => {
    item.object3d.position.set(0,0,0);
    item.object3d.rotation.set(0,0,0);
    item.object3d.scale.set(1,1,1);
    renderInspector(); scheduleSave();
  };
  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row'; btnRow.appendChild(resetBtn);
  tr._body.appendChild(btnRow);
  inspectorEl.appendChild(tr);

  if(/light/i.test(item.type)){
    const li = inspGroup('Light', 'light');
    li._body.appendChild(rowEl('Color', colorInput(item.material.color, v => {
      item.material.color = v; item.object3d.color.set(v); scheduleSave();
    })));
    li._body.appendChild(rowEl('Intensity', sliderInput(item.material.intensity, 0, 12, 0.05, v => {
      item.material.intensity = v; item.object3d.intensity = v; scheduleSave();
    })));
    if(item.type === 'light' || item.type === 'spotLight'){
      li._body.appendChild(rowEl('Cast Shadow', toggleInput(item.object3d.castShadow !== false, v => {
        item.object3d.castShadow = v; scheduleSave();
      })));
    }
    inspectorEl.appendChild(li);
  }

  if(!/light/i.test(item.type)){
    const mat = item.object3d.material;
    const ms = inspGroup('Material', 'material');
    const set = (key, apply) => v => {
      item.material[key] = v;
      if(apply) apply(v);
      if(mat) mat.needsUpdate = true;
      scheduleSave();
    };

    ms._body.appendChild(rowEl('Base Color', colorInput(item.material.color, set('color', v => mat.color.set(v)))));
    ms._body.appendChild(rowEl('Metalness', sliderInput(item.material.metalness, 0, 1, 0.01, set('metalness', v => mat.metalness = v))));
    ms._body.appendChild(rowEl('Roughness', sliderInput(item.material.roughness, 0, 1, 0.01, set('roughness', v => mat.roughness = v))));
    ms._body.appendChild(rowEl('Opacity', sliderInput(item.material.opacity, 0, 1, 0.01, set('opacity', v => { mat.opacity = v; mat.transparent = v < 1; }))));
    ms._body.appendChild(rowEl('Emissive', colorInput(item.material.emissive, set('emissive', v => mat.emissive.set(v)))));
    ms._body.appendChild(rowEl('Emissive Int.', sliderInput(item.material.emissiveIntensity, 0, 5, 0.01, set('emissiveIntensity', v => mat.emissiveIntensity = v))));
    ms._body.appendChild(rowEl('Env Intensity', sliderInput(item.material.envMapIntensity, 0, 4, 0.01, set('envMapIntensity', v => mat.envMapIntensity = v))));
    ms._body.appendChild(rowEl('Wireframe', toggleInput(item.material.wireframe, set('wireframe', v => mat.wireframe = v))));
    ms._body.appendChild(rowEl('Flat Shading', toggleInput(item.material.flatShading, set('flatShading', v => { mat.flatShading = v; mat.needsUpdate = true; }))));
    ms._body.appendChild(rowEl('Depth Write', toggleInput(item.material.depthWrite, set('depthWrite', v => mat.depthWrite = v))));
    ms._body.appendChild(rowEl('Depth Test', toggleInput(item.material.depthTest, set('depthTest', v => mat.depthTest = v))));
    ms._body.appendChild(rowEl('Alpha Test', sliderInput(item.material.alphaTest, 0, 1, 0.01, set('alphaTest', v => mat.alphaTest = v))));

    const sideSel = document.createElement('select');
    ['front','double'].forEach(s => {
      const o = document.createElement('option');
      o.value = s; o.textContent = s === 'front' ? 'Front' : 'Double';
      if(item.material.side === s) o.selected = true;
      sideSel.appendChild(o);
    });
    sideSel.onchange = () => set('side', v => mat.side = v === 'double' ? THREE.DoubleSide : THREE.FrontSide)(sideSel.value);
    ms._body.appendChild(rowEl('Sides', sideSel));
    inspectorEl.appendChild(ms);

    const ph = inspGroup('Physical', 'physical');
    ph._body.appendChild(rowEl('Clearcoat', sliderInput(item.material.clearcoat, 0, 1, 0.01, set('clearcoat', v => { if(mat.clearcoat !== undefined) mat.clearcoat = v; }))));
    ph._body.appendChild(rowEl('Clearcoat Rough', sliderInput(item.material.clearcoatRoughness, 0, 1, 0.01, set('clearcoatRoughness', v => { if(mat.clearcoatRoughness !== undefined) mat.clearcoatRoughness = v; }))));
