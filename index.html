/* ============ RENDER LOOP ============ */
let fpsAcc = 0, fpsFrames = 0, fpsValue = 0;
let lastT = performance.now();
const clock = new THREE.Clock();
let playTime = 0;

function loop(){
  const now = performance.now();
  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;

  fpsAcc += dt; fpsFrames++;
  if(fpsAcc >= 0.4){
    fpsValue = Math.round(fpsFrames / fpsAcc);
    fpsAcc = 0; fpsFrames = 0;
    $('#hudFps').textContent = fpsValue + ' fps';
    $('#playStats').textContent = fpsValue + ' fps';
  }

  if(state.playing){ playTime += dt; runScriptUpdates(dt, playTime); }

  controls.update();

  for(const it of state.objects){
    const h = it.object3d.userData.__helper;
    if(h && h.update) h.update();
  }

  renderer.render(scene, state.playing ? gameCam : editorCam);
}
renderer.setAnimationLoop(loop);

/* ============ SCRIPT RUNTIME ============ */
let scriptInstances = [];
const keyState = {};
window.addEventListener('keydown', e => { keyState[e.key] = true; });
window.addEventListener('keyup', e => { keyState[e.key] = false; });

function makeCtx(item){
  return {
    object: item.object3d, scene, camera: gameCam, renderer, THREE,
    input: { keys: keyState, isDown: k => !!keyState[k] },
    time: 0, delta: 0,
    find: name => scene.getObjectByName(name)
  };
}

async function startScripts(){
  scriptInstances = [];
  for(const item of state.objects){
    for(const sid of (item.scripts||[])){
      const f = findNode(sid);
      if(!f) continue;
      if(f.kind === 'shader') continue;
      const data = await getFileData(f.id);
      if(!data) continue;
      try{
        const factory = new Function('ctx', 'THREE',
          '"use strict";\n' + data +
          '\n;return { init: (typeof init === "function") ? init : null, update: (typeof update === "function") ? update : null };');
        const mod = factory(makeCtx(item), THREE);
        const inst = { item, mod, ctx: makeCtx(item) };
        scriptInstances.push(inst);
        if(mod.init) mod.init(inst.ctx);
      } catch(err){
        console.error('Script error in ' + f.name, err);
        toast('Script error: ' + f.name);
      }
    }
  }
  if(scriptInstances.length) setStatus('Running ' + scriptInstances.length + ' script(s)');
}

function runScriptUpdates(dt, t){
  for(const inst of scriptInstances){
    inst.ctx.time = t;
    inst.ctx.delta = dt;
    if(inst.mod.update){
      try{ inst.mod.update(inst.ctx, dt); }
      catch(e){ console.error(e); }
    }
  }
}

          if(ids.includes(o.scripts[k])){ o.scripts.splice(k, 1); changed = true; }
        }
        if(ids.includes(o.asset)) o.asset = null;

/* ============ IMPORT ============ */
const fileInput = $('#fileInput');
$('#btnImport').onclick = () => fileInput.click();
$('#btnImport2').onclick = () => fileInput.click();

function readAsText(f){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(f); }); }
function readAsDataURL(f){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); }); }

fileInput.addEventListener('change', async () => {
  const files = Array.prototype.slice.call(fileInput.files || []);
  if(!files.length) return;
  setStatus('Importing ' + files.length + ' file(s)…');
  for(const f of files){
    const kind = kindOf(f.name);
    const textKind = isTextKind(kind);
    let data;
    try {
      data = textKind ? await readAsText(f) : await readAsDataURL(f);
    } catch(err){
      console.error(err); toast('Could not read ' + f.name); continue;
    }
    const node = {
      id: uid('f'), type:'file', name: f.name, kind,
      binary: !textKind, size: f.size,
      data: textKind ? data : undefined
    };
    const folder = folderForKind(kind);
    folder.children.push(node);
    folder.expanded = true;
    // Store in IndexedDB
    if(textKind) FileStore.put(node.id, data);
    else {
      // Store blob directly (more efficient than data URL for large files)
      await FileStore.put(node.id, f);
      // Keep small data URL for previews
      if(f.size < 2_000_000) node.data = data;
    }
  }
  fileInput.value = '';
  renderTree(); renderAssets(); renderShaders();
  scheduleSave();
  toast('Imported ' + files.length + ' file(s)');
  setStatus('Import complete');
});

/* ============ PERSISTENCE ============ */
let _saveT = null;
function scheduleSave(){
  state.dirty = true;
  clearTimeout(_saveT);
  _saveT = setTimeout(persist, 800);
}

function persist(){
  try {
    const meta = { v: 2, name: state.projectName, tree: state.root, scene: serializeScene() };
    FileStore.saveMeta(meta);
  } catch(err){ console.warn('Persist failed', err); }
  updateStatusBar();
}

async function boot(){
  try { await FileStore.init(); } catch(e){ console.warn('IndexedDB unavailable', e); }

  let meta = null;
  try { meta = await FileStore.loadMeta(); } catch(e){}

  if(meta && meta.tree && meta.scene){
    state.projectName = meta.name || 'UntitledProject';
    state.root = meta.tree;
    // Load text file data for open tabs
    // (data is lazy-loaded on demand)
    for(const def of meta.scene){
      def.material = materialDefaults(def.material || {});
      addObjectFromDef(def, false);
    }
    setStatus('Project restored');
  } else {
    state.root = defaultProject();
    for(const def of defaultScene()){
      addObjectFromDef(def, false);
    }
    setStatus('New project');
  }

  renderTree();
  renderAssets();
  renderShaders();
  refreshHierarchy();
  if(state.objects[1]) selectObject(state.objects[1].id);

  // Auto-open first script
  const firstScript = allFiles().find(f => f.kind === 'script');
  if(firstScript){
    // Load its data first
    const d = await FileStore.get(firstScript.id);
    if(d != null) firstScript.data = d;
    state.selectedFileId = firstScript.id;
    state.activeShaderId = (allFiles().find(f => f.kind === 'shader')||{}).id;
    renderTree();
  }

  resizeAll();
  renderInspector();
  updateStatusBar();

  if(window.innerWidth < 900 && window.innerHeight > window.innerWidth){
    $('#right').classList.add('collapsed');
  }
  setTimeout(resizeAll, 200);
}

function updateStatusBar(){
  const tris = renderer.info && renderer.info.render ? renderer.info.render.triangles : 0;
  $('#hudStats').textContent = tris.toLocaleString() + ' tris';
  $('#statusObjs').textContent = state.objects.length + ' object' + (state.objects.length === 1 ? '' : 's');
  const item = getItem(state.selectedId);
  $('#statusSel').textContent = item ? item.name : '—';
  let files = 0, bytes = 0;
  walkFiles(state.root, f => { files++; bytes += (f.size || (f.data ? f.data.length : 0)); });
  $('#statusMem').textContent = files + ' files · ' + fmtBytes(bytes);
}

/* ============ EXPORT: STANDALONE HTML ============ */
async function buildStandaloneHTML(){
  const runtimeSrc = `import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

const DATA = JSON.parse(document.getElementById('gd-data').textContent);
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fb8d9);
scene.fog = new THREE.Fog(0x9fc2dd, 40, 120);

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 4000);
camera.position.set(7, 5.5, 9);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.09;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 0.5; controls.maxDistance = 500;

const hemi = new THREE.HemisphereLight(0xbfd9f0, 0x6b7a5a, 0.85);
scene.add(hemi);

const gltfLoader = new GLTFLoader();
const objLoader = new OBJLoader();
const fbxLoader = new FBXLoader();
const texLoader = new THREE.TextureLoader();
const texCache = {};

function loadTex(id, srgb){
  if(!id) return null;
  const key = id + (srgb?'_s':'_l');
  if(texCache[key]) return texCache[key];
  const f = DATA.files[id];
  if(!f) return null;
  const t = texLoader.load(f.data);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  texCache[key] = t;
  return t;
}

function geom(type){
  switch(type){
    case 'sphere': return new THREE.SphereGeometry(0.5, 40, 28);
    case 'plane': return new THREE.PlaneGeometry(1,1,20,20);
    case 'cylinder': return new THREE.CylinderGeometry(0.5,0.5,1,32);
    case 'cone': return new THREE.ConeGeometry(0.5,1,32);
    case 'torus': return new THREE.TorusGeometry(0.4,0.16,24,48);
    case 'capsule': return new THREE.CapsuleGeometry(0.35,0.5,6,16);
    case 'ring': return new THREE.RingGeometry(0.25,0.5,40);
    case 'icosahedron': return new THREE.IcosahedronGeometry(0.5,0);
    case 'dodecahedron': return new THREE.DodecahedronGeometry(0.5,0);
    case 'octahedron': return new THREE.OctahedronGeometry(0.5,0);
    case 'tetrahedron': return new THREE.TetrahedronGeometry(0.5,0);
    case 'torusKnot': return new THREE.TorusKnotGeometry(0.35,0.1,80,12);
    default: return new THREE.BoxGeometry(1,1,1,4,4,4);
  }
}

async function buildScene(){
  const built = {};
  for(const def of (DATA.scene||[])){
    let obj;
    if(def.type === 'light'){
      obj = new THREE.DirectionalLight(new THREE.Color(def.material.color), def.material.intensity);
      obj.castShadow = true;
      obj.shadow.mapSize.set(2048,2048);
      const d = 25;
      obj.shadow.camera.left = -d; obj.shadow.camera.right = d;
      obj.shadow.camera.top = d; obj.shadow.camera.bottom = -d;
    } else if(def.type === 'pointLight'){
      obj = new THREE.PointLight(new THREE.Color(def.material.color), def.material.intensity, 0, 2);
    } else if(def.type === 'model'){
      obj = new THREE.Group();
      const f = DATA.files[def.asset];
      if(f){
        try{
          const ext = (f.name.split('.').pop()||'').toLowerCase();
          let loaded = null;
          if(ext === 'glb' || ext === 'gltf'){ loaded = (await gltfLoader.loadAsync(f.data)).scene; }
          else if(ext === 'obj'){ loaded = await objLoader.loadAsync(f.data); }
          else if(ext === 'fbx'){ loaded = await fbxLoader.loadAsync(f.data); }
          if(loaded){
            loaded.traverse(o => { if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
            obj.add(loaded);
          }
        } catch(e){ console.warn(e); }
      }
    } else {
      const m = def.material;
      const mat = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(m.color), metalness: m.metalness, roughness: m.roughness,
        opacity: m.opacity, transparent: m.transparent || m.opacity < 1,
        emissive: new THREE.Color(m.emissive), emissiveIntensity: m.emissiveIntensity,
        wireframe: m.wireframe, flatShading: m.flatShading,
        side: m.side === 'double' ? THREE.DoubleSide : THREE.FrontSide,
        depthWrite: m.depthWrite, depthTest: m.depthTest,
        alphaTest: m.alphaTest, envMapIntensity: m.envMapIntensity,
        clearcoat: m.clearcoat, clearcoatRoughness: m.clearcoatRoughness,
        sheen: m.sheen, sheenRoughness: m.sheenRoughness,
        transmission: m.transmission, thickness: m.thickness, ior: m.ior,
        iridescence: m.iridescence, iridescenceIOR: m.iridescenceIOR,
        specularIntensity: m.specularIntensity,
        anisotropy: m.anisotropy, anisotropyRotation: m.anisotropyRotation
      });
      const map = loadTex(m.map, true); if(map) mat.map = map;
      const nrm = loadTex(m.normalMap, false); if(nrm) mat.normalMap = nrm;
      const rgh = loadTex(m.roughnessMap, false); if(rgh) mat.roughnessMap = rgh;
      const mtl = loadTex(m.metalnessMap, false); if(mtl) mat.metalnessMap = mtl;
      const ao = loadTex(m.aoMap, false); if(ao) mat.aoMap = ao;
      const em = loadTex(m.emissiveMap, true); if(em) mat.emissiveMap = em;
      obj = new THREE.Mesh(geom(def.type), mat);
      obj.castShadow = true; obj.receiveShadow = true;
    }
    if(!obj) continue;
    obj.name = def.name;
    obj.position.fromArray(def.position);
    obj.rotation.fromArray(def.rotation);
    obj.scale.fromArray(def.scale);
    obj.visible = def.visible !== false;
    obj.userData.__id = def.id;
    scene.add(obj);
    built[def.id] = obj;
  }
  return built;
}

const instances = [];
const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

function makeCtx(obj){
  return {
    object: obj, scene, camera, renderer, THREE,
    input: { keys, isDown: k => !!keys[k] },
    time: 0, delta: 0,
    find: n => scene.getObjectByName(n)
  };
}

async function runScripts(built){
  for(const def of (DATA.scene||[])){
    if(!def.scripts || !def.scripts.length) continue;
    const obj = built[def.id];
    if(!obj) continue;
    for(const sid of def.scripts){
      const f = DATA.files[sid];
      if(!f || !f.data) continue;
      if(f.kind === 'shader') continue;
      try{
        const factory = new Function('ctx','THREE',
          '"use strict";\\n' + f.data +
          '\\n;return { init: (typeof init === "function") ? init : null, update: (typeof update === "function") ? update : null };');
        const mod = factory(makeCtx(obj), THREE);
        const inst = { obj, mod, ctx: makeCtx(obj) };
        instances.push(inst);
        if(mod.init) mod.init(inst.ctx);
      } catch(e){ console.error(e); }
    }
  }
}

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

const clock = new THREE.Clock();
let elapsed = 0;
function animate(){
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  for(const inst of instances){
    inst.ctx.time = elapsed;
    inst.ctx.delta = dt;
    if(inst.mod.update){ try{ inst.mod.update(inst.ctx, dt); } catch(e){ console.error(e); } }
  }
  controls.update();
  renderer.render(scene, camera);
}

(async () => {
  resize();
  const built = await buildScene();
  await runScripts(built);
  renderer.setAnimationLoop(animate);
  window.__FORGE_READY__ = true;
})();
`;

  // Collect file data
  const filesOut = {};
  const allF = allFiles();
  for(const f of allF){
    let data = f.data;
    if(data == null){
      const d = await FileStore.get(f.id);
      if(d instanceof Blob){
        data = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(d); });
      } else {
        data = d;
      }
    }
    filesOut[f.id] = { name: f.name, kind: f.kind, data };
  }

  const payload = { name: state.projectName, generator: 'Forge', three: '0.160.0', scene: serializeScene(), files: filesOut };
  const json = JSON.stringify(payload).replace(/</g, '\\u003c');
  const title = esc(state.projectName);

  return `<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>${title}</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#17171a}
#c{display:block;width:100vw;height:100vh;height:100dvh;touch-action:none}
#loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#8a8a92;
background:#17171a;transition:opacity .35s;letter-spacing:.3px}
#loader.gone{opacity:0;pointer-events:none}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}<\/script>
</head><body>
<canvas id="c"></canvas>
<div id="loader">Loading…</div>
<script id="gd-data" type="application/json">${json}<\/script>
<script type="module">${runtimeSrc}<\/script>
<script>(function(){var l=document.getElementById('loader');var t=setInterval(function(){if(window.__FORGE_READY__){l.classList.add('gone');clearInterval(t);setTimeout(function(){l.remove();},400);}},120);setTimeout(function(){clearInterval(t);},9000);})();<\/script>
</body></html>`;
}

async function download(filename, content, mime){
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime || 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 3000);
}

/* ============ ZIP EXPORT ============ */
const CRC = (() => { const t = new Uint32Array(256); for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; } return t; })();
function crc32(buf){ let c = 0xFFFFFFFF; for(let i = 0; i < buf.length; i++) c = CRC[(c ^ buf[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

function buildZip(entries){
  const enc = new TextEncoder();
  const chunks = [];
  const central = [];
  let offset = 0;
  for(const e of entries){
    const nameBytes = enc.encode(e.name);
    const data = e.data;
    const crc = crc32(data);
    const local = new Uint8Array(30 + nameBytes.length);
    const dv = new DataView(local.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0x0800, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, data.length, true);
    dv.setUint32(22, data.length, true);
    dv.setUint16(26, nameBytes.length, true);
    local.set(nameBytes, 30);
    chunks.push(local, data);
    const cd = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint32(42, offset, true);
    cd.set(nameBytes, 46);
    central.push(cd);
    offset += local.length + data.length;
  }
  let centralSize = 0;
  central.forEach(c => centralSize += c.length);
  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, entries.length, true);
  ev.setUint16(10, entries.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, offset, true);
  return new Blob([...chunks, ...central, end], { type: 'application/zip' });
}

function dataURLToBytes(durl){
  const i = durl.indexOf(',');
  const b64 = durl.slice(i+1);
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
  return arr;
}

async function bytesOfFile(node){
  let data = node.data;
  if(data == null){
    const d = await FileStore.get(node.id);
    if(d instanceof Blob){
      return new Uint8Array(await d.arrayBuffer());
    }
    data = d;
  }
  if(typeof data === 'string' && data.startsWith('data:')) return dataURLToBytes(data);
  if(typeof data === 'string') return new TextEncoder().encode(data);
  if(data instanceof Blob) return new Uint8Array(await data.arrayBuffer());
  return new Uint8Array(0);
}

const safeName = s => String(s).replace(/[^a-zA-Z0-9._-]/g, '_');

$('#btnExportZip').onclick = async () => {
  setStatus('Building ZIP…');
  const enc = new TextEncoder();
  const entries = [];
  entries.push({ name: 'index.html', data: enc.encode(await buildStandaloneHTML()) });
  const proj = { name: state.projectName, version: 2, scene: serializeScene(), tree: state.root };
  entries.push({ name: 'project.json', data: enc.encode(JSON.stringify(proj, null, 2)) });

  const folderMap = { model:'assets/models', texture:'assets/textures', audio:'assets/audio', video:'assets/video', font:'assets/fonts', script:'scripts', shader:'shaders', html:'src', css:'src/styles', json:'src/data', text:'src' };

  for(const f of allFiles()){
    const dir = folderMap[f.kind] || 'assets/misc';
    const data = await bytesOfFile(f);
    entries.push({ name: dir + '/' + safeName(f.name), data });
  }
  const blob = buildZip(entries);
  await download(safeName(state.projectName || 'project') + '.zip', blob, 'application/zip');
  toast('Exported ' + entries.length + ' files');
  setStatus('ZIP export complete');
};
