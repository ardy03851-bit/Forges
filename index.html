<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0b0d">
<title>Forge</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
:root{
  --bg:#0b0b0d;--panel:#131316;--panel-2:#19191c;--panel-3:#202024;
  --border:#25252a;--border-2:#2f2f35;--border-3:#3a3a42;
  --text:#d8d8dc;--text-2:#a0a0a8;--dim:#6e6e77;--dim-2:#4a4a52;
  --accent:#4a9eff;--accent-2:#2a7fd4;--accent-glow:rgba(74,158,255,.22);
  --green:#4ade80;--amber:#f5b942;--red:#f0776c;--purple:#b68cf0;--cyan:#4fd1c5;--orange:#e59966;
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --tb:42px;--sb:22px;--rad:4px;
  --hi:inset 0 1px 0 rgba(255,255,255,.045);
  --sh-1:0 1px 2px rgba(0,0,0,.35);
  --sh-2:0 2px 6px rgba(0,0,0,.4);
  --sh-3:0 8px 24px rgba(0,0,0,.5);
}
body{background:var(--bg);color:var(--text);font:13px/1.4 var(--font-ui);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a2a30;border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#3a3a42;background-clip:content-box}
button{font:inherit;color:inherit;background:none;border:none;padding:0}
svg{display:block;flex:0 0 auto}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100vw;position:relative}

#toolbar{
  height:var(--tb);flex:0 0 auto;display:flex;align-items:center;gap:4px;
  padding:0 max(8px,env(safe-area-inset-left));
  background:linear-gradient(180deg,#1c1c20,#16161a);
  border-bottom:1px solid #000;box-shadow:var(--hi),0 1px 0 rgba(0,0,0,.4);
  z-index:50;position:relative;
}
.brand-mark{width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:var(--accent);margin-right:2px;filter:drop-shadow(0 0 6px var(--accent-glow))}
.sep{width:1px;height:20px;background:linear-gradient(180deg,transparent,#2a2a30,transparent);margin:0 5px}
.mode-switch{display:flex;background:#0c0c0e;border:1px solid #000;border-radius:5px;padding:2px;gap:2px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.03)}
.mode-btn{
  appearance:none;border:0;background:transparent;color:var(--text-2);
  font:inherit;font-size:12px;font-weight:500;padding:4px 11px;border-radius:3px;
  min-height:26px;cursor:pointer;display:flex;align-items:center;gap:5px;
  transition:background .12s,color .12s,box-shadow .12s;position:relative;
}
.mode-btn:hover{color:var(--text);background:rgba(255,255,255,.03)}
.mode-btn.active{background:linear-gradient(180deg,#2a2a32,#202028);color:#fff;box-shadow:var(--hi),0 1px 2px rgba(0,0,0,.4),inset 0 0 0 1px var(--border-3)}
.tb-btn{
  appearance:none;font:inherit;font-size:12px;font-weight:500;
  background:linear-gradient(180deg,#26262c,#1a1a1e);
  color:var(--text-2);border:1px solid var(--border-2);border-radius:var(--rad);
  padding:6px 8px;min-height:28px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  transition:background .1s,color .1s,box-shadow .1s,transform .05s;
  box-shadow:var(--hi),var(--sh-1);
}
.tb-btn:hover{background:linear-gradient(180deg,#2e2e36,#21212a);color:var(--text);border-color:var(--border-3)}
.tb-btn:active{background:linear-gradient(180deg,#15151a,#1e1e24);box-shadow:inset 0 2px 4px rgba(0,0,0,.5);transform:translateY(1px)}
.tb-btn.primary{background:linear-gradient(180deg,#5aa8ff,#3d8bef);color:#fff;border-color:#2f79d6;box-shadow:var(--hi),0 1px 3px rgba(0,0,0,.4),0 0 0 1px rgba(74,158,255,.3)}
.tb-btn.primary:hover{background:linear-gradient(180deg,#6bb3ff,#4d96f2)}
.tb-btn.pill{padding:6px 12px}
.tb-btn.icon{padding:6px;min-width:30px;justify-content:center}
.tb-btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--dim)}
.tb-btn.ghost:hover{background:var(--panel-3);color:var(--text);border-color:transparent;box-shadow:none}
.tb-btn.active{background:linear-gradient(180deg,#2a2a32,#202028);color:#fff;box-shadow:var(--hi),inset 0 0 0 1px var(--accent)}
.spacer{flex:1}

#main{flex:1;display:flex;min-height:0;position:relative}
.side{flex:0 0 auto;display:flex;flex-direction:column;background:var(--panel);min-height:0;
  transition:width .16s ease,opacity .16s;position:relative}
#left{width:250px;border-right:1px solid #000;box-shadow:1px 0 0 rgba(255,255,255,.02)}
#right{width:320px;border-left:1px solid #000;box-shadow:-1px 0 0 rgba(255,255,255,.02)}
.side.collapsed{width:0;overflow:hidden;opacity:0;border:0}

.panel{display:flex;flex-direction:column;min-height:0;flex:1 1 auto;overflow:hidden;
  border-bottom:1px solid #000;box-shadow:0 1px 0 rgba(255,255,255,.02)}
.panel:last-child{border-bottom:0;box-shadow:none}
.panel-head{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  height:28px;padding:0 4px 0 10px;
  background:linear-gradient(180deg,#1c1c20,#15151a);
  font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);
  border-bottom:1px solid #000;box-shadow:var(--hi);
}
.panel-head .title{display:flex;align-items:center;gap:6px}
.panel-actions{display:flex;gap:0}
.panel-actions button{
  appearance:none;border:0;background:transparent;color:var(--dim);
  width:24px;height:22px;border-radius:3px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .1s,color .1s;
}
.panel-actions button:hover{background:var(--panel-3);color:var(--text)}
.panel-body{flex:1 1 auto;overflow:auto;min-height:0;position:relative}

.panel-tabs{
  flex:0 0 auto;display:flex;background:linear-gradient(180deg,#1a1a1e,#14141a);
  border-bottom:1px solid #000;padding:0 4px;gap:0;box-shadow:var(--hi);position:relative;z-index:2;
  overflow-x:auto;
}
.panel-tabs::-webkit-scrollbar{height:0}
.panel-tab{
  appearance:none;border:0;background:transparent;color:var(--text-2);
  font:inherit;font-size:11.5px;font-weight:500;padding:9px 11px;cursor:pointer;
  display:flex;align-items:center;gap:6px;position:relative;
  border-bottom:1.5px solid transparent;margin-bottom:-1px;transition:color .12s;
  white-space:nowrap;flex:0 0 auto;
}
.panel-tab:hover{color:var(--text)}
.panel-tab.active{color:#fff;border-bottom-color:var(--accent)}
.panel-tab.active svg{filter:drop-shadow(0 0 4px var(--accent-glow))}

.tab-view{flex:1 1 auto;overflow:auto;min-height:0;display:none;position:relative}
.tab-view.active{display:block}
#right .panel{display:flex;flex-direction:column}

.breadcrumb{
  display:flex;align-items:center;gap:2px;padding:5px 8px;
  background:linear-gradient(180deg,#17171b,#121216);
  border-bottom:1px solid #000;font-size:11px;color:var(--text-2);
  overflow-x:auto;white-space:nowrap;flex:0 0 auto;box-shadow:var(--hi);
}
.breadcrumb::-webkit-scrollbar{height:0}
.breadcrumb .crumb{padding:2px 6px;border-radius:3px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:background .1s,color .1s}
.breadcrumb .crumb:hover{background:var(--panel-3);color:var(--text)}
.breadcrumb .crumb.current{color:var(--text);background:rgba(255,255,255,.02)}
.breadcrumb .sep-c{color:var(--dim-2);font-size:10px;padding:0 1px}

.tree-row{
  display:flex;align-items:center;gap:6px;height:24px;padding-right:8px;
  font-size:12.5px;color:var(--text);cursor:pointer;white-space:nowrap;
  border-left:2px solid transparent;touch-action:none;-webkit-user-select:none;user-select:none;
  transition:background .08s;
}
.tree-row:hover{background:linear-gradient(90deg,rgba(255,255,255,.02),transparent 80%)}
.tree-row.sel{background:linear-gradient(90deg,rgba(74,158,255,.12),rgba(74,158,255,.03) 80%);border-left-color:var(--accent)}
.tree-row.drop-target{background:linear-gradient(90deg,rgba(74,222,128,.16),rgba(74,222,128,.04) 80%);box-shadow:inset 0 0 0 1px var(--green)}
.tree-row .arrow{width:12px;height:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--dim-2);transition:transform .12s}
.tree-row .arrow.expanded{transform:rotate(90deg)}
.tree-row .ic{width:14px;height:14px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.tree-row .label{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.tree-row .badge{font-size:9.5px;color:var(--dim-2);font-variant-numeric:tabular-nums;letter-spacing:.3px}
.tree-row.dragging{opacity:.3}

.hier-row{
  display:flex;align-items:center;gap:6px;height:26px;padding:0 4px 0 10px;
  font-size:12.5px;cursor:pointer;border-left:2px solid transparent;transition:background .08s;
}
.hier-row:hover{background:linear-gradient(90deg,rgba(255,255,255,.02),transparent 80%)}
.hier-row.sel{background:linear-gradient(90deg,rgba(74,158,255,.12),rgba(74,158,255,.03) 80%);border-left-color:var(--accent)}
.hier-row.multi-sel{background:linear-gradient(90deg,rgba(182,140,240,.14),rgba(182,140,240,.03) 80%);border-left-color:var(--purple)}
.hier-row .ic{width:14px;height:14px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.hier-row.sel .ic{color:var(--accent)}
.hier-row .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hier-row .act{border:0;background:transparent;color:var(--dim-2);width:22px;height:22px;border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s,color .1s}
.hier-row .act:hover{background:var(--panel-3);color:var(--text)}
.hier-row .act.on{color:var(--accent)}
.hier-row .act.on svg{filter:drop-shadow(0 0 4px var(--accent-glow))}

#center{flex:1 1 auto;position:relative;min-width:0;background:#000;overflow:hidden}
.pane{position:absolute;inset:0;display:none}
.pane.active{display:flex;flex-direction:column}

#viewportWrap{position:absolute;inset:0;touch-action:none;overflow:hidden}
#viewport{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#viewportWrap.drop-target::after{
  content:'';position:absolute;inset:0;border:1.5px dashed var(--accent);
  background:radial-gradient(circle at center,rgba(74,158,255,.12),rgba(74,158,255,.04));
  pointer-events:none;z-index:5;animation:dropPulse 1.2s ease-in-out infinite}
@keyframes dropPulse{0%,100%{border-color:var(--accent)}50%{border-color:#7bb8ff}}
#viewportHud{position:absolute;left:10px;top:10px;display:flex;gap:6px;pointer-events:none;z-index:3;flex-wrap:wrap;max-width:60%}
.hud-chip{
  background:rgba(15,15,18,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.07);border-radius:4px;padding:3px 8px;
  font:11px/1.3 var(--font-mono);color:var(--text-2);font-variant-numeric:tabular-nums;box-shadow:var(--sh-1);
}
#gizmoBar{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  display:flex;gap:1px;background:rgba(15,15,18,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.08);border-radius:7px;padding:3px;z-index:6;
  box-shadow:0 6px 24px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);
  max-width:calc(100% - 20px);overflow-x:auto;
}
#gizmoBar::-webkit-scrollbar{height:0}
#gizmoBar button{
  appearance:none;border:0;background:transparent;color:var(--text-2);
  min-width:44px;height:32px;border-radius:5px;cursor:pointer;
  font:inherit;font-size:11px;font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:5px;
  transition:background .1s,color .1s;flex:0 0 auto;
}
#gizmoBar button:hover{background:rgba(255,255,255,.07);color:var(--text)}
#gizmoBar button.on{background:linear-gradient(180deg,#5aa8ff,#3d8bef);color:#fff;box-shadow:var(--hi),0 1px 3px rgba(0,0,0,.4)}
#gizmoSep{width:1px;background:rgba(255,255,255,.1);margin:5px 3px;flex:0 0 auto}

#editorPane{background:#0e0e10}
#tabBar{flex:0 0 auto;display:flex;align-items:stretch;height:32px;background:linear-gradient(180deg,#0a0a0c,#08080a);border-bottom:1px solid #000;overflow-x:auto;overflow-y:hidden}
#tabBar::-webkit-scrollbar{height:0}
.tab{display:flex;align-items:center;gap:6px;padding:0 8px 0 10px;font-size:12px;color:var(--text-2);background:transparent;border-right:1px solid var(--border);cursor:pointer;white-space:nowrap;flex:0 0 auto;transition:background .1s,color .1s}
.tab:hover{color:var(--text);background:rgba(255,255,255,.02)}
.tab.active{background:#0e0e10;color:#fff;box-shadow:inset 0 1.5px 0 var(--accent)}
.tab .x{color:var(--dim-2);padding:1px 3px;border-radius:2px;display:flex;align-items:center}
.tab .x:hover{background:var(--panel-3);color:var(--text)}
#editorBody{flex:1;display:flex;min-height:0;position:relative}
#gutter{flex:0 0 auto;width:48px;background:#0a0a0c;border-right:1px solid var(--border);overflow:hidden;padding:10px 0;font:12.5px/1.55 var(--font-mono);color:#3d3d44;text-align:right;user-select:none}
#gutter div{padding-right:10px}
#codeArea{position:relative;flex:1;min-width:0;overflow:hidden}
#highlight,#codeInput{
  position:absolute;inset:0;margin:0;padding:10px 14px;
  font:12.5px/1.55 var(--font-mono);white-space:pre;overflow:auto;border:0;tab-size:2;
  -webkit-user-select:text;user-select:text;
}
#highlight{color:#cfcfd4;pointer-events:none;z-index:0}
#codeInput{background:transparent;color:transparent;caret-color:#fff;z-index:1;resize:none;outline:none;-webkit-text-fill-color:transparent}
#codeInput::selection{background:rgba(74,158,255,.35)}
.c-key{color:#c586c0}.c-str{color:#ce9178}.c-num{color:#b5cea8}.c-com{color:#5a6670;font-style:italic}
.c-tag{color:#569cd6}.c-att{color:#9cdcfe}.c-fn{color:#dcdcaa}.c-op{color:#8a8a92}
.c-type{color:#4ec9b0}.c-shader-k{color:#b68cf0}.c-shader-t{color:#4ec9b0}

#autocomplete{position:absolute;background:#1a1a1e;border:1px solid var(--border-3);border-radius:4px;min-width:220px;max-height:220px;overflow:auto;z-index:100;box-shadow:var(--sh-3);display:none;padding:3px 0;font:12px var(--font-mono)}
#autocomplete.show{display:block}
#autocomplete .ac-item{padding:4px 10px;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
#autocomplete .ac-item:hover,#autocomplete .ac-item.sel{background:var(--accent);color:#fff}
#autocomplete .ac-item .k{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-left:auto}
#autocomplete .ac-item.sel .k{color:rgba(255,255,255,.7)}

#findBar{position:absolute;top:8px;right:16px;z-index:20;background:#1a1a1e;border:1px solid var(--border-3);border-radius:5px;padding:5px 6px;display:none;align-items:center;gap:4px;box-shadow:var(--sh-3)}
#findBar.show{display:flex}
#findBar input{background:#0e0e10;border:1px solid var(--border-2);border-radius:3px;color:var(--text);font:12px var(--font-mono);padding:4px 7px;width:130px;outline:none;-webkit-user-select:text;user-select:text}
#findBar input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
#findBar .fbtn{appearance:none;background:transparent;border:0;color:var(--text-2);padding:4px 6px;border-radius:3px;cursor:pointer;display:flex;align-items:center}
#findBar .fbtn:hover{background:var(--panel-3);color:var(--text)}

#assetsGrid{padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:9px;align-content:start}
.asset-card{background:linear-gradient(180deg,#1e1e24,#15151a);border:1px solid var(--border);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;cursor:grab;transition:border-color .1s,box-shadow .15s,transform .08s;box-shadow:var(--sh-1);touch-action:none;-webkit-user-select:none;user-select:none}
.asset-card:hover{border-color:var(--border-3);box-shadow:var(--sh-2);transform:translateY(-1px)}
.asset-card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--sh-2)}
.asset-card.dragging{opacity:.35;cursor:grabbing}
.asset-card .preview{height:76px;background:radial-gradient(circle at 50% 20%,#1a1a20,#0a0a0c);display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center;color:var(--dim);position:relative}
.asset-card .preview::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 40%,rgba(0,0,0,.15))}
.asset-card .preview .ext{position:absolute;right:4px;bottom:4px;font:9px/1 var(--font-mono);font-weight:600;letter-spacing:.5px;background:rgba(0,0,0,.7);border-radius:3px;padding:2px 5px;color:#c8c8ce;backdrop-filter:blur(4px);z-index:1}
.asset-card .info{padding:6px 8px;border-top:1px solid #000;box-shadow:var(--hi)}
.asset-card .info .n{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.asset-card .info .s{font-size:9.5px;color:var(--dim);display:block;margin-top:1px;font-variant-numeric:tabular-nums}

#inspector{padding-bottom:24px}
.insp-header{padding:10px 12px;background:linear-gradient(180deg,#1c1c22,#15151a);border-bottom:1px solid #000;display:flex;align-items:center;gap:8px;box-shadow:var(--hi)}
.insp-header .dot{width:8px;height:8px;border-radius:2px;background:var(--accent);box-shadow:0 0 6px var(--accent-glow)}
.insp-header .name{font-size:12.5px;font-weight:500;color:#eaeaec;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.insp-header .kind{font:9.5px/1 var(--font-mono);font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);background:#0e0e10;border-radius:3px;padding:3px 5px;box-shadow:inset 0 1px 2px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.03)}
.insp-group{border-bottom:1px solid #000;box-shadow:0 1px 0 rgba(255,255,255,.02)}
.insp-group > h4{margin:0;padding:9px 12px 6px;font-size:10px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;transition:color .12s}
.insp-group > h4:hover{color:var(--text-2)}
.insp-group > h4 .caret{margin-left:auto;color:var(--dim-2);transition:transform .15s}
.insp-group.collapsed > h4 .caret{transform:rotate(-90deg)}
.insp-group.collapsed > .insp-group-body{display:none}
.insp-group-body{padding-bottom:8px}
.row{display:flex;align-items:center;gap:8px;padding:3px 12px;min-height:26px}
.row > label{flex:0 0 84px;font-size:11.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row > .ctl{flex:1;display:flex;gap:4px;min-width:0;align-items:center}
input[type=text],input[type=number],select{
  appearance:none;background:#0a0a0c;border:1px solid var(--border-2);border-radius:3px;
  color:var(--text);font:12px var(--font-ui);padding:4px 6px;min-width:0;width:100%;
  min-height:26px;-webkit-user-select:text;user-select:text;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.4);transition:border-color .12s,box-shadow .12s;
}
input[type=number]{font-family:var(--font-mono);font-size:11.5px;text-align:right;padding-right:6px;font-variant-numeric:tabular-nums}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:inset 0 1px 2px rgba(0,0,0,.4),0 0 0 2px var(--accent-glow)}
select{cursor:pointer;padding-right:20px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' fill='none' stroke='%236e6e77' stroke-width='1.3'/></svg>");background-repeat:no-repeat;background-position:right 6px center}
input[type=color]{appearance:none;border:1px solid var(--border-2);border-radius:3px;background:#0a0a0c;width:32px;height:26px;padding:2px;cursor:pointer;flex:0 0 auto;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:none;border-radius:2px}
input[type=range]{appearance:none;-webkit-appearance:none;background:transparent;width:100%;height:22px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:#2a2a30;border-radius:1px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:linear-gradient(180deg,#6bb3ff,#3d8bef);margin-top:-5px;border:2px solid #0e0e10;box-shadow:0 0 0 1px var(--accent),0 1px 3px rgba(0,0,0,.4)}
.slider-val{flex:0 0 40px;text-align:right;font:11px var(--font-mono);color:var(--dim);font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:11.5px;color:var(--text);user-select:none}
.chk input{appearance:none;width:28px;height:16px;border-radius:8px;background:#2a2a30;position:relative;transition:background .12s;cursor:pointer;flex:0 0 auto;margin:0;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.chk input::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#9a9aa2;transition:transform .14s,background .14s;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.chk input:checked{background:linear-gradient(180deg,#4d96f2,#2a7fd4)}
.chk input:checked::after{transform:translateX(12px);background:#fff}

.tex-slot{display:flex;align-items:center;gap:8px;padding:5px 12px;margin:2px 0;border-radius:4px;border:1px solid transparent;transition:background .12s,border-color .12s;touch-action:none}
.tex-slot.droppable{border-color:rgba(74,158,255,.2);border-style:dashed}
.tex-slot.hot{border-color:var(--accent);background:rgba(74,158,255,.1);box-shadow:0 0 0 2px var(--accent-glow)}
.tex-slot .thumb{width:30px;height:30px;border-radius:3px;background:#0a0a0c;border:1px solid var(--border-2);flex:0 0 auto;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:var(--dim-2);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.tex-slot .meta{flex:1;min-width:0}
.tex-slot .meta .n{font-size:10.5px;color:var(--dim);display:block;text-transform:uppercase;letter-spacing:.4px}
.tex-slot .meta .v{font-size:11px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;margin-top:1px}
.tex-slot .meta .v.empty{color:var(--dim-2)}
.tex-slot .clr{border:0;background:transparent;color:var(--dim-2);cursor:pointer;width:22px;height:22px;border-radius:3px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;transition:background .1s,color .1s}
.tex-slot .clr:hover{background:var(--panel-3);color:var(--red)}

.chip-list{display:flex;flex-wrap:wrap;gap:5px;padding:4px 12px}
.chip{display:flex;align-items:center;gap:5px;background:linear-gradient(180deg,#232329,#1a1a1e);border:1px solid var(--border-2);border-radius:3px;padding:3px 6px;font-size:11px;color:var(--text);box-shadow:var(--hi),var(--sh-1)}
.chip button{border:0;background:transparent;color:var(--dim);cursor:pointer;padding:0;display:flex;align-items:center}
.chip button:hover{color:var(--text)}

.btn-row{display:flex;gap:6px;padding:6px 12px}
.btn-row .tb-btn{flex:1;justify-content:center}
.tb-btn.danger{color:#ffbdbd;border-color:#5a2b2b;background:linear-gradient(180deg,#3a2020,#281414)}
.tb-btn.danger:hover{background:linear-gradient(180deg,#4a2a2a,#321818)}
.empty{color:var(--dim-2);font-size:12px;padding:24px 16px;text-align:center;line-height:1.6}

/* Terrain / brush tools */
.brush-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px 10px}
.brush-btn{appearance:none;background:linear-gradient(180deg,#232329,#1a1a1e);border:1px solid var(--border-2);border-radius:4px;color:var(--text-2);cursor:pointer;padding:8px 4px;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:background .1s,border-color .1s;box-shadow:var(--hi)}
.brush-btn:hover{color:var(--text);border-color:var(--border-3)}
.brush-btn.on{background:linear-gradient(180deg,#2a5a96,#1e4574);border-color:var(--accent);color:#fff}
.brush-btn svg{width:16px;height:16px}

.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 10px}
.preset-btn{appearance:none;background:linear-gradient(180deg,#1e1e24,#15151a);border:1px solid var(--border);border-radius:5px;cursor:pointer;padding:0;overflow:hidden;text-align:left;transition:border-color .12s,transform .1s;box-shadow:var(--sh-1)}
.preset-btn:hover{border-color:var(--border-3);transform:translateY(-1px)}
.preset-btn .swatch{height:44px;background-size:cover;background-position:center;position:relative}
.preset-btn .swatch::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.4))}
.preset-btn .pname{font-size:11px;padding:5px 8px;display:block;color:var(--text)}
.preset-btn .pdesc{font-size:9.5px;padding:0 8px 6px;display:block;color:var(--dim)}

#statusbar{
  height:var(--sb);flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;padding-bottom:env(safe-area-inset-bottom);
  background:linear-gradient(180deg,#18181c,#111114);border-top:1px solid #000;box-shadow:var(--hi);
  font:11px var(--font-ui);color:var(--text-2);z-index:40;
}
#statusbar .right{display:flex;gap:16px;font-variant-numeric:tabular-nums;font-family:var(--font-mono);font-size:10.5px}

#dragLayer{position:fixed;inset:0;z-index:9000;display:none;touch-action:none;-webkit-user-select:none;user-select:none}
#dragLayer.active{display:block}
.drag-ghost{position:absolute;pointer-events:none;transform:translate(10px,10px);background:linear-gradient(180deg,rgba(30,30,36,.98),rgba(20,20,24,.98));border:1px solid var(--accent);border-radius:5px;padding:6px 11px;font:11.5px var(--font-ui);color:#fff;white-space:nowrap;box-shadow:0 10px 32px rgba(0,0,0,.7),0 0 0 3px var(--accent-glow);backdrop-filter:blur(10px);display:flex;align-items:center;gap:6px}

#toast{position:fixed;left:50%;bottom:48px;transform:translate(-50%,12px);background:linear-gradient(180deg,rgba(30,30,36,.98),rgba(22,22,26,.98));border:1px solid var(--border-3);border-radius:6px;padding:10px 18px;font-size:12.5px;color:#eaeaec;z-index:10000;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;box-shadow:0 12px 32px rgba(0,0,0,.7),var(--hi);max-width:min(80vw,440px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

#modalBack{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:8000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
#modalBack.show{display:flex}
#modal{background:linear-gradient(180deg,#1c1c22,#131317);border:1px solid var(--border-3);border-radius:10px;min-width:min(420px,90vw);max-width:600px;max-height:80vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.06)}
#modal h3{margin:0;padding:14px 18px;font-size:13.5px;border-bottom:1px solid #000;font-weight:600;box-shadow:var(--hi)}
#modal .body{padding:14px 18px}
#modal .body p{margin:0 0 10px;font-size:12.5px;color:var(--text-2);line-height:1.55}
#modal .foot{padding:12px 18px;border-top:1px solid #000;display:flex;gap:8px;justify-content:flex-end;box-shadow:var(--hi)}

.shader-list{padding:6px}
.shader-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;font-size:12px;cursor:pointer;transition:background .1s}
.shader-item:hover{background:var(--panel-2)}
.shader-item.sel{background:linear-gradient(90deg,rgba(74,158,255,.14),rgba(74,158,255,.03))}
.shader-item .ic{color:var(--purple)}
.shader-item .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shader-item .act{opacity:0;color:var(--dim-2);cursor:pointer;transition:opacity .1s,color .1s}
.shader-item:hover .act{opacity:1}
.shader-item .act:hover{color:var(--red)}

body.playing #toolbar,body.playing #left,body.playing #right,body.playing #statusbar{display:none!important}
body.playing #center{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;z-index:900}
#playHud{position:fixed;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));display:none;gap:8px;z-index:1000;align-items:center}
body.playing #playHud{display:flex}
#playHud .stat{background:rgba(15,15,18,.85);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.09);border-radius:5px;padding:7px 12px;font:11.5px var(--font-mono);color:#cfcfd6;font-variant-numeric:tabular-nums;box-shadow:var(--sh-2)}
#btnStop{background:linear-gradient(180deg,#f0776c,#d34f42);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:5px;padding:9px 16px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:var(--hi),0 4px 12px rgba(0,0,0,.4)}
#btnStop:hover{background:linear-gradient(180deg,#f58178,#e05e52)}

.hidden{display:none!important}

#bootOverlay{position:fixed;inset:0;background:var(--bg);z-index:20000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-size:13px;color:var(--dim);transition:opacity .3s}
#bootOverlay.done{opacity:0;pointer-events:none}
#bootOverlay .logo{color:var(--accent);filter:drop-shadow(0 0 12px var(--accent-glow))}
#bootOverlay.error{color:var(--red)}
#bootOverlay .err{padding:12px 20px;max-width:500px;text-align:center;font-size:12px;line-height:1.6;color:var(--text-2)}

/* Floating brush indicator */
#brushRing{position:fixed;border:2px solid rgba(74,158,255,.7);border-radius:50%;pointer-events:none;z-index:1000;display:none;box-shadow:0 0 12px rgba(74,158,255,.4),inset 0 0 12px rgba(74,158,255,.15)}
#brushRing.on{display:block}

@media (max-width:900px){
  #left{width:200px}
  #right{position:absolute;right:0;top:0;bottom:0;z-index:30;width:290px;box-shadow:-14px 0 40px rgba(0,0,0,.6)}
  #right.collapsed{box-shadow:none}
}

<script type="module">
/* ============================================================
   FORGE — Stylized Game Editor
   Fixes: vec.getComponent (Euler lacks it) → use .x/.y/.z
   ============================================================ */

window.addEventListener('error', e => console.error('[Forge]', e.error || e.message));
window.addEventListener('unhandledrejection', e => console.error('[Forge] unhandled', e.reason));

const bootOverlay = document.getElementById('bootOverlay');
const bootMsg = document.getElementById('bootMsg');
const bootErr = document.getElementById('bootErr');
const setBootMsg = m => { bootMsg.textContent = m; };
function failBoot(err){
  bootOverlay.classList.add('error');
  bootMsg.textContent = 'Forge failed to start';
  bootErr.classList.remove('hidden');
  bootErr.textContent = (err && err.message ? err.message : String(err)) + '\n\nTry a hard reload or check the browser console.';
}

async function loadCore(){
  try {
    setBootMsg('Loading 3D engine…');
    const THREE = await import('three');
    setBootMsg('Loading controls…');
    const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
    const { TransformControls } = await import('three/addons/controls/TransformControls.js');
    setBootMsg('Loading mesh simplifier…');
    let SimplifyMod = null;
    try { SimplifyMod = await import('three/addons/modifiers/SimplifyModifier.js'); } catch(_){}
    return { THREE, OrbitControls, TransformControls, SimplifyModifier: SimplifyMod && SimplifyMod.SimplifyModifier };
  } catch(e){ failBoot(e); throw e; }
}

/* ---------- Utils ---------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.prototype.slice.call(el.querySelectorAll(s));
const uid = (p='id') => p + '_' + Math.random().toString(36).slice(2,9);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const lerp = (a,b,t) => a + (b-a)*t;
const fmt = n => (Math.round(n*1000)/1000).toString();
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const extOf = n => { const i = String(n).lastIndexOf('.'); return i<0 ? '' : n.slice(i+1).toLowerCase(); };
const fmtBytes = b => { if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(1)+' KB'; if(b<1073741824) return (b/1048576).toFixed(1)+' MB'; return (b/1073741824).toFixed(2)+' GB'; };

// Safe component access — FIXES the getComponent bug (Euler lacks it)
function vecGet(v, i){
  if(!v) return 0;
  if(typeof v.getComponent === 'function') return v.getComponent(i);
  if(i === 0) return v.x || 0;
  if(i === 1) return v.y || 0;
  return v.z || 0;
}
function vecSet(v, i, val){
  if(!v) return;
  if(typeof v.setComponent === 'function'){ v.setComponent(i, val); return; }
  if(i === 0) v.x = val;
  else if(i === 1) v.y = val;
  else v.z = val;
}

const EXT_KIND = {
  glb:'model', gltf:'model', obj:'model', fbx:'model', stl:'model', ply:'model', dae:'model', '3ds':'model',
  png:'texture', jpg:'texture', jpeg:'texture', webp:'texture', gif:'texture', bmp:'texture', svg:'texture',
  hdr:'texture', exr:'texture', tga:'texture', dds:'texture', ktx2:'texture', avif:'texture',
  mp3:'audio', wav:'audio', ogg:'audio', m4a:'audio', aac:'audio', flac:'audio', opus:'audio',
  mp4:'video', webm:'video', mov:'video', m4v:'video', ogv:'video',
  js:'script', mjs:'script', ts:'script', bun:'script', tsx:'script', jsx:'script', cjs:'script',
  html:'html', htm:'html', css:'css', scss:'css', sass:'css', less:'css',
  json:'json', jsonc:'json', json5:'json', toml:'text', yaml:'text', yml:'text', csv:'text', tsv:'text',
  txt:'text', md:'text', markdown:'text', ini:'text', cfg:'text', log:'text',
  ttf:'font', woff:'font', woff2:'font', otf:'font', eot:'font',
  gdshader:'shader', gdshaderinc:'shader', glsl:'shader', frag:'shader', vert:'shader',
  wgsl:'shader', hlsl:'shader', shader:'shader', compute:'shader',
  bin:'binary', dat:'binary', pack:'binary'
};
const kindOf = n => EXT_KIND[extOf(n)] || 'text';
const KIND_COLOR = { model:'#e5c07b', texture:'#98c379', audio:'#56b6c2', video:'#d19a66', script:'#61afef',
  html:'#e06c75', css:'#c678dd', json:'#d19a66', text:'#8a8a92', font:'#b57ee5', shader:'#b68cf0', binary:'#6e6e77' };
const KIND_ICON  = { model:'i-cube', texture:'i-image', audio:'i-music', video:'i-film', script:'i-code',
  html:'i-tag', css:'i-hash', json:'i-braces', text:'i-doc', font:'i-type', shader:'i-sparkle', binary:'i-file' };
const KIND_LABEL = { model:'3D Model', texture:'Texture', audio:'Audio', video:'Video', script:'Script',
  html:'HTML', css:'Stylesheet', json:'JSON', text:'Text', font:'Font', shader:'Shader', binary:'Binary' };
const TEXT_KINDS = new Set(['script','html','css','json','text','shader']);
const isTextKind = k => TEXT_KINDS.has(k);

/* ---------- Toast / Modal ---------- */
let toastT = null;
function toast(m, ms=2000){
  const t = $('#toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), ms);
}
function setStatus(m){ $('#statusMsg').textContent = m; }
function showModal(title, body, buttons){
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = body;
  const foot = $('#modalFoot'); foot.innerHTML = '';
  (buttons||[{label:'Close'}]).forEach(b=>{
    const el = document.createElement('button');
    el.className = 'tb-btn ' + (b.cls||'');
    el.textContent = b.label;
    el.onclick = () => { if(!b.action || b.action()!==false) closeModal(); };
    foot.appendChild(el);
  });
  $('#modalBack').classList.add('show');
}
function closeModal(){ $('#modalBack').classList.remove('show'); }
$('#modalBack').addEventListener('click', e => { if(e.target.id==='modalBack') closeModal(); });

/* ---------- Storage ---------- */
const DB_NAME='forge-store', DB_VER=4, STORE_FILES='files', STORE_META='meta';
let _db = null, _idbOK = false, _idbTried = false;

function tryOpenDB(){
  if(_idbTried) return Promise.resolve(_idbOK ? _db : null);
  _idbTried = true;
  return new Promise(res => {
    try{
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = () => {
        const db = req.result;
        if(!db.objectStoreNames.contains(STORE_FILES)) db.createObjectStore(STORE_FILES);
        if(!db.objectStoreNames.contains(STORE_META)) db.createObjectStore(STORE_META);
      };
      req.onsuccess = () => { _db = req.result; _idbOK = true; res(_db); };
      req.onerror = () => { console.warn('IDB failed', req.error); res(null); };
      req.onblocked = () => { console.warn('IDB blocked'); res(null); };
      setTimeout(() => { if(!_db){ _idbOK=false; res(null); } }, 3000);
    } catch(e){ console.warn('IDB threw', e); res(null); }
  });
}

const FileStore = {
  cache: new Map(),
  urlCache: new Map(),
  async init(){ await tryOpenDB(); },
  async put(id, value){
    this.cache.set(id, value);
    this._revokeURL(id);
    if(!_idbOK || !_db) return;
    try {
      await new Promise((res,rej)=>{
        const tx = _db.transaction(STORE_FILES, 'readwrite');
        tx.objectStore(STORE_FILES).put(value, id);
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
        tx.onabort = () => rej(tx.error);
      });
    } catch(e){ console.warn('IDB put failed', e); }
  },
  async get(id){
    if(this.cache.has(id)) return this.cache.get(id);
    if(!_idbOK || !_db) return null;
    try {
      return await new Promise((res,rej)=>{
        const tx = _db.transaction(STORE_FILES, 'readonly');
        const r = tx.objectStore(STORE_FILES).get(id);
        r.onsuccess = () => { this.cache.set(id, r.result); res(r.result); };
        r.onerror = () => rej(r.error);
      });
    } catch(e){ console.warn('IDB get failed', e); return null; }
  },
  async del(id){
    this.cache.delete(id);
    this._revokeURL(id);
    if(!_idbOK || !_db) return;
    try {
      await new Promise((res,rej)=>{
        const tx = _db.transaction(STORE_FILES, 'readwrite');
        tx.objectStore(STORE_FILES).delete(id);
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
      });
    } catch(e){}
  },
  _revokeURL(id){
    const u = this.urlCache.get(id);
    if(u){ try{ URL.revokeObjectURL(u); }catch(e){} this.urlCache.delete(id); }
  },
  async getURL(id){
    if(this.urlCache.has(id)) return this.urlCache.get(id);
    const d = await this.get(id);
    if(d == null) return null;
    let url;
    if(d instanceof Blob) url = URL.createObjectURL(d);
    else if(typeof d === 'string' && d.startsWith('data:')) url = d;
    else url = 'data:text/plain;base64,' + btoa(unescape(encodeURIComponent(String(d))));
    this.urlCache.set(id, url);
    return url;
  },
  async saveMeta(meta){
    if(!_idbOK || !_db) return;
    try {
      await new Promise((res,rej)=>{
        const tx = _db.transaction(STORE_META, 'readwrite');
        tx.objectStore(STORE_META).put(meta, 'project');
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
      });
    } catch(e){ console.warn('saveMeta failed', e); }
  },
  async loadMeta(){
    if(!_idbOK || !_db) return null;
    try {
      return await new Promise((res,rej)=>{
        const tx = _db.transaction(STORE_META, 'readonly');
        const r = tx.objectStore(STORE_META).get('project');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    } catch(e){ return null; }
  }
};

/* ---------- Undo / Redo ---------- */
const Undo = {
  stack: [], index: -1, limit: 60, _recording:true,
  snapshot(){
    try{
      return JSON.stringify({
        scene: serializeScene(),
        counter: state.objectCounter,
        world: World.serialize()
      });
    } catch(e){ return null; }
  },
  push(){
    if(!this._recording) return;
    const s = this.snapshot();
    if(s == null) return;
    if(this.stack[this.index] === s) return;
    this.stack = this.stack.slice(0, this.index + 1);
    this.stack.push(s);
    if(this.stack.length > this.limit) this.stack.shift();
    this.index = this.stack.length - 1;
    updateUndoButtons();
  },
  canUndo(){ return this.index > 0; },
  canRedo(){ return this.index < this.stack.length - 1; },
  undo(){
    if(!this.canUndo()) return;
    this.index--;
    this._apply(this.stack[this.index]);
    updateUndoButtons();
  },
  redo(){
    if(!this.canRedo()) return;
    this.index++;
    this._apply(this.stack[this.index]);
    updateUndoButtons();
  },
  _apply(json){
    this._recording = false;
    try{
      const data = JSON.parse(json);
      clearSceneObjects();
      for(const def of data.scene){
        def.material = materialDefaults(def.material || {});
        try { addObjectFromDef(def, false); } catch(e){ console.warn(e); }
      }
      state.objectCounter = data.counter || 0;
      if(data.world) World.deserialize(data.world);
      selectObject(null);
      refreshHierarchy();
      updateStatusBar();
    } catch(e){ console.warn('Undo apply failed', e); }
    this._recording = true;
  }
};
function updateUndoButtons(){

}

/* ---------- Tree helpers ---------- */
function findNode(id, node=state.root){
  if(!node) return null;
  if(node.id === id) return node;
  const kids = node.children;
  if(!kids) return null;
  for(let i = 0; i < kids.length; i++){
    const r = findNode(id, kids[i]);
    if(r) return r;
  }
  return null;
}
function findParent(id, node=state.root){
  if(!node || !node.children) return null;
  for(const c of node.children){
    if(c.id === id) return node;
    const r = findParent(id, c);
    if(r) return r;
  }
  return null;
}
function ensureFolder(path, root=state.root){
  let cur = root;
  for(const name of path){
    cur.children = cur.children || [];
    let next = cur.children.find(c => c.type==='folder' && c.name===name);
    if(!next){
      next = { id: uid('d'), type:'folder', name, children:[], expanded:false };
      cur.children.push(next);
    }
    cur = next;
  }
  return cur;
}
function walkFiles(node, fn){
  if(!node) return;
  if(node.type==='file') fn(node);
  if(node.children) for(const c of node.children) walkFiles(c, fn);
}
function walkAll(node, fn){
  if(!node) return;
  fn(node);
  if(node.children) for(const c of node.children) walkAll(c, fn);
}
function allFiles(){
  const out = [];
  walkFiles(state.root, f => out.push(f));
  return out;
}
function folderForKind(kind){
  if(kind==='model') return ensureFolder(['Assets','Models']);
  if(kind==='texture') return ensureFolder(['Assets','Textures']);
  if(kind==='audio'||kind==='video') return ensureFolder(['Assets','Media']);
  if(kind==='script') return ensureFolder(['Scripts']);
  if(kind==='shader') return ensureFolder(['Shaders']);
  if(kind==='font') return ensureFolder(['Assets','Fonts']);
  if(kind==='html'||kind==='css') return ensureFolder(['src']);
  if(kind==='json'||kind==='text') return ensureFolder(['src','data']);
  return ensureFolder(['Assets','Misc']);
}

uniform vec4 deep_color : source_color = vec4(0.05, 0.15, 0.35, 1.0);
