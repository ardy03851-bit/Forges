function duplicateAsset(asset) {
  const copy = deepClone(asset);
  copy.id = uid('a');
  copy.name = asset.name.replace(/(\.[^.]+)?$/, ' copy$1');
  copy.url = asset.url;
  State.urlRegistry.set(copy.id, asset.url);
  State.assets.push(copy);
  renderAssetPanel();
  toast('Duplicated');
}
function deleteAsset(asset) {
  Modal.confirm('Delete asset?', 'Remove "' + asset.name + '" from the bin and delete its stored file. Clips using it will be removed.', () => {
    Undo.run('Delete asset', () => {
      State.project.tracks.forEach(t => { t.clips = t.clips.filter(c => c.assetId !== asset.id); });
      const i = State.assets.indexOf(asset);
      if (i >= 0) State.assets.splice(i, 1);
    });
    releaseMedia(asset.id);
    revokeURL(asset.id);
    IDB.del('blobs', asset.id).catch(() => { });
    renderAssetPanel();
    renderStorageBar();
    Timeline.requestRender();
    Preview.render(State.playhead);
  }, true);
}
function replaceSelectedClip(asset) {
  Undo.run('Replace clip', () => {
    State.selection.forEach(id => {
      const f = Timeline.findClip(id);
      if (!f) return;
      f.clip.assetId = asset.id;
      const dur = asset.type === 'image' ? f.clip.duration : (asset.duration || f.clip.duration);
      f.clip.duration = Math.min(f.clip.duration, dur / (f.clip.speed || 1));
      f.clip.inPoint = 0;
    });
  });
  Timeline.requestRender();
  Preview.render(State.playhead);
}

/* -------------------- Drag from asset bin to timeline ------------------- */
let assetDrag = null;
function startAssetDrag(asset, e) {
  if (assetDrag) return;
  assetDrag = { asset: asset, pointerId: e.pointerId };
  const ghost = $('#dragGhost');
  ghost.textContent = asset.name;
  ghost.style.display = 'block';
  moveGhost(e.clientX, e.clientY);
}
function moveGhost(x, y) {
  const g = $('#dragGhost');
  g.style.left = x + 'px';
  g.style.top = (y - 40) + 'px';
}
function updateDropLine(e) {
  const drop = computeDrop(e);
  const dl = $('#dropLine');
  if (drop) {
    dl.style.display = 'block';
    dl.style.left = (Timeline.secToPx(drop.time)) + 'px';
  } else dl.style.display = 'none';
}
function computeDrop(e) {
  const r = $('#tlScroll').getBoundingClientRect();
  if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) return null;
  const localY = e.clientY - r.top;
  if (localY < Timeline.RULER_H) return null;
  let t = Timeline.pxToSec(e.clientX - r.left);
  t = Math.max(0, t);
  return { time: t, trackIndex: -1, clientY: e.clientY };
}
function dropAsset(asset, drop, e) {
  const wantedKind = asset.type === 'audio' ? 'audio' : 'video';
  const rr = $('#tlScroll').getBoundingClientRect();
  const localY = drop.clientY - rr.top + State.scrollY;
  let track = null, acc = 0;
  for (const t of State.project.tracks) {
    if (localY >= acc && localY < acc + t.height && t.kind === wantedKind) { track = t; break; }
    acc += t.height;
  }
  if (!track) track = State.project.tracks.find(t => t.kind === wantedKind);
  if (!track) { toast('No compatible track'); return; }
  const dur = asset.type === 'image' ? 5 : (asset.duration || 5);
  Undo.run('Drop asset', () => {
    const c = makeClip(asset.id, asset.type, drop.time, dur, 0);
    if (State.snapping) {
      const snap = Timeline.findSnapPoint(drop.time, c, track);
      if (snap !== null) c.start = snap;
    }
    if (State.rippleEdit) rippleInsert(track, c);
    else track.clips.push(c);
    State.selection = new Set([c.id]);
  });
  Timeline.requestRender();
  Inspector.render();
  Preview.render(State.playhead);
}

/* --------------------------- Storage bar -------------------------------- */
async function renderStorageBar() {
  const el = $('#storageBar');
  if (!el) return;
  if (!navigator.storage || !navigator.storage.estimate) { el.textContent = 'Storage — unavailable'; return; }
  try {
    const est = await navigator.storage.estimate();
    const used = est.usage || 0, quota = est.quota || 0;
    const pct = quota ? (used / quota * 100) : 0;
    el.innerHTML = 'Storage ' + fmtBytes(used) + ' / ' + fmtBytes(quota) +
      '<div style="height:3px;background:rgba(0,0,0,.4);border-radius:2px;margin-top:5px;overflow:hidden"><div style="height:100%;width:' + pct.toFixed(1) + '%;background:' + (pct > 85 ? 'var(--danger)' : 'var(--accent)') + '"></div></div>';
  } catch (e) { el.textContent = 'Storage —'; }
}

    const r = scrub.getBoundingClientRect();
    const p = clamp((e.clientX - r.left) / r.width, 0, 1);
    const dur = Math.max(0.001, Timeline.totalDuration());
    Timeline.setPlayhead(p * dur);

    Timeline.setPlayhead(clamp(stageStartT + dx * perPx, 0, dur));

  $('#tlScroll').addEventListener('dblclick', e => {
    const r = $('#tlScroll').getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const t = Timeline.pxToSec(x);
    const idx = State.project.tracks.findIndex(tr => {
      const i = State.project.tracks.indexOf(tr);
      let top = Timeline.RULER_H;
      for (let j = 0; j < i; j++) top += State.project.tracks[j].height;
      return y >= top - State.scrollY && y < top + tr.height - State.scrollY;
    });
    const trk = State.project.tracks[idx];
    if (trk && trk.kind === 'text') {
      Undo.run('Add text', () => {
        const c = makeClip(null, 'text', t, 4, 0);
        c.text = { content: 'New text', font: '-apple-system, "SF Pro Text", Inter, system-ui, sans-serif', weight: 700, size: 64, color: '#FFFFFF', bg: false, bgColor: '#000000', bgOpacity: 0.6, stroke: true, strokeColor: '#000000', strokeWidth: 3, align: 'center', x: 0.5, y: 0.85 };
        trk.clips.push(c);
        State.selection = new Set([c.id]);
      });
      Inspector.render();
      Timeline.requestRender();
    }
  });

  // Long-press on clip
  let lpTimer = 0;
  $('#tlScroll').addEventListener('pointerdown', e => {
    const r = $('#tlScroll').getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    if (y < Timeline.RULER_H) return;
    lpTimer = setTimeout(() => {
      const t = Timeline.pxToSec(x);

        for (const c of tr.clips) {
          if (t >= c.start && t < c.start + c.duration) { showClipMenu(c, tr); return; }
        }
      }
    }, 560);
  });
  $('#tlScroll').addEventListener('pointerup', () => clearTimeout(lpTimer));
  $('#tlScroll').addEventListener('pointermove', () => clearTimeout(lpTimer));
  $('#tlScroll').addEventListener('pointercancel', () => clearTimeout(lpTimer));
}

/* ----------------------- Silence / ducking / SFX ------------------------ */
function detectSilence() {
  const tr = State.project.tracks.find(t => t.kind === 'audio' && t.clips.length);
  if (!tr) { toast('No audio track with clips'); return; }
  const silentRanges = [];
  const thresh = 0.02, minDur = 0.4;
  tr.clips.forEach(c => {
    const asset = getAsset(c.assetId);
    if (!asset || !asset.peaks) return;
    const pps = asset.peaksPerSec || 60;
    const peaks = asset.peaks, n = asset.peaksBuckets;
    const startT = c.start, dur = c.duration;
    let cur = null;
    for (let i = 0; i < dur * pps; i++) {
      const srcT = c.inPoint + i / pps * (c.speed || 1);
      const b = Math.floor(srcT * pps);
      let peak = 0;
      if (b >= 0 && b < n) peak = Math.max(Math.abs(peaks[b * 2]), Math.abs(peaks[b * 2 + 1]));
      const t = startT + i / pps;
      if (peak < thresh) { if (cur === null) cur = t; }
      else { if (cur !== null && t - cur > minDur) silentRanges.push([cur, t]); cur = null; }
    }
    if (cur !== null && (startT + dur) - cur > minDur) silentRanges.push([cur, startT + dur]);
  });
  if (!silentRanges.length) { toast('No silence detected'); return; }
  const wrap = document.createElement('div');
  wrap.innerHTML = '<div style="padding:10px 16px;color:var(--txt1);font-size:12px">Found ' + silentRanges.length + ' silent regions (min ' + minDur + 's). Choose an action:</div>';
  Modal.open({
    title: 'Silence detection', body: wrap, center: true,
    actions: [
      { label: 'Cancel' },
      { label: 'Add markers', onClick: () => {
        Undo.run('Add silence markers', () => {
          silentRanges.forEach((r, i) => { State.project.markers.push({ id: uid('m'), time: r[0], name: 'Silence ' + (i + 1), color: '#E5A50A' }); });
          State.project.markers.sort((a, b) => a.time - b.time);
        });
        Timeline.requestRender();
        toast(silentRanges.length + ' markers added');
      } },
      { label: 'Remove dead air', kind: 'primary', onClick: () => {
        Undo.run('Remove dead air', () => {
          silentRanges.sort((a, b) => a[0] - b[0]);
          silentRanges.forEach(([s, e]) => {
            const dur = e - s;
            tr.clips.forEach(c => {
              if (c.start + c.duration <= s) return;
              if (c.start >= e) { c.start -= dur; return; }
              if (c.start < s && c.start + c.duration > e) {
                const right = deepClone(c);
                right.id = uid('c');
                right.start = s;
                right.inPoint = c.inPoint + (s - c.start) * (c.speed || 1);
                right.duration = c.duration - (s - c.start) - dur;
                c.duration = s - c.start;
                tr.clips.push(right);
              } else if (c.start >= s && c.start + c.duration <= e) {
                c.duration = 0;
              }
            });
          });
          tr.clips = tr.clips.filter(c => c.duration > 0.001).sort((a, b) => a.start - b.start);
          let acc = 0;
          tr.clips.forEach(c => { c.start = acc; acc += c.duration; });
        });
        Timeline.requestRender();
        toast('Dead air removed');
      } }
    ]
  });
}

  kinds.forEach(([k, label]) => {
    const b = document.createElement('button');
    b.className = 'menuItem';

function openChapters() {
  const p = State.project;
  const body = document.createElement('div');
  const sorted = p.markers.slice().sort((a, b) => a.time - b.time);
  if (!sorted.length) {
    body.innerHTML = '<div style="padding:24px;color:var(--txt2);font-size:12px;text-align:center">No markers yet. Tap the flag icon or press M to add a chapter.</div>';
  } else {
    sorted.forEach(m => {
      const r = document.createElement('div');
      r.className = 'inspRow';
      r.innerHTML = '<label class="num">' + fmtTC(m.time, p.fps) + '</label>' +
        '<input type="text" value="' + escapeHtml(m.name || '') + '">' +
        '<button class="btn icon sm" data-jump>' + icon('play', 12) + '</button>' +
        '<button class="btn icon sm" data-del>' + icon('trash', 12) + '</button>';
      r.querySelector('input').addEventListener('input', e => { m.name = e.target.value; markDirty(); });
      r.querySelector('[data-jump]').onclick = () => { Timeline.setPlayhead(m.time); Preview.render(m.time); };

  Modal.open({

}

/* ------------------------------- Render --------------------------------- */
function renderAll() {
  $('#projName').value = State.project.name;
  Timeline.resize();
  Timeline.requestRender();
  Timeline.updateTC();
  renderAssetPanel();
  Inspector.render();
  Preview.render(State.playhead);
  Preview.updateTransformOverlay();
}

/* --------------------------------- Boot --------------------------------- */
async function boot() {
  const unlock = () => { Audio.ensure(); document.removeEventListener('pointerdown', unlock); document.removeEventListener('keydown', unlock); };
  document.addEventListener('pointerdown', unlock);
  document.addEventListener('keydown', unlock);
  if (navigator.storage && navigator.storage.persist) { try { await navigator.storage.persist(); } catch (e) { } }
  let loaded = null;
  try { loaded = await IDB.get('project', 'current'); } catch (e) { }
  if (loaded && loaded.tracks && loaded.tracks.length) {
    State.project = loaded;
    const assetsMeta = await IDB.get('project', 'assets').catch(() => null);
    if (assetsMeta && Array.isArray(assetsMeta)) {
      for (const meta of assetsMeta) {
        const blob = await IDB.get('blobs', meta.id).catch(() => null);
        if (!blob) continue;
        const a = Object.assign({}, meta);
        State.assets.push(a);
        registerURL(a, blob);
      }
    }
    toast('Project restored');
  } else { State.project = newProject(); }
  Preview.init();
  Timeline.init();
  bindUI();
  Shortcuts.init();
  initTabs();
  applyLayout();
  window.addEventListener('resize', debounce(() => { applyLayout(); Preview.setSize(); Preview.render(State.playhead); Preview.updateTransformOverlay(); }, 120));
  window.addEventListener('orientationchange', () => setTimeout(() => { applyLayout(); Preview.setSize(); Preview.render(State.playhead); Preview.updateTransformOverlay(); }, 260));
  hydrateIcons(document);
  $('#btnAssetView').innerHTML = icon('grid');
  Undo.reset();
  Timeline.resize();
  Timeline.requestRender();
  Timeline.updateTC();
  renderAssetPanel();
  Inspector.render();
  Preview.setSize();
  Preview.render(0);
  renderStorageBar();
  startAutosave();
  setInterval(async () => {
    if (State.dirty) {
      await saveProject().catch(() => { });
      await IDB.put('project', 'assets', State.assets.map(a => ({
        id: a.id, name: a.name, type: a.type, mime: a.mime, size: a.size,
        duration: a.duration, width: a.width, height: a.height, channels: a.channels,
        sampleRate: a.sampleRate, supported: a.supported, thumbKey: a.thumbKey, createdAt: a.createdAt
      }))).catch(() => { });
    }
  }, 25000);
  (function loop() { Timeline.render(); requestAnimationFrame(loop); })();
  let lastPreview = 0;
  (function previewLoop(t) {
    if (!State.playing && t - lastPreview > 66) { lastPreview = t; Preview.render(State.playhead); Preview.updateTransformOverlay(); }
    requestAnimationFrame(previewLoop);
  })(0);
  window.addEventListener('beforeunload', e => { if (State.dirty) { e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') renderStorageBar(); });
  if (!State.assets.length) setTimeout(() => toast('Import media with the + button, or drop files anywhere'), 700);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => { boot().catch(e => errToast(e, 'BOOT')); });
else boot().catch(e => errToast(e, 'BOOT'));
