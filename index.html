/* ============ CODE EDITOR ============ */
const tabBar = $('#tabBar');
const codeInput = $('#codeInput');
const highlightEl = $('#highlight');
const gutterEl = $('#gutter');
const findBar = $('#findBar');
const acEl = $('#autocomplete');

const KEYWORDS = ['const','let','var','function','return','if','else','for','while','do','new','class','extends','import','export','from','default','this','typeof','instanceof','try','catch','finally','throw','switch','case','break','continue','await','async','of','in','delete','void','yield','null','true','false','undefined','static','get','set'];
const GLOBALS = ['console','Math','JSON','Object','Array','String','Number','Boolean','Promise','Map','Set','Date','performance','document','window','requestAnimationFrame'];
const CTX_PROPS = ['object','scene','camera','renderer','THREE','input','time','delta','find'];
const THREE_PROPS = ['Vector2','Vector3','Quaternion','Euler','Matrix4','Color','Mesh','MeshPhysicalMaterial','MeshStandardMaterial','MeshBasicMaterial','Group','Scene','PerspectiveCamera','OrthographicCamera','DirectionalLight','PointLight','SpotLight','AmbientLight','HemisphereLight','BoxGeometry','SphereGeometry','PlaneGeometry','CylinderGeometry','ConeGeometry','TorusGeometry','TorusKnotGeometry','CapsuleGeometry','RingGeometry','IcosahedronGeometry','DodecahedronGeometry','OctahedronGeometry','TetrahedronGeometry','TextureLoader','Clock','Raycaster','Box3','Sphere','Fog','GridHelper','AxesHelper'];

function highlightCode(src, kind){
  if(kind === 'script') return highlightJS(src);
  if(kind === 'html') return highlightHTML(src);
  if(kind === 'css') return highlightCSS(src);
  if(kind === 'json') return highlightJS(src);
  if(kind === 'shader') return highlightShader(src);
  return esc(src);
}

function highlightJS(src){
  const re = /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|('(?:\\.|[^'\\])*'|"(?:\\.|[^"\\])*"|`(?:\\.|[^`\\])*`)|\b(const|let|var|function|return|if|else|for|while|do|new|class|extends|import|export|from|default|this|typeof|instanceof|try|catch|finally|throw|switch|case|break|continue|await|async|of|in|delete|void|yield|null|true|false|undefined|static)\b|\b(console|Math|JSON|Object|Array|String|Number|Boolean|Promise|Map|Set|Date|performance|document|window|THREE)\b|\b(\d+\.?\d*)\b|([A-Za-z_$][A-Za-z0-9_$]*)(?=\s*\()/g;
  let out = '', last = 0, m;
  while((m = re.exec(src)) !== null){
    out += esc(src.slice(last, m.index));
    let cls = 'c-com';
    if(m[2]) cls = 'c-str';
    else if(m[3]) cls = 'c-key';
    else if(m[4]) cls = 'c-type';
    else if(m[5]) cls = 'c-num';
    else if(m[6]) cls = 'c-fn';
    out += '<span class="' + cls + '">' + esc(m[0]) + '</span>';
    last = m.index + m[0].length;
  }
  out += esc(src.slice(last));
  return out;
}

function highlightHTML(src){
  return esc(src)
    .replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="c-com">$1</span>')
    .replace(/(&lt;\/?)([a-zA-Z][a-zA-Z0-9-]*)/g, '$1<span class="c-tag">$2</span>')
    .replace(/([a-zA-Z-]+)=(&quot;|")/g, '<span class="c-att">$1</span>=$2');
}

function highlightCSS(src){
  return esc(src)
    .replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="c-com">$1</span>')
    .replace(/([a-z-]+)(\s*:)/g, '<span class="c-att">$1</span>$2')
    .replace(/(#[0-9a-fA-F]{3,8})\b/g, '<span class="c-num">$1</span>');
}

function highlightShader(src){
  const shaderK = /\b(shader_type|render_mode|uniform|varying|in|out|void|fragment|vertex|if|else|return|const|struct|attribute|layout|precision|lowp|mediump|highp|flat|smooth|discard)\b/g;
  const shaderT = /\b(vec2|vec3|vec4|float|int|bool|mat2|mat3|mat4|sampler2D|samplerCube|ivec2|ivec3|ivec4|uint|uvec2|uvec3|uvec4|ALBEDO|NORMAL|METALLIC|ROUGHNESS|ALPHA|EMISSION|COLOR|VERTEX|POSITION|UV|NORMAL_MAP|TIME|VIEW|LAYER)\b/g;
  let out = esc(src);
  out = out.replace(/(\/\/[^\n]*)/g, '<span class="c-com">$1</span>');
  out = out.replace(shaderT, '<span class="c-shader-t">$&</span>');
  out = out.replace(shaderK, '<span class="c-shader-k">$&</span>');
  out = out.replace(/\b(\d+\.?\d*)\b/g, '<span class="c-num">$1</span>');
  return out;
}

async function openFile(node){
  if(!node || node.type !== 'file') return;
  if(!isTextKind(node.kind)){
    if(node.kind === 'texture'){ setRightTab('assets'); toast('Texture: ' + node.name); }
    else if(node.kind === 'model'){ toast('Model: ' + node.name + ' — double-click in tree to add'); }
    return;
  }
  // Ensure data is loaded from IndexedDB
  if(node.data == null){
    const d = await FileStore.get(node.id);
    if(typeof d === 'string') node.data = d;
    else if(d instanceof Blob) node.data = await d.text();
    else node.data = '';
  }
  if(!state.openTabs.some(t => t.id === node.id)){
    state.openTabs.push({ id: node.id });
  }
  state.activeTabId = node.id;
  state.selectedFileId = node.id;
  setMode('code');
  renderTabs();
  loadEditor(node);
  renderTree();
}

function renderTabs(){
  tabBar.innerHTML = '';
  for(const t of state.openTabs){
    const node = findNode(t.id);
    if(!node) continue;
    const el = document.createElement('div');
    el.className = 'tab' + (t.id === state.activeTabId ? ' active' : '');
    const ic = document.createElement('span');
    ic.style.color = KIND_COLOR[node.kind] || '#8a8a92';
    ic.innerHTML = `<svg width="12" height="12"><use href="#${KIND_ICON[node.kind] || 'i-file'}"/></svg>`;
    el.appendChild(ic);
    const nm = document.createElement('span');
    nm.textContent = node.name;
    el.appendChild(nm);
    const x = document.createElement('span');
    x.className = 'x';
    x.innerHTML = '<svg width="10" height="10"><use href="#i-x"/></svg>';
    x.onclick = ev => {
      ev.stopPropagation();
      const i = state.openTabs.findIndex(tt => tt.id === t.id);
      if(i >= 0) state.openTabs.splice(i, 1);
      if(state.activeTabId === t.id){
        state.activeTabId = state.openTabs.length ? state.openTabs[state.openTabs.length-1].id : null;
        if(state.activeTabId) openFile(findNode(state.activeTabId));
        else { codeInput.value = ''; updateHighlight(); }
      }
      renderTabs();
    };
    el.appendChild(x);
    el.onclick = () => {
      state.activeTabId = t.id;
      state.selectedFileId = t.id;
      renderTabs();
      loadEditor(node);
      renderTree();
    };
    tabBar.appendChild(el);
  }
}

function loadEditor(node){
  codeInput.value = node.data || '';
  updateHighlight();
  setStatus('Editing ' + node.name);
}

let _charW = 0;
function measureCharW(){
  if(_charW) return _charW;
  const span = document.createElement('span');
  span.style.cssText = 'position:absolute;visibility:hidden;font:12.5px/1.55 ' + getComputedStyle(document.body).fontFamily;
  span.style.fontFamily = 'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
  span.textContent = 'MMMMMMMMMM';
  document.body.appendChild(span);
  _charW = span.getBoundingClientRect().width / 10;
  span.remove();
  return _charW;
}

function updateHighlight(){
  const node = findNode(state.activeTabId);
  const kind = node ? node.kind : 'text';
  const text = codeInput.value;
  highlightEl.innerHTML = '<code>' + highlightCode(text, kind) + '\n</code>';
  const lines = text.split('\n').length;
  let g = '';
  for(let i = 1; i <= lines; i++) g += '<div>' + i + '</div>';
  gutterEl.innerHTML = g;
  highlightEl.scrollTop = codeInput.scrollTop;
  highlightEl.scrollLeft = codeInput.scrollLeft;
  gutterEl.scrollTop = codeInput.scrollTop;
}

codeInput.addEventListener('input', () => {
  updateHighlight();
  const node = findNode(state.activeTabId);
  if(!node) return;
  node.data = codeInput.value;
  node.size = codeInput.value.length;
  scheduleSave();
  scheduleFileSave(node);
  hideAutocomplete();
});

let _fileSaveT = null;
function scheduleFileSave(node){
  clearTimeout(_fileSaveT);
  _fileSaveT = setTimeout(async () => {
    await FileStore.put(node.id, node.data);
    setStatus('Saved ' + node.name);
    updateStatusBar();
  }, 600);
}

codeInput.addEventListener('scroll', () => {
  highlightEl.scrollTop = codeInput.scrollTop;
  highlightEl.scrollLeft = codeInput.scrollLeft;
  gutterEl.scrollTop = codeInput.scrollTop;
  hideAutocomplete();
});

codeInput.addEventListener('keydown', e => {
  const meta = e.metaKey || e.ctrlKey;

  if(meta && (e.key === 'f' || e.key === 'h')){ e.preventDefault(); toggleFind(true); return; }
  if(meta && e.key === 'g'){ e.preventDefault(); findNext(); return; }
  if(meta && e.key === 's'){
    e.preventDefault();
    const node = findNode(state.activeTabId);
    if(node){ node.data = codeInput.value; FileStore.put(node.id, node.data); toast('Saved ' + node.name); }
    return;
  }
  if(meta && e.key === ' '){ e.preventDefault(); showAutocomplete(); return; }
  if(e.key === 'Escape'){ hideAutocomplete(); findBar.classList.remove('show'); return; }
  if(e.key === 'Tab'){
    e.preventDefault();
    if(acEl.classList.contains('show') && acEl._items.length){ applyAutocomplete(); return; }
    const s = codeInput.selectionStart, en = codeInput.selectionEnd;
    codeInput.value = codeInput.value.slice(0, s) + '  ' + codeInput.value.slice(en);
    codeInput.selectionStart = codeInput.selectionEnd = s + 2;
    updateHighlight();
    return;
  }
  if(e.key === 'Enter'){
    if(acEl.classList.contains('show') && acEl._items.length){ e.preventDefault(); applyAutocomplete(); return; }
    // Auto-indent
    e.preventDefault();
    const s = codeInput.selectionStart;
    const before = codeInput.value.slice(0, s);
    const lineStart = before.lastIndexOf('\n') + 1;
    const line = before.slice(lineStart);
    const indentMatch = line.match(/^[ \t]*/);
    let indent = indentMatch ? indentMatch[0] : '';
    if(/[{(\[:]\s*$/.test(line)) indent += '  ';
    const insert = '\n' + indent;
    codeInput.value = codeInput.value.slice(0, s) + insert + codeInput.value.slice(codeInput.selectionEnd);
    codeInput.selectionStart = codeInput.selectionEnd = s + insert.length;
    updateHighlight();
    return;
  }
  if(e.key === 'ArrowUp' || e.key === 'ArrowDown'){
    if(acEl.classList.contains('show') && acEl._items.length){
      e.preventDefault(); moveAutocomplete(e.key === 'ArrowDown' ? 1 : -1); return;
    }
  }
  const pairs = { '(':')', '[':']', '{':'}', '"':'"', "'":"'" };
  if(pairs[e.key]){
    const s = codeInput.selectionStart, en = codeInput.selectionEnd;
    e.preventDefault();
    if(s !== en){
      const sel = codeInput.value.slice(s, en);
      codeInput.value = codeInput.value.slice(0, s) + e.key + sel + pairs[e.key] + codeInput.value.slice(en);
      codeInput.selectionStart = s + 1;
      codeInput.selectionEnd = en + 1;
    } else {
      codeInput.value = codeInput.value.slice(0, s) + e.key + pairs[e.key] + codeInput.value.slice(s);
      codeInput.selectionStart = codeInput.selectionEnd = s + 1;
    }
    updateHighlight();
    return;
  }
});

/* ============ AUTOCOMPLETE ============ */
let acIndex = 0, acFiltered = [];

function showAutocomplete(){
  const pos = codeInput.selectionStart;
  const before = codeInput.value.slice(0, pos);
  const wordMatch = before.match(/[A-Za-z_$][A-Za-z0-9_$]*$/);
  const prefix = wordMatch ? wordMatch[0] : '';

  const objNames = state.objects.map(o => o.name).filter(Boolean);
  const suggestions = [
    ...KEYWORDS.map(k => ({ label:k, kind:'keyword' })),
    ...GLOBALS.map(g => ({ label:g, kind:'global' })),
    ...CTX_PROPS.map(p => ({ label:p, kind:'ctx' })),
    ...THREE_PROPS.map(p => ({ label:p, kind:'three' })),
    ...objNames.map(n => ({ label:n, kind:'object' }))
  ];

  acFiltered = suggestions.filter(s => !prefix || s.label.toLowerCase().startsWith(prefix.toLowerCase())).slice(0, 60);
  if(!acFiltered.length){ hideAutocomplete(); return; }

  acEl.innerHTML = '';
  acFiltered.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'ac-item' + (i === 0 ? ' sel' : '');
    el.innerHTML = esc(s.label) + '<span class="k">' + s.kind + '</span>';
    el.onclick = () => { acIndex = i; applyAutocomplete(); };
    acEl.appendChild(el);
  });
  acIndex = 0;

  const rect = getCaretRect();
  acEl.style.left = rect.left + 'px';
  acEl.style.top = (rect.top + 18) + 'px';
  acEl.classList.add('show');
  acEl._items = acFiltered;
}

function getCaretRect(){
  const pos = codeInput.selectionStart;
  const before = codeInput.value.slice(0, pos);
  const lines = before.split('\n');
  const line = lines.length - 1;
  const col = lines[lines.length-1].length;
  const style = getComputedStyle(codeInput);
  const lh = parseFloat(style.lineHeight) || 19;
  const charW = measureCharW();
  const areaRect = $('#codeArea').getBoundingClientRect();
  const left = areaRect.left + 14 + col * charW - codeInput.scrollLeft;
  const top = areaRect.top + 10 + (line + 1) * lh - codeInput.scrollTop;
  return { left: clamp(left, areaRect.left + 4, areaRect.right - 230), top };
}

function moveAutocomplete(dir){
  acIndex = clamp(acIndex + dir, 0, acFiltered.length - 1);
  $$('#autocomplete .ac-item').forEach((el, i) => el.classList.toggle('sel', i === acIndex));
  const sel = $$('#autocomplete .ac-item')[acIndex];
  if(sel) sel.scrollIntoView({ block:'nearest' });
}

function applyAutocomplete(){
  const item = acFiltered[acIndex];
  if(!item) return;
  const pos = codeInput.selectionStart;
  const before = codeInput.value.slice(0, pos);
  const after = codeInput.value.slice(pos);
  const wordMatch = before.match(/[A-Za-z_$][A-Za-z0-9_$]*$/);
  const prefix = wordMatch ? wordMatch[0] : '';
  const newBefore = before.slice(0, before.length - prefix.length) + item.label;
  codeInput.value = newBefore + after;
  codeInput.selectionStart = codeInput.selectionEnd = newBefore.length;
  hideAutocomplete();
  updateHighlight();
}

function hideAutocomplete(){ acEl.classList.remove('show'); }
codeInput.addEventListener('blur', () => setTimeout(hideAutocomplete, 150));
codeInput.addEventListener('keyup', e => {
  if(e.key === 'Escape' || e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'Enter' || e.key === 'Tab') return;
  if(/[a-zA-Z_$]/.test(e.key)) showAutocomplete();
  else if(e.key === 'Backspace' || e.key === '.') hideAutocomplete();
});

/* ============ FIND / REPLACE ============ */
const findInput = $('#findInput');
const replaceInput = $('#replaceInput');

function toggleFind(show){
  findBar.classList.toggle('show', show);
  if(show) findInput.focus();
}
$('#findClose').onclick = () => findBar.classList.remove('show');
$('#findPrev').onclick = () => findPrev();
$('#findNext').onclick = () => findNext();
$('#replaceOne').onclick = () => replaceOne();
$('#replaceAll').onclick = () => replaceAll();

function findNext(){
  const q = findInput.value;
  if(!q) return;
  const start = codeInput.selectionEnd;
  let idx = codeInput.value.indexOf(q, start);
  if(idx < 0) idx = codeInput.value.indexOf(q);
  if(idx < 0){ toast('Not found'); return; }
  codeInput.focus();
  codeInput.setSelectionRange(idx, idx + q.length);
}
function findPrev(){
  const q = findInput.value;
  if(!q) return;
  const start = codeInput.selectionStart;
  const from = Math.max(0, start - 1);
  let idx = codeInput.value.lastIndexOf(q, from);
  if(idx < 0) idx = codeInput.value.lastIndexOf(q);
  if(idx < 0){ toast('Not found'); return; }
  codeInput.focus();
  codeInput.setSelectionRange(idx, idx + q.length);
}
function replaceOne(){
  const q = findInput.value, r = replaceInput.value;
  if(!q) return;
  const sel = codeInput.value.slice(codeInput.selectionStart, codeInput.selectionEnd);
  if(sel === q){
    const s = codeInput.selectionStart;
    codeInput.value = codeInput.value.slice(0, s) + r + codeInput.value.slice(codeInput.selectionEnd);
    codeInput.selectionStart = codeInput.selectionEnd = s + r.length;
  }
  findNext();
  updateHighlight();
  const node = findNode(state.activeTabId);
  if(node){ node.data = codeInput.value; scheduleFileSave(node); }
}
function replaceAll(){
  const q = findInput.value, r = replaceInput.value;
  if(!q) return;
  const count = codeInput.value.split(q).length - 1;
  codeInput.value = codeInput.value.split(q).join(r);
  updateHighlight();
  const node = findNode(state.activeTabId);
  if(node){ node.data = codeInput.value; scheduleFileSave(node); }
  toast('Replaced ' + count + ' occurrence' + (count === 1 ? '' : 's'));
}

const assetsGrid = $('#assetsGrid');

function renderAssets(){
  assetsGrid.innerHTML = '';
  const files = allFiles().filter(f => ['texture','model','audio','video','font'].includes(f.kind));
  if(!files.length){
    assetsGrid.innerHTML = '<div class="empty" style="grid-column:1/-1;padding:40px 20px">No assets yet.<br><br>Import files to get started.</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  const chunkSize = 100;
  let rendered = 0;
  function renderChunk(){
    const end = Math.min(rendered + chunkSize, files.length);
    for(let i = rendered; i < end; i++){
      const f = files[i];
      const card = document.createElement('div');
      card.className = 'asset-card' + (f.id === state.selectedFileId ? ' sel' : '');
      const prev = document.createElement('div');
      prev.className = 'preview';
      if(f.kind === 'texture' && f.data && typeof f.data === 'string' && f.data.startsWith('data:image')){
        prev.style.backgroundImage = 'url(' + f.data + ')';
      } else if(f.kind === 'texture'){
        FileStore.getURL(f.id).then(u => {
          if(u && /^(data:image|blob:)/.test(u)) prev.style.backgroundImage = 'url(' + u + ')';
        });
      } else {
        prev.innerHTML = `<svg width="24" height="24" style="color:${KIND_COLOR[f.kind]||'#8a8a92'}"><use href="#${KIND_ICON[f.kind]||'i-file'}"/></svg>`;
      }
      const ext = document.createElement('span');
      ext.className = 'ext';
      ext.textContent = (extOf(f.name) || '?').toUpperCase();
      prev.appendChild(ext);
      card.appendChild(prev);
      const info = document.createElement('div');
      info.className = 'info';
      const n = document.createElement('span');
      n.className = 'n'; n.textContent = f.name; n.title = f.name;
      info.appendChild(n);
      const s = document.createElement('span');
      s.className = 's';
      s.textContent = KIND_LABEL[f.kind] || f.kind;
      info.appendChild(s);
      card.appendChild(info);
      card.onclick = () => { state.selectedFileId = f.id; renderAssets(); renderTree(); };
      card.ondblclick = () => quickAddAsset(f);
      frag.appendChild(card);
    }
    rendered = end;
    if(rendered < files.length) requestAnimationFrame(renderChunk);
  }
  assetsGrid.appendChild(frag);
  renderChunk();
}

async function runTool(id){
  const item = getItem(state.selectedId);
  if(!item && id !== 'addWind'){ toast('Select an object first'); return; }

  if(id === 'scatter'){
    const count = parseInt(prompt('How many copies?', '12') || '0', 10);
    if(!count) return;
    const radius = parseFloat(prompt('Radius?', '5') || '5');
    for(let i = 0; i < count; i++){
      const dup = JSON.parse(JSON.stringify({
        id: uid('o'), name: item.name + '_' + i, type: item.type, asset: item.asset,
        position: item.object3d.position.toArray(), rotation: item.object3d.rotation.toArray().slice(0,3),
        scale: item.object3d.scale.toArray(), visible: true,
        material: item.material, scripts: item.scripts.slice()
      }));
      const a = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random()) * radius;
      dup.position[0] += Math.cos(a) * r;
      dup.position[2] += Math.sin(a) * r;
      dup.rotation[1] += Math.random() * Math.PI * 2;
      const s = 0.7 + Math.random() * 0.6;
      dup.scale = [dup.scale[0]*s, dup.scale[1]*s, dup.scale[2]*s];
      addObjectFromDef(dup, false);
    }
    toast('Scattered ' + count);
    scheduleSave();
  }
  else if(id === 'grid'){
    const n = parseInt(prompt('Grid size (NxN)?', '3') || '3', 10);
    const sp = parseFloat(prompt('Spacing?', '2') || '2');
    const off = (n - 1) * sp / 2;
    for(let x = 0; x < n; x++){
      for(let z = 0; z < n; z++){
        if(x === 0 && z === 0) continue;
        const dup = JSON.parse(JSON.stringify({
          id: uid('o'), name: item.name + '_' + x + '_' + z, type: item.type, asset: item.asset,
          position: item.object3d.position.toArray(), rotation: item.object3d.rotation.toArray().slice(0,3),
          scale: item.object3d.scale.toArray(), visible: true,
          material: item.material, scripts: item.scripts.slice()
        }));
        dup.position[0] += x * sp - off;
        dup.position[2] += z * sp - off;
        addObjectFromDef(dup, false);
      }
    }
    toast('Created grid');
    scheduleSave();
  }
  else if(id === 'snapGround'){
    item.object3d.position.y = item.object3d.scale.y / 2;
    renderInspector(); scheduleSave();
  }
  else if(id === 'frame'){
    const box = new THREE.Box3().setFromObject(item.object3d);
    const c = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const dist = maxDim * 2.2;
    editorCam.position.set(c.x + dist*0.7, c.y + dist*0.5, c.z + dist*0.7);
    controls.target.copy(c);
    controls.update();
  }
  else if(id === 'bakeTransform'){
    // Apply the world transform to children and reset
    const o = item.object3d;
    o.updateMatrixWorld(true);
    const m = o.matrix.clone();
    o.position.set(0,0,0); o.rotation.set(0,0,0); o.scale.set(1,1,1);
    o.updateMatrix();
    o.traverse(c => {
      if(c !== o && c.isMesh){
        c.geometry = c.geometry.clone();
        c.geometry.applyMatrix4(m);
      }
    });
    renderInspector(); scheduleSave();
    toast('Baked');
  }
  else if(id === 'addWind'){
    const shaders = allFiles().filter(f => f.kind === 'shader' && /wind|leaf|grass/i.test(f.name));
    let shader = shaders[0];
    if(!shader){
      const folder = ensureFolder(['Shaders']);
      shader = makeFile('wind_leaf.gdshader', 'shader', WIND_LEAF_SHADER);
      folder.children.push(shader);
      FileStore.put(shader.id, shader.data);
      renderShaders(); renderTree();
    }
    const targets = item ? [item] : state.objects;
    for(const t of targets){
      if(t.scripts.indexOf(shader.id) < 0) t.scripts.push(shader.id);
    }
    toast('Wind applied to ' + targets.length + ' object(s)');
    renderInspector(); scheduleSave();
  }
  else if(id === 'randomize'){
    for(const t of state.objects){
      if(t === item || t.type === item.type){
        t.object3d.rotation.y += Math.random() * Math.PI * 2;
        const s = 0.8 + Math.random() * 0.4;
        t.object3d.scale.multiplyScalar(s);
      }
    }
    renderInspector(); scheduleSave();
  }
  else if(id === 'flatten'){
    toast('Flatten is not available for all model types');
  }
}

/* ============ RENDER LOOP ============ */
let fpsAcc = 0, fpsFrames = 0;
let lastT = performance.now();
const clock = new THREE.Clock();
let playTime = 0;

function loop(){
  const now = performance.now();
  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;
  fpsAcc += dt; fpsFrames++;
  if(fpsAcc >= 0.4){
    const fpsValue = Math.round(fpsFrames / fpsAcc);
    fpsAcc = 0; fpsFrames = 0;
    $('#hudFps').textContent = fpsValue + ' fps';
    $('#playStats').textContent = fpsValue + ' fps';
  }
  if(state.playing){ playTime += dt; runScriptUpdates(dt, playTime); }
  controls.update();
  for(const it of state.objects){
    const h = it.object3d.userData.__helper;
    if(h && h.update) h.update();
  }
  renderer.render(scene, state.playing ? gameCam : editorCam);
}
renderer.setAnimationLoop(loop);

/* ============ SCRIPT RUNTIME ============ */
let scriptInstances = [];
const keyState = {};
window.addEventListener('keydown', e => { keyState[e.key] = true; });
window.addEventListener('keyup', e => { keyState[e.key] = false; });

function makeCtx(item){
  return {
    object: item.object3d, scene, camera: gameCam, renderer, THREE,
    input: { keys: keyState, isDown: k => !!keyState[k] },
    time: 0, delta: 0,
    find: name => scene.getObjectByName(name)
  };
}

async function startScripts(){
  scriptInstances = [];
  for(const item of state.objects){
    for(const sid of (item.scripts||[])){
      const f = findNode(sid);
      if(!f || f.kind === 'shader') continue;
      let data = f.data;
      if(data == null){
        const d = await FileStore.get(f.id);
        data = typeof d === 'string' ? d : (d instanceof Blob ? await d.text() : '');
      }
      if(!data) continue;
      try{
        const factory = new Function('ctx', 'THREE',
          '"use strict";\n' + data +
          '\n;return { init: (typeof init === "function") ? init : null, update: (typeof update === "function") ? update : null };');
        const mod = factory(makeCtx(item), THREE);
        const inst = { item, mod, ctx: makeCtx(item) };
        scriptInstances.push(inst);
        if(mod.init) mod.init(inst.ctx);
      } catch(err){
        console.error('Script error in ' + f.name, err);
        toast('Script error: ' + f.name);
      }
    }
  }
  if(scriptInstances.length) setStatus('Running ' + scriptInstances.length + ' script(s)');
}

function runScriptUpdates(dt, t){
  for(const inst of scriptInstances){
    inst.ctx.time = t;
    inst.ctx.delta = dt;
    if(inst.mod.update){
      try{ inst.mod.update(inst.ctx, dt); }
      catch(e){ console.error(e); }
    }
  }
}

      if(isTextKind(kind)) openFile(node);
      scheduleSave();
      toast('Created ' + name);
    }
    else if(act === 'newFolder'){
      const name = prompt('Folder name:');
      if(!name) return;
      const parent = (state.currentFolderId && findNode(state.currentFolderId)) || state.root;
      const folder = parent.type === 'folder' ? parent : state.root;
      folder.children = folder.children || [];
      folder.children.push({ id: uid('d'), type:'folder', name, children:[], expanded:true });
      renderTree();
      scheduleSave();
      toast('Created folder ' + name);
    }
    else if(act === 'rename'){
      const node = state.selectedFileId && findNode(state.selectedFileId);
      if(!node){ toast('Select a file or folder'); return; }
      const name = prompt('Rename to:', node.name);
      if(!name || name === node.name) return;
      node.name = name;
      if(node.type === 'file') node.kind = kindOf(name);
      renderTree(); renderTabs();
      scheduleSave();
    }
    else if(act === 'delete'){
      const node = state.selectedFileId && findNode(state.selectedFileId);
      if(!node || node.id === 'root') return;
      const parent = findParent(node.id);
      if(!parent) return;
      if(!confirm('Delete "' + node.name + '"?')) return;
      const i = parent.children.indexOf(node);
      if(i >= 0) parent.children.splice(i, 1);
      state.selectedFileId = null;
      const ids = [];
      walkFiles(node, f => ids.push(f.id));
      ids.forEach(id => FileStore.del(id));
      // Remove references from objects
      state.objects.forEach(o => {
        let changed = false;
        for(let k = o.scripts.length - 1; k >= 0; k--){
          if(ids.includes(o.scripts[k])){ o.scripts.splice(k, 1); changed = true; }
        }
        if(ids.includes(o.asset)) o.asset = null;
        if(changed) renderInspector();
      });
      renderTree(); scheduleSave();
      toast('Deleted ' + node.name);
    }
  };
});

function readAsDataURL(f){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); }); }

async function runScripts(built){

    for(const sid of def.scripts){

  }
}

/* ============ ZIP EXPORT ============ */
const CRC = (() => { const t = new Uint32Array(256); for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; } return t; })();
function crc32(buf){ let c = 0xFFFFFFFF; for(let i = 0; i < buf.length; i++) c = CRC[(c ^ buf[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

function buildZip(entries){
  const enc = new TextEncoder();
  const chunks = [];
  const central = [];
  let offset = 0;
  const DOS_TIME = ((12 << 11) | (0 << 5) | 0) & 0xffff;
  const DOS_DATE = (((2026 - 1980) << 9) | (1 << 5) | 1) & 0xffff;

  for(const e of entries){
    const nameBytes = enc.encode(e.name);
    const data = e.data;
    const crc = crc32(data);

    // Local header
    const local = new Uint8Array(30 + nameBytes.length);
    const dv = new DataView(local.buffer);
    dv.setUint32(0, 0x04034b50, true);   // signature
    dv.setUint16(4, 20, true);            // version needed
    dv.setUint16(6, 0x0800, true);        // UTF-8 flag
    dv.setUint16(8, 0, true);             // compression: store
    dv.setUint16(10, DOS_TIME, true);
    dv.setUint16(12, DOS_DATE, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, data.length, true);
    dv.setUint32(22, data.length, true);
    dv.setUint16(26, nameBytes.length, true);
    dv.setUint16(28, 0, true);
    local.set(nameBytes, 30);
    chunks.push(local, data);

    // Central directory entry
    const cd = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);            // version made by
    cv.setUint16(6, 20, true);            // version needed
    cv.setUint16(8, 0x0800, true);        // UTF-8 flag
    cv.setUint16(10, 0, true);            // compression: store
    cv.setUint16(12, DOS_TIME, true);
    cv.setUint16(14, DOS_DATE, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);            // extra field length
    cv.setUint16(32, 0, true);            // comment length
    cv.setUint16(34, 0, true);            // disk number
    cv.setUint16(36, 0, true);            // internal attributes
    cv.setUint32(38, 0, true);            // external attributes
    cv.setUint32(42, offset, true);
    cd.set(nameBytes, 46);
    central.push(cd);

    offset += local.length + data.length;
  }

  let centralSize = 0;
  for(const c of central) centralSize += c.length;

  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, entries.length, true);
  ev.setUint16(10, entries.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, offset, true);
  ev.setUint16(20, 0, true);

  return new Blob([...chunks, ...central, end], { type: 'application/zip' });
}

function dataURLToBytes(durl){
  const i = durl.indexOf(',');
  const b64 = durl.slice(i+1);
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
  return arr;
}

async function bytesOfFile(node){
  let data = node.data;
  if(data == null){
    const d = await FileStore.get(node.id);
    if(d instanceof Blob) return new Uint8Array(await d.arrayBuffer());
    data = d;
  }
  if(typeof data === 'string' && data.startsWith('data:')) return dataURLToBytes(data);
  if(typeof data === 'string') return new TextEncoder().encode(data);
  if(data instanceof Blob) return new Uint8Array(await data.arrayBuffer());
  return new Uint8Array(0);
}

/* Walk tree and collect files with their full relative paths */
function collectTreePaths(node, prefix, out){
  const items = node.children || [];
  for(const c of items){
    if(c.type === 'folder'){
      collectTreePaths(c, prefix + c.name + '/', out);
    } else {
      out.push({ node: c, path: prefix + c.name });
    }
  }
}

const safeName = s => String(s).replace(/[^a-zA-Z0-9._\-\/]/g, '_');

$('#btnExportZip').onclick = async () => {
  setStatus('Building ZIP…');
  const enc = new TextEncoder();
  const entries = [];

  // Standalone playable build
  entries.push({ name: 'index.html', data: enc.encode(await buildStandaloneHTML()) });

  // Project metadata
  const proj = {
    name: state.projectName, version: 3, generator: 'Forge',
    scene: serializeScene(), tree: state.root, objectCounter: state.objectCounter
  };
  entries.push({ name: 'project.json', data: enc.encode(JSON.stringify(proj, null, 2)) });

  // File manifest
  const manifest = { generated: new Date().toISOString(), files: [] };

  // Preserve folder tree
  const treePaths = [];
  collectTreePaths(state.root, '', treePaths);

  for(const { node: f, path } of treePaths){
    let bytes;
    try { bytes = await bytesOfFile(f); }
    catch(e){ console.warn('Skip ' + f.name, e); continue; }
    const safePath = safeName(path);
    entries.push({ name: safePath, data: bytes });
    manifest.files.push({ path: safePath, kind: f.kind, size: bytes.length });
  }

  entries.push({ name: 'manifest.json', data: enc.encode(JSON.stringify(manifest, null, 2)) });

  // README
  const readme = [
    '# ' + state.projectName,
    '',
    'Exported from **Forge** — a browser-based game development environment.',
    '',
    '## Contents',
    '',
    '- `index.html` — Standalone playable build. Open directly in a browser.',
    '- `project.json` — Full project state (scene graph + asset tree).',
    '- `manifest.json` — File listing with sizes.',
    '- Project folders — Mirrors your Explorer tree exactly.',
    '',
    '## Deploy',
    '',
    'Push to GitHub and enable Pages, or upload to any static host (Netlify, Vercel, Cloudflare).',
    '',
    '## Stats',
    '',
    '- Scene objects: ' + state.objects.length,
    '- Files exported: ' + manifest.files.length,
    '- Generated: ' + manifest.generated,
    ''
  ].join('\n');
  entries.push({ name: 'README.md', data: enc.encode(readme) });

  const blob = buildZip(entries);
  await download(safeName(state.projectName || 'project') + '.zip', blob, 'application/zip');
  toast('Exported ' + entries.length + ' files');
  setStatus('ZIP export complete');
};

/* ============ AUTOSAVE ============ */
document.addEventListener('visibilitychange', () => { if(document.hidden) persist(); });
window.addEventListener('beforeunload', () => { persist(); });

/* ============ PREVENT GESTURES ============ */
document.addEventListener('gesturestart', e => {
  if(e.target.closest && (e.target.closest('#codeArea') || e.target.closest('#shaderEditor'))) return;
  e.preventDefault();
});

/* ============ BOOT ============ */
boot().then(() => {
  console.log('%cForge', 'color:#4a9eff;font-weight:600', 'ready');
});
