    scheduleSave();
  });

  /* ---------- Loaders ---------- */
  const _loaderCache = {};
  async function loaderFor(name, path){
    if(_loaderCache[name]) return _loaderCache[name];
    try {
      const mod = await import(`three/addons/loaders/${path}`);
      const C = mod[name];
      _loaderCache[name] = C;
      return C;
    } catch(e){ console.warn('Loader unavailable:', name); return null; }
  }
  async function loadModelByExt(file){
    const ext = extOf(file.name);
    const url = await FileStore.getURL(file.id);
    if(!url) throw new Error('No URL');
    if(ext === 'glb' || ext === 'gltf'){
      const L = await loaderFor('GLTFLoader','GLTFLoader.js');
      const g = await new L().loadAsync(url); return g.scene;
    }
    if(ext === 'obj'){
      const L = await loaderFor('OBJLoader','OBJLoader.js');
      return await new L().loadAsync(url);
    }
    if(ext === 'fbx'){
      const L = await loaderFor('FBXLoader','FBXLoader.js');
      return await new L().loadAsync(url);
    }
    if(ext === 'stl'){
      const L = await loaderFor('STLLoader','STLLoader.js');
      const geo = await new L().loadAsync(url); geo.computeVertexNormals();
      return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color:0xc0c0c8, roughness:0.6, metalness:0.1 }));
    }
    if(ext === 'ply'){
      const L = await loaderFor('PLYLoader','PLYLoader.js');
      const geo = await new L().loadAsync(url); geo.computeVertexNormals();
      const hasColors = geo.attributes.color !== undefined;
      return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: hasColors ? 0xffffff : 0xb0b0b8, vertexColors: hasColors, roughness:0.7, metalness:0.05 }));
    }
    throw new Error('Unsupported .' + ext);
  }

  const texLoader = new THREE.TextureLoader();
  const _texCache = new Map();
  async function getTextureCached(file, srgb){
    const key = file.id + (srgb ? '_s' : '_l');
    if(_texCache.has(key)) return _texCache.get(key);
    const url = await FileStore.getURL(file.id);
    if(!url) return null;
    const t = await texLoader.loadAsync(url);
    t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    _texCache.set(key, t);
    return t;
  }

  /* ---------- Stylized material helpers ---------- */
  // Toon shader material — 3-tone cel shading
  function makeToonMaterial(color, bands, shadowTint){
    const c = new THREE.Color(color);
    const sh = new THREE.Color(shadowTint);
    return new THREE.ShaderMaterial({
      uniforms:{
        uColor: { value: c },
        uShadowColor: { value: sh },
        uBands: { value: bands }
      },
      vertexShader:`
        varying vec3 vNormal;
        varying vec3 vViewPos;
        void main(){
          vNormal = normalize(normalMatrix * normal);
          vec4 mv = modelViewMatrix * vec4(position,1.0);
          vViewPos = -mv.xyz;
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader:`
        uniform vec3 uColor;
        uniform vec3 uShadowColor;
        uniform float uBands;
        varying vec3 vNormal;
        varying vec3 vViewPos;
        void main(){
          vec3 N = normalize(vNormal);
          vec3 L = normalize(vec3(0.5, 0.9, 0.4));
          float ndl = max(dot(N, L), 0.0);
          float stepped = floor(ndl * uBands) / uBands;
          vec3 col = mix(uShadowColor * uColor, uColor, stepped);
          // Simple fresnel rim
          float fres = pow(1.0 - max(dot(N, normalize(vViewPos)), 0.0), 3.0);
          col += vec3(0.15) * fres;
          gl_FragColor = vec4(col, 1.0);
          #include <colorspace_fragment>
        }`,
      fog:true
    });
  }

  /* ---------- Procedural geometry library ---------- */
  // Seeded pseudo-random for deterministic generation
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function geoRock(seed=1){
    const rng = mulberry32(seed);
    const geo = new THREE.IcosahedronGeometry(0.5, 1);
    const pos = geo.attributes.position;
    for(let i = 0; i < pos.count; i++){
      const v = new THREE.Vector3().fromBufferAttribute(pos, i);
      const n = 0.7 + rng() * 0.6;
      v.multiplyScalar(n);
      // flatten bottom a bit
      if(v.y < -0.1) v.y *= 0.6;
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    geo.computeVertexNormals();
    return geo;
  }

  function geoTreeTrunk(height=1, radius=0.08){
    const geo = new THREE.CylinderGeometry(radius*0.7, radius, height, 8, 1);
    return geo;
  }

  function geoTreeFoliage(seed=1, style='round'){
    const rng = mulberry32(seed);
    if(style === 'pine'){
      // Cone stack
      const group = new THREE.Group();
      return group;
    }
    // Round cluster: several icosahedrons merged (as separate meshes we combine in a group)
    return null;
  }

  // Build a stylized round tree as a Group
  function buildTreeRound(seed=1, palette={ leaf:'#4a7a30', trunk:'#5a4030' }){
    const rng = mulberry32(seed);
    const group = new THREE.Group();
    // Trunk
    const trunkH = 1.6 + rng() * 0.6;
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.08, 0.13, trunkH, 6, 1),
      new THREE.MeshStandardMaterial({ color: palette.trunk, roughness: 0.9, flatShading:true })
    );
    trunk.position.y = trunkH / 2;
    trunk.castShadow = true; trunk.receiveShadow = true;
    group.add(trunk);

    // Foliage clusters (3-5 spheres)
    const clusterCount = 3 + Math.floor(rng() * 3);
    const leafMat = new THREE.MeshStandardMaterial({ color: palette.leaf, roughness: 0.85, flatShading:true });
    for(let i = 0; i < clusterCount; i++){
      const r = 0.5 + rng() * 0.4;
      const sphere = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), leafMat);
      const angle = (i / clusterCount) * Math.PI * 2 + rng() * 0.5;
      const dist = 0.15 + rng() * 0.3;
      sphere.position.set(
        Math.cos(angle) * dist,
        trunkH + 0.15 + rng() * 0.4,
        Math.sin(angle) * dist
      );
      // squash a bit
      sphere.scale.set(1, 0.85 + rng() * 0.15, 1);
      sphere.castShadow = true; sphere.receiveShadow = true;
      group.add(sphere);
    }
    return group;
  }

  function buildTreePine(seed=1, palette={ leaf:'#2d5a2a', trunk:'#4a3020' }){
    const rng = mulberry32(seed);
    const group = new THREE.Group();
    const trunkH = 1.8 + rng() * 0.6;
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.07, 0.11, trunkH, 6, 1),
      new THREE.MeshStandardMaterial({ color: palette.trunk, roughness: 0.9, flatShading:true })
    );
    trunk.position.y = trunkH / 2;
    trunk.castShadow = true; trunk.receiveShadow = true;
    group.add(trunk);

    const leafMat = new THREE.MeshStandardMaterial({ color: palette.leaf, roughness: 0.85, flatShading:true });
    const layers = 3 + Math.floor(rng() * 2);
    for(let i = 0; i < layers; i++){
      const t = i / layers;
      const r = 0.7 * (1 - t * 0.7);
      const h = 0.7;
      const cone = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7, 1), leafMat);
      cone.position.y = trunkH * 0.6 + i * 0.55 + h * 0.5;
      cone.castShadow = true; cone.receiveShadow = true;
      group.add(cone);
    }
    return group;
  }

  function buildTreeAutumn(seed=1){
    return buildTreeRound(seed, { leaf:'#d97a3a', trunk:'#5a4030' });
  }

  function buildBush(seed=1){
    const rng = mulberry32(seed);
    const group = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color:'#3a6a28', roughness:0.9, flatShading:true });
    const n = 3 + Math.floor(rng() * 3);
    for(let i = 0; i < n; i++){
      const r = 0.3 + rng() * 0.2;
      const s = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), mat);
      s.position.set((rng() - 0.5) * 0.4, 0.25 + rng() * 0.15, (rng() - 0.5) * 0.4);
      s.scale.y = 0.75;
      s.castShadow = true; s.receiveShadow = true;
      group.add(s);
    }
    return group;
  }

  function buildGrassBlade(){
    // Crossed quads for a billboard-ish grass tuft
    const group = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color:'#5a9a3a', roughness:0.9, side:THREE.DoubleSide, transparent:false, flatShading:true });
    const bladeCount = 3;
    for(let i = 0; i < bladeCount; i++){
      const h = 0.35 + Math.random() * 0.25;
      const w = 0.06;
      const geo = new THREE.PlaneGeometry(w, h);
      geo.translate(0, h / 2, 0);
      const m = new THREE.Mesh(geo, mat);
      m.rotation.y = (i / bladeCount) * Math.PI;
      group.add(m);
    }
    return group;
  }

  function buildFlower(seed=1, color='#f0776c'){
    const group = new THREE.Group();
    const stem = new THREE.Mesh(
      new THREE.CylinderGeometry(0.012, 0.015, 0.35, 4),
      new THREE.MeshStandardMaterial({ color:'#3a6a28', roughness:0.9 })
    );
    stem.position.y = 0.175;
    group.add(stem);
    const petalMat = new THREE.MeshStandardMaterial({ color, roughness:0.8, emissive:new THREE.Color(color).multiplyScalar(0.1) });
    const petalCount = 4 + Math.floor(Math.random() * 2);
    for(let i = 0; i < petalCount; i++){
      const angle = (i / petalCount) * Math.PI * 2;
      const petal = new THREE.Mesh(new THREE.IcosahedronGeometry(0.06, 0), petalMat);
      petal.position.set(Math.cos(angle) * 0.07, 0.36, Math.sin(angle) * 0.07);
      petal.scale.y = 0.4;
      group.add(petal);
    }
    const center = new THREE.Mesh(new THREE.IcosahedronGeometry(0.04, 0),
      new THREE.MeshStandardMaterial({ color:'#ffdd66', roughness:0.8, emissive:new THREE.Color('#ffdd66').multiplyScalar(0.2) }));
    center.position.y = 0.38;
    group.add(center);
    return group;
  }

  function buildMushroom(seed=1){
    const group = new THREE.Group();
    const rng = mulberry32(seed);
    const stemH = 0.18 + rng() * 0.1;
    const stem = new THREE.Mesh(
      new THREE.CylinderGeometry(0.03, 0.04, stemH, 6),
      new THREE.MeshStandardMaterial({ color:'#e8e0d0', roughness:0.9 })
    );
    stem.position.y = stemH / 2;
    group.add(stem);
    const cap = new THREE.Mesh(
      new THREE.SphereGeometry(0.11, 8, 6, 0, Math.PI * 2, 0, Math.PI / 2),
      new THREE.MeshStandardMaterial({ color:'#d94a3a', roughness:0.8, flatShading:true })
    );
    cap.position.y = stemH;
    cap.scale.y = 0.7;
    group.add(cap);
    // White spots
    const dotMat = new THREE.MeshStandardMaterial({ color:'#f0e8d0', roughness:0.9 });
    for(let i = 0; i < 3; i++){
      const dot = new THREE.Mesh(new THREE.SphereGeometry(0.018, 6, 4), dotMat);
      const a = rng() * Math.PI * 2;
      const r = rng() * 0.06;
      dot.position.set(Math.cos(a) * r, stemH + 0.07, Math.sin(a) * r);
      group.add(dot);
    }
    return group;
  }

  /* ---------- Geometry registry ---------- */
  const GEOM = {
    box: () => new THREE.BoxGeometry(1,1,1,4,4,4),
    sphere: () => new THREE.SphereGeometry(0.5, 32, 24),
    plane: () => new THREE.PlaneGeometry(1,1,20,20),
    cylinder: () => new THREE.CylinderGeometry(0.5,0.5,1,24,4),
    cone: () => new THREE.ConeGeometry(0.5,1,24,4),
    torus: () => new THREE.TorusGeometry(0.4,0.16,20,40),
    capsule: () => new THREE.CapsuleGeometry(0.35,0.5,6,16),
    ring: () => new THREE.RingGeometry(0.25,0.5,40),
    icosahedron: () => new THREE.IcosahedronGeometry(0.5,0),
    dodecahedron: () => new THREE.DodecahedronGeometry(0.5,0),
    octahedron: () => new THREE.OctahedronGeometry(0.5,0),
    tetrahedron: () => new THREE.TetrahedronGeometry(0.5,0),
    torusKnot: () => new THREE.TorusKnotGeometry(0.35,0.1,80,12)
  };

  /* ---------- Object management ---------- */
  function getItem(id){ return state.objects.find(o => o.id === id) || null; }
  function tagObj(obj, id){ obj.traverse(o => { o.userData.itemId = id; }); }

  function applyMaterialProps(mat, m){
    if(m.shading === 'toon'){
      // Toon: swap to our custom shader material; store standard props on the object anyway
      // We'll create a fresh toon material in createObject3D
    }
    mat.color = new THREE.Color(m.color || '#ffffff');
    if(mat.metalness !== undefined) mat.metalness = m.metalness;
    if(mat.roughness !== undefined) mat.roughness = m.roughness;
    mat.opacity = m.opacity; mat.transparent = m.transparent || m.opacity < 1;
    if(mat.emissive) mat.emissive = new THREE.Color(m.emissive || '#000000');
    if(mat.emissiveIntensity !== undefined) mat.emissiveIntensity = m.emissiveIntensity;
    if(mat.wireframe !== undefined) mat.wireframe = m.wireframe;
    if(mat.flatShading !== undefined) mat.flatShading = m.flatShading;
    if(mat.side !== undefined) mat.side = m.side === 'double' ? THREE.DoubleSide : THREE.FrontSide;
    if(mat.depthWrite !== undefined) mat.depthWrite = m.depthWrite;
    if(mat.depthTest !== undefined) mat.depthTest = m.depthTest;
    if(mat.alphaTest !== undefined) mat.alphaTest = m.alphaTest;
    if(mat.envMapIntensity !== undefined) mat.envMapIntensity = m.envMapIntensity;
    if(mat.clearcoat !== undefined){ mat.clearcoat = m.clearcoat; mat.clearcoatRoughness = m.clearcoatRoughness; }
    if(mat.sheen !== undefined){ mat.sheen = m.sheen; mat.sheenColor = new THREE.Color(m.sheenColor); mat.sheenRoughness = m.sheenRoughness; }
    if(mat.transmission !== undefined){ mat.transmission = m.transmission; mat.thickness = m.thickness; mat.ior = m.ior; }
    if(mat.iridescence !== undefined){ mat.iridescence = m.iridescence; mat.iridescenceIOR = m.iridescenceIOR; }
    if(mat.specularIntensity !== undefined){ mat.specularIntensity = m.specularIntensity; mat.specularColor = new THREE.Color(m.specularColor); }
    if(mat.anisotropy !== undefined){ mat.anisotropy = m.anisotropy; mat.anisotropyRotation = m.anisotropyRotation; }
    mat.needsUpdate = true;
  }

  function makeMaterial(m){
    if(m.shading === 'toon'){
      return makeToonMaterial(m.color, m.toonBands, m.toonShadowTint);
    }
    if(m.shading === 'unlit'){
      return new THREE.MeshBasicMaterial({ color:new THREE.Color(m.color), side: m.side === 'double' ? THREE.DoubleSide : THREE.FrontSide });
    }
    const mat = new THREE.MeshPhysicalMaterial({});
    applyMaterialProps(mat, m);
    return mat;
  }

  async function assignTextureSlot(item, slot, fileId, srgb){
    const mat = item.object3d.material;
    if(!mat || !mat.isMeshStandardMaterial && !mat.isMeshPhysicalMaterial) {
      // toon/unlit shaders don't have texture slots — create a physical variant
      if(!fileId){ item.material[slot] = null; return; }
      const newMat = new THREE.MeshPhysicalMaterial({});
      applyMaterialProps(newMat, item.material);
      item.object3d.traverse(o => { if(o.isMesh) o.material = newMat; });
    }
    const target = item.object3d.material || (() => {
      const m = new THREE.MeshPhysicalMaterial({});
      item.object3d.traverse(o => { if(o.isMesh) o.material = m; });
      return m;
    })();
    if(!fileId){ target[slot] = null; item.material[slot] = null; target.needsUpdate = true; return; }
    const f = findNode(fileId);
    if(!f) return;
    const tex = await getTextureCached(f, srgb);
    if(!tex) return;
    target[slot] = tex;
    item.material[slot] = fileId;
    target.needsUpdate = true;
  }

  /* ---------- Procedural object type → object3D ---------- */
  function createProcedural(type, seed=1){
    switch(type){
      case 'tree_round': return buildTreeRound(seed);
      case 'tree_pine': return buildTreePine(seed);
      case 'tree_autumn': return buildTreeAutumn(seed);
      case 'bush': return buildBush(seed);
      case 'grass_tuft': return buildGrassBlade();
      case 'flower': return buildFlower(seed);
      case 'flower_red': return buildFlower(seed, '#e04a5a');
      case 'flower_pink': return buildFlower(seed, '#ff8ab0');
      case 'flower_yellow': return buildFlower(seed, '#ffd94a');
      case 'mushroom': return buildMushroom(seed);
      case 'rock': {
        const m = new THREE.Mesh(geoRock(seed), new THREE.MeshStandardMaterial({ color:0xa8a8a0, roughness:0.85, flatShading:true }));
        m.castShadow = true; m.receiveShadow = true;
        return m;
      }
      default: return null;
    }
  }

  function createObject3D(def){
    let obj;
    const m = def.material || materialDefaults();
    const seed = def.seed || (Math.random() * 1e6 | 0);

    // Procedural nature objects
    if(['tree_round','tree_pine','tree_autumn','bush','grass_tuft','flower','flower_red','flower_pink','flower_yellow','mushroom','rock'].includes(def.type)){
      obj = createProcedural(def.type, seed);
      if(obj && obj.isMesh){
        const mat = makeMaterial(m);
        obj.material = mat;
      } else if(obj){
        // Group: apply material to all meshes
        obj.traverse(c => {
          if(c.isMesh){
            const mat = makeMaterial(m);
            // preserve flatShading for stylized look
            if(mat.isMeshStandardMaterial || mat.isMeshPhysicalMaterial) mat.flatShading = true;
            c.material = mat;
            c.castShadow = true; c.receiveShadow = true;
          }
        });
      }
    } else if(def.type === 'light'){
      obj = new THREE.DirectionalLight(new THREE.Color(m.color), m.intensity);
      obj.castShadow = true;
      obj.shadow.mapSize.set(2048,2048);
      obj.shadow.camera.near = 0.5; obj.shadow.camera.far = 120;
      const d = 30;
      obj.shadow.camera.left = -d; obj.shadow.camera.right = d;
      obj.shadow.camera.top = d; obj.shadow.camera.bottom = -d;
      obj.shadow.bias = -0.0005; obj.shadow.normalBias = 0.02;
      const h = new THREE.DirectionalLightHelper(obj, 0.5, 0xffcc66);
      h.name = '__lh'; helpers.add(h);
      obj.userData.__helper = h;
    } else if(def.type === 'pointLight'){
      obj = new THREE.PointLight(new THREE.Color(m.color), m.intensity, 0, 2);
    } else if(def.type === 'spotLight'){
      obj = new THREE.SpotLight(new THREE.Color(m.color), m.intensity);
    } else if(def.type === 'ambientLight'){
      obj = new THREE.AmbientLight(new THREE.Color(m.color), m.intensity);
    } else if(def.type === 'model'){
      obj = new THREE.Group();
    } else {
      const mat = makeMaterial(m);
      obj = new THREE.Mesh((GEOM[def.type] || GEOM.box)(), mat);
      obj.castShadow = true; obj.receiveShadow = true;
    }
    if(!obj) obj = new THREE.Group();
    obj.name = def.name;
    obj.position.fromArray(def.position||[0,0,0]);
    obj.rotation.fromArray(def.rotation||[0,0,0]);
    obj.scale.fromArray(def.scale||[1,1,1]);
    obj.visible = def.visible !== false;
    return obj;
  }

  async function loadModelAsset(item){
    const file = findNode(item.asset);
    if(!file) return;
    const group = item.object3d;
    while(group.children.length){
      const c = group.children.pop();
      c.traverse(o => { if(o.isMesh && o.geometry) o.geometry.dispose(); });
    }
    try{
      const loaded = await loadModelByExt(file);
      if(!loaded) throw new Error('Empty result');
      loaded.traverse(o => { if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
      group.add(loaded);
      tagObj(group, item.id);
      const box = new THREE.Box3().setFromObject(loaded);
      const size = new THREE.Vector3(); box.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z);
      if(maxDim > 4){ loaded.scale.multiplyScalar(2 / maxDim); }
      setStatus('Loaded ' + file.name);
    } catch(err){
      console.error(err);
      toast('Failed to load ' + file.name + ': ' + err.message);
    }
  }

  function addObjectFromDef(def, select=true){
    const obj = createObject3D(def);
    scene.add(obj);
    tagObj(obj, def.id);
    const item = {
      id: def.id, name: def.name, type: def.type,
      asset: def.asset || null,
      seed: def.seed || null,
      material: materialDefaults(def.material || {}),
      scripts: (def.scripts||[]).slice(),
      object3d: obj
    };
    state.objects.push(item);
    if(def.type === 'model' && def.asset){
      loadModelAsset(item);
    } else {
      ['map','normalMap','roughnessMap','metalnessMap','aoMap','emissiveMap','displacementMap','alphaMap'].forEach(slot => {
        if(item.material[slot]){
          const srgb = slot === 'map' || slot === 'emissiveMap';
          assignTextureSlot(item, slot, item.material[slot], srgb);
        }
      });
    }
    refreshHierarchy();
    updateStatusBar();
    if(select) selectObject(def.id);
    return item;
  }

  function removeObject(id){
    const idx = state.objects.findIndex(o => o.id === id);
    if(idx < 0) return;
    const item = state.objects[idx];
    if(transform.object === item.object3d) transform.detach();
    if(item.object3d.userData.__helper){
      helpers.remove(item.object3d.userData.__helper);
    }
    scene.remove(item.object3d);
    item.object3d.traverse(o => {
      if(o.isMesh){
        if(o.geometry) o.geometry.dispose();
        if(o.material){
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          mats.forEach(m => m.dispose && m.dispose());
        }
      }
    });
    state.objects.splice(idx, 1);
    state.selectedIds.delete(id);
    if(state.selectedId === id) selectObject(null);
    refreshHierarchy();
    updateStatusBar();
    scheduleSave();
  }

  function clearSceneObjects(){
    // Remove all objects without touching the file tree
    for(const item of [...state.objects]){
      if(transform.object === item.object3d) transform.detach();
      if(item.object3d.userData.__helper) helpers.remove(item.object3d.userData.__helper);
      scene.remove(item.object3d);
    }
    state.objects.length = 0;
    state.selectedIds.clear();
    state.selectedId = null;
    refreshHierarchy();
    updateStatusBar();
  }

  function syncSelectedFromObject(obj){
    // Called when TransformControls updates an object — mark save + inspector refresh
    const item = getItem(obj.userData.itemId);
    if(!item) return;
    // Item's transform is already the object3d's transform (shared ref)
  }

  function selectObject(id, opts){
    opts = opts || {};
    if(opts.additive && id){
      if(state.selectedIds.has(id)) state.selectedIds.delete(id);
      else state.selectedIds.add(id);
    } else if(opts.toggle && id){
      if(state.selectedIds.has(id)) state.selectedIds.delete(id);
      else state.selectedIds.add(id);
    } else {
      state.selectedIds.clear();
      if(id) state.selectedIds.add(id);
    }
    state.selectedId = id;
    const item = getItem(id);
    if(item && item.object3d && !state.playing){
      transform.attach(item.object3d);
      transform.enabled = true;
      transform.visible = true;
    } else {
      transform.detach();
    }
    renderInspector();
    refreshHierarchy();
    updateStatusBar();
  }

  function serializeScene(){
    return state.objects.map(it => ({
      id: it.id, name: it.name, type: it.type, asset: it.asset, seed: it.seed,
      position: it.object3d.position.toArray(),
      rotation: [it.object3d.rotation.x, it.object3d.rotation.y, it.object3d.rotation.z],
      scale: it.object3d.scale.toArray(),
      visible: it.object3d.visible,
      material: Object.assign({}, it.material),
      scripts: it.scripts.slice()
    }));
  }

  /* ---------- World (sky/lighting) ---------- */
  const World = {
    current: Object.assign({}, SKY_PRESETS.forest),
    apply(preset){
      this.current = Object.assign({}, preset);
      scene.background = new THREE.Color(preset.sky);
      scene.fog.color = new THREE.Color(preset.fog);
      scene.fog.near = preset.fogNear;
      scene.fog.far = preset.fogFar;
      skyMat.uniforms.topColor.value.set(preset.sky);
      skyMat.uniforms.bottomColor.value.set(preset.horizon);
      sun.color.set(preset.sunColor);
      sun.intensity = preset.sunIntensity;
      hemi.color.set(preset.hemiSky);
      hemi.groundColor.set(preset.hemiGround);
      hemi.intensity = preset.hemiIntensity;
      renderWorldPanel();
    },
    setSun(pos){
      sun.position.fromArray(pos);
      this.current.sunPos = pos.slice();
    },
    serialize(){ return Object.assign({}, this.current); },
    deserialize(d){ this.apply(d); }
  };

  /* ---------- TREE RENDER ---------- */
  const treeEl = $('#fileTree');
  const breadcrumbEl = $('#breadcrumb');
  const TREE_PAGE_SIZE = 400;

  function renderBreadcrumb(){
    breadcrumbEl.innerHTML = '';
    const home = document.createElement('span');
    home.className = 'crumb' + (state.currentFolderId === 'root' ? ' current' : '');
    home.innerHTML = '<svg width="11" height="11"><use href="#i-folder"/></svg>Project';
    home.onclick = () => { state.currentFolderId = 'root'; renderTree(); };
    breadcrumbEl.appendChild(home);
    if(state.currentFolderId === 'root') return;
    const node = findNode(state.currentFolderId);
    if(!node){ state.currentFolderId = 'root'; return renderBreadcrumb(); }
    const chain = [];
    let cur = node;
    while(cur && cur.id !== 'root'){ chain.unshift(cur); cur = findParent(cur.id); }
    for(const n of chain){
      const s = document.createElement('span'); s.className = 'sep-c'; s.textContent = '/';
      breadcrumbEl.appendChild(s);
      const c = document.createElement('span');
      c.className = 'crumb' + (n === node ? ' current' : '');
      c.textContent = n.name;
      c.onclick = () => { state.currentFolderId = n.id; renderTree(); };
      breadcrumbEl.appendChild(c);
    }
  }

  function renderTree(){
    treeEl.innerHTML = '';
    renderBreadcrumb();
    if(!state.root) return;
    const frag = document.createDocumentFragment();
    const build = (node, depth) => {
      const row = document.createElement('div');
      row.className = 'tree-row' + (node.id === state.selectedFileId ? ' sel' : '');
      row.style.paddingLeft = (4 + depth * 12) + 'px';
      row.dataset.id = node.id;

      if(node.type === 'folder'){
        const arr = document.createElement('span');
        arr.className = 'arrow' + (node.expanded ? ' expanded' : '');
        arr.innerHTML = '<svg width="10" height="10"><use href="#i-chevron-right"/></svg>';
        row.appendChild(arr);
        const ic = document.createElement('span');
        ic.className = 'ic';
        ic.style.color = '#c8a55c';
        ic.innerHTML = `<svg width="14" height="14"><use href="#${node.expanded?'i-folder-open':'i-folder'}"/></svg>`;
        row.appendChild(ic);
        const label = document.createElement('span');
        label.className = 'label'; label.textContent = node.name;
        row.appendChild(label);
        if(node.children && node.children.length){
          const b = document.createElement('span');
          b.className = 'badge'; b.textContent = String(node.children.length);
          row.appendChild(b);
        }
        row.addEventListener('pointerdown', e => {
          const startX = e.clientX, startY = e.clientY;
          let dragged = false;
          const onMove = me => {
            if(Math.hypot(me.clientX-startX, me.clientY-startY) > 5) dragged = true;
          };
          const onUp = ue => {
            window.removeEventListener('pointermove', onMove);
            window.removeEventListener('pointerup', onUp);
            if(dragged) return;
            node.expanded = !node.expanded;
            state.currentFolderId = node.id;
            state.selectedFileId = node.id;
            renderTree();
          };
          window.addEventListener('pointermove', onMove);
          window.addEventListener('pointerup', onUp);
        });
        frag.appendChild(row);
        if(node.expanded){
          const kids = node.children || [];
          const showAll = node._showAll || kids.length <= TREE_PAGE_SIZE;
          const shown = showAll ? kids : kids.slice(0, TREE_PAGE_SIZE);
          shown.forEach(c => build(c, depth + 1));
          if(!showAll){
            const more = document.createElement('div');
            more.className = 'tree-row';
            more.style.paddingLeft = (4 + (depth+1) * 12) + 'px';
            more.style.color = 'var(--dim)';
            more.style.fontStyle = 'italic';
            more.textContent = '+ ' + (kids.length - TREE_PAGE_SIZE) + ' more…';
            more.onclick = () => { node._showAll = true; renderTree(); };
            frag.appendChild(more);
          }
        }
      } else {
        const spacer = document.createElement('span');
        spacer.className = 'arrow';
        row.appendChild(spacer);
        const ic = document.createElement('span');
        ic.className = 'ic';
        ic.style.color = KIND_COLOR[node.kind] || '#8a8a92';
        ic.innerHTML = `<svg width="13" height="13"><use href="#${KIND_ICON[node.kind] || 'i-file'}"/></svg>`;
        row.appendChild(ic);
        const label = document.createElement('span');
        label.className = 'label'; label.textContent = node.name;
        row.appendChild(label);
        if(node.size != null && node.size > 0){
          const b = document.createElement('span');
          b.className = 'badge'; b.textContent = fmtBytes(node.size);
          row.appendChild(b);
        }
        row.addEventListener('click', e => {
          e.stopPropagation();
          state.selectedFileId = node.id;
          const p = findParent(node.id);
          state.currentFolderId = p ? p.id : 'root';
          renderTree();
          if(isTextKind(node.kind)) openFile(node);
          else if(node.kind === 'texture'){ setRightTab('assets'); renderAssets(); }
        });
        row.addEventListener('dblclick', e => { e.stopPropagation(); quickAddAsset(node); });
        row.addEventListener('pointerdown', e => beginDrag(e, node, row, 'tree'));
        frag.appendChild(row);
      }
    };
    (state.root.children||[]).forEach(c => build(c, 0));
    treeEl.appendChild(frag);
  }

  function isDescendant(folderNode, maybeChildId){
    let found = false;
    walkAll(folderNode, n => { if(n.id === maybeChildId) found = true; });
    return found;
  }

  function moveIntoFolder(fileNode, folderNode){
    const oldParent = findParent(fileNode.id);
    if(!oldParent) return;
    const i = oldParent.children.indexOf(fileNode);
    if(i >= 0) oldParent.children.splice(i, 1);
    folderNode.children = folderNode.children || [];
    folderNode.children.push(fileNode);
    folderNode.expanded = true;
    renderTree();
    scheduleSave();
    toast('Moved to ' + folderNode.name);
  }

  /* ---------- DRAG SYSTEM ---------- */
  const dragLayer = $('#dragLayer');
  const dragGhost = $('#dragGhost');

  function beginDrag(ev, node, rowEl, source){
    if(ev.button !== undefined && ev.button !== 0) return;
    ev.preventDefault();
    ev.stopPropagation();
    const startX = ev.clientX, startY = ev.clientY;
    let active = false;

    const move = e => {
      if(!active){
        if(Math.hypot(e.clientX-startX, e.clientY-startY) < 6) return;
        active = true;
        dragLayer.classList.add('active');
        if(rowEl) rowEl.classList.add('dragging');
        dragGhost.innerHTML = `<svg width="12" height="12" style="color:${KIND_COLOR[node.kind]}"><use href="#${KIND_ICON[node.kind]||'i-file'}"/></svg><span>${esc(node.name)}</span>`;
        if(state.mode !== 'scene') setMode('scene');
      }
      dragGhost.style.left = e.clientX + 'px';
      dragGhost.style.top = e.clientY + 'px';

      const r = wrap.getBoundingClientRect();
      const over = e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom;
      wrap.classList.toggle('drop-target', over);
      highlightTexSlots(node.kind === 'texture' && !over);

      $$('.tree-row.drop-target').forEach(x => x.classList.remove('drop-target'));
      const hovered = document.elementFromPoint(e.clientX, e.clientY);
      const targetRow = hovered && hovered.closest('.tree-row');
      if(targetRow && targetRow.dataset.id){
        const target = findNode(targetRow.dataset.id);
        if(target && target.type === 'folder' && target.id !== node.id && !isDescendant(node, target.id)){
          targetRow.classList.add('drop-target');
        }
      }
    };

    const up = e => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      dragLayer.classList.remove('active');
      if(rowEl) rowEl.classList.remove('dragging');
      wrap.classList.remove('drop-target');
      $$('.tree-row.drop-target').forEach(x => x.classList.remove('drop-target'));
      highlightTexSlots(false);
      dragGhost.innerHTML = '';
      if(!active) return;

      const r = wrap.getBoundingClientRect();
      const inViewport = e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom;
      if(inViewport){
        handleViewportDrop(node, e.clientX, e.clientY);
        return;
      }

      const el = document.elementFromPoint(e.clientX, e.clientY);
      if(el){
        const slot = el.closest('.tex-slot');
        if(slot && slot.dataset.slot){
          const item = getItem(state.selectedId);
          if(item){
            const srgb = slot.dataset.slot === 'map' || slot.dataset.slot === 'emissiveMap';
            assignTextureSlot(item, slot.dataset.slot, node.id, srgb).then(() => {
              toast('Applied to ' + slot.dataset.slot);
              renderInspector();
            });
          }
          return;
        }
        const treeRow = el.closest('.tree-row');
        if(treeRow && treeRow.dataset.id){
          const target = findNode(treeRow.dataset.id);
          if(target && target.type === 'folder' && target.id !== node.id && !isDescendant(node, target.id)){
            moveIntoFolder(node, target);
          }
        }
      }
    };

    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  }

  function highlightTexSlots(on){
    $$('.tex-slot').forEach(el => el.classList.toggle('droppable', on));
  }

  /* ---------- Viewport ---------- */
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  const groundPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);

  function toNDC(cx, cy){
    const r = canvas.getBoundingClientRect();
    ndc.x = ((cx - r.left) / r.width) * 2 - 1;
    ndc.y = -((cy - r.top) / r.height) * 2 + 1;
    return ndc;
  }

  function pickItem(cx, cy){
    raycaster.setFromCamera(toNDC(cx, cy), state.playing ? gameCam : editorCam);
    const roots = state.objects.map(o => o.object3d).filter(o => o && o.visible);
    const hits = raycaster.intersectObjects(roots, true);
    for(const h of hits){
      let n = h.object;
      while(n){
        if(n.userData && n.userData.itemId){
          const it = getItem(n.userData.itemId);
          if(it) return { item: it, point: h.point, hit: h };
        }
        n = n.parent;
      }
    }
    return null;
  }

  function groundPoint(cx, cy){
    raycaster.setFromCamera(toNDC(cx, cy), editorCam);
    const p = new THREE.Vector3();
    return raycaster.ray.intersectPlane(groundPlane, p) ? p : new THREE.Vector3(0,0,0);
  }

  function handleViewportDrop(node, cx, cy){
    if(node.kind === 'model'){
      const p = groundPoint(cx, cy);
      addObjectFromDef({
        id: uid('o'), name: node.name.replace(/\.[^.]+$/, ''), type:'model',
        asset: node.id, position:[p.x, 0, p.z], rotation:[0,0,0], scale:[1,1,1],
        visible:true, material: materialDefaults({}), scripts: []
      });
      toast('Placed ' + node.name);
      return;
    }
    if(node.kind === 'texture'){
      const hit = pickItem(cx, cy);
      if(!hit){ toast('Drop a texture onto a mesh'); return; }
      const slot = guessTextureSlot(node.name);
      const srgb = slot === 'map' || slot === 'emissiveMap';
      assignTextureSlot(hit.item, slot, node.id, srgb).then(() => {
        toast('Applied → ' + slot);
        renderInspector();
      });
      return;
    }
    if(node.kind === 'script' || node.kind === 'shader'){
      const hit = pickItem(cx, cy);
      if(!hit){ toast('Drop onto an object'); return; }
      if(hit.item.scripts.indexOf(node.id) < 0) hit.item.scripts.push(node.id);
      toast('Attached ' + node.name + ' → ' + hit.item.name);
      renderInspector();
      scheduleSave();
      return;
    }
    toast('Drop a model, texture, script or shader');
  }

  function guessTextureSlot(name){
    const n = name.toLowerCase();
    if(/_?normal|_nrm|_n\.|_norm/.test(n)) return 'normalMap';
    if(/rough/.test(n)) return 'roughnessMap';
    if(/metal/.test(n)) return 'metalnessMap';
    if(/[_\-\b]ao\b|occlusion/.test(n)) return 'aoMap';
    if(/emiss|glow/.test(n)) return 'emissiveMap';
    if(/height|disp/.test(n)) return 'displacementMap';
    if(/alpha|opac|mask/.test(n)) return 'alphaMap';
    return 'map';
  }

  /* ---------- Smart link ---------- */
  async function smartLink(){
    const item = getItem(state.selectedId);
    if(!item){ toast('Select an object first'); return; }
    if(/light/i.test(item.type)){ toast('Cannot link on lights'); return; }
    const allTex = allFiles().filter(f => f.kind === 'texture');
    if(!allTex.length){ toast('No textures in project'); return; }
    const scores = { map:null, normalMap:null, roughnessMap:null, metalnessMap:null, aoMap:null, emissiveMap:null, displacementMap:null, alphaMap:null };
    const baseName = item.name.toLowerCase().split(/[\s_-]/)[0];
    let hits = 0;
    for(const f of allTex){
      const fn = f.name.toLowerCase();
      const slot = guessTextureSlot(f.name);
      const sharesName = baseName.length >= 3 && fn.includes(baseName);
      if(sharesName || scores[slot] == null) scores[slot] = f;
    }
    for(const slot of Object.keys(scores)){
      if(scores[slot]){
        const srgb = slot === 'map' || slot === 'emissiveMap';
        await assignTextureSlot(item, slot, scores[slot].id, srgb);
        hits++;
      }
    }
    renderInspector();
    toast(hits ? 'Linked ' + hits + ' maps' : 'No matching textures');
    scheduleSave();
  }

  /* ---------- Hierarchy ---------- */
  const hierEl = $('#hierarchy');
  const TYPE_ICON = {
    box:'i-cube', sphere:'i-cube', plane:'i-cube', cylinder:'i-cube', cone:'i-cube', torus:'i-cube',
    capsule:'i-cube', ring:'i-cube', icosahedron:'i-cube', dodecahedron:'i-cube', octahedron:'i-cube',
    tetrahedron:'i-cube', torusKnot:'i-cube', model:'i-cube',
    light:'i-sun', pointLight:'i-point', spotLight:'i-sun', ambientLight:'i-sun',
    tree_round:'i-tree', tree_pine:'i-tree', tree_autumn:'i-tree', bush:'i-leaf',
    grass_tuft:'i-leaf', flower:'i-leaf', flower_red:'i-leaf', flower_pink:'i-leaf', flower_yellow:'i-leaf',
    mushroom:'i-leaf', rock:'i-rock'
  };

  function refreshHierarchy(){
    hierEl.innerHTML = '';
    if(!state.objects.length){
      hierEl.innerHTML = '<div class="empty">No objects in scene</div>';
      return;
    }
    const frag = document.createDocumentFragment();
    for(const item of state.objects){
      const row = document.createElement('div');
      const isMulti = state.selectedIds.has(item.id) && item.id !== state.selectedId;
      row.className = 'hier-row' + (item.id === state.selectedId ? ' sel' : (isMulti ? ' multi-sel' : ''));
      const ic = document.createElement('span');
      ic.className = 'ic';
      ic.innerHTML = `<svg width="13" height="13"><use href="#${TYPE_ICON[item.type] || 'i-cube'}"/></svg>`;
      row.appendChild(ic);
      const label = document.createElement('span');
      label.className = 'label'; label.textContent = item.name;
      row.appendChild(label);
      const vis = document.createElement('button');
      vis.className = 'act' + (item.object3d.visible ? ' on' : '');
      vis.title = 'Toggle visibility';
      vis.innerHTML = `<svg width="13" height="13"><use href="#${item.object3d.visible?'i-eye':'i-eye-off'}"/></svg>`;
      vis.onclick = e => {
        e.stopPropagation();
        item.object3d.visible = !item.object3d.visible;
        refreshHierarchy();
        scheduleSave();
      };
      row.appendChild(vis);
      const sc = document.createElement('button');
      sc.className = 'act'; sc.title = 'Scripts';
      sc.innerHTML = '<svg width="13" height="13"><use href="#i-code"/></svg>';
      sc.onclick = e => { e.stopPropagation(); selectObject(item.id); openScriptModal(item); };
      row.appendChild(sc);
      row.onclick = e => {
        if(e.shiftKey || e.metaKey || e.ctrlKey) selectObject(item.id, { additive: true });
        else selectObject(item.id);
      };
      frag.appendChild(row);
    }
    hierEl.appendChild(frag);
  }

  function openScriptModal(item){
    const scripts = allFiles().filter(f => f.kind === 'script' || f.kind === 'shader');
    let html = '<p>Attach script/shader to <b>' + esc(item.name) + '</b></p>';
    if(!scripts.length){
      html += '<p style="color:var(--dim-2)">No scripts. Create one in the Explorer.</p>';
    } else {
      html += '<div class="chip-list" style="padding:0">';
      for(const s of scripts){
        const on = item.scripts.indexOf(s.id) >= 0;
        html += `<div class="chip" data-sid="${s.id}" style="cursor:pointer;${on?'border-color:var(--accent)':''}">
          <span style="width:6px;height:6px;border-radius:2px;background:${KIND_COLOR[s.kind]}"></span>${esc(s.name)}${on?' ✓':''}
        </div>`;
      }
      html += '</div>';
    }
    showModal('Scripts — ' + item.name, html, [
      { label:'New Script', action: () => { createScriptFor(item); return false; } },
      { label:'Close' }
    ]);
    $$('#modalBody .chip').forEach(chip => {
      chip.onclick = () => {
        const sid = chip.dataset.sid;
        const i = item.scripts.indexOf(sid);
        if(i >= 0) item.scripts.splice(i, 1);
        else item.scripts.push(sid);
        scheduleSave();
        renderInspector();
        openScriptModal(item);
      };
    });
  }

  function createScriptFor(item){
    const name = prompt('Script name:', (item.name.replace(/\s+/g,'_') || 'script') + '.js');
    if(!name) return false;
    const fn = /\.[a-z]+$/i.test(name) ? name : name + '.js';
    const folder = ensureFolder(['Scripts']);
    const node = makeFile(fn, kindOf(fn), 'let t = 0;\n\nfunction init(ctx){\n  // runs once\n}\n\nfunction update(ctx, dt){\n  t += dt;\n  // ctx.object.rotation.y += dt * 0.5;\n}\n');
    folder.children.push(node);
    FileStore.put(node.id, node.data);
    item.scripts.push(node.id);
    closeModal();
    renderTree();
    renderInspector();
    openFile(node);
    scheduleSave();
    return false;
  }

  /* ---------- Inspector ---------- */
  const inspectorEl = $('#inspector');
  const groupCollapse = new Set();

  function inspGroup(title, key){
    const g = document.createElement('div');
    g.className = 'insp-group' + (groupCollapse.has(key) ? ' collapsed' : '');
    const h = document.createElement('h4');
    h.innerHTML = esc(title) + '<span class="caret"><svg width="10" height="10"><use href="#i-chevron-down"/></svg></span>';
    h.onclick = () => {
      if(groupCollapse.has(key)) groupCollapse.delete(key); else groupCollapse.add(key);
      g.classList.toggle('collapsed');
    };
    g.appendChild(h);
    const body = document.createElement('div');
    body.className = 'insp-group-body';
    g.appendChild(body);
    g._body = body;
    return g;
  }

  function rowEl(label, ctl){
    const r = document.createElement('div');
    r.className = 'row';
    if(label != null){
      const l = document.createElement('label');
      l.textContent = label; l.title = label;
      r.appendChild(l);
    }
    const c = document.createElement('div');
    c.className = 'ctl';
    if(ctl) c.appendChild(ctl);
    r.appendChild(c);
    return r;
  }

  // SAFE vec3 editor — uses vecGet/vecSet (handles Euler + Vector3)
  function vec3Inputs(vec, opts){
    opts = opts || {};
    const deg = !!opts.deg;
    const scale = deg ? 180/Math.PI : 1;
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;gap:4px;width:100%';
    ['X','Y','Z'].forEach((ax, i) => {
      const inp = document.createElement('input');
      inp.type = 'number'; inp.step = opts.step || 0.1;
      inp.value = fmt(vecGet(vec, i) * scale);
      inp.dataset.vec = opts.key;
      inp.dataset.axis = i;
      inp.dataset.deg = deg ? '1' : '0';
      inp.title = ax;
      inp.addEventListener('input', () => {
        const v = parseFloat(inp.value);
        if(isNaN(v)) return;
        vecSet(vec, i, deg ? v * Math.PI/180 : v);
        scheduleSave();
      });
      wrap.appendChild(inp);
    });
    return wrap;
  }

  function sliderInput(value, min, max, step, onChange){
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;align-items:center;gap:6px;width:100%';
    const r = document.createElement('input');
    r.type = 'range'; r.min = min; r.max = max; r.step = step; r.value = value;
    const v = document.createElement('span');
    v.className = 'slider-val'; v.textContent = (+value).toFixed(2);
    r.addEventListener('input', () => {
      const n = parseFloat(r.value);
      v.textContent = n.toFixed(2);
      onChange(n);
    });
    wrap.appendChild(r); wrap.appendChild(v);
    return wrap;
  }

  function colorInput(value, onChange){
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;align-items:center;gap:6px;width:100%';
    const c = document.createElement('input');
    c.type = 'color'; c.value = value || '#ffffff';
    const t = document.createElement('input');
    t.type = 'text'; t.value = (value || '#ffffff').toUpperCase(); t.style.flex = '1';
    c.addEventListener('input', () => { t.value = c.value.toUpperCase(); onChange(c.value); });
    t.addEventListener('change', () => {
      if(/^#[0-9a-f]{6}$/i.test(t.value)){ c.value = t.value; onChange(t.value); }
    });
    wrap.appendChild(c); wrap.appendChild(t);
    return wrap;
  }

  function toggleInput(value, onChange){
    const lbl = document.createElement('label');
    lbl.className = 'chk';
    const inp = document.createElement('input');
    inp.type = 'checkbox'; inp.checked = !!value;
    inp.addEventListener('change', () => onChange(inp.checked));
    lbl.appendChild(inp);
    return lbl;
  }

  function textureSlotRow(item, slot, label){
    const fileId = item.material[slot];
    const fileNode = fileId ? findNode(fileId) : null;
    const wrap = document.createElement('div');
    wrap.className = 'tex-slot';
    wrap.dataset.slot = slot;
    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    if(fileNode){
      const cached = fileNode.data;
      if(cached && typeof cached === 'string' && cached.startsWith('data:image')){
        thumb.style.backgroundImage = 'url(' + cached + ')';
      } else {
        FileStore.getURL(fileNode.id).then(u => {
          if(u && /^(data:image|blob:)/.test(u)) thumb.style.backgroundImage = 'url(' + u + ')';
          else thumb.innerHTML = '<svg width="14" height="14"><use href="#i-image"/></svg>';
        });
      }
    } else {
      thumb.innerHTML = '<svg width="14" height="14"><use href="#i-image"/></svg>';
    }
    wrap.appendChild(thumb);
    const meta = document.createElement('div');
    meta.className = 'meta';
    const n = document.createElement('span');
    n.className = 'n'; n.textContent = label;
    const v = document.createElement('span');
    v.className = 'v' + (fileNode ? '' : ' empty');
    v.textContent = fileNode ? fileNode.name : 'None';
    meta.appendChild(n); meta.appendChild(v);
    wrap.appendChild(meta);
    const clr = document.createElement('button');
    clr.className = 'clr'; clr.title = 'Clear';
    clr.innerHTML = '<svg width="12" height="12"><use href="#i-x"/></svg>';
    clr.onclick = () => { assignTextureSlot(item, slot, null).then(renderInspector); scheduleSave(); };
    wrap.appendChild(clr);
    return wrap;
  }

  function renderInspector(){
    inspectorEl.innerHTML = '';
    const item = getItem(state.selectedId);
    if(!item){
      inspectorEl.innerHTML = '<div class="empty">No selection<br><br>Select an object in the Hierarchy,<br>or drag a model into the viewport.</div>';
      return;
    }
    const h = document.createElement('div');
    h.className = 'insp-header';
    const dot = document.createElement('span'); dot.className = 'dot';
    h.appendChild(dot);
    const nm = document.createElement('span'); nm.className = 'name'; nm.textContent = item.name;
    h.appendChild(nm);
    const k = document.createElement('span'); k.className = 'kind'; k.textContent = item.type;
    h.appendChild(k);
    inspectorEl.appendChild(h);

    const g = inspGroup('Object', 'object');
    const nameInp = document.createElement('input');

  function rebuildMaterial(item){
    const m = item.material;
    item.object3d.traverse(c => {
      if(!c.isMesh) return;
      // dispose old
      if(c.material && c.material.dispose) c.material.dispose();
      const newMat = makeMaterial(m);
      if(newMat.isMeshStandardMaterial || newMat.isMeshPhysicalMaterial) newMat.flatShading = true;
      c.material = newMat;
    });
  }

  function syncInspectorTransform(){
    const item = getItem(state.selectedId);
    if(!item) return;
    $$('#inspector [data-vec]').forEach(inp => {
      const key = inp.dataset.vec;
      const axis = parseInt(inp.dataset.axis, 10);
      const deg = inp.dataset.deg === '1';
      const vec = item.object3d[key];
      if(!vec) return;
      if(document.activeElement === inp) return;
      inp.value = fmt(vecGet(vec, axis) * (deg ? 180/Math.PI : 1));
    });
  }

  function duplicateSelected(){
    const src = getItem(state.selectedId);
    if(!src) return;
    const targets = state.selectedIds.size > 1 ? [...state.selectedIds].map(getItem).filter(Boolean) : [src];
    const newIds = [];
    for(const s of targets){
      const def = {
        id: uid('o'),
        name: s.name + ' copy',
        type: s.type,
        asset: s.asset,
        seed: s.seed ? s.seed + 1 : null,
        position: [s.object3d.position.x + 0.6, s.object3d.position.y, s.object3d.position.z + 0.6],
        rotation: [s.object3d.rotation.x, s.object3d.rotation.y, s.object3d.rotation.z],
        scale: s.object3d.scale.toArray(),
        visible: s.object3d.visible,
        material: Object.assign({}, s.material),
        scripts: s.scripts.slice()
      };
      const item = addObjectFromDef(def, false);
      newIds.push(item.id);
    }
    if(newIds.length){
      state.selectedIds.clear();
      newIds.forEach(id => state.selectedIds.add(id));

  /* ---------- Terrain system ---------- */
  const TERRAIN_SIZE = 40;
  const TERRAIN_SEG = 96;
  function createTerrain(seed){
    // If a terrain exists, select it instead
    const existing = state.objects.find(o => o.type === 'terrain');
    if(existing){ selectObject(existing.id); return existing; }
    const geo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEG, TERRAIN_SEG);
    geo.rotateX(-Math.PI / 2);
    const heightArr = new Float32Array(geo.attributes.position.count);
    // Vertex colors for painting
    const colors = new Float32Array(geo.attributes.position.count * 3);
    for(let i = 0; i < geo.attributes.position.count; i++){
      colors[i*3] = 0.42; colors[i*3+1] = 0.55; colors[i*3+2] = 0.33; // default grass green
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const mat = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.95, metalness:0, flatShading:false });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.receiveShadow = true; mesh.castShadow = false;

    const def = {
      id: uid('o'), name:'Terrain', type:'terrain',
      position:[0,0,0], rotation:[0,0,0], scale:[1,1,1], visible:true,
      material: materialDefaults({ color:'#6b8f5a', roughness:0.95, metalness:0, shading:'standard' }),
      scripts: []
    };
    const item = {
      id: def.id, name: def.name, type: def.type, asset:null,
      seed: null, material: def.material, scripts: [],
      object3d: mesh,
      terrain: {
        size: TERRAIN_SIZE, segments: TERRAIN_SEG,
        heights: heightArr,
        baseColors: new Float32Array(colors)
      }
    };
    scene.add(mesh);
    tagObj(mesh, item.id);
    state.objects.push(item);
    refreshHierarchy();
    updateStatusBar();
    selectObject(item.id);
    toast('Terrain created');
    scheduleSave();
    return item;
  }

  function resetTerrain(item){
    if(!item.terrain) return;
    const t = item.terrain;
    for(let i = 0; i < t.heights.length; i++) t.heights[i] = 0;
    applyTerrainHeights(item);
    Undo.push();
    scheduleSave();
  }

  function applyTerrainHeights(item){
    const geo = item.object3d.geometry;
    const pos = geo.attributes.position;
    const t = item.terrain;
    for(let i = 0; i < pos.count; i++){
      pos.setY(i, t.heights[i]);
    }
    pos.needsUpdate = true;
    geo.computeVertexNormals();
  }

  // Raycast terrain specifically (returns {item, faceIndex, point})
  function pickTerrain(cx, cy){
    const terrainItems = state.objects.filter(o => o.type === 'terrain');
    if(!terrainItems.length) return null;
    raycaster.setFromCamera(toNDC(cx, cy), editorCam);
    for(const item of terrainItems){
      const hits = raycaster.intersectObject(item.object3d, false);
      if(hits.length){
        return { item, point: hits[0].point, uv: hits[0].uv, hit: hits[0] };
      }
    }
    return null;
  }

  function sculptAt(item, cx, cy){
    const geo = item.object3d.geometry;
    const pos = geo.attributes.position;
    const t = item.terrain;
    raycaster.setFromCamera(toNDC(cx, cy), editorCam);
    const hits = raycaster.intersectObject(item.object3d, false);
    if(!hits.length) return;
    const hitPoint = hits[0].point;
    const brushRadius = state.brush.size;
    const strength = state.brush.strength * 0.15;
    const mode = state.brush.mode;

    const half = t.size / 2;
    // Precompute color attribute if painting
    const colorAttr = geo.attributes.color;
    const paintColor = new THREE.Color(state.brush.paintColor);

    for(let i = 0; i < pos.count; i++){
      const x = pos.getX(i), z = pos.getZ(i);
      const dx = x - hitPoint.x, dz = z - hitPoint.z;
      const d2 = dx*dx + dz*dz;
      if(d2 > brushRadius * brushRadius) continue;
      const dist = Math.sqrt(d2);
      const tNorm = 1 - dist / brushRadius;
      let falloff;
      switch(state.brush.falloff){
        case 'linear': falloff = tNorm; break;
        case 'sharp': falloff = tNorm * tNorm; break;
        default: falloff = tNorm * tNorm * (3 - 2 * tNorm); // smoothstep
      }
      if(mode === 'raise'){
        t.heights[i] += strength * falloff;
      } else if(mode === 'lower'){
        t.heights[i] -= strength * falloff;
      } else if(mode === 'smooth'){
        // Average neighboring vertices
        const cx0 = pos.getX(i), cz0 = pos.getZ(i);
        t.heights[i] = lerp(t.heights[i], 0, strength * falloff * 0.5);
      } else if(mode === 'flatten'){
        const target = hitPoint.y;
        t.heights[i] = lerp(t.heights[i], target, strength * falloff);
      } else if(mode === 'noise'){
        const n = (Math.random() * 2 - 1);
        t.heights[i] += n * strength * falloff;
      } else if(mode === 'paint'){
        if(colorAttr){
          const r = colorAttr.getX(i), g = colorAttr.getY(i), b = colorAttr.getZ(i);
          const nr = lerp(r, paintColor.r, falloff * 0.4);
          const ng = lerp(g, paintColor.g, falloff * 0.4);
          const nb = lerp(b, paintColor.b, falloff * 0.4);
          colorAttr.setXYZ(i, nr, ng, nb);
        }
      }
    }
    if(mode !== 'paint'){
      pos.needsUpdate = true;
      geo.computeVertexNormals();
      // Update each Y
      for(let i = 0; i < pos.count; i++) pos.setY(i, t.heights[i]);
      pos.needsUpdate = true;
    } else if(colorAttr){
      colorAttr.needsUpdate = true;
    }
  }

  /* ---------- Foliage system ---------- */
  // Scatter a preset across terrain using raycasting
  function scatterFoliage(cx, cy){
    const terrainHit = pickTerrain(cx, cy);
    if(!terrainHit){ toast('Foliage needs terrain to scatter on'); return; }
    const { item: terrain, point } = terrainHit;
    const preset = state.foliage.preset;
    const count = state.foliage.density;
    const size = state.foliage.size;
    const jitter = state.foliage.jitter;
    const radius = state.brush.size * 1.5;

    // Duplicate or create new objects
    for(let i = 0; i < count; i++){
      const angle = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random()) * radius;
      const px = point.x + Math.cos(angle) * r;
      const pz = point.z + Math.sin(angle) * r;
      // Raycast down to find Y
      const ray = new THREE.Raycaster(new THREE.Vector3(px, point.y + 5, pz), new THREE.Vector3(0, -1, 0));
      const hits = ray.intersectObject(terrain.object3d, false);
      const py = hits.length ? hits[0].point.y : point.y;
      const def = {
        id: uid('o'),
        name: preset + '_' + Math.floor(Math.random()*1000),
        type: preset,
        seed: Math.random() * 1e6 | 0,
        position: [px, py, pz],
        rotation: [0, Math.random() * Math.PI * 2, 0],
        scale: [size * (0.7 + Math.random() * 0.6), size * (0.7 + Math.random() * 0.6), size * (0.7 + Math.random() * 0.6)],
        visible: true,
        material: materialDefaults({ color: state.brush.paintColor, roughness: 0.9, flatShading: true }),
        scripts: []
      };
      // Small jitter rotation
      def.rotation[0] = (Math.random() - 0.5) * jitter * 0.3;
      addObjectFromDef(def, false);
    }
    refreshHierarchy();
    updateStatusBar();
  }

  const KEYWORDS = ['const','let','var','function','return','if','else','for','while','do','new','class','extends','import','export','from','default','this','typeof','instanceof','try','catch','finally','throw','switch','case','break','continue','await','async','of','in','delete','void','yield','null','true','false','undefined','static','get','set'];
  const GLOBALS = ['console','Math','JSON','Object','Array','String','Number','Boolean','Promise','Map','Set','Date','performance','document','window','requestAnimationFrame'];
  const CTX_PROPS = ['object','scene','camera','renderer','THREE','input','time','delta','find'];
  const THREE_PROPS = ['Vector2','Vector3','Quaternion','Euler','Matrix4','Color','Mesh','MeshPhysicalMaterial','MeshStandardMaterial','MeshBasicMaterial','Group','Scene','PerspectiveCamera','OrthographicCamera','DirectionalLight','PointLight','SpotLight','AmbientLight','HemisphereLight','BoxGeometry','SphereGeometry','PlaneGeometry','CylinderGeometry','ConeGeometry','TorusGeometry','TorusKnotGeometry','CapsuleGeometry','RingGeometry','IcosahedronGeometry','DodecahedronGeometry','OctahedronGeometry','TetrahedronGeometry','TextureLoader','Clock','Raycaster','Box3','Sphere','Fog','GridHelper','AxesHelper'];

  function highlightCode(src, kind){
    if(kind === 'script') return highlightJS(src);
    if(kind === 'html') return highlightHTML(src);
    if(kind === 'css') return highlightCSS(src);
    if(kind === 'json') return highlightJS(src);
    if(kind === 'shader') return highlightShader(src);
    return esc(src);
  }
  function highlightJS(src){
    const re = /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|('(?:\\.|[^'\\])*'|"(?:\\.|[^"\\])*"|`(?:\\.|[^`\\])*`)|\b(const|let|var|function|return|if|else|for|while|do|new|class|extends|import|export|from|default|this|typeof|instanceof|try|catch|finally|throw|switch|case|break|continue|await|async|of|in|delete|void|yield|null|true|false|undefined|static)\b|\b(console|Math|JSON|Object|Array|String|Number|Boolean|Promise|Map|Set|Date|performance|document|window|THREE)\b|\b(\d+\.?\d*)\b|([A-Za-z_$][A-Za-z0-9_$]*)(?=\s*\()/g;
    let out = '', last = 0, m;
    while((m = re.exec(src)) !== null){
      out += esc(src.slice(last, m.index));
      let cls = 'c-com';
      if(m[2]) cls = 'c-str';
      else if(m[3]) cls = 'c-key';
      else if(m[4]) cls = 'c-type';
      else if(m[5]) cls = 'c-num';
      else if(m[6]) cls = 'c-fn';
      out += '<span class="' + cls + '">' + esc(m[0]) + '</span>';
      last = m.index + m[0].length;
    }
    out += esc(src.slice(last));
    return out;
  }
  function highlightHTML(src){
    return esc(src)
      .replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="c-com">$1</span>')
      .replace(/(&lt;\/?)([a-zA-Z][a-zA-Z0-9-]*)/g, '$1<span class="c-tag">$2</span>')
      .replace(/([a-zA-Z-]+)=(&quot;|")/g, '<span class="c-att">$1</span>=$2');
  }
  function highlightCSS(src){
    return esc(src)
      .replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="c-com">$1</span>')
      .replace(/([a-z-]+)(\s*:)/g, '<span class="c-att">$1</span>$2')
      .replace(/(#[0-9a-fA-F]{3,8})\b/g, '<span class="c-num">$1</span>');
  }
  function highlightShader(src){
    let out = esc(src);
    out = out.replace(/(\/\/[^\n]*)/g, '<span class="c-com">$1</span>');
    out = out.replace(/\b(vec2|vec3|vec4|float|int|bool|mat2|mat3|mat4|sampler2D|samplerCube|ivec2|ivec3|ivec4|uint|ALBEDO|NORMAL|METALLIC|ROUGHNESS|ALPHA|EMISSION|COLOR|VERTEX|POSITION|UV|TIME|VIEW|LAYER)\b/g, '<span class="c-shader-t">$&</span>');
    out = out.replace(/\b(shader_type|render_mode|uniform|varying|in|out|void|fragment|vertex|if|else|return|const|struct|attribute|layout|precision|lowp|mediump|highp|flat|smooth|discard)\b/g, '<span class="c-shader-k">$&</span>');
    out = out.replace(/\b(\d+\.?\d*)\b/g, '<span class="c-num">$1</span>');
    return out;
  }

  async function openFile(node){
    if(!node || node.type !== 'file') return;
    if(!isTextKind(node.kind)){
      if(node.kind === 'texture'){ setRightTab('assets'); toast('Texture: ' + node.name); }
      return;
    }
    if(node.data == null){
      const d = await FileStore.get(node.id);
      node.data = typeof d === 'string' ? d : (d instanceof Blob ? await d.text() : '');
    }
    if(!state.openTabs.some(t => t.id === node.id)) state.openTabs.push({ id: node.id });
    state.activeTabId = node.id;
    state.selectedFileId = node.id;
    setMode('code');
    renderTabs();
    loadEditor(node);
    renderTree();
  }

  function renderTabs(){
    tabBar.innerHTML = '';
    for(const t of state.openTabs){
      const node = findNode(t.id);
      if(!node) continue;
      const el = document.createElement('div');
      el.className = 'tab' + (t.id === state.activeTabId ? ' active' : '');

        if(state.activeTabId === t.id){
          state.activeTabId = state.openTabs.length ? state.openTabs[state.openTabs.length-1].id : null;
          if(state.activeTabId) openFile(findNode(state.activeTabId));
          else { codeInput.value = ''; updateHighlight(); }

  codeInput.addEventListener('scroll', () => {

  codeInput.addEventListener('keydown', e => {
    const meta = e.metaKey || e.ctrlKey;
    if(meta && (e.key === 'f' || e.key === 'h')){ e.preventDefault(); toggleFind(true); return; }
    if(meta && e.key === 'g'){ e.preventDefault(); findNext(); return; }
    if(meta && e.key === 's'){
      e.preventDefault();
      const node = findNode(state.activeTabId);
      if(node){ node.data = codeInput.value; FileStore.put(node.id, node.data); toast('Saved ' + node.name); }
      return;
    }
    if(meta && e.key === ' '){ e.preventDefault(); showAutocomplete(); return; }
    if(e.key === 'Escape'){ hideAutocomplete(); findBar.classList.remove('show'); return; }
    if(e.key === 'Tab'){
      e.preventDefault();
      if(acEl.classList.contains('show') && acEl._items.length){ applyAutocomplete(); return; }
      const s = codeInput.selectionStart, en = codeInput.selectionEnd;
      codeInput.value = codeInput.value.slice(0, s) + '  ' + codeInput.value.slice(en);
      codeInput.selectionStart = codeInput.selectionEnd = s + 2;
      updateHighlight();
      return;
    }
    if(e.key === 'Enter'){
      if(acEl.classList.contains('show') && acEl._items.length){ e.preventDefault(); applyAutocomplete(); return; }
      e.preventDefault();
      const s = codeInput.selectionStart;
      const before = codeInput.value.slice(0, s);
      const lineStart = before.lastIndexOf('\n') + 1;
      const line = before.slice(lineStart);
      const indentMatch = line.match(/^[ \t]*/);
      let indent = indentMatch ? indentMatch[0] : '';
      if(/[{(\[:]\s*$/.test(line)) indent += '  ';
      const insert = '\n' + indent;
      codeInput.value = codeInput.value.slice(0, s) + insert + codeInput.value.slice(codeInput.selectionEnd);
      codeInput.selectionStart = codeInput.selectionEnd = s + insert.length;
      updateHighlight();
      return;
    }
    if(e.key === 'ArrowUp' || e.key === 'ArrowDown'){
      if(acEl.classList.contains('show') && acEl._items.length){
        e.preventDefault(); moveAutocomplete(e.key === 'ArrowDown' ? 1 : -1); return;
      }
    }
    const pairs = { '(':')', '[':']', '{':'}', '"':'"', "'":"'" };
    if(pairs[e.key]){
      const s = codeInput.selectionStart, en = codeInput.selectionEnd;
      e.preventDefault();
      if(s !== en){
        const sel = codeInput.value.slice(s, en);
        codeInput.value = codeInput.value.slice(0, s) + e.key + sel + pairs[e.key] + codeInput.value.slice(en);
        codeInput.selectionStart = s + 1; codeInput.selectionEnd = en + 1;
      } else {
        codeInput.value = codeInput.value.slice(0, s) + e.key + pairs[e.key] + codeInput.value.slice(s);
        codeInput.selectionStart = codeInput.selectionEnd = s + 1;
      }
      updateHighlight();
      return;
    }
  });

  let acIndex = 0, acFiltered = [];
  function showAutocomplete(){
    const pos = codeInput.selectionStart;
    const before = codeInput.value.slice(0, pos);
    const wordMatch = before.match(/[A-Za-z_$][A-Za-z0-9_$]*$/);
    const prefix = wordMatch ? wordMatch[0] : '';
    const objNames = state.objects.map(o => o.name).filter(Boolean);
    const suggestions = [
      ...KEYWORDS.map(k => ({ label:k, kind:'kw' })),
      ...GLOBALS.map(g => ({ label:g, kind:'glb' })),
      ...CTX_PROPS.map(p => ({ label:p, kind:'ctx' })),
      ...THREE_PROPS.map(p => ({ label:p, kind:'3d' })),
      ...objNames.map(n => ({ label:n, kind:'obj' }))
    ];
    acFiltered = suggestions.filter(s => !prefix || s.label.toLowerCase().startsWith(prefix.toLowerCase())).slice(0, 60);
    if(!acFiltered.length){ hideAutocomplete(); return; }
    acEl.innerHTML = '';
    acFiltered.forEach((s, i) => {
      const el = document.createElement('div');
      el.className = 'ac-item' + (i === 0 ? ' sel' : '');
      el.innerHTML = esc(s.label) + '<span class="k">' + s.kind + '</span>';
      el.onclick = () => { acIndex = i; applyAutocomplete(); };
      acEl.appendChild(el);
    });
    acIndex = 0;
    const rect = getCaretRect();
    acEl.style.left = rect.left + 'px';
    acEl.style.top = (rect.top + 18) + 'px';
    acEl.classList.add('show');
    acEl._items = acFiltered;
  }
  function getCaretRect(){
    const pos = codeInput.selectionStart;
    const before = codeInput.value.slice(0, pos);
    const lines = before.split('\n');
    const line = lines.length - 1;
    const col = lines[lines.length-1].length;
    const style = getComputedStyle(codeInput);
    const lh = parseFloat(style.lineHeight) || 19;
    const charW = 7.5;
    const areaRect = $('#codeArea').getBoundingClientRect();
    const left = areaRect.left + 14 + col * charW - codeInput.scrollLeft;
    const top = areaRect.top + 10 + (line + 1) * lh - codeInput.scrollTop;
    return { left: clamp(left, areaRect.left + 4, areaRect.right - 230), top };
  }
  function moveAutocomplete(dir){
    acIndex = clamp(acIndex + dir, 0, acFiltered.length - 1);
    $$('#autocomplete .ac-item').forEach((el, i) => el.classList.toggle('sel', i === acIndex));
    const sel = $$('#autocomplete .ac-item')[acIndex];
    if(sel) sel.scrollIntoView({ block:'nearest' });
  }
  function applyAutocomplete(){
    const item = acFiltered[acIndex];
    if(!item) return;
    const pos = codeInput.selectionStart;
    const before = codeInput.value.slice(0, pos);
    const after = codeInput.value.slice(pos);
    const wordMatch = before.match(/[A-Za-z_$][A-Za-z0-9_$]*$/);
    const prefix = wordMatch ? wordMatch[0] : '';
    const newBefore = before.slice(0, before.length - prefix.length) + item.label;
    codeInput.value = newBefore + after;
    codeInput.selectionStart = codeInput.selectionEnd = newBefore.length;
    hideAutocomplete();
    updateHighlight();
  }
  function hideAutocomplete(){ acEl.classList.remove('show'); }
  codeInput.addEventListener('blur', () => setTimeout(hideAutocomplete, 150));
  codeInput.addEventListener('keyup', e => {
    if(e.key === 'Escape' || e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'Enter' || e.key === 'Tab') return;
    if(/[a-zA-Z_$]/.test(e.key)) showAutocomplete();
    else if(e.key === 'Backspace' || e.key === '.') hideAutocomplete();
  });

  const findInput = $('#findInput');
  const replaceInput = $('#replaceInput');
  function toggleFind(show){ findBar.classList.toggle('show', show); if(show) findInput.focus(); }
  $('#findClose').onclick = () => findBar.classList.remove('show');
  $('#findPrev').onclick = () => findPrev();
  $('#findNext').onclick = () => findNext();
  $('#replaceOne').onclick = () => replaceOne();
  $('#replaceAll').onclick = () => replaceAll();
  function findNext(){
    const q = findInput.value; if(!q) return;
    const start = codeInput.selectionEnd;
    let idx = codeInput.value.indexOf(q, start);
    if(idx < 0) idx = codeInput.value.indexOf(q);
    if(idx < 0){ toast('Not found'); return; }
    codeInput.focus();
    codeInput.setSelectionRange(idx, idx + q.length);
  }
  function findPrev(){
    const q = findInput.value; if(!q) return;
    const start = codeInput.selectionStart;
    let idx = codeInput.value.lastIndexOf(q, start - 1);
    if(idx < 0) idx = codeInput.value.lastIndexOf(q);
    if(idx < 0){ toast('Not found'); return; }
    codeInput.focus();
    codeInput.setSelectionRange(idx, idx + q.length);
  }
  function replaceOne(){
    const q = findInput.value, r = replaceInput.value;
    if(!q) return;
    const sel = codeInput.value.slice(codeInput.selectionStart, codeInput.selectionEnd);
    if(sel === q){
      const s = codeInput.selectionStart;
      codeInput.value = codeInput.value.slice(0, s) + r + codeInput.value.slice(codeInput.selectionEnd);
      codeInput.selectionStart = codeInput.selectionEnd = s + r.length;
    }
    findNext();
    updateHighlight();
    const node = findNode(state.activeTabId);
    if(node){ node.data = codeInput.value; scheduleFileSave(node); }
  }
  function replaceAll(){
    const q = findInput.value, r = replaceInput.value;
    if(!q) return;
    const count = codeInput.value.split(q).length - 1;
    codeInput.value = codeInput.value.split(q).join(r);
    updateHighlight();
    const node = findNode(state.activeTabId);
    if(node){ node.data = codeInput.value; scheduleFileSave(node); }
    toast('Replaced ' + count);
  }
  findInput.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); findNext(); }
    if(e.key === 'Escape') findBar.classList.remove('show');
  });
  replaceInput.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); replaceOne(); }
  });

        e.stopPropagation();
        const p = findParent(f.id);
        if(p && confirm('Delete ' + f.name + '?')){
          const i = p.children.indexOf(f);
          if(i >= 0) p.children.splice(i, 1);
          FileStore.del(f.id);
          if(state.activeShaderId === f.id){ state.activeShaderId = null; shaderEditor.value = ''; shaderName.textContent = 'No shader selected'; }
          renderShaders();
          renderTree();
          scheduleSave();
        }
      };
      shaderList.appendChild(el);
    }
  }

    }

  function renderTools(){
